body:
  text: 月或災害或危亡或鬼胎或妖異或刑尅母子平安者固多不能兩全或兩不利者亦有或以爲誦經未必有益不知正法難遇世人或不知此經尊重此經利益不聞其名者有之聞名不知重者有之或虛敬而不持誦或持誦而始勤終怠或脫落混淆或怠汚顚倒字誤句差解會失當雖有懴謝之文難得全經之利皆人自誤不遇經功遂以爲誦經無益是爲謗法嗚呼正法宜行親恩難報救難利生學道者之急務也若教化世人敬誦此經則母子安產難免生善男善女世間皆福德相正道永流傳矣功德最大觀經者勉之功德品續二十五章若爲求官進職爵祿亨達貴遇人君如法持念是此眞經卽得職務遷轉子孫榮貴世世不絕玉經之利豈但有益生產哉若爲求官進職使爵祿亨達貴遇人君如法持念是此眞經卽得職司事務陞遷轉進子孫榮貴世世不絕求官無官而求得官進職進陞進也職位微小營求遷轉陞進高位美職爵命官爲爵祿俸給曰祿亨亨嘉逸樂貞吉悅利達稱意遂心謀望通達貴遇人君出常曰貴爵祿亨達且得君行政受人主之知遇君臣相遇自古爲難貴而遇人君則臣不虛貴方爲亨達一云遇明君智主也是此文非重句法宜云爾職務職有官守職事各有所司故曰職務政務也轉轉授美缺或易閒散作清要也子孫榮貴或世官世祿或廕子廕孫安富尊榮光前裕後且榮且貴世世不絕雖非等天地永世守慶流後代福澤綿遠相承不絕雖數世亦云久遠若孔聖人之至德祖天師之神化子孫厯朝受封是眞榮貴不絕封爵詔祿出自天朝官職若不可求資格相循遷轉若不可謀况文須讀書武要知兵學問功勳假借不得如何求進夫官授有德祿以養賢大德者必得其位必得其名如法持念眞經誦法言守聖訓心與天合動與道俱是大善人或以言揚或以行舉無爵而贈官無職而贈祿或有官職而陞轉此用賢之常理以德招採若或求之廣成尹夀巢由嚴光或爲帝師或爲國賓與之弗受豈善人不可得爵祿乎若漢之孔明晉唐之旌陽李泌海蟾皆修道而官者也經云求官又何疑焉要之天爵良貴吾身固有超凡入聖進德有階神化登仙厯劫不壞道德經云死而不亡仙傳云子生孫兮孫又支夫道尊德貴仙傳無窮不慕世名浮利修天爵良貴由凡希聖出塵登仙永延不絕是眞能如法持念眞經功德品續二十六章若人欲求資財殷富如法奉持是此眞經卽得財寶充溢衣食自然慶流子孫傳之後代此經利益豈止遂求官之謀哉若人欲求家資財用殷富如法奉持是此眞經卽得財貨寶玩充滿盈溢衣食豐潔自然充裕餘慶流及子孫傳之後代資用也身家所需曰資一云資賴也言人賴此利生也與貲義同財財貨也亦財用也殷實也充實之義富家道極豐財用充足曰富奉持欽崇曰奉持守看誦財寶財貨財之財寶貨貝也金銀珠玉珍奇玩好采帛希有貴重之物皆稱寶充充足也溢豐盈也衣食自然不費心力自然豐足也慶流子孫慶吉祥也福澤綿遠奕葉相仍故曰慶流子孫傳之後代不止及一世之子孫代代相傳後人永享安榮之福解疑孔子云富而可求也雖執鞭之士吾亦爲之如不可求從吾所好甚言富之不可求如何此云欲求殷富如法奉持此經卽得富足慶流後代是言富若可求子夏曰商聞之矣富貴在天富雖可欲有命存焉天實主之如何可求然富雖有命先儒云富貴福澤以厚其終所以報有德如法持念此經口誦天言欽若昊天是令德獲福者矣詩云樂只君子福履綏之此之謂也或又云大禹聖者也菲飲食惡衣服卑宮室惟甘儉約道家云學道須學徹骨貧此言持經足以致富似以利歆人者禹之自奉儉聖人不私己之心也道家之學貧心無物累也求富可得迺設言持經之效佛經云所求如意皆得滿足兩教法門大開方便福利無邊有求轍應無願不成若疑惑閒斷始勤終怠口應心非無正信堅固圓滿心無至誠以感之則雖求亦不得矣觀經者善體之嘗考萬物皆備於我本有不資而富者在奈何世人馳逐名利競浮華嗜情欲以假作眞貧者戚戚不能持大道誦眞經富者侈蕩不能棄智利奉法言甘至老死自喪固有之富老君曰金玉滿堂莫之能守富貴而驕自貽其咎戒人之逐外忘內也今言求富持經之效欲人改易求富之心以重經耳噫持經誠有效也若無誠敬且招愆矣觀經者愼之功德品續二十七章若人被諸惡星之所照臨困苦牀枕如法持念是此眞經是諸惡星返降吉祥是經利益豈但求富者遂哉若人生命流年被諸惡星之所照臨困苦牀枕睡眠不安如法持念是此眞經是諸惡星化凶爲吉返降吉祥赤松子云生民煢煢各戴一星然星之所照有吉有凶吉則千祥凶有咎徵在三光之下者常避忌惡星凶星也如羅睺計都天破天哭天敗天退等星是矣照臨或生命分度或流年値遇或宅遇分野當生當照統屬分臨困所如不遂鬱而不伸也苦貧厄疾患危迫切身也困苦牀枕只是困危無聊臥不安席伏枕不甯之意一云牀枕有驚是諸惡星所該者廣凡天上凶星命運宅遇當照一切凶星是也返降吉祥惡星照臨多凶無吉如法持念此經靈章運化凶曜呈祥凡所被照臨惡星不惟不見咎禍返默錫福祉降吉祥星之照臨命運分野本有一定如何持經惡星降吉祥天人一理上下相通感應之機㨗於影響宋襄公有君人之言三熒惑退舍不惟君也孝婦含寃而致三年之旱賤臣叩心而飛六月之霜匹夫匹婦皆可以感天地動鬼神但恐不至誠耳一誠感格片言可以孚神明不言亦可以運造化况眞經爲天地之宗三景得以開光如法持念眞經奉至聖之玄章悉貞明之秘要凶星散吉祥生返禍爲福矣人一也惠迪吉從逆凶中誡經云星之照臨吉凶惟人自召作善則星光大善則光顯無善無惡其光微小過其光散大過其光滅惡星之臨人有過則惡報應無過則咎微免善則凶去福臨矣傳云一念之惡爲妖星厲鬼一念之善爲景星慶雲休咎之徵係一念之善惡眞持此經雖險災大難亦當退去而困苦牀枕適然之厄有不盡消耶太甲曰天作孽猶可違亦此意矣夫人能弘道贊化育若默轉眞經入神達化則與天地合其德與日月合其明與四時合其序與鬼神合其吉凶斡旋造化永超凡塵且鬼神覷不破生死不相關星辰豈能拘限哉觀是經者勉焉功德品二十八章若人命過應入地獄注名惡籍父母師長夫妻男女當爲亡人持念是經或安置道場旛花供養卽得亡者鬼籍盡除神生淨土同苦罪眾咸蒙濟度承斯勝利皆生天上是經功德不但免在生之咎若人命過死去時魂魄應入地獄注其名於作惡之籍其父母師長夫妻男女當爲亡人持念是經或安置超拔道場旛花供養卽得亡者鬼籍盡除神生淨土同獄同亡同籍受苦罪眾咸賴經功得蒙濟度承斯最勝妙法利益皆生天上命過命過其數而死也應入地獄或夙世今生有罪應當入地獄受罪報地獄若酆都鐵圍九獄十八獄二十四獄三十六獄七十二獄無間等地獄注名惡籍注錄其名在惡業簿籍中以施報對也父母師長或亡者之父母或其師傅或其尊長夫妻男女亡者或是婦人或是男人必有其夫其妻在卽夫妻不在或有子孫或有親屬之男女在當爲亡人持念是經其見在親屬當爲亡故之人奉持誦念是經或安置道場或安立布置道場遵道法拔罪業故曰道場旛花供養旛稱讚聖號不盡書之長旛懸竪竿端以風四表揚寶光花獻所有奇花以迓聖神上天揚法有自然旛蓋旌幢天花絢采以彰休光世間但以旛置道場示莊嚴迓神庥供養供亨獻也養以飲食供奉也天上以清靜妙法爲食天廚妙供惟道惟恭今世之五供養十供養不過空五有除五苦禁五樂去十惡念十眞住十信以敬共神明欽崇正法奉持寶章是眞供養今但以飲食花果珍奇供之而無恭敬之實抑末矣經所云供養者是誠心天然之供也卽得亡者鬼籍盡除神生淨土一轉此經或立道場卽得使亡故者出幽冥削黑業鬼籍惡業盡得除去神生清淨樂土同受地獄苦之罪眾一切咸得超脫䝉受經法慈濟拔度咸皆也承斯勝緣法利皆生天上斯此也夫天福雖有盡一持念是眞經或立道場卽除亡人並同苦獄魂之罪使生天上若永遠奉持功德豈有窮盡耶噫地獄無門惟人自召天堂有路昧者難行况生來正性卽帝眞經常持永念地獄天堂一切不染永證玄眞矣方云善持經者功德品續二十九章又此經所在之處常有十天至眞大聖無極飛天神王侍衞供養持是經人當得自稱爲正一眞人是人在處自得十方至眞至聖金剛力士濳護其人如護己身若出若入遊行之處百邪避路魔鬼殄除精靈伏藏一切災殃不能侵近是持經人命欲終時更不見諸地獄惡相卽見天宮玉女持幢下迎而生天上如天福盡下生人間卽得千生萬生中常爲國王大臣聖賢慶會國土清平人民樂業常得宿性通明遵奉大道展轉修持至登道岸是持經人獲福如是是經功德豈但利益生死哉又此經所在之處常有十天至眞大聖無盡量飛天神王侍衞供養是持經人當得自稱爲正一眞人是人在處自得十方至眞至聖金剛力士濳護其人如護己身若出若入遊行之處百邪迴避持經人所走之路魔鬼殄絕除去精靈濳伏收藏一切災殃不能侵近是持經人命欲終時更不見諸地獄惡相卽見天宮玉女持幢節下迎而生天上如天福受盡下生人間卽得千生萬生中常爲國王大臣聖君賢相明良相慶聚會一朝國土清甯平定人民安然樂業常得宿性通明遵奉大道展轉修持至登道岸是持經人獲福如是十天十方諸天飛天神王飛身遊護諸天之神王也侍衞侍立拱衞也正一眞人至正無私眞一不二之人也金剛力士兩教護法皆來護持經人濳護其人暗中護持經人如護神明自己之身見諸神保護之切也其持經之人或出或入遊行之處一切邪妖魔鬼精靈遠避伏藏殄絕除去殄絕也盡也災咎禍殃不能親近是人命終更不見諸地獄種種惡相天宮玉女一本作天官者非也幢非旛非旌大法幢也下迎接導上天耳千萬生爲國王大臣世世尊貴如佛千八世爲王世子玄帝千世爲王千世爲宰臣老君厯劫爲皇帝王者之師共安長樂且宿性通明大智大慧不昧厯劫良因遵守崇奉大道反覆展轉進修操持至登道岸道岸得道如濟海岸也佛云到彼岸大雅云誕先登于岸此之謂也一云畔岸持經功德時刻有益或利生或利死或少或眾或久或近隨願皆成化誠神矣必千生萬生遵奉無二展轉修持始登道岸可見大成之難也觀經者恒其志可入最上功德品續三十章又若有持是經人若雨下時起大悲心如法向空念此經三卷一徧其雨所霑面所向方一切眾生五逆十惡一切重罪悉皆消滅一切重病自得痊愈是諸眾生命終之後不墮地獄神生淨土蓮花化生何况持是經者又若有持是經人或行於道路値大風起吹是持經之人觸身之塵是塵所霑一切眾生一切惡業悉皆消滅更不墮於三惡道當生天上故知持經功德不可思議此經功德不但利一身也又若有持是經人若雨下之時起大悲度世之心如法向虛空念此經上中下三卷週完一徧其雨所霑濡面所向方隅一切眾生五逆十惡一切重罪悉皆消散除滅一切重病自得痊可安愈是持經人所向方之諸眾生命終之後不墮地獄神生淨土不假淫穢蓮花化生何况持是經者其功德詎可量耶又若有持是經人或行於道路値大風起吹是持經之人觸身之塵土是塵所霑一切眾生一切惡業悉自消滅更不墮於三惡道中當生天上故知持經功德不可思議考證解疑持經人無處不慈悲非但雨下風起有大悲心推言若雨下風起時也甚言持經之效大悲憐憫哀矜恤念世間一切也釋教云婆心太切詩云哀此煢獨又云矜不成人道經云大悲覺世持經者憫世人業苦故起大悲心五逆不忠不孝不慈不睦不義一云不敬天地君親師不敬三寶不持戒律不修德行不明心性一云滋縱財色名食睡十惡殺盜邪淫兩舌妄言綺語惡口貪嗔癡一切重病痊愈痊安可也愈平愈也蓮花化生佛家言西方極樂世界蓮花生人道家云青華長樂界蓮花化生又云欲生因蓮花言居世出世不染一塵妙法生生無淫穢心又如天地之初自然化生成人也儒者多以兩教爲妄伊尹生於空桑獨非儒者之聖人乎且人心如蓮知蓮生則心宗印矣善哉周子觀蓮雖愛其處泥不汚亦必別有眞見也故爲學道之宗三惡道地獄魔鬼畜生不可思議不可以心思不可以言議見功德莫量也夫道之濟世眞經利人法雨浸濡普潤一切響徹十方利盡法界儒家云有如時雨化之者又曰樹之風聲又曰不疾而速所過者化所存者神民日遷善而不知爲之者故周公生而無烈風淫雨海外向化人能修至道持眞經無論雨水所霑風塵所及卽風雨所不及水塵所不霑三千大千世界永霑法利矣故曰持經功德不可思議功德品續三十一章是持經人若經涉於江河淮海沐浴其身是身所霑之水其中眾生魚鼈黿鼉一切水族是諸惡業悉皆除滅盡此一報之身命過之後不復更受胎卵溼化一切等身是持經人口出一切言語音響一切邪魔外道聞者皆是清淨法音是持經人若遇諸廟能爲其神誦詠是經是諸鬼神得聞是經卽脫鬼趣登證仙道恭敬是人如奉是帝是持經人功德不但及於人也若經涉於江河淮海沐浴其身是身所霑之水其中眾生魚鼈黿鼉一切水族其前世所造是諸惡業悉皆除滅盡此一世見在報應之身命過之後得證妙果不復更受胎卵溼化一切等身是持經人口出一切言語音響一切邪魔外道聞者不知爲世間言詞聲氣皆是清淨法音是持經人若遇諸神廟能爲其神誦詠是經是諸鬼神得聞是經卽脫鬼趣登證仙道恭敬是持經人如奉是說經之帝經涉經厯過也涉濟渡也一云徒身過水曰涉如呂祖朗吟飛過洞庭湖達摩折蘆過江是也要之凡過水不拘徒身舟船皆曰經涉江河海皆注水之通名淮淮河也沐浴其身以水澡洗其身也其中眾生水中一切生物鱗者魚甲者鼈黿鼉等一切水生族類諸惡業悉得除滅盡此一報而已死後不復輪轉畜業若羽若毛若鱗若甲若介胎卵溼化一切等身人雖胎生此胎字不指人說只言獸屬蓋龍爲水族之尊尙稱業報其下水族又可知矣眞持經人身口悉出金光故言音所及一切邪魔外道聞者皆是清淨法音爲神說經神脫鬼趣神雖靈響露威光彰報應尙有趣在聞此眞經脫其識根拔其趣意所謂融盡宿習也登證仙道上證眞仙之道也神與仙之分別等階神雖有功德而功勳顯赫俱在雖大神亦然卽大賢未融形迹與入聖而不優之類也仙則空五蘊淨九識遣能所融事理雖分五品比神鬼則高出矣夫聖人出萬物亨山不童川不涸鳥獸魚鼈咸若持經人沐浴之法水水族親霑又不啻聖王之功化也龍得法而高悟法水均霑有不超脫哉此野狐之所以得法復人身也若說經度神鬼脫其趣如薩祖師度王靈官普禪師之度關聖賢令其斂神威忘宿念也故至今二聖之恭敬不衰功德品續三十二章若人在世不孝父母不敬三寶殺生偷盜邪淫妄語作種種極重罪業將命終時若有道心正信善男善女於亡者未氣斷時起大悲心于其頭邊念玉帝尊號七遍或二七遍三七遍四七遍乃至百遍千遍是其亡者生前所造諸不善業悉得消滅更不墮諸惡趣神昇九天何况受持是此經者又若復有人自從往劫乃至今身輪轉人天漂沈世域積千愆萬過在於己身若遇是持經之人形影暫映其身如爲帝光之所攝受或與同語或聞其聲如奉帝言道語之所慰諭彼人罪障永得除滅經之功德不特下及物上及鬼神也若人在世不敬三寶殺盜淫妄作種種極重罪業將命終時若有道心正信善男善女於亡者氣未斷時起大悲心于其頭邊念玉帝尊號或一七二三四七乃至百千等遍是其亡者生前所造諸不善業悉得消滅更不墮諸惡趣神昇九炁上天何况受持是此經者又若復有人自從往劫乃至今身輪轉人天漂沈世域積千般愆尤萬種過失在於己身若遇是持經之人形影暫映其身如爲上帝道光之所攝受或與同語或聞其聲如奉上帝法語道言之所慰諭彼人罪障永得除滅三寶道經師也道爲三教之宗萬有之祖經爲度世津梁師爲人天眼目不敬所以有罪殺生偷盜邪淫妄語大犯者大罪萌一念亦有罪種種非一端也言不能盡記正信至正誠信一無所爲也一七二三四七千百遍或云言道周天功化亦是不墮諸惡趣有善根無邪念故不墮惡趣輪轉人天或人間天上之福一云人中福爲人天漂沈世域生死無常如萍水浮漂業趣難脫似水中沈溺世域世間界域也形影暫映持經人形影暫時照映造業人身如同帝光之所玄攝神受受或作授言帝光授與者非是大抵光臨人則肅然敬心無念故曰攝受我受其光之法利也同語聞聲造業者或與持經者共語或聞持經者聲音道語大道玄語或云道祖之語太拘慰諭慰善言撫慰諭教誨命令也罪障除滅一切夙世今生罪皆釋往劫今生障礙皆除也夫經之神功存亡受益利及一切惟正信人有是功可見以至誠心爲本利亡者利他人如此持是經者功德又豈可量哉觀者勉之功德品續三十三章又若持是經人造作長旛書帝名號於其旛上懸諸長竿或在觀宇或在家庭是旛被諸風吹所指方面一切眾生皆霑勝利一切惡業悉得除滅又若有持是經人書帝名號在一切有聲物上或鍾或磬鈴鐸鐃鈸一切道具法事之屬或以道場或因戲擊或被風觸是聲出時或遠或近一切眾生聞是聲已所有罪障悉得清淨此又申言持經功德也長旛書帝號長竿俱解見前觀宇觀中殿宇前觀觀也神在無他心惟一誠觀之故神居曰觀家庭家之庭前所指方面風吹寶旛所指方位面向也勝利解見前鍾磬鈴鐸鐃鈸皆法樂金屬也一切道具法事之屬除金石絲竹匏土革木等樂與有聲物或一切道家所用法事之具道場用法具鳴帝號可也戲擊如何亦有功此戲非狂蕩耍戲或演習法樂或幼小無知者或凡愚不知誤鳴法器及有聲物或閑時喜樂鳴有聲物書帝名號非帝之名帝號厯劫不磨迺常住大名故曰名號今讚佛云洪名聖號亦此意風觸聲出被風吹觸響物聲出也遠近眾生聞聲罪障悉得清淨不拘遠近一切眾生凡聞有帝號之聲者罪障消除悉得清淨考證古人制樂所以諧神人和上下况帝號爲玄祖榮名聞者肅然法音一振神功無邊大舜作樂百獸率舞何况於人人聞兵器則威聞戲具聲則嬉聞琴則和何况法音一切有聲戲具無論也法具樂器所以敬共明神齊一眾志又書帝號故聞者敬而罪滅夫罪障所以報惡人也聞法音善心勃然故罪障悉滅得清淨今雷震一聲聞者敬畏可以作證解疑今世懸旛及書帝號於法樂道具法事共一切有聲物上者甚多聞見者亦不少罪障不除何也書號者非眞有正信持經之心聞見者以爲故常頑心不除甚至輕慢浪戲謗凟自無善心何以釋罪嗚呼經法帝號功德難量先眞持經度自已則不動而敬不言而信更以帝號度人自永利矣功德品續三十四章又若有持是經人了悟生死深入山林修眞學道或時登臨上山顧望目所及處山林溪谷含生品類有形無形胎卵溼化蠢動飛濳種種物類所有罪業皆得除滅身心清淨命終生天何况受持是此經者當知是人卽是道藏功德身也此復申言持經之效了悟生死生死事大理最難明依父母之精血得天地之理氣生也所以生不可知精耗氣散神去形枯死也所以死不可知未知生未知死雖能達事變觀物理明於言不昧於行未爲了悟若有持經人絕聖去智除二障斷諸惑融宿性成大覺證三元登最上了悟生死根源卽佛家云徹悟也深入山林昔人云小隱居山旣云了悟高山平地總屬道場修行何必入山林大隱居市理固有然名山勝景地靈人傑眞修者雖無志於山林幽山茂林天造地設以成仙境也故逸人入焉修眞學道人生正性至眞無假性道自然不待學問自情慾日滋知誘物化眞者漸假性道不明了悟者於山中林下默加修持以返天眞參學大道了脫生死道德經云絕學無憂此云學道何也彼云絕學絕學之名象意識此云學道學曠然無爲之道也夫佛家以了悟爲最上此云了悟方入山修眞學道則兩門之品階可知或有時學道人登高臨水遊厯勝境上山四面顧視觀望目力所及之處若山若林水溪澗谷谷山之溝壑虛深曠空者也含生品類含大造生意諸品諸類有形無形有形已生者無形未生者亦有生而不見形者若胎生若卵生若因水因土汙下溼生若無中生有化生蠢動飛濳大造之生蠢然者物含生運動高而飛躍深而濳藏介飛濳之間走者種種一切物類所有今昔罪業皆得除滅身心清淨無有繫累命終悉生天上修眞目望所及物類超濟若此何况受持是此經者當知是持經人功德難窮卽是大道玄藏不可稱量大功德身也夫學道之人心大慈悲無不仁愛未見聞者心不可見目望所及一切物類念其蠢動含靈俱有法性一意慈悲默然神度救拔出世故濟一切有如是功德儒書云致中和萬物育焉又立靈臺望氛祲察災祥曲成萬物裁成輔相天地之所不及使人物生死順受正命返歸化源又有何罪業贊孔子者曰當年不能窮其學累世不能殫其蘊聖不可知之謂神今贊修眞學道者曰道藏功德身亦言其大無不包深不可測稱讚難窮耳觀經者有得焉方知是義功德品續三十五章爾時天尊謂玉虛上帝言今我略說未盡其妙若廣說之凡流邪見疑惑不信是經功德窮劫難言爾時解見前天尊元始至尊也謂吿語也元始吿玉虛明皇天之上帝言一云玉清玄虛上帝今我略說未盡其妙今元始指說經之時而言也我元始自己稱謂也略說稍說大略也未盡其妙未盡言道之要妙與夫最上功德也若廣說之此經言持經功德利人利物利存利亡利有形利無形利己利他利天利地亦云廣矣猶云若廣說之凡邪不信此所言者一世界人物今昔天地存亡若三千大千無量世界從劫至劫無量數劫一未來世一切未來世無始之始無終之終若有知若無知若聞見若不聞見若思議若不思議若有盡量若無盡量一切功德俱在是經與持經者若爲廣布宣說其妙凡流邪見疑惑不信凡凡世庸人流流俗之類如同流水不能拔萃也邪見偏邪之見不正大也疑智見不決兩可未定惑私意起紛紛縈縈是非莫知雜亂無凖見故不信此經有無盡量之利益也是經功德窮劫難言窮無量劫數亦難盡言一云窮盡厯劫言不盡大抵元始永在劫數無盡經功難窮大道莫量終是言不盡夫大道無言妙法無象眞經無字可施可受可見可聞可言可得皆第二義耳故我太上化生無量數劫說法萬二千天厯度遐方著經億萬一化千七百年譚經九萬餘度猶云吾不知其名强名曰道孔子繼往開來啟䝉萬古迺曰無知也釋迦佛說法四十九年譚經三百餘會著經律論三藏且云我今略說無力說盡顔子卓立心齋坐忘亦云雖欲從之未由也已此經爲萬法之宗其功德果然說不盡最上功德說也說不得說了人亦明不得故儒家之無爲而治道家之眞玄功德佛家之身命布施西來正義皆不可以言傳者矣善乎斵輪之妙得心應手莊子三教之宗匠也故六合之外存而不論六合之內論而不議非不能言言易起人之惑不如無言卽夫子罕言命性道不可得聞之意也佛氏迺言許多世界景色分諸事理姑不論其茫茫無稽卽有所據言不能盡者尙多也從其教者以爲佛說人所不能說妄以爲高不知佛生外域殊俗異類要荒小國環之者眾釋氏就其見言之中國不知妄云佛見之廣試觀中華百里不同風燕越秦齊山川風化不徧厯者不能知况西域之遠可詳考耶卽有史册亦風聞雜記甯保無差乎人好異者多不究是非使佛果周知如何所著經典不造唐文入中國三番譯迺成章耶旣不知唐言唐文所言者必其所隣之國或效莊子之設喻言道亦有之矣人不細考謬言高下何其好異之過也噫不言諸界不滋人之惑略言功化以啟人之䝉示眞意顯正法此道之所以爲實益也學者尙悉心究之功德品續三十六章于時玉虛上帝聞是說已心生歡喜不勝踴躍瞻仰慈顔稽首讚歎而作頌曰九天之上謂之大羅玉京金闕雲層峩峩中有天帝仁慈惠和至道無敵降伏眾魔天寶靈符玉律金科神仙億萬幢幡眾多聞者罪滅永出愛河是號玉皇穹蒼眞老妙圓清淨智慧辯才至道至尊三界師混元祖無能勝主四生慈父高天上聖大慈仁者十號圓滿萬德周身無量度人拔生死苦爾時玉虛上帝說是頌及十號已諸天聖眾異口同音歎未曾有此言聞經欽受喜慶之義于時于天尊說此經神咒功德品已竟之時玉虛上帝聞是說已心生歡慶喜悅不勝歡騰踊躍瞻仰玉帝慈顔稽首讚歎而作頌美之辭曰九天之上謂之大羅玉京金闕俱解見前雲層峩峩峩峩巍然高峻也大羅金闕法雲祥光層覆無極峩然巍崇峻廣莫量采和云玉京宮闕高嵯峨中有天帝金闕中有萬天教主之玉帝仁慈惠和大仁大慈至惠至和惠不是愛利厯劫生化人物各足無所不與故言惠至道威德無敵降伏一切眾魔天寶靈符諸天寶崇玄靈眞符也一云寶作珍奇不可從玉律金科玄戒天律金格也神仙億萬侍宸聖眾百千萬億法幢寶旛以爲儀衞眾多莫量聞名號法音者罪盡消滅永出愛河眾生萬有諸業易斷惟愛難割厯劫漂沈未能頓出永出愛河業根斷矣是號玉皇解見前穹蒼眞老玄穹無極蒼空莫量無始眞老妙圓清淨奇妙圓滿眞清眞淨智慧辯才大智大慧妙辯宏才至道至尊至道無極至尊無對三界
