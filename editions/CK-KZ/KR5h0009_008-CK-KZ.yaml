body:
  text: 師天地人三界之宗師混元祖無始之先天地未分世界未有帝眞長在厯劫眞宗故曰混元之祖無能勝主三教萬法一切聖人無能比肩皆以爲主故云無能勝四生慈父四生胎卵溼化皆賴帝德以生以成善始善終並以道濟故曰四生慈父高天上聖諸天無如大羅天高諸仙諸佛無如玉帝尊故曰高天上聖大慈仁者大慈大仁無盡量者十號圓滿自穹蒼至仁者十號玉帝行德神功皆周完圓滿如此萬德周身帝德無邊此云萬德周身約言也無盡量度人拔一切生死苦爾時玉虛上帝說是頌及十號已諸天一切聖眾異口同音歎未曾有聞此妙法聖號至德厯劫難逢故聖眾同稱歎未曾見此希有也一云歎世間未曾有此夫帝之功德若此以億億劫修證始之觀經者大悟眞修斯不愧矣高上玉皇本行集經註解卷之中重刊道藏輯要高上玉皇本行集經註解卷之下天眞護持品第四護持品一章爾時昊天上帝聞說經法從座而起長跪帝前白言惟願聖慈普爲大眾及諸天人持是經人說利益事于時玉皇上帝興方便意開利益門宣玉匱科傳靈寶法吿於昊天上帝曰汝今諦聽當爲汝說受持功德扶危拔苦利益存亡神妙之事眾眞稽首俱發聲言臣等今日幸聞湛然常住之法莫不上福諸天徧周三界三塗五苦咸得消滅惟願慈悲愍臣等故演斯妙義昊天上帝昊大高玄天帝非時稱昊天也大眾一云諸天聖眾聽聞經者一云世間大眾天上本無世人經廣度三界浩劫二說俱是此經皆玉笈琅函珍藏上天故云宣玉匱科人性靈明不垢不淨無成無壞不昇不沉本自湛然常住知誘物累自取滅亡漂沉輪轉盲昧不明不能湛然常住鬼有趣神有識報盡復輪亦不能湛然常住今聞經法功德利益宿性得融根塵淨盡拔業識除罪障堅固圓滿是聞湛然常住之法曠世奇逢豈不幸乎三塗天塗地塗水塗五苦色累苦心愛累苦神貪累苦形身累苦魂華境苦精夫此經爲最上妙法故有如是功德昊天上帝不求妙旨而請利益非以效歆人此經一言一畫亦無量法寶知其效而眞心奉持斯無負說經之慈悲護持品二章玉帝吿曰若有眾生孝養父母恭敬三寶竭忠於君不殺不盜不婬不姤不嗔不恨不驕不詐奉戒持齋冥心大道生尊重心持誦是經我卽勅下周流法界徧傳十方無極世界勅命東方東華帝君青騎神仙兵馬無鞅數眾悉令下降覆護受持是此經者勅命東南扶桑大帝與其部眾神仙兵馬無鞅數眾悉令下降覆護受持是此經者勅命南方朱陵大帝赤騎神仙兵馬無鞅數眾悉令下降覆護受持是此經者勅命西南太華元老與其部眾神仙兵馬無鞅數眾悉令下降覆護受持是此經者勅命西方皓靈皇老白騎神仙兵馬無鞅數眾悉令下降覆護受持是此經者勅命西北皇天上帝與其部眾神仙兵馬無鞅數眾悉令下降覆護受持是此經者勅令北方紫微帝君黑騎神仙兵馬無鞅數眾悉令下降覆護受持是此經者勅命東北冲虛天君與其部眾神仙兵馬無鞅數眾悉令下降覆護受持是此經者勅命上方天皇大帝崐崙蒼老黃騎神仙兵馬無鞅數眾悉令下降覆護受持是此經者勅命下方來和天君名山大洞神仙兵馬無鞅數眾悉令下降覆護受持是此經者覆護保重護持也持經者敬奉帝言道語與天合德與道合眞是大道身道之所在神人共崇故帝令十方聖眾覆護然必於忠孝恭敬戒淫殺盜妄者持經以德行爲本冥心於道道自歸之或云道流出家不近君親以爲不忠孝不知道門玄戒極嚴守持操修不敢犯戒虧體辱親至誠堅固先報四恩何嘗忘君親不忠孝哉故許眞君著淨明忠孝經以見道之眞忠孝也護持品三章勅命十方一切金仙四眾八部及諸眷屬悉令下降覆護受持是此經者勅命十方天眞大聖飛天神王三官四聖二曜九星北斗南斗東斗西斗中斗二十八宿周天眾星金剛力士神王等眾各與部眾悉令下降覆護受持是此經者金仙諸佛菩薩也四眾非世人四眾陰陽神眾將卒四眾也八部解見二卷眷屬四眾八部之姻眷屬類也十方天眞大聖十方諸天眾眞大聖也飛天神王解見前三官天地水也四聖天蓬天猷翊聖佑聖二曜日月也九星金木水火土月孛紫炁羅㬋計都也二十八宿角亢氐房心尾箕斗牛女虛危室壁奎婁胃昴畢觜參井鬼柳星張翼軫攷證經是帝勅朝命所頒三公四相兩京九卿羣有司百執事貴戚異姓億兆蒼赤罔不欽奉玉經有眾神之覆護受持者帝命旌賢輔有德也人身有三元四象二氣九宮五行及二十八宿之度數周天經緯水火眞志大慧操修力行妙法善功與眾神等故人之一身身體毛髪皮肉血髓力行妙法善功經絡輔我正性眞氣命寶存焉夫正性眞氣卽帝眞經三萬六千神氣八萬四千毫孔眞光卽十方仙眞金剛力士星曜神王部眾消灾經云卽有天眞眾聖金剛力士各百億萬眾護衞是經卽此意也夫經不在言語文字眞意在吾心神不在十方世界而在吾一身持心修身不在誦讀披閱而在一誠默運至誠無私精神氣全聖可學天可希道可入動罔不吉神其佑之三藥耗一眞喪自己之神衰氣弱精不充徹與天違逆神豈佑之噫人一也君子修之吉小人悖之凶故經云覆護持經者則知天福有德矣帝德無疆經利最大惟人之敬受何如護持品四章勅命降魔力士四天門王五嶽四瀆及諸名山四海九江十二河源山林川澤一切主者悉與眷屬覆護受持是此經者諸險惡處令得安穩勅命所在一切土地靈官并溝渠等神及一切諸大力鬼王皆令覆護受持是此經者四天門王東西南北四天門王也五嶽東泰南衡西華北恒中嵩也四瀆江瀆河瀆淮瀆濟瀆之神也四海東西南北四海九江洋子錢塘漢陽潯陽混同錦江湘江烏龍鴨綠等一切江也十二河源黃河爲世界之脉若崐崙禹門星宿海火墩腦兒及尾閭發瀉河水等根源也一云論黃河之源崐崙有九井七泉不止十二十二河源蓋禹疏九河及汝漢淮水泗水爲十二也九河徒駭太史馬頰覆釜胡蘇簡潔鈎盤鬲津汝漢淮泗爲十二河源黃河則河之總神若涇渭沂汶溱洧滹沱興洽弱水等及一切諸河皆河之屬也山林盡世間山林川澤盡世間川澤水流曰川澤水澤也無水注曰溝有水曰渠帝經法旨諸仙寶崇諸佛受持諸天奉行諸神欽仰諸人誦讀魔鬼自伏實惟山得以鎭靜水得以流長所在衞護惟嚴也持經者旣爲諸神之護又烏可慢哉一慢則過深罪重矣善乎孔子曰小人不知天命而不畏也狎大人侮聖人之言知此爲小人觀斯經尙戒勉之護持品五章令諸魔外道悉皆懾伏潛形遁跡高飛海外遠避他方如是山林社稷祠廟血食之屬一切鬼神當自消滅五方行病瘟疫鬼帥諸惡鬼神并風王水怪孽音業龍妖神土精木魅盡自消滅五虛六耗夢寐乖常野道呪咀蠱毒之類皆自消滅是持經人心欲願者一切如意皆得滿足懾音聶諸魔天魔地魔魔王魔民魔女外道淫辭邪說僻行雜法旁門小術私技三千六百九十六種三萬六千等是也悉皆懾伏悉盡也懾驚畏心服也伏收歛歸伏也潛形遁跡潛藏也藏其形象不敢顯露遁逃避也逃其影跡不敢停止也諸魔之形雖外若妖艷幻象奇美眞態實阻不可見人此經眞法破鬼之膽碎魔之心諸魔難逃其鑒心畏法言玄律丹勅自不敢留恐露醜質外道之言欲以亂眞正道行而邪說息大道尊而旁門廢帝命一宣自不敢容高飛海外魔行無跡可以飛言外道人耳何以言飛格心易慮向化忘私高騰海外卽俗語言魂飛天外魄㪚九霄耳遠避他方不敢居其故地也山林解見前社土神稷穀神祠司也祀也神之司臨祀而祝之也廟朝也接神於廟而朝祭也血食享牲醴之祭者也以上鬼神皆宜祀者也如何令自消滅神邀祭祀必爲不直民謟鬼神必爲不正故薩眞人收伏王靈官改禁城隍西門豹守濟州投巫於水以禁河神况邪有假神以惑人人有崇邪以誑俗故胡頴經畧廣東毁幻佛而殺妖𡛥杖僧人以脫愚俗今云一切鬼神消滅奉經旨不作禍福安然無威聲也五方行病瘟疫鬼帥諸惡鬼神惡鬼神非行病鬼帥迺世之厲鬼强神也并行風之王水中之怪作孽暴龍妖異邪神土精木魅盡自消滅五虛六耗精神氣血身五虛六脉衰耗夢寐乖常魂魄不甯一云五虛六耗如天哭破敗喪門太嵗大耗小耗飛廉空亡黃旛豹尾九梁赤口白舌惡厭神殺凶星作禍神鬼之屬一切等事野道邪法咒詛妖語或咒或誓及蠱毒魘昧之類皆自消滅是持經人心欲願者一切謀望趂心如意皆得滿足無有違逆夫道德之士鬼神欽重凶邪盡消祥桑之死梓橦驅瘟旌陽伏蛟祖天師伏魔薩祖禁鬼皆有明效噫王彦方烈士也盜願刑戮不令彦方知則驅魔伏外道誠有德之必然者但人之三尸五累七情六欲九識十惡爲害斯不能正己伏邪除凶人能正心進道斬三尸除五累情欲盡識惡除已障盡而外邪消凶散吉臨矣護持品六章或有未能遵依科教修崇齋醮但能淸淨持戒專一信受尊重敬慕是此經典並同修齋護持淨戒者是人功德坦然無礙自在逍遙號人中聖德慧長新同諸眞人持戒專一持守道門戒律或五戒八戒十二可從戒十八戒二十四戒三十六戒七十二戒百二十戒百八十戒三百大戒女冠六百淨戒專心致志持此戒品專一堅固無二信受尊重者信受奉行欽嚴尊重敬慕誠敬仰慕坦然無礙坦平也寬廣也心有二則功德不實戒不持於功德有玷心身淸淨持戒專信受切尊敬經典心無染心無二無有虧欠縈繫功德眞實自是坦然又有何礙自在逍遙人性生來無拘無困客感物累忙忙苦苦無復自如焉得快樂淸淨正信無復物累得大自在常樂逍遙人中聖者不惟爲逍遙之人淸淨正信高出人儔號人中聖人德慧常新者習與智長化與心成聞見眞而智慮融物累忘而性眞湛德日新慧日明同諸眞人淸淨正信者同持經得道諸天眞人夫所謂淸淨持戒專一信受尊重敬慕非有計功之心爲人之意無所爲而爲絶無虛假間斷卽孔子所謂造次終食顚沛無違卽中庸所言無入而不自得莊子著逍遙之旨海蟾著快活之歌佛家所謂大自在儒典所謂日新温故而知新皆自然之效也豈有所假借又豈有勉强襲取之義哉噫淸淨正信雖不依科教修齋醮有是自然功德可見道旨玄科惟在實體經義科教齋醮普法品以演道化耳陳希夷諷度人經成道蓋眞持經旨耳今之齋醮無明效者有盛儀無眞修也若淸淨正信更修齋醮則功益大無齋醮有眞誠功亦神若無眞誠則齋醮皆文具矣甯無過乎護持品七章爾時昊天上帝聞是說已卽於帝前稽首歌曰大哉至道無形無名渺渺億劫黃道開淸神淸朗耀九炁吐精玉虛澄輝太霞高明玉皇開化溥度天人三元道養二象攝生朽樹故根已枯使榮蠢動蜎息長生化形懷胎含孕俱得生成亡者命過魂歸三淸魄受鍊度南宮飛昇今日大吉皆得光明五帝鑒映普吿萬靈天神地祇及諸河源五嶽四瀆及諸名山洞玄洞虛洞空洞仙無極大聖至眞尊神無窮無極溥監度生惡根斷絕玄都記名眾眞班列咸聽帝言經是帝勅保誦持人至度道岸無使災侵我奉帝命一切咸聽大哉至道大莫可量至不可及也無形無名不見不聞名亦强稱也渺渺億劫無始無終厯劫無數也一云十萬曰億要之舉大數言實無數耳黃道開淸吉時慶會天道開通也神淸朗耀神風永淸朗耀光明也九炁吐精融炎演昊景道混洞浩等九炁也吐精黃道開炁慶消九炁呈輝吐精炫瑞玉虛澄輝玉光虛明澄然淸輝也一云玉虛天呈輝太霞高明太玄霞光大高至明也玉皇開化開度教化也溥度天人溥徧也盡度一切天上地下人也三元道養天生地成人教化之爲三元道養也二象攝生乾坤造化生成人物終始宰制故云二象攝生一云陰陽陶鑄爲二象攝生俱是正論朽樹故根朽壞也故死也已枯使榮枯稿也已乾枯使再發榮蠢動蜎息長生化形蜎飛蠕動蠢類生不夭拆俱得脫其本形也懷胎含孕俱得生成人物胎孕不傷不墮俱得安然生長而成也亡者命過魂歸三淸死者不經地獄皆歸天上也魄受鍊度南官飛昇死者七魄受大慈眞人鍊度魂神飛上南宮也今日大吉指說經時言也皆得光明人物咸濟幽暗開光也五帝鑒映五方五帝照鑒光映也普吿萬靈徧吿一切鬼神也天神地祗及諸河源五嶽四瀆及諸名山洞玄洞虛洞空洞仙玄虛空洞一切仙帝神佛將鬼也無極大聖至眞尊神無窮無極無盡量也普監度生溥徧監臨度化羣生也惡根斷絕永除人物惡根也玄都紀名玄都丹臺紀功德名也眾眞班列朝班侍列也咸聽帝言玉帝言也經是帝勅此經是玉帝勅旨也保誦持人保護誦持經法之人也至度道岸登升道岸也無使災侵一切災難不侵也我奉帝命奉玉帝命也一切咸聽一切人物鬼神皆聽也此申全經功效護持品八章于時昊天上帝說是歌己吿大眾言此玉皇妙法語諸聖祕密言路絕道斷微妙難思巍巍大範爲神明之宗保鎭國土拔度生死爾時昊天上帝說是語已法筵淸眾咸仰道言溥得開悟諸聖諸至眞聞受此經皆寶重不敢輕洩故曰諸聖秘密言路絕道斷最上一乘法非常聞修眞要路入聖周行情欲幻妄到此拔根愛念凡思無復滋蔓輪迴轉生一刀兩段故言路絕道斷一云七聖皆迷人所難行亦是微妙難思深微玄妙神不可以思致難以思入人心思所不易到也巍巍高大妙範仙章爲神明之眞宗心印一說言玉帝道範爲神明宗師太拘了法筵法會華筵淸眾淸淨聖眾也道言指玉帝言或以爲仰昊天妙法等言溥得開悟盡得悟也攷證夫子之言性與天道不可得而聞也文始經云聖智造迷鬼神不識佛在靈山說法菩薩𤢜𤢜着耳聽玉皇法語路絕道斷微妙難思有何疑哉爲神明之宗鎭國土度生死亦自然之效矣解疑天下無道外之人亦無人外之道人物幽明皆道也人性全眞萬物皆備一切化育世界始終皆吾性之眞也玉帝道身也經爲道旨也惟道則全功神化妙本自然人與同性也甯不可以持經耶知道在身一心體道生生世世無二則聖眞在我己護持品九章於是天尊而說偈曰玉帝功德大玄理極幽深生於浩劫前運化於古今我今說妙經愍念諸有情此誠極妙法功德中功德名號最上乘無比爲第一大光明王尊威德世希有能破暴惡魔皆令心降伏能滅極重罪皆令得清淨若人聞是經或聞帝妙號稽首生恭敬一切罪消滅十惡四重罪五逆於父母信心一稱名隨聲盡消滅保護人天眾四相與五衰三塗極重苦人間凡厄難凶年饑饉喪毒藥及魘魅刑獄與寃家軍陣鬬戰苦山林惡道中虎豹豺狼眾江海毒龍類迅雷風雨雹水火及盜賊蠱毒中心腹失志發狂亂蛇蝎毒惡蟲邪魔凶怪神伺求人便者由持是眞經普皆自散滅惡病久纒綿夢寐亦不安非理欲殘命殄滅不爲殃緣遇是經故安穩得自在所有希求願財寶及富貴以此經功德如意皆稱遂神威自在仙諸天十一曜三十二天主二十八宿星靈妃玉女等天神及地祗三界虛空神江海諸龍王水火及風神宮殿與宅舍山林樹木眾溝渠井泉神由持是經故一切皆擁護衣食常自然子孫臻富貴出言人希聞所至皆推敬若爲求男女持誦此眞經帝詔下天曹落籍天仙人降謫生其家爲其作男女顯貴人崇重七祖得超昇光大慶門戸延及父母親吉祥常熾盛災障不能侵是故我今說大眾宜諦聽慈悲度一切皆令達上淸大光明王尊光明無量覺王至尊威德世希有玄威妙德世間無有四重罪一云魔獄鬼畜一云雷擊災疫盜賊刑獄五逆於父母孟子所謂五不孝惰四肢博奕飲酒好貨財私妻子從耳目之欲以爲父母戮好勇鬬狠以危父母一云不恭信孝順守禮爲五過信心一稱帝號隨聲滅罪五衰珠冠碎身屈頭俯眼淚鼻噴身無光天衣敝影露神運不靈通凡數運會遇也寃家前業寃相遇也迅疾雷也雹氷雨也伺暗候人空便爲害七祖父祖曾高傳支之祖開林之祖立姓之祖爲七祖熾勝大光顯也此偈元始著玉帝玉經功德令人欽持也護持品十章於是天尊普吿四眾凡人持念此經受誦帝號皆道根深重宿有善緣此經尊妙普度天人但精心恭奉家國安甯保命度災掃除不祥天子王侯得奉之者致國太平凶冦自夷邊域不爭兆民歌唱普天興隆運推數周正道當行有得之者天眞敬重寶之秘之人持念此經受誦道根深重卽儒家所謂資禀淸且厚佛家所謂根器好宿有善緣夙世往劫廣植陰德預有良緣蓋至道難聞法會難遇慶宵難逢有厯世不聞正法有聞而不信不悟不周完不蒙實益者皆根器之淺緣分之薄今値法會聞正法蒙實益皆是厯劫修持道根深重宿有善緣保命度災者保命延生度災消厄自古聖賢有生有死災厄常有何云保命度災蓋保天命而全正氣素患難而日坦然生順死安吉凶無二是持經之保命度災也掃除不祥經法所在凶厄潛消吉人天相災難永除無有不祥天子王侯天下之君曰天子曰皇曰帝周則稱王近世稱藩封一國之君曰王分符世臣曰侯古之侯分封百里凶㓂自夷夷平也國有道內順治外威嚴凶人賊㓂不作自然夷平四夷來王天下晏然邊域不起兵爭兆民眾庶歌謠唱樂太平普天下興隆富庶乂安運推數周貞元會運推遷時數己周一運正道當行於世有得經法湛然神化之道者天眞敬重寶之祕之此經尊重寶之可也普度天人迺云祕之不幾於私天道哉蓋大道雖然普濟不信者不可輕傳佛之正法眼藏不妄示人孔子曰中人以下不可以語上也上達必由心悟輕之則爲褻天經云祕之觀者愼之自知經義應驗品續十一章報應神驗品第五爾時慈悲度厄眞人尋聲救苦眞人濟生度死眞人萬福護身眞人俱從座起越班而出俱白天尊言若諸末世凡夫雖宿有善緣得遇是經被諸邪障所隔本末疑惑不信是經功德如是之人見在未來於諸地獄得何罪報惟願聖慈說其報應惡趣之苦凡夫被諸邪障所隔已之邪見人之邪說偏性抝妄事障理障一切隔礙本末疑惑者始不能信後不能悟上下扞格不能融通終始本末不得徹契本末疑惑不信是經功德如是之人見在未來今世未來世也報應惡趣之苦人物業識各有意趣或善或惡輪沉難脫大聖至眞融宿習拔根塵淨識業絕諸趣障執盡脫不受輪迴無諸罪報大賢菩薩小仙小聖神將鬼靈善者以作福爲趣惡者以作業爲趣善者無論惡者自沉業獄報應種種欲出無門欲免無計報盡轉生捨此入彼業緣牽累復迷不悟厯刼顚倒相循不止此等業趣實可憫憐四眞人上乞天尊說其報應惡趣之苦迺大慈悲度世心切也兩教言報應儒者以爲不然太甲曰天作孽猶可違自作孽不可活傳云福善禍淫又云天人之應捷於影響何嘗不言報應哉夫子曰君子懷刑又曰畏天命故自不爲惡道義悅心自無他趣厯朝於鄕飲禮射而講讀律令教兆民惟格人非心匡翼其善心耳兩教之言報應刑獄無非拔其業趣使爲大善也噫惟聖人神道設教而億兆服玉帝功德最大故經明示報應拔人惡趣不爲詭眾若自不修眞但以禍福眩人是欺眾也觀經者絕欲成眞免一身之惡獄而後可以濟世度人矣應驗品續十二章是時天尊謂四眞人云若諸世間剛强暴惡不善眾生終日竟夜對諸道像無恭敬心出誹謗語是罪當墮五無間獄若得値遇是持經人設諸方便誘引開導如是之人能滅惡心信向是經彼人罪業淨盡無餘不善眾生言行不善一切眾生終日竟夜竟亦終也盡也盡日盡夜出誹謗語誹以言非之也謗以言毁之也是不敬道像誹謗神聖的人其罪當墮五無間獄五獄冥司大獄也非聖者無法故墮此罪試觀誹謗妖言之陽律則知謗神之罪値遇彼此時候適相會逢也慢神謗法之人業根深重一意執迷無有信心持經人大慈悲方便啟誘接引開發化導顯彼良心生其善念信向是經者信心皈依專向是經彼人罪業者彼指慢神謗法之人所在罪業淨盡無餘業消罪滅報對悉盡永免寃愆不入輪迴常清常淨惡報永除再無不了之業也無間地獄業若難消一心信向眞經惡根立斷諸塵盡滅有何牽繫根塵立盡業淨無餘夫神德經功利益最大兩教甚言罪福切示慢神謗法之罪儒者每戒謟瀆鬼神豈儒不敬神不尊經哉詩云無忝爾所生張子云不愧屋漏爲無忝又曰存心養性爲匪懈兩教所言敬神尊經使其存心修行無愧於天地神明尊信法言體道成眞也儒者言不媚神戒其邀福妄瀆耳事天畏天希天尊先王之法言對越駿奔嚴敬不苟儒與兩教一也若祭無益敬不足行天命不足畏此敝言也儒者亦切責之甯獨二氏乎噫善惡敬怠一切由心能絕情欲去智識空五藴除五累則不在五行中天地不能拘五無間獄又何遭哉佛云稱佛名號火坑變作蓮池孟子云誦堯之言行堯之行是堯而已矣則眞善功效立見應驗品續十三章又若有邪見愚執惡人覩持是經生諸惡逆偏眼邪視乃至起一惡心發一惡言妄生謗讟持經之人其罪深重命終之後墮大地獄永無出期不惟慢神謗經罪重目見曰覩生諸惡逆有不信心故不知經爲道語法言持之利益阿慢輕忽厭惡謗毁生諸過惡悖逆偏眼邪視不喜見經並持經人無有正眼定觀輕藐憎厭讟詈毁也持經作善本不可毁邪執惡人不知緣業罪福不知持經之善妄自生謗毁讟詈之言加持經之人命終之後終盡也墮大地獄無間獄也永無出期永終也長也妄謗正法業根深重故墮地獄難出夫識見一也見之不正則爲邪人一也執迷不悟則爲愚爲惡心一也生惡念則爲逆眼目一也偏眼邪視則爲過一念至微也起一惡心爲業根一語無幾也發一惡言爲罪本君子成人之美嘉人之善持經者當稱讃也妄生謗讟是自作孽人生本無業自惹其罪深重是大可哀命終是還造化舊物也固無拘迺一謗法墮大地獄死亦不安其過如何永無出期天心仁愛上帝好生惟神正直不掩沒人今罪者無出期豈天拘之哉孽自己作定業難逃欲除已業還須自信至善不囘業根脫矣噫刑獄天討法本無親慈父不能庇其子孝子不得私其父至公者神豈消自致之業哉信經向法自懴前業如世人出首信誠免其罪犯也人生世間聖愚無二卽不能出言有章聲爲律幸勿出訛言而爲惡口不能行無過動身爲度幸勿行惡事而造身業不能心無妄想守至眞幸勿起惡意造心業不知大道勿謗道不能解經勿非經不能持誦勿謗人不明鬼神生死因果勿起毁言一心正信久自明道漸成聖眞又何罪業之有應驗品續十四章至若在世男女得遇是經不生敬仰穢手污觸葷口讀誦床榻不淨便將安置或誦是經講習俗語共同戲笑以爲常典如是之人命過之後墮無間獄永無出期殃緣九祖受考酆都累及子孫害纒後代是人於地獄中厯無量劫受大苦惱縱遇聖教累承救拔罪惡小減又遇上聖殊恩得離地獄生餓鬼中厯干萬劫不聞漿水之名鬼報得盡生畜生中畜生報已若生人中復生邊夷外域而復女身貧寒困苦癃殘百病受無量苦人所憎棄求生不生求死不死輕斯經故獲罪如是此甚言慢經之報不生敬仰不敬重仰慕也穢手污觸不淨之手或請捧經卷或披閱指點污觸輕犯此經葷口讀念誦持食五葷五辛三厭之口也床榻不淨棹几牀榻座器不淨便將此經安置供放九祖始祖四昭四穆爲九祖受考酆都考考察過失也吏作拷掠之拷此卽小兒犯事罪坐家長之義累及子孫害纒後代積不善之家必有餘殃受大苦惱罹大罪苦煩惱無限遇聖教累救罪惡小減卽蒙經功法力咸遇上聖殊恩上帝恩赦也得脫離地獄苦報餓鬼腹大咽喉微小飲食難下黒獄羅酆不見漿水亦不聞名生類莫蠢於物鬼報盡生畜生中其業尙在人世雖一中國難投男身難得生邊夷外域而復女身人中之不美也貧寒困苦貧賤凍餓困苦艱難癃殘百病衰損殘廢百病縈纒受無量苦言不盡之苦人所憎惡厭棄求生不得安生求死不能卽死皆以輕慢此經之故獲罪業如是之重亦可哀哉夫人生參天地爲三才此身貴重親賴以繼光前裕後道賴以傳所係匪輕一慢經法殃及已身緣祖先禍後代受業報何其愚之甚也又觀三教書言男女法性無有分别在在處處皆爲樂土中庸云富貴貧賤夷狄患難素位而行無入而不自得今言外域女身病難之體爲人憎棄何也蓋無分別皆自得者道也分等類言罪福者報也報應明人斯爲善矣嗚呼人一也皆可爲善人也尙勉力進道勿造業而爲人所憎應驗品續十五章又復有人初雖信受後復慢易善惡童子上奏三官黑薄書名靑編減算身歿之後拘閉幽牢往復三塗無由解脫或於見世受種種病疥癩癰疽以爲果報憂悲苦惱日夜相煎或身被橫惡所加或牢獄繫鎻或非命自害毒藥所殘或被虎狼毒蛇之所噉食或爲寃債之所牽引或行山林値遇惡人被他屠割推落崕岸或被邪精魍魎之所殘害或値水火之所焚漂或被刀兵之所橫誅輕斯經故橫喪天年獲如是果獲如是報可不悲歟可不痛歟善惡童子紀錄世人善惡之童子黑簿錄過之簿也書慢易經典之罪青編減算減慢易經者之算輕斯經故獲如是業果報應可不悲歟可不痛歟旣悲哀其苦又痛惜其愚此見天尊之大慈也証疑夫後一慢易此經罪報無窮則尊道信經貴有恒也久道化成經功全驗盡被其德領其效矣人惟無恒始勤終怠無怪乎罪業之及也抑自古及今不才者間出不持經不聞經者甚眾獲罪厄患者每有豈皆盡慢經者耶蓋經以言道不信道而無德卽慢經者也無德有罪卽慢經之罪也欲尊經消罪當進道修德應驗品續十六章汝宜殷勤依此奉行勿生邪念若諸念不生萬緣頓息塵沙惡業隨心消散一切灾魔自然殄滅此經功德不可思議是誠無比最上妙法諸經之王有大利益非人勿示諸念不生者無善念無惡念無無念無無無念萬緣頓息者空五累除九識離四象絕百非空萬有忘一無外緣內緣業緣福緣空定妙緣宿世今生攀援未來一切斷絕悉盡根塵塵沙惡業隨心消散者世上塵恒河沙不可稱數如是眾業隨信經心悉皆消散三教萬法一切無可比此誠爲最上妙法兩門之經儒之書皆不及此爲三教諸經之王道雖人人可學不信不敬者不可傳非人勿示非重道之人不傳示也解疑儒者不教自暴自棄之夫佛不度無緣之輩道法最尊豈强不信之人哉噫信心進道之基眞志成聖之要不信不可以授經人當至誠勵志以爲受經入聖之本應驗品續十七章若諸天人五衰四相輪迴侵逼能捨除妄想受持是經坐招自然天福益固身度三界與道長存此經至尊不宜妄示人矣天人者欲界六天尙有欲樂色界十八天常有色象無色界四天以空定爲樂大梵四天知空知無雖無冀樂靜福有數諸天之外最上種民四天無輪迴成壞以前諸天等義不同在種民下有成有壞四相非人我眾生夀者福相盛衰德相盛衰分四相也一云生壯老盡爲四相一云不威儀不神通不快樂不精健爲四相輪迴侵逼者欲色梵無色三十二天久暫不同其天人福盡轉生人間皆有定數故云輪迴侵逼能捨除妄想者逐緣妄生或想福或想慧或想夀或想空或想定或想上昇或想轉降言所不盡心所不窮皆名妄想捨除雜念一緣不生空空無無是捨幻念除妄想坐招自然天福益固者不待思求自然坐致欲界色界無色梵界皆自所居而得超脫永不輪轉無毁淪得大堅固不入輪迴身度三界者能出欲界於色界及無色梵界天地人出三有象高度上霄玄境與道長存者與道合眞浩劫長存觀天人寶經之效則世人可知矣勉之應驗品續十八章是此經典無與等無能勝是大威德大神咒能令一切枯槁便生枝葉花果茂盛能除眾生極重苦惱能令短命眾生而得長夀此經功德不可思議歎莫能盡無與等者一切諸經諸法皆出其下無與等倫無能勝者一
