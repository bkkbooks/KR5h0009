body:
  text: 護持品一章高上玉皇本行集經卷下天眞護持品第四爾時昊天上帝聞說經法從座而起長跪帝前白言惟願聖慈普爲大衆及諸天人持是經人說利益事于時玉皇上帝興方便意開利益門宣玉匱科傳靈寶法告於昊天上帝曰汝今諦聽當爲汝說受持功德扶危拔苦利益存亡神妙之事衆眞稽首俱發聲言臣等今日幸聞湛然常住之法莫不上福諸天徧周三界三塗五苦咸得消滅惟願慈悲愍臣等故演斯妙義諸天聖衆旣稱歎神呪功德品及帝號功德已當爾之時昊天上帝昊大高玄天帝非時稱昊天也聞天尊說經法從自已所居之座而起身向上長跪玉帝道前奏白言說惟願至尊聖慈普徧爲一切大衆云諸天聖衆聽聞經者一云世間大衆天上本無世人經廣度三界浩刼二說俱是及諸天天人持是經之人宣說經法一切利益之事于時玉皇上帝興方便拔度一切之妙意開永利大益之門宣玉匱寶科此經皆玉笈琅函珎藏上天故云宣玉匱科傳玄靈妙寶大法告於昊天上帝曰汝今誥聽汝指昊天上帝也諦專聽見諦之意當爲汝說受持此經功德匡扶一切困危救拔一切苦厄利益生存死亡神妙之事衆眞稽首俱發聲言臣等今日幸聞湛然常住之法人性靈明不垢不凈無成無壞不昇不沉本自湛然常住知誘物累自取滅亡漂沉輪轉盲昩不明不能湛然常住鬼有趣神有識報盡復輪亦不能堪然常住今聞經法功德利益宿性得融根塵凈盡拔業識除罪障堅固圓滿是聞湛然常住之法曠世奇逢豈不幸乎此法功力莫不上福諸境諸天徧周三界解見前三塗天塗地塗水涂五苦色累苦心愛累苦神貪累苦形身累苦䰟華境苦精咸得消滅惟願至尊慈悲愍臣等故愍矜恤憫念也演斯妙義夫此經爲最上妙法故有如是功德昊天上帝不求妙旨而請利益非以效歆人此經一言一晝亦無量法寶知其效而眞心奉持斯無負說經之慈悲護持品二章玉帝告曰若有衆生孝養父母恭敬三寶竭忠於君不殺不盗不媱不妬不嗔不恨不驕不詐奉戒持齋冥心大道生尊重心持誦是經我即勑下周流法界徧傳十方無極世界勑命東方東華帝君青騎神仙兵馬無鞅數衆悉令下降覆護受持是此經者勑命東南扶桑大帝與其部衆神仙兵馬無鞅數衆悉令下降覆護受持是此經者勑命南方朱陵大帝赤騎神仙兵馬無鞅數衆悉令下降覆護受持是此經者勑命西南太華元老與其部衆神仙兵馬無鞅數衆悉令下降覆護受持是此經者勑命西方皓靈皇老白騎神仙兵馬無鞅數衆悉令下降覆護受持是此經者勑命西北皇天上帝與其部衆神仙兵馬無鞅數衆悉令下降覆護受持是此經者勑命北方紫微帝君黑騎神仙兵馬無鞅數衆悉令下降覆護受持是此經者勑命東北沖虛天君與其部衆神仙兵馬無鞅數衆悉令下降覆護受持是此經者勑命上方天皇大帝崑崙蒼老黄騎神仙兵馬無鞅數衆悉令下降覆護受持是此經者勑命下方來和天君名山大洞神仙兵馬無鞅數衆悉令下降覆護受持是此經者玉帝告曰持經非徒口誦也若有世間一切衆生孝順事養父母恭敬道經師三寶竭力盡心上忠於君不殺生不偷盜不淫慾不嫉妬不嗔怒不怨恨不驕傲不奸詐奉受道典清凈玄戒持守眞正齋素不怠忽不躁急坦然澹然默任自然棲神養靜法天凝眞冥心合於大道欽若昊天祗奉道法生尊崇珍重之心一云自己嚴敬不苟且奉持誦詠是經我玉帝自言也當作朕字讀即勑下周流諸世間一切法界遍傳十方無極世界勑命東方東華帝君青騎南方朱陵大帝赤騎西方皓靈皇老白騎北方紫微帝君黑騎等神仙兵馬東南扶桑大帝西南太華元老西北皇天上帝乾方也東北沖虚天君上方天皇大帝此非勾陳天皇廼司天之神佛云帝釋天主也崑崙蒼老黄騎下方來和天君名山大洞與其部衆神仙兵馬無鞅數衆悉令下降覆護受持是此經者覆護保重護持也持經者敬奉帝言道語合德與天與道合眞是大道身道之所在神人共崇故帝令十方聖衆覆護然必於忠孝恭敬戒淫殺盗妄者持經以德行爲本冥心於道道自歸之或云道流出家不近君親以爲不忠孝不知道門玄戒極嚴守持操脩不敢犯戒虧體辱親至誠堅固先報四恩何嘗忘君親不忠孝哉故許眞君著凈明忠孝經以見道之眞忠孝也護持品三章勑命十方一切金仙四衆八部及諸眷屬悉令下降覆護受持是此經者勑命十方天眞大聖飛天神王三官四聖二曜九星北斗南斗東斗西斗中斗二十八宿周天衆星金剛力士神王等衆各與部衆悉令下降覆護受持是此經者勑命十方世界一切金仙金仙諸佛菩薩也四衆非世人四衆陰陽神衆將卒四衆也八部觧見二卷及諸眷屬四衆八部之姻眷屬類也十方天眞大聖十方諸天衆眞大聖也飛天神王觧見前三官天地水也四聖天蓬天猷翊聖估聖二曜日月也九星金木水火土月孛紫炁羅㬋計都也北南東西中五斗二十八宿角亢氐房心尾箕斗牛女虚危室壁奎婁胃昴畢觜參井鬼柳星張翼軫周天衆星辰金剛力士神王等衆一切將部也各與其部下等衆攷證經是帝勑朝命所頒三公四相兩京九卿羣有司百執事貴戚異姓億兆蒼赤罔不欽奉玉經有衆神之覆護受持者帝命旌賢輔有德也人身有三元四象二氣九官五行及二十八宿之度數周天經緯水火眞志大慧操修力行妙法善功與衆神等故人之一身身體毛髪皮肉血髓筋骨神氣精華經絡輔我正性眞氣命寶存焉夫正性眞氣即帝眞經三萬六千神氣八萬四千毫孔眞光即十方仙眞金剛力士星曜神王部衆消灾經云即有天眞衆聖金剛力士各百億萬衆護衛是經即此意也夫經不在言語文字眞意在吾心神不在十方世界而在吾一身持心修身不在誦讀披閱而在一誠默運至誠無私精神氣全聖可學天可希道可入動罔不吉神其估之三藥耗一眞喪自已之神衰氣弱精不充徹與天違逆神豈估之噫人一也君子修之吉小人悖之凶故經云覆護持經者則知天福有德矣帝德無疆經利最大惟人之敬受何如護持品四章勑命隆魔力士四天門王五嶽四瀆及諸名山四海九江十二河源山林川澤一切主者悉與眷屬覆護受持是此經者諸險惡處令得安穩勑命所在一切土地靈官并溝渠等神及一切諸大力鬼王皆令覆護受持是此經者十二河源今紀十三名有二水共源者故云十二河源勑命降魔王天丁力士四天門王東西南北四天門王也五嶽東泰南衡西華北恒中嵩也四瀆江瀆河瀆淮瀆濟瀆之神也及盡世界一切諸名山四海東西南北四海九江洋子錢塘漢陽潯陽混同錦江湘江烏龍鴨緑等一切江也十二河源黄河爲世界之脉若崑崙禹門星宿海火墩腦兒及尾閭發瀉河水等根源也一云論黄河之源崑崙有九井七泉不止十二十二河源蓋禹踈九河及汝漢淮水泗水爲十二也九河徒駭太史馬頰覆釜胡蘇簡潔鈎盤鬲津汝漢淮泗爲十二河源黄河則河之總神若涇渭沂汶溱洧滹沱興洽弱水等及一切諸河皆河之屬也山林盡世間山林川澤盡世間川澤水流曰川澤水澤也一切主山林川澤主者之神悉與其眷屬覆護受持是此經者諸危險艱惡之處令其無虞而得安穩指持經者言帝之勑命所在一切方所土地之神一切感應靈官溝無水注曰溝或山或土渠有水曰渠等神自溝渠之外凢一切小神也及一切諸大力鬼王皆令覆護受持是此經者帝經法旨諸仙寶崇諸佛受持諸天奉行諸神欽仰諸人謫讀魔鬼自伏實惟山得以鎭靜水得以流長所以衛護惟嚴也持經者旣爲諸神之護又鳥可慢哉一慢則過深罪重矣善乎孔子曰小人不知天命而不畏也狎大人侮聖人之言知此爲小人觀斯經尚戒勉之護持品五章令諸魔外道悉皆懾伏潜形遁跡高飛海外逺避他方如是山林社稷祠廟血食之屬一切鬼神當自消滅五方行病瘟疫鬼帥諸惡鬼神并風王水怪孽音業龍妖神土精水魁盡自消滅五虛六耗夢寐乖常野道呪咀蠱毒之類皆自消滅是持經人心欲願者一切如意皆得滿足懾音聶令諸魔外道諸魔天魔地魔魔王魔民魔女外道淫辭邪說僻行雜法旁門小術私技三千六百九十六種三萬六千等是也令勅命禁令剿除也悉皆懾伏悉盡也懾驚畏心服也伏收斂歸伏也潜形遁跡潜藏也藏其形象不敢顯露遁逃避也逃其影跡不敢停止也諸魔之形雖外若妖艷幻象竒美眞態實阻不可見人此經眞法破鬼之膽碎魔之心諸魔難逃其鑒心畏法言玄律丹勑自不敢留恐露醜質外道之言欲以亂眞正道行而邪說息大道尊而傍門廢帝命一宣自不敢容高飛海外魔行無跡可以飛言外道人耳何以言飛格心易慮向化忘私高騰海外即俗語言魂飛天外魄散九霄耳逺避他方不敢居其故地也如是山林社稷祠廟血食之屬一切鬼神當自消滅山林解見前社土神稷榖神祠司也祀也神之司臨祀而祝之也廟朝也妾神於廟而朝祭也血食享牲醴之祭者也以上鬼神皆宜祀者也如何令自消滅神邀祭祀必爲不直民謟鬼神必爲不正故薩眞人收伏王靈官改禁城隍西門豹守濟州投巫於水以禁河神况邪有假神以感人人有崇邪以誑俗故胡穎經畧廣東毁幻佛而殺妖蛇杖僧人以脫愚俗今云一切鬼神消滅奉經旨不你禍福安然無威聲也五方行病瘟疫鬼帥諸惡鬼神惡鬼神非行病鬼帥廼世之厲鬼强神也并行風之王水中之恠作孽暴龍妖異邪神土精木魅盡自消滅五虚六耗精神氣血身五虚六脉衰耗夢寐乖常魂魄不寧一云五虚六耗如天哭破敗喪門太嵗太耗小耗飛廉空亡黄旛豹尾九赤口白舌惡厭神殺凶星作禍神鬼之屬一切辱事野道邪法呪詛妖語或呪或誓及蠱毒魘昩之類皆自消滅是持經人心欲願者一切謀望趁心如意皆得滿足無有違逆夫道德之士鬼神欽重凶邪盡消祥桑之死梓橦驅瘟旌陽伏蛟祖天師伏魔薩祖禁鬼皆有明效噫王彦方烈士也盗願刑戮不令彦方知則驅魔伏外道誠有德之必然者但人之三尸五累七情六欲九識下𢙣爲害欺不能正己伏邪除凶人能正心進道斬三尸除五累情欲盡識惡除己願盡而外邪消凶散吉臨矣護持品六章或有未能遵依科教修崇齋醮但能清凈持戒專一信受尊重敬慕是此經典並同修齋護持凈戒者是人功德坦然無礙自在逍遥號人中聖德慧長新同諸眞人能如法受持經者功德莫量已或有未能邁依玄科教典修崇大齋醮但能清凈無染持戒專一持守道門戒律或五戒八戒十二可從戒十八戒二十四戒三十六戒七十二戒百二十戒百八十戒三百大戒女冠六百凈戒專心致志持此戒品專一堅固無二信受尊重信受奉行欽嚴尊重誠敬仰慕是此經典或作但能清凈持戒專一信受尊重敬慕讀者俱是並同修齋護持凈戒者未能遵依科教修崇齋醮清凈尊經之人並同修齋醮者功德一般諸神敬估護持是凈戒者三云自己清凈專一護持所守凈戒是人功德坦然無礙坦平也寬廣也心有二則功德不實戒不持於功德有玷心身清凈持戒專信受切尊敬經典心無染心無二無有虧欠縈繫功德眞實自是坦然又有何礙自在逍遥人性生來無拘無困客感物累忙忙苦苦無復自如焉得快樂清凈正信無復物累得大自在常樂逍遥號人中聖不惟爲逍遥之人消凈正信高出人儔號人中聖人德慧常新習與智長化與心成聞見眞而智慮融物累忘而性眞湛德日新慧日明是德慧常新同諸眞人清凈正信者同持經得道諸天眞人夫所謂清凈持戒專一信受尊重敬慕非有計功之心爲人之意無所爲而爲絶無虚假間斷即孔子所謂造次終食顛沛無違即中庸所言無入而不自得莊子著逍遥之旨海蟾著快活之歌佛家所謂大自在儒典所謂日新温故而知新皆自然之效也豈有所假借又豈有勉强襲取之義哉噫清凈正信雖不依科教脩齋醮有是自然功德可見道旨玄科惟在實體經義科教齋醮普法品以演道化耳陳希夷諷度人經成道蓋眞持經旨耳今之齋醮無明效者有盛儀無眞修也若清凈正信更脩齋醮則功益大無齋醮有眞誠功亦神若無眞誠則齋醮皆文具矣寧無過乎護持品七章爾時昊天上帝聞是說已即於帝前稽首歌曰大哉至道無形無名渺渺億刼黄道開清神清朗耀九炁吐精玉虚澄輝太霞高明玉皇開化溥度天人三元道養二象攝生朽樹故根已枯使榮蠢動蜎息長生化形懷胎含孕俱得生成亡者命過魂歸三清魄受鍊度南宫飛昇今日大吉皆得光明五帝鑒映普告萬靈天神地衹及諸河源五嶽四瀆及諸名山洞玄洞虚洞空洞仙無極大聖至眞尊神無窮無極溥監度生惡根斷絶玄都記名衆眞班列咸聽帝言經是帝勑保誦持人至度道岸無使灾侵我奉帝命一切咸聽爾時觧見前昊天上帝聞是說已指上護持功德言也即於帝玉帝也前稽首歌稱讃詠歌也曰大哉至道大莫可量至不可及也無形無名不見不聞名亦强稱渺渺億刼無始無終歷刼無數一云十萬曰億要之舉大數言實無數耳黄道開清吉時慶會天道開通神清朗耀神風永清朗耀光明九炁吐精融炎演昊景道混洞浩等九炁也吐精黄道開死慶消九炁呈輝吐精炫瑞玉虚澄輝玉光虛明澄然清輝一云玉虚天呈輝太霞高明太玄霞光大高至明玉皇開化開度教化溥度天人溥遍也盡度一切天上地下人三元道養天生地成人教化之爲三元道養也二象攝生乾坤造化生成人物終始宰制故云二象攝生一云陰陽陶鑄爲二象攝生俱是正論朽樹故根朽壤也故死也已枯使榮枯槁也已乾枯使再發榮蠢動蜎息長生化形蜎飛蠕動蠢類生不夭折俱得脫其本形懷胎含孕俱得生成人物胎孕不傷不墮俱得安然生長而成亡者命過魂歸三清死者不經地獄皆歸天上魄受煉度南宫飛昇死者七𩲸受大慈眞人鍊度魂神飛上南宫今日大吉指說經時言皆得光明人物咸濟幽暗開光五帝鑒映五方五帝照鑒光映普告萬靈徧告一切鬼神天神地祇及諸河源五嶽四瀆及諸名山洞玄洞虚洞空洞仙玄虚空洞一切仙帝神佛將鬼無極大聖至眞尊神無窮無極無盡量也普監度生溥徧監臨度化群生惡根斷絶永除人物惡根玄都紀名玄都丹臺紀功德名衆眞班列朝班侍列咸聽帝言玉帝言也經是帝勑此經是玉帝勑旨保誦持人保護誦持經法之人至度道岸登升道岸無使災侵一切灾難不侵我奉帝命奉玉帝命一切咸聽一切人物鬼神皆德也此申全經功德護持品八章于時昊天上帝說是歌已告大衆言此玉皇妙法語諸聖祕密言路絶道斷微妙難思巍巍大範爲神明之宗保鎭國土拔度生死爾時昊天上帝說是語已法筵清衆咸仰道言溥得開悟于時昊天上帝稽首稱讃玉帝旣說歌已告諸天仙眞神將等大衆言此玉皇妙法語諸仙聖皆有法語大而可量傳而有限或可知其始知其終或利生而遣死或利人而遣物或鬼神可識或邪魔不伏或無知無形不能普濟非爲奇妙今是經功化無窮威利莫量一切獲益非常品也廼玉皇妙法語諸聖眞秘密玄言元始說經如何云諸聖諸至眞聞受此經皆寶重不敢輕洩故曰諸聖秘密言路絶道斷最上一乘法非常聞修眞要路入聖周行情欲幻妄到此拔根愛念凢思無復滋蔓輪迴轉生一刀兩叚故言路絶道斷一云七聖皆迷人所難行亦是微妙難思深微玄妙神不可以思致難以思入人心思所不易到也巍巍高大妙範仙章爲神明之眞宗心印一說言玉帝道範爲神明宗師太拘了保鎭國土拔度生死爾時昊天上帝說是妙法至拔度等語已法筵法會華筵清衆清凈聖衆也咸仰道言道言指玉帝言或以爲仰昊天妙法等言溥得開悟盡得悟也攷證夫子之言性與天道不可得而聞也文始經云聖智造迷鬼神不識佛在靈山說法菩薩𤢜𤢜着耳聽玉皇法語路絶道斷微妙難思有何疑哉爲神明之宗鎭國土度生死亦自然之效矣觧疑天下無道外之人亦無人外之道人物幽明皆道也人性全眞萬物皆備一切化育世界始終皆吾性之眞也玉帝道身也經爲道旨也惟道則全功神化妙本自然人與同性也寧不可以持經耶知道在身一心體道生生世世無二則聖眞在我已護持品九章於是天尊而說偈曰玉帝功德大玄理極幽深生於浩刼前運化於古今我今說妙經愍念諸有情此誠極妙法功德中功德名號最上乘無比爲第一大光明王尊威德世希有能破暴惡魔皆令心降伏能滅極重罪皆令得清凈若人聞是經或聞帝妙號稽首生恭敬一切罪消滅十惡四重罪五逆於父母信心一稱名隨聲盡消滅保護人天衆四相與五衰三塗極重苦人間凡厄難凶年饑饉喪毒藥及魘魅刑獄與寃家軍陣闘戰苦山林惡道中虎豹豺狼衆江海毒龍類迅雷風雨雹水火及盜賊蠱毒中心腹失志發狂亂蛇蝎毒惡蟲邪魔凶怪神伺求人便者由持是眞經普皆自散滅惡病久纏綿夢寐亦不安非理欲殘命殄滅不爲殃縁遇是經故安穩得自在所有希求願財寶及富貴以此經功德如意皆稱遂神威自在仙諸天十一曜三十二天主二十八宿星靈妃玉女等天神及地祇三界虛空神江海諸龍王水火及風神宫殿與宅舍山林樹木衆溝渠井泉神由持是經故一切皆擁護衣食常自然子孫臻富貴出言人希聞所至皆推敬若爲求男女持誦此眞經帝詔下天曹落籍天仙人降謫生其家爲其作男女顯貴人崇重七祖得超昇光大慶門户延及父母親吉祥常熾盛災障不能侵是故我今說大衆宜諦聽慈悲度一切皆令達上清凡音纉於是法筵清衆開悟時元始天尊說偈語曰玉帝功德大玄理極幽深生於浩刼前蓮化於古今我元始自言也今說妙經愍念諸有情功德中最上功德無比妙法爲第一玄機大光明王尊光明無量覺王至尊威德世希有玄威妙德世間無有十惡四重罪四重罪一云魔獄鬼畜一云雷擊灾疫盜賊刑獄五逆於父母孟子所謂五不孝惰四肢博弈飲酒好貨財私妻子從耳目之欲以爲父母戮好勇闘狠以危父母一云不恭信孝順守禮爲五過信心一稱帝號隨聲滅罪五衰珠冠碎身屈頭俯眼淚鼻噴身無光天衣敝影露神運不靈通凡數蓮會遇也寃家前業寃相遇也迅疾雷也雹氷雨也伺暗侯人空便爲害非理欲殘害己者殄絶止滅不爲禍殃東西南北四八三十二天主持經人出言玄妙人所希聞所至處人皆推心敬服七祖父祖曾高傳支之祖開林之祖立姓之祖爲七祖熾勝大光顯也慈悲度一切皆令達上清大羅界也此偈元始著玉帝玉經功德令人欽持也護持品十章於是天尊普告四衆凡人持念此經受誦帝號皆道根深重宿有善縁此經尊妙普度天人但精心恭奉家國安寧保命度灾掃除不祥天子王侯得奉之者致國太平凶寇自夷邊域不爭兆民歌唱普天興隆運推數周正道當行有得之者天眞敬重寶之祕之於是元始天尊普告四衆凡世間一切人持念此經受謫玉帝寶號皆道根深重即儒家所謂資禀清且厚佛家所謂根器好宿有善縁夙世徃刼廣植陰德預有良縁蓋至道難聞法會難遇慶宵難逢有歷世不聞正法有聞而不信不悟不周完不蒙實益者皆根器之淺縁分之薄今值法會聞正法蒙實益皆是歷刼脩持道根深重宿有善縁此經尊妙普度天人但精心供奉精誠恭敬尊奉此經家國安寧保命度災保命延生度灾消厄自古聖賢有生有死灾厄常有何云保命度災蓋保天命而全正氣素患難而日坦然生順死安吉凶無二是持經之保命度災也掃除不祥經法所在凶厄潜消吉人天相災難永除無有不祥天子王侯天下之君曰天子曰皇曰帝周則稱王近世稱藩封一國之君曰王分符世臣曰侯古之侯分封百里得奉之者得奉此經者致國祚享太平凶寇自夷夷平也國有道内順治外威嚴凶人賊寇不作自然夷平四夷來王天下晏然邊域不起兵爭兆民衆庶歌謡唱樂太平普天下與隆富庶乂安運推數周貞元會運推還時數已周一運正道當行於世有得經法湛然神化之道者天眞敬重寶之祕之此經尊重寶之可也普度天人廼云祕之不幾於私天道哉蓋大道雖然普濟不信者不可輕傳佛之正法眼藏不妄示人孔子曰中人以下不可以語上也上達必由心悟輕之則爲褻天經云祕之觀者愼之自知經義應驗品續十一章報應神驗品第五爾時慈悲度厄眞人尋聲救苦眞人濟生度死眞人萬福護身眞人俱從座起越班而出俱白天尊言若諸末世凡夫雖宿有善縁得遇是經被諸邪障所隔本末疑惑不信是經功德如是之人見在未來於諸地獄得何罪報惟願聖慈說其報應惡趣之苦爾時慈悲度厄眞人尋聲救苦眞人濟生度死眞人萬福護身眞人俱從所坐座上起越班而出越衆神班次而出俱白元始天尊言若諸末世凡夫雖宿有善縁得遇是經被諸邪障所隔己之邪見人之邪說偏性拗妄事障理障一切隔礙本末疑惑始不能信後不能悟上下扞格不能融通終始本末不得徹契本末疑惑不信是經功德如是之人見在未來今世未來世也於諸地獄得何等罪業報應惟願聖慈天尊說其報應惡趣之苦人物業識各有意趣或善或惡輪沉難脫大聖至眞融宿習拔根塵凈識業絶諸趣障執盡脫不受轉廻無諸罪報大賢菩薩小仙小聖神將鬼靈善者以作福爲趣惡者以作業爲趣善者無論惡者自沉業獄報應種種欲出無門欲免無計報盡轉生捨此入彼業縁牽累復迷不悟歷刼顛倒相循不止此等業趣實可憫憐四眞人上乞天尊說其報應惡趣之苦廼大慈悲度世心切也兩教言報應儒者以爲不然太甲曰天作孽猶可違自作孽不可活傳云福善禍淫又云天人之應捷於影響何嘗不言報應哉夫子曰君子懷刑又曰畏天命故自不爲惡道義悅心自無他趣歷朝扵郷飲禮射而講讀律令教兆民惟格人非心匡翼其善心耳兩教之言報應刑獄無非拔其業趣使爲大善也噫惟聖人神道設教而億兆服玉帝功德最大故經明示報應拔人惡趣不爲詭衆若自不修眞但以禍福眩人是欺衆也觀經者絶欲成眞免一身之惡獄而後可以濟世度人矣應驗品續十二章是時天尊謂四眞人云若諸世間剛强暴惡不善衆生終日竟夜對諸道像無恭敬心出誹謗語是罪當墮五無間獄若得值遇是持經人設諸方便誘引開導如是之人能滅惡心信向是經彼人罪業凈盡無餘是時元始天尊謂慈悲度厄等四眞人云若諸世間剛强暴惡姓勇行粗者不善衆生言行不善一切衆生終日竟夜竟亦終也盡也盡日盡夜對諸道像諸神聖像無恭敬心出誹謗語誹以言非之也謗以言毀之也是不敬道像誹謗神聖的人其罪當墮五無間獄五獄冥司大獄也非聖者無法故墮此罪試觀誹謗妖言之陽律則知謗神之罪若得值遇是持經人值遇彼此時候適相會逢也設諸方便救度之法誘引開導慢神謗法之人業根深重一意執迷無有信心持經人大慈悲方便啓誘接引開發化導顯彼良心生其善念如是慢神謗法之人能滅自已一切惡心信向是經信心皈依專向是經彼人罪業彼指慢神謗法之人所在罪業凈盡無餘業消罪滅報對悉盡永免寃愆不入轉廻常清常凈惡報永除再無不了之業也無間地獄業若難消一心信向眞經惡根立斷諸塵盡滅有何牽繫根塵立盡業凈無餘夫神德經功利益最大兩教甚言罪福切示慢神謗法之罪儒者每戒謟瀆鬼神豈儒不敬神不尊經哉詩云無忝爾所生張子云不愧屋漏爲無忝又曰存心養性爲匪懈兩教所言敬神尊經使其存心脩行無愧於天地神明尊信法言體道成眞也儒者言不媚神戒其邀福妄瀆耳事天畏天希天尊先王之法言對越駿奔嚴敬不苟儒與兩教一也若祭無益敬不足行天命不足畏此敝言也儒者亦切責之寧獨二氏乎噫善惡敬怠一切由心能絶情欲去智識空五藴除五累則不在五行中天地不能拘五無間獄又何遣哉佛云稱佛名號火坑變作蓮池孟子云誦堯之言行堯之行是堯而已矣則眞善功效立見皇經集註卷之八
