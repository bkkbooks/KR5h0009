front:
  text: 高上玉皇本行集
  hash: sha256:fbfff63c1d3614a0c57352a1512ad5ab645da706ad414ff3536293352667ec54
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5h0009_SJB_002-340638c, image: sjb/34/340638c.png}
body:
  text: 謹按抱朴子云高上者種民之上盡天之極其高無對即佛家所謂不退轉之地也玉皇者聖中最尊神中最貴諸佛聖師萬天帝主故尊稱曰玉皇吕純陽云道高無皇經註觧卷之上文昌開化帝君張校純陽警化帝君吕閱長春輔化眞君丘編雷霆大元帥鄧天君訂証皇經集註目録本經三卷一萬二千三十六字上卷中卷下卷五品清微天宫神通品第一係上卷太上大光明圓滿大神咒品第二玉皇功德品第三俱中卷天眞護持品第四報應神驗品第五俱下卷本經集註十卷十萬餘言首卷諸眞序前序附攷義管見序二卷三卷四卷俱上卷註五卷六卷七卷俱中卷註八卷九卷十卷俱下卷註經名同異辨倫曰皇上帝仁孚浩刼功超列聖盡善盡美稱讃難窮位乎玉清宣元始之化廼號玉皇韓湘云本行者迷玉帝成聖根本歷修妙行集經集元始五品之妙言合爲一經示後人修行之正路耳管見云惟天蓋高玉帝所居之天位接玉清又超諸天故曰高上人見玉帝之尊以爲絶德人終不能及不知聖道無二我與至聖齊肩帝之尊帝之妙行成之也故天樞張上相傳集是經欲人希聖成眞故明旨云玉皇本行集經欲人觀經了悟歷考良因追蹤至聖以成上眞也其後又稱曰太上洞玄靈寶經蓋言大不可量高不可極故曰太上闡先天道德之秘爲萬世文字之宗洞明三景顯露玄機故曰洞玄玄靈之藴爲天人億代法寶故曰靈寶要之經以明道道屬我身人能盡性至命了悟此道探本躬行可以入聖矣清微天宫神通品第一祖天師云清微天宫超絶三界塵染悉凈虚玄明妙微不可窮居三清境是大天宫玉帝居也元始演經御此妙界至聖妙用運化無方不可測識經演此義爲最上品非神智妙慧不能明了故曰神通品第一愚按古義云妙化不側之謂神周貫無遣之謂通廼五品之冠三卷之宗丹臺契此全經可曉神通品一章爾時元始天尊爾時者無極分景之初太玄開化之始萬聖良縁妙際此經將演之時也元大也首也始初也萬聖闡化肇端於元始故曰元始天尊在清微天中註清微天解見前玉京金闕註紫清白眞人云玉帝所居白玉爲京黄金爲闕非世金玉神通妙化碧天瓊琅莊嚴官城故曰玉京金闕七寶玄苑註白眞人云七寶者碧上瑶階琉璃宫虬文壁白玉城丹闕金色徹照光廼號七寶一云玻瓈水晶珍珠瑪瑙珊瑚琥珀硨磲玄苑重玄秘苑也玉皇宫殿陞光明座註張子房云元始時臨御玉皇殿陞大光明玄聖之寶座與無鞅數衆宣說靈寶清凈眞一不二法門子房云元始登座無量眞聖來集故曰與無鞅數衆宣明玄靈妙寶清凈無染至眞玄一秘妙無間無雜不二之法門十方集說云人之元神性命之宗是大天尊清微天界身固有之玉京金闕七寶莊嚴人人本具而性命陰陽神氣精又身之七寶則琅庭玄苑天人一致天君泰然則玉皇光明之座可陞百體從令凝神會道即天尊御座與無鞅眞聖宣靈寶清凈眞一不二之法門也然道無形迹了悟明徹秘臻妙境若大路然入之有自矣故曰法門神通品二章是時註是元始陞座之時玉皇尊帝註尊帝其崇無比故云然與諸天眞飛天大聖無極神王靈童玉女九千萬人清齋建節侍在側焉子房云與同也諸衆也玉帝同衆天仙眞人妙運助化昇度神通飛天之大聖三千大界無量之外諸天地無極方之神王少陽梵氣應感侍啓之靈童少陰梵氣宣化傳奏之玉女大計九千萬之神人不露神光歸眞元始清齋持建寶節侍列於元始光明座之傍天猷副元帥云人身有眞主元神靈通不拘亦有飛天大聖神氣扶衛一身無間隙處亦有無極神王少陽之玄光少陰之靈運亦有靈童玉女心同於道則陽剛大數亦云九千萬身神朝元清齋無貳爾心建節身無惰儀管見云人與天地一般當清明不雜元神御極之時果如顏子之心齋如法家之持幢唱恭無二則從令天君而道得矣神通品三章于是註于是就此際會也玉帝知時欲至即於會前舉六通力放大光明遍照諸天無極梵刹一切境界皆大震動十方無極一切世界俱同瑠璃玻瓈無有隔礙註梓童云玉帝知道開玄光文明將啓演法傳經之時欲至即於盛會前彰舉六通之法力放普照最大之光明遍照無量天無窮極諸天帝神眞所居之玄梵宫刹一切神御之境界皆大震驚而竦動盡十方無極量一切仙佛之世界俱同瑠璃玻瓈之寶光明瑩徹盡照畢見無有間隔滯礙不見之處張紫陽云六通視通聽通神觸通神會通夙神通預照通即佛家所謂天眼等六通也梵刹仙帝神居妙麗天上不依階塵未嘗毁壞巍然不拔凡目難見故曰梵刹一切境界各神所居之境其境之界一切世界不止人間諸界天境亦謂之世瑠璃雖有形光而乘物畢見玻瓈之寳無有漏脫而物無不見玉帝光明射盡諸界幽闇悉輝豈有隔礙以如字言者恐人不省故比喻而論耳管見云人性光明本無不通以元神失主故有隔礙或聞不見或見不聞或知不言或言不知或蔽人己或惑先後玆不能六通也若了徹性命元神時御則普照天人表裏洞觸紫府丹臺黄庭玄界身神故址本有天垣皆光耀見輝無有遮滯盡被光明豈非玻瓈瑠璃之載物無隱障耶雖然道固本明明之非易未知不可强已知不可惑不先不後了悟實難人能如玉帝觀時至而顯光復日新而常泰則大光明終不晦道其永彰矣神通品四章十方聖衆並乘五色瓊輪琅輿碧輦九色玄龍十絶羽蓋雷祖云十方四正四隅及上下也聖衆十方眞聖神衆也睹玉帝所放光明並皆乘駕五采文色瓊玉之輪琅秀華輿蒼碧寶輦九色華光玄龍十絶無倫之羽蓋白玉蟾云五色青黄赤白黑也輪車之兩輪輿車也輦帝王車駕之總名九色青色赤色黄色白色黑色紫色碧色太玄色金光明色玄龍有龍光象不見形骸十絶十極所無神奇絶倫靈鳳祥鸞之羽蓋道經云羽蓋即高柄羽扇一云神仙帝眞輦行時有瑞羽法節以爲之蓋後說尤妙管見云人秉五行金木水火土之元靈各有法寶仙眞道成諸寶擁隨法駕人能默朝上帝效法於天身中神集正氣呈秀瓊玉輪琅玗眞碧寳輦九氣靈色玄化之神龍十絶無儔之羽蓋昔在一身中矣豈獨天地神聖有哉噫惟眞得者知之神通品五章麟舞鳳唱肅歌嗈嗈靈妃散花金童揚煙讃詠洞章浮空而來虚靜天師云聖衆駕行有麒麟導舞嗚鳳和唱嘯聲和雅其歌嗈嗈天靈妃御散布瓊花隨侍金童輝揚祥煙讃唱歌詠玄洞寶章同護神駕浮凌虚空而來帝京十方人云神帝行駕有靈童采女歌隨麟舞鳳唱侍衛童女舞唱效麟法鳳也故曰嘯歌嗈嗈此說太鑿神駕行有麟鳳即今帝乘御看馬之類況道經有云天帝行時龍翔鳳舞蓋天上太和仙景自有此意又云龍豹長嘯於山林則嗈嗈嘯歌爲眞麟鳳無疑不然舜帝作樂於岐山何爲鳳凰儀而百獸舞耶觀經味此當從前說管見云人能修道默順帝則禮元皇身中太和天籟鳴唱玄脉安適雅如麒麟之舞鸞鳳之鳴嗈嗈可樂陽精煥彩陰華呈露恍見靈妃散花金童揚煙秘樂玄韻即天人讃詠洞章對越元神如憑虚御風是亦聖衆浮空來帝闕也此人人之同具惟有志者驗焉神通品六章是時梵天一切金仙大乘菩薩四衆八部承斯光照皆乘金碧飛雲玉輿九霞流景慶霄四會三辰吐芳飛香八湊旋繞道前雨衆妙花如雲而下遍覆會前子房云此時諸梵天一切大覺金仙了悟大乘正道之大士天神魔鬼之四衆天龍八部承此光明之照皆乘金光碧色飛雲寶玉輦輿所被九霞之服流散妙景以慶吉之霄四衆集會曰月星三辰爲之吐芳秀散飛異香八蜒環凑衆聖呈此秘妙旋繞周折於大道之前雨降竒妙天花如衆雲之垂下遍覆蓋盛會之前麻姑云梵天最上寶林瓊宫凡世未見隱妙莫窮故曰梵天金仙金剛不壊之仙大乘菩薩若觀音大士等四衆仙衆將衆男神女神也或亦分天神魔鬼俱遍若云道俗僧尼非也蓋天上凡身難至故不言此四衆八部神部將部天人天丁部金剛部龍王部夜光女使部修羅部夜乂部也九霞碧霞彩霞紫霞丹霞雲霞煙霞瑞光霞景輝霞普運寶霞九色玄光流此異景蓋衣之光亦云神之隨形妙好不專在衣被也慶霄云佳辰亦云慶覲神霄也四會天良會神吉會時際會縁凑會也不專言四衆之會也旋繞道前飛香八凑之旋繞亦云聖衆旋繞也如雲而下遍覆會前妙花如雲之下盡覆會前或專言聖衆如雲而下太鑿管見云人身之神甚多元神弗御則衆神不呈靈惟修眞之士默朝眞主萬神恭謁靈府玄光諸奇百妙一一湊顯元神會前諸禎列瑞如祥雲遍覆我與天上不二矣神通品七章是時帝光遍照諸天下燭十方無極世界同玄都境凡彼人間上近九天通接交連至親至邇凡彼下方無極世界山陵坡坂溝澗溪谷緬平如掌六合至邇三境非遼天寶臺殿星羅人間瓊瑰羅列朗耀雲衢七寶欄楯以界道路玉樹仙花蒨燦珠寶景秀丹田芝草綿覆天眞皇人云是時玉帝之光自此世界三十六天遍照及三千大界之諸天下照燭盡十方無極量之世界俱皆光明同於玉帝所居玄都境界凡彼各法界人世間承此光照無有隔礙上近於九陽妙化之天天地人間通明相接交互合連極其親近凡彼各下方無極世界高大山陵崎嶇坡坂污下之溝澗溪谷緬然平正如人手掌盡上下四方之六合聯屬至近三清境界亦非遼逺天上珍寶之臺閣殿宇如星辰明密羅布於人間瓊瑶瑰玉張羅陳列朗然光耀於雲空衢路七寶妙成之欄楯以分界道路玉枝寶樹仙瑞奇花蒨燦珠珍之寶妙景秀輝丹田瑞芝靈草綿結覆蔭石杏林考義云人王之居曰京都玉帝之居妙冠諸天世所難見故曰玄都平時天清地濁神靈人愚若不連接非親邇也帝光照徹神機妙聯故上下連神人親近也九天九上界三十六天非止九也山舉高大者而言陵丘大阜也坡地之失平者坂山嶺之崎嶇者也深長曰溝山夾水曰澗水之流注處曰溪山之大虚曰谷緬坦平也地有山水谷澗本不平也帝光覆照妙意融溢故盡各世界之地皆平瓊美石瑰玉類也紛然並陳曰羅列雲衢天端之路横曰欄竪曰楯即世之排攔也蒨華光之顯輝者珠寶珠寶之實丹田玄都丹陛之田耳管見云人身有天地陰陽之元秘不交則上下間隔遼異若元神御光天輝煥發則地天泰上下融高下曲轉並親邇妙合矣身中本有之寶妙顯神映與天上何殊丹田御神之地奇景秀見靈孕神芝綿覆呈瑞已欄楯仙花何待逺求神通品八章時彼下方皆見諸天鈞天妙樂隨光旋轉自然振響又復皆見鸞嘯鳳唱飛鳴應節龍戲麟盤翔舞天端諸天寶花零亂散落徧滿道路是時凡聖駭異幽暗開光天人悅慶踴躍懼忻凡夫學士盡得飛昇仰觀刼仞寶臺俯眄紫雲彌羅是諸世界一切人民咸臻道炁白首面皺皆得化度紺髪朱顏少壯幼稚轉增形容光澤美好苦惱痊平普蒙解脫安樂快然天下歌謡欣國太平長生大帝云當彼帝光遍照之時各世界下方人民皆見各天鈞天上秘之妙樂隨帝光旋轉繞動自然聲振而音響又復盡見瑞鸞歌嘯靈鳳和唱飛動聲嗚悉應節奏玄龍舞戲祥麟旋盤翶翔舞動於天端諸天上珍寶之花紛零飄亂布散降落周遍充滿於諸界道路此時凡夫聖人皆震駭驚異幽隱黑暗盡開光明天神民人並皆豫悅喜慶踴躍鼔舞懽暢忻樂無知凡夫學道士人皆得神遊玉京飛昇天上仰觀刼仞高隆諸寶之臺俯眄紫雲覆映彌羅之界是諸世界一切諸人兆民咸皆臻於道炁妙化之域白頭皺面之老盡得化度爲紺黑之髪紅朱之顔少年壯夫幼小童稚轉增加華麗形容光輝潤澤粹美奇好衆苦諸惱痊泰安平普三千大界老幼盡蒙悟解超脫安逸喜樂心意快然各天下皆謳歌謫謡欣樂國運之太平雷門使者云鈎天妙樂金爲八音之首上梵玄韻不毁之金元諸韻諧和無亂無毁聲律之宗一云不調自匀世所希聞故曰鈞天又云大造爲洪鈞道化妙運自然太和天樂之妙是大造之化故曰鈞天踴躍懽忻手舞足蹈而喜也八尺曰仞天之寶臺歷衆刼難毀非可磨消者故曰刼仞仰觀舉目觀俯眄低首顧視也紫雲彌羅黄老寶境非俯視者對寶臺言若有俯仰之義紺深青揚赤色紺髪即今言緑鬢管見云人有陰陽身分上下上炁常清下氣常濁惟氣間而不和則上妙不見不聞而衰損弱虚遂乘以患人旣符大道會元秘輝妙景則眞聞秘音眞見玄化鈞天雅奏麟鳳龍鸞悉顯奇矣瓊花飄瑞周徹美觀陰陽氣承佳鬰神若驚駭一切幽闇光明上下和暢即天人之踴躍懽忻矣陰消陽復妙意昇玄是凡夫學士盡昇也上瞻碧寶之臺俯顧通玄之境國富民安氣和神泰衰者壯平者泰不足者有餘易筋换髓終保太和周身順熙快此妙化非老者返少少壯增好天下歌謡欣國太平之義哉吁此實理也達者味焉神通品九章當爾之時神風遐著萬炁揚津天震地裂枯骨更生沉尸飛𩲸皆得復形酆都鐵圍長夜九幽即時破壞地獄苦魂化生諸天三惡道苦一時觧脫時諸罪衆以斯光力得生十方諸大天宫魏伯陽云當天下歌欣太平時帝德神風遐逺鼔著妙有萬炁揚太和津乾發生機陽剛行健天震玄輿坤開成蓮陰柔效順地裂靈幽已枯之骨更復迴生沉滯之尸渙飛之魄皆得復形無拘無散冥府酆都大鐵圍山大鐵圍城冥冥長覆九幽黑獄即時破壞無復暗蔽獄禁諸地獄中受苦幽魂俱化生諸天地獄餓鬼畜生三惡道苦一時觧脫業寃永除時諸亡獄受苦罪衆以斯玉帝玄瑞道光燭照之力得生十方世界玄霄之上沖漠之表諸大天宫愚按鼓萬物者莫疾乎風帝化玄通神神無盡徧徹法界蒙受者不識不知故曰神風一炁有景色無實形奚云揚津炁之所通帝德默運太和洋溢浹洽津濡故曰揚津一天震非言雷陽德亨也出乎震以施生一地裂非崩裂地道卑而上行陰定陽復露成育之妙不閉塞而地藏發泄故云裂一枯骨更生非杇骨再起心死形稿者悟道知眞回陽换骨人中之仙枯骨再生也一魄在人身樂人死享祭祀生不明道塵識染累神離形死魂消魄散或自執或墮罪獄渙飛魄精幻變漂淪惡孽飛魄復形魂靈魄聚不致漂沉驚禁罪苦一切冥業一酆都鐵圍嚴固難開悉由罪魂自障蔽帝光玄照一燭罪滅不見天日長夜九幽之獄悉開光明酆都鐵圍即時摧壊破盡獄苦罪衆得生天上三惡道苦亦即觧脫彼時承光罪衆仗此道力生十方大天宫夫人之生神具形全肖形天地陰陽五行性無不備本太和貫徹清凈無染至知誘物化認假爲眞塵勞染著攀援妄想一有執恃牢不可破欺蔽日久無復開明喜怒憂思悲恐驚情倏臨驟懼心無定見忙忙不止私欲苦心累身語之不省即沉尸飛魄酆都鐵圍黑獄幽閉也若絶欲忘私使天君泰然沖和澄徹鼓巽風周太和全浩然洽道脉即神風遐著萬炁揚津陽施陰受交泰回陽消無量之苦除不盡之塵破歷刼之迷執脫暗昩之業趣即天震地裂枯骨更生沉尸飛魄復形酆都鐵圍九幽即時破壊也陰消陽長欲盡理還易濁爲清精氣化神脫五苦而融五氣默朝元官凈三業而證三元上登紫府即地獄苦魂化生諸天三惡道苦一時解脫罪衆時承光力得生諸天宫也生世間者恩之寶之神通品十章爾時玉帝即分其身徧於諸大天宫令諸天宫自然化現白玉爲京黄金爲闕七寶玄苑大光明殿具光明座幢節旛蓋異寶奇花徧布是處爾時玉帝即以所分之身徧於是處白玉京中黄金闕内七寶玄苑大光明殿光明座上普爲十方演說清凈解脫之道鐘離帝君云彼放大光明時玉帝即分化法身徧及於衆大天宫令各天宫自然化現白玉京城黄金闕庭七寶莊嚴玄苑皆如玉帝所居大光明玄殿備具大光明寶座玄揮法幢節旛華蓋珍異妙寳奇麗天花徧布滿各大天宫之處爾時玉帝即以妙分之身徧在各大天宫神化玉京金闕玄苑之中御大光明殿陞光明座上諸神座俱有光元始玉帝演法寶座其光尤妙至大莫量最神難言妙勝佛家法王座故帝化身陞此座上徧爲十方世界演說其眞清眞凈悟解超脫之道演演明陳其義也管見云人之元神靈通不拘無所不到本同玉帝之妙化紫府丹臺本同天上之神宫瑞芝靈藥本同天上之寶花人惟牽於世利元神失主遂不能周流徹貫觸處呈靈喪我清靜之眞不得解脫之道若保眞合道默禮神王則靈運普通周身徧滿即玉帝分身徧諸天宫凡身達妙至寶呈奇珠樓寶殿瓊官瑶臺即天上金玉京闕七寶玄苑也神宫丹臺即光明殿光明座也氣和脉暢光動霞揚即幢節旛蓋神芝之秀又同天上奇花也元神御宰丹臺敷靈顯秘即玉帝以分身遍各天宫同時登座說法也吾之眞性歷刼不壊無二無雜無拘無間本清靜不染脫落自然大明不昩也能神御敷靈則遍一身皆玄化周三千無拘我明了因縁不昩實際表裏瑩徹窮神達化即玉帝演解講明清靜解脫之道教化各世界也達者味之自識此義神通品十一章時化玉帝各以無量天眞大聖妙行眞人靈妃玉女侍列左右是諸玉女顔容姝妙端麗奇特天珍異寶莊嚴身相言音清徹衆所樂聞是諸玉女其身復出微妙解脫自然之香是香芬馥周徧諸天極妙樂土及諸大地一切福處王母云爾時徧諸天宫化身玉帝各以無盡量天上諸眞神通大聖靈蓮變化妙行莊嚴之眞人靈通仙妃護聖玉女侍立分列於左右此衆玉女顔面形容姝美奇妙端正華麗神奇特邁天珎神異之寳莊嚴身之形相言語音聲清明通徹大衆所樂聽聞是衆玉女其身邊復發出玄微神妙大解脫自然之馨香此香芬芳鬰馥周遍充滿於衆天宫極神妙快樂之凈土並徧及衆大地世界一切福會之處考義云妙行者人有諸善不假强爲功德不窮本於自然而成眞人則神通莫量故曰妙行靈妃玉女陰梵妙氣變化之神拱衛帝眞凡天上神女皆如是稱無欲無累與魔女不同德功俱備貴美尊靈純潔永無間雜故曰靈妃玉女非專言帝后是諸玉女是此也顔容姝妙姝美也端莊正也麗華澤也奇神妙罕見特超絶衆美世無比倫也天寶莊嚴身相天上妃女玄光神化妙寶莊嚴其體其容世所未見言音清徹言言語音音聲清聲語分明徹通徧周聞也微妙解脫自然之香妃女了悟得大解脫玄機難窮神妙莫量不待造作自然馨香且不知其香從何而生故曰微妙是香芬馥芬香美氣布揚也馥鬱然馨香盛著也周徧諸天極妙樂土周悉及也徧廣被也極甚也各大天宫侍衛玉帝化身之玉女香不止及一處皆徧及各世界諸天甚妙無苦樂土大地盡山河世界而言福䖏有世界則有生成故曰福處或云恭敬精信然後得聞異香各世界承玉帝光皆生信心得遇靈妃玉女妙香故曰福處此亦通六道一切衆生聞是香者普蒙開度所謂天道人道魔道地獄道餓鬼道畜生道若諸天道一切天人或有能聞是此香者五衰四相永得消除轉增天福若諸人道王臣兆庶或有能聞是此香者即得人天長壽之樂身或滅度乃得脫殻屍解之道若諸魔道一切諸魔或有能聞是此香者安處天宫闘戰之苦各得休息若諸地獄道一切罪魂或有能聞是此香者離地獄苦得凈土樂若諸餓鬼道一切餓鬼或有能聞是此香者即得飽滿無飢渴惱若諸畜生道一切畜生或有能聞是此香者脫畜生苦得智慧樂救苦天尊云六道中一切衆生聞是靈妃玉女自然之香者普皆蒙受開化拔度之惠六道衆生所謂各天上人道世界人天道諸魔道冥府地獄道窮魂餓鬼道業報畜生道四種民天下一切諸天界之天人或有能聞是靈妃玉女自然之香者五衰四相之苦永得消滅除去轉增益天福之樂若大地一切世界諸人道中帝王臣宰兆民衆庶或有能聞是此自然之香者即得留形住世享人天長壽之樂身或入滅超度即得脫殻無拘屍解仙化之道若諸世界各天諸魔道中一切魔王魔民魔女諸魔精類或有得聞是此自然香者安然附䖏天界别宫爭闘戰伐之苦各得止休寧息若諸世界冥途地獄道中一切有罪之䰟或有能聞是此自然香者即能脫離地獄之苦得生凈土樂地若諸窮䰟餓鬼道中一切餓鬼或有能聞是此自然香者即得飽味滿腹無有飢渴惱恨若諸畜生道中一切業報畜生或有能聞是此自然香者即能脫離畜生之苦得生智慧聰明之樂薩眞人云六道道猶路也在六般途路中受輪轉故曰六道首言天道者天有三十六稱最上四天號曰種民七寶九宸諸天仙所居佛家云不退轉之地種民之下有四崇秘天佛家云四梵天也崇秘天下有四忘象天佛家云四禪天即無色界也忘象天下有色界十八天色界十八天下有欲界六天一世界有三十六天各世界俱同四種民天虚無妙有妙化玄神永無毁淪止有上聖眞仙御居並無天人不在天人道數四崇秘天塵染方凈略化未神未臻大乘雖冠天人道大刼亦不能免無色界色界欲界諸天人天身高大形如白銀不依日月之照自有光明日月天天人身高五里其上漸加至於百數由旬之高由旬四十里道經云踰舍也衣六銖二錢五分重之天衣頭有自然珠冠目不舜頭不俯立不倚眼無淚身無困憊若不悟大乘天福受盡之日珠冠碎目瞬雨淚身屈形憊五般衰弱四不美相見矣若承自然之香精信恭敬悟其妙香之由頓契大道不從外聞此香遂得了悟是曰能聞五衰四相永得消除永終也終免衰相之苦轉增天福轉轉進益天福無窮不退盡也人道不同有陰陽老少有貴賤貧富有聖賢智愚不得大道壽算不長死之甚難屍不能化若各世界帝王宰臣大小臣僚及兆庶諸民千萬曰兆庶衆也兆庶盡人民而言極語其多也若能承自然香了悟大道亦能善聞馨妙即得人天道無拘礙長壽之樂縱或滅度亦必妙脫軀殻屍解仙化矣脫殻或坐脫立亡或投胎奪舍屍解或此已死又顯身於世間屍魂並去或假死而上昇若諸魔道魔類不同若唃嘶囉與天帝爭衡闘亂天宫修羅宄逆等一切魔途或好戰爭或作幻厲居䖏不安常無休息此魔等若聞自然妙香能悟道眞則改邪從正居䖏安然守其素位在天别宫不樂紛爭闘亂戰伐之苦各得罷休止息闘戰苦者闘亂必傷戰伐必殺互勝互敗交爲寇讐所以云苦各得休息神雖不侵魔爲魔所亂亦必應變伏魔今魔聞香悟妙安處不爭神亦無事神魔悉安故言各得休息諸世界地獄不止一名曰酆都曰血湖曰血硤曰寒氷曰火車曰刀山曰劔樹曰愛河曰刳心曰鐵床曰風刀曰鐵狗曰銅蛇曰鑊湯曰鋸解曰碓磨曰剥剔曰泥犂曰拔舌以及三十六獄一切受罪之䰟本難離地獄囚刑之苦若聞此自然之香即能了悟遂得超脫出離地獄諸苦得生清凈樂土諸餓鬼歷刼窮䰟久繫鬼籍或細頸大腹或首大腹獈或咽喉蔽塞或食炭吞煙或餐鎔銅或啖鐵九累世不聞漿水不遇飲食餓餒渴痛雖常憂懊若諸世界如是餓鬼道中一切餓鬼聞此自然之香即能悟道則道味充腹即得飽滿消除飢渴開明喉咽永無餓惱諸畜生道卵化濕耎蠢動皆是不專言禽獸也畜生者雖畜養於天地之間無有智慧業報多苦雖苦難脫各世界一切畜生若聞自然妙香即能悟道則得此解脫業報即盡脫離畜生之苦得聰明智慧之樂畜生非無知不能言道不能體道形異神殊或豢養乘御或漁獵殺食投䧟阱充庖厨茹毛飲血皮骨悉盡最苦難言聞香即得智慧皆帝光法力也管見云上兩節俱一意人身元神總御陰陽眞聖妙行靈妃王女皆所有也神氣精血太和之中本有妙香解脫自然微妙難窮也氣之偏正是非狂愚自分亦有六道惟天君不泰則爲五行所拘念頭不斷紛紛擾擾爲陰陽所制是亦受六道輪轉者也睹己身六丁玉女之美聞太和解脫自然之香明徹大道使元神常煥即覩帝光而仙化者也永脫塵凡不爲身拘是亦永脫六道之苦矣達者味焉自識兩節之意神通品十二章爾時諸生天罪衆旣得生是勝天宫已縁承慈光攝受之故便得覺悟各各明了罪福因縁與諸眷屬作天伎音計其倚切藝也一本作伎字之豉切渠紀切與也伎字當從樂來詣帝前是諸衆等各各含悲俱發聲言臣等前後經千劫萬劫不見三光常䖏黑暗三惡道中多受苦惱伏蒙上帝方便放光愍救我等皆生天上是諸惡業悉皆滅盡無諸繫滯皆得徃生仰朝上帝各到道前是諸生天一切罪衆說是語已稽首復位葛仙翁云爾聞香脫化時候諸地獄餓鬼等途一切生天罪衆旣蒙自然妙香得生是最勝天已因承玉帝大慈光明攝受之故攝接引保持也受接引魂神召之皈眞也帝放慈光妙化眞香攝受諸罪衆即便得覺悟大道覺知其所以然也悟撤通也罪衆覺悟脫其三惡道趣各各明通了徹深知罪福因縁夙根曰因有因則有果由來曰縁有縁則有業罪衆旣明罪業福德因果縁故與諸親眷屬類與同也罪衆或魔或鬼或業畜各有親黨統屬旣生天明道與眷屬舉作天上伎藝妙樂天伎以藝字解者言其妙無不通耳來詣帝前詣至也是諸生天罪衆等各各包含着悲的意思俱發聲音言說臣等前前後後經歷大刼小刼千千萬萬不見日月星之三光常䖏陰黑幽暗之地墮於地獄餓鬼畜生三惡道之中多受罪苦悲惱伏蒙上帝伏鞠身俯伏地下也蒙承受仰被之意言伏蒙以卑承尊當作是言耳後凡言伏蒙倣此蒙上帝普行方便放大光明方便者普著道妙令人得便益故曰方便慈光旣放憐愍救拔我等皆得生於天上是諸惡苦業報悉皆除滅了盡無諸牽繫滯絆皆得徃生諸天仰朝玉皇上帝各得到元始至尊大道之前是諸生天一切罪衆說是言語己畢稽首復歸原侍立的地位愚按人秉陰陽與天地本來相同溺於利欲污䧟眞心長惡不悛以報應轉輪之事爲無是不知罪福因縁故妙和眞意無有蔽於塵俗之綱貪嗔癡妬狂亂悲喜嗜慾求名不見了期是常䖏黑暗如地獄餓鬼畜生之在三惡道中也晝夜熬煎亦與諸罪衆多受苦惱一般是即惡業不盡有繫滯不得生天之罪衆也元神御天光發則一身陰氣雜意惡趣皆復正氣而昇九陽境界知善惡凡聖之關捷於影響報應昭然即洩太和之韻呈靈秘禮元皇是即生天罪衆承帝慈光攝受各明罪福因縁與諸眷屬作天伎樂來詣帝前也陰氣消雜念忘惡趣凈易惡爲善皈神皈命悔悟懲創自知作惡不祥不悟大道如同面墻坐井寔無所見蔽於参三貳二之途遂多憂懼惟元神御瓊臺降眞引靈妙發玄輝化陰全陽了脫塵凡永無牽累心同於道默朝上帝是即罪衆含悲自言累刼憂暗之苦伏蒙帝光愍救免惡業無繫滯徃生朝上帝而到道前也此本天上至神妙化近取諸身者以道本在身欲人反觀實踐耳故稽首復位以上四句不復贅言達者詳焉皇經註解卷之二
