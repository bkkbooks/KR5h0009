body:
  text: 嗣漢五十代天師大眞人張國祥校狀元方外隱江西吉水羅洪先閱山東濟南小兆臣周玄貞集神通品十三章爾時玉帝出大妙音普告十方諸天聖衆汝等諦聽此諸罪衆曠劫以來縱無明性造十惡業六塵徧染三業縈纏肆意任心曾無覺悟陰罪陽過日積月深背道違眞順邪棄正舉心運念動結愆尤遂使命過之後身落三塗不得解脫若非今日遇是法筵何由出離紫微大帝云當光明攝受之時玉帝發出大妙音聲大妙音者清徹響明徧及三千大界一切皆聞至妙絶倫故曰妙音普告諭十方各世界諸天帝聖眞神衆云汝等諦聽汝爾也諦詳審眞聽也玉帝教諸聖衆諦聽己之訓遂言此諸三惡罪衆曠劫以來曠廣逺也罪衆從歷劫以至此時縱放無明之性性本靈明縱情恣慾狂惑悖亂任意想爲不復本然靈覺妙體故曰無明性造十惡業障十惡者身三惡業殺生偷盗邪淫心三惡業貪嗔癡口四惡業兩舌惡罵綺語妄言十惡積愆遂致業報故曰惡業六塵徧染六塵者眼耳鼻舌身意六根不凈謂之六塵或云財色名食睡自便私心共爲六塵亦通身之内外皆受塵污無些清凈故言徧染三業縈纏三業者身口心之三毒惡業或云徃因夙業見在愆業未來寃業亦通縈旋也纏約縛之意積業重累若繩鎖縛人不得脫身者故曰縈纏肆放意思不知收歛任從心志不知點檢縱情爲惡曾無知覺悔悟之期人不見聞自己獨知幽隱過惡之陰罪衆所聞見不能掩飾錯誤不改之陽過日日漸積月月益深背了大道違逆不從眞理順從邪途棄捨正道舉起心意運發念頭無誠正之功隨妄動之機結成𠎝愆過尤遂使命終亡過之後身落地獄餓鬼畜生之三塗不得解悟超脫若非今日遇此妙法會筵何因由得出離業苦哉愚按人身神氣分陰陽清濁任陰趣縱濁惡順邪念棄眞意故釀成愆惡難脫業苦積惡之久不知其業報由來所以不覺悟也元神定居妙意震敷周身承靈默契重玄陽長陰消謝愆滅罪與道合眞皆由妙覺大悟識愆罪之縁因耳古人以致知爲入門良有見矣况人性無二說善惡皆由心無明性即法性也故遮蔽爲凡了悟爲聖聖狂之分間不容髪人能攝情歸性命定神靈達理欲之幾知塵惡之自頓脫業苦默契重玄即玉帝出妙音告十方縱性造惡之因業類遇法筵而出離三惡道也若以無明性爲累離此求眞是分二途則不得會一達妙矣學者玩之自知超凡之要神通品十四章爾時諸天化身玉帝即以神通不動其所移接天人皆令得至清微天宫玉清聖境元始會下是諸衆等不覺不知是時天尊及會衆等見是十方玉帝化身普皆來集天尊會前如無邊明鏡照諸影像互相容入時諸大衆稽首瞻仰玉帝化身聖中最尊增長清信益加志樂心無退轉起大堅固天皇上帝云爾大慈光明徧攝受之時各大天宫化身之玉帝即以大神通巍巍不動其所攝受神光妙移接引諸天諸人皆令其得至清微天宫最上玉清之聖境元始道祖會下玉清者尊貴無比大清靜虚秘之天聖境者至眞所御虚無妙有諸神未易至不退轉之地也元始會下非大神聖際良縁者不得覲承瞻仰當演經時諸天人俱至廼玉帝神移慈接使令得至耳是諸天人大衆等不覺不知其因何自而幸至元始會下也是時天尊乃元始天尊或以爲各天帝非也元始當此時及會下大衆等見盡十方玉帝化身普徧皆來集會在元始盛會之前顯列不礙如無邊量衆大明鏡照諸衆等形影體像互相含容無礙攝入無遣此時諸大衆五體投地頓顙稽首瞻視快仰玉帝神化之身聖眞中最尊崇者玉帝爲諸佛聖師萬天帝主故曰最尊增長清潔誠信之心更益加篤志慕樂重道皈眞必志不改而後爲誠必眞喜樂大道而後爲皈奉也大衆快覩玉帝之妙化心悅誠服故曰益加志樂傾心皈依無退毁轉移之意起大堅固服膺之誠心有退則不堅心有移則不固不堅固非清信志樂矣惟瞻仰玉帝心無退轉則是發起最大堅固不改毀之眞志永皈大道者愚按人之神氣清濁同源妙化無二心不同道雖導引搬轉終非正途故神不凝靈不見不能秘化呈奇耳若元神凝眞妙攝衆有俾默朝眞帝會神玄宫眞如自在不假作爲即衆化身玉帝神通不動移接天人至清微天元始會下也氣精玄會默順帝則不識不知元神蓮靈照身衆妙不拘不漏即大衆不知覺神昇上界元始及衆見帝化身咸集如大明鏡衆光彰照諸像互相容入也氣精投神會秘皈眞無染無偽快樂自如一得永得不毀不淪即大衆瞻玉帝化身知其最尊增清信加志樂無退轉心起大堅固也學者密體之自見其妙神通品十五章時諸天人邇得生天忽睹天尊勝會道場清凈第一無爲功德之所莊嚴踊躍歡喜一時作禮歎未曾有爾時十方諸化玉帝俱復一體坐法座中法筵清衆俱願欲聞玉帝本行修證未敢議問張果云玉帝化身普集之時諸天天人近邇得帝慈光神昇太玄得生清微天上忽然覩見玉帝大天尊最勝良會大利益道場勝會者凡人之聚見曰會會上若有限的利益則不可言勝會元始演玉經玉帝顯慈光各法界衆等普集神鬼人物永霑大利開三教之泰運揚萬法之玄宗廼法筵之最良極佳歷刼諸會難與比對功德最上永無毁淪故曰勝會會上元始讃玉帝之德傳至眞之法最上一乘普度世間了悟故曰道場此勝會道場絶無塵染虚潔妙明是清凈第一玉帝之妙化出於自然普濟永利之玄功不假作爲沙界蒙恩永刼被澤玉帝未嘗有心元始未嘗着意萬天讓功諸佛讓德良縁妙會功化普彰眞無爲功德之所莊嚴天人睹此快樂無極眞不知手之舞之足之蹈之而踊躍歡喜一時法會大衆五體投地作禮稱歎言自歷刼來未曾有此妙化勝會道場也此時十方世界諸化身玉帝俱還復作一體坐在大光明法座中法筵會上清凈之大衆言清衆者此時乘帝光上昇夙塵頓消絶無染着故言清衆大衆見玉帝之化身顯於各大天宫一切世界悉被光明今在元始會前復爲一體分化不見其不足一體不見其有餘倏分倏聚神妙難窮不知何因有此神通衆等念是俱願欲聞玉帝根本行持修眞證聖之由未敢擅議請問愚按人之一身神氣滋衛脉胳貫串表裏相附虚靈妙應動靜互根本一分而萬萬歸一源也人惟氣拘物蔽食圖妄想則明者昏靈者滯間有學道濟世而小智私仁矯假功德恩惠有窮豈足言道若善始不善終善作不善成或勉以支分强作把柄或聚或散雖若靈通亦非道妙果能眞知了悟公溥明通寂感悉定並無將迎之擾靈運默會不假推運之勞道機妙存人心退聽濁而返清滯而返靈獨覺眞得怡然快樂脫拘蔽妙日新即諸天人生天覩天尊道場清凈逈超無爲功德莊嚴躍喜作禮歎未曾有也歛萬歸一天君御極即十方化身玉帝復一體坐法座中也若清衆願聞帝行未敢議問則說經根因固不可作已身言也學道者秘會之則妙理自見矣神通品十六章於是天尊普告四衆言徃昔有國名號光嚴妙樂其國王者名曰凈德時王有后名寶月光其王無嗣嘗因一日作是思惟我或作帝字讀或作朕字讀此王自言不可作帝字過去前刼亦未嘗稱朕字還作我字讀爲是今將老而無太子身或崩殁音木亡也社稷九廟委付何人作是念已即便敕下詔諸道衆於諸宫殿依諸科教懸諸旛蓋清凈嚴潔廣陳供養六時行道徧禱眞聖已經半載不退初心星主大帝云當清衆欲聞玉帝修證妙因之時於是元始天尊普遍告法會下四衆言徃昔過去浩刼前有國都名號稱作光嚴妙樂其國君王名號凈德其王有皇后名號寶月光其王無繼嗣儲君嘗因一日間想念此事作是思慮圖惟自言我今將至老死而無有太子己身若或崩殁亡去天子爲天下主不敢言死稱之曰崩如山崩大變也社稷九廟委託付與何人社土神稷谷神國以民爲本民以土谷養生爲天社稷之神廼至重者故君有天下必言社稷九廟者有國必有太廟始祖繼始祖傳己支之嫡祖三傳之祖繼三傳之祖太高祖有天下之高祖曾祖祖父始祖在中其後左昭右穆分列共爲九廟人以宗嗣爲重況國君有天下又大不同故王慮無太子社稷九廟無託作此想念已竟即便傳下敕旨詔諸道門清衆於各宫廟神殿中遵依道法祈禳諸科教品懸諸花旛寳蓋齋明盛服肅建壇場内外始終恭虔不亂極清凈威嚴明潔廣多陳設供養品物於白日六時辰中行香演道徧歷宫廟禱祝仙眞神聖已經及半年之久王益虔誠不退悔始初立道場祈禳之心愚按人生此身性得天地之理形得天地之氣得父精母血有此身體得日月照臨之光以爲明得皇王水土以爲生得聖人之制以爲守持得先知先覺之師友以爲進益有道則位天地育萬物入聖超凡生死無拘無道則萬事瓦裂遺臭不止釀成業愆報復不已成聖則身滅理存與道同久即子孫相繼祭祀不輟爲凡即無子息絶祖祀也聖凡之等相判若此凡聖之關相去幾何人能知身之關係若此其重知生我不偶莫負此身知四恩之當報識五常之非輕盡倫理明庶物涵養用敬進學以知厚重堅固聞善必行晝夜點檢善保始終不愧屋漏無息至誠與天地合德日月合明四時合序鬼神合吉凶俟聖不惑無一息少懈生順死安還造化舊物身後澤名彌久彌光即光嚴國王祈太子行道不退心也神通品十七章忽從一夜寶月光皇后夢太上道君與諸至眞金姿音資態也玉質清凈之儔音酬駕五色龍輿擁耀景旌蔭音印陰覆也明霞蓋是時太上道君安坐龍輿抱一嬰兒嬰兒當作金容字讀身諸毛孔放百億光照諸宫殿作百寶色幢節前導浮空而來是時皇后心生歡喜恭敬接禮長跪道前白道君言今王無嗣願乞此子爲社稷主伏願慈悲哀愍聽許爾時道君答皇后言願特賜汝是時皇后禮謝道君而乃收之皇后收已便從夢歸覺而有娠音辰姓也懷胎一年于丙午嵗正月九日午時誕于王宫廣生帝君云光嚴國王祈嗣不退初心忽然至一夜間王妃寶月光皇后夢見太上靈寶大道君與諸至聖眞人金光姿容玉潤體質清凈神光之儔侣乘駕五色龍載之輦輿擁簇光濯妖景旌節蔭罩明輝霞光寶蓋是時太上大道君安然坐在五色龍輿中抱一嬰小神兒其兒身各毛孔内放出百億萬祥妙之光照映王之各宫殿作百寳莊嚴之景色法幢旌節在前導引浮凌虚空而來是時月光皇后見道君抱此神兒心生歡喜恭敬迎接盡禮長跪於道君之前或作道路前非也上白道君言今臣國王無有繼嗣願乞求此聖子爲本國社稷之主伏願道君著大慈悲哀憐愍恤王之無嗣聽臣之請許降此子爲後彼時道君答皇后言願特以此子賜汝是時皇后盡禮上謝道君廼將此子收之皇后收子已竟便從夢中歸來遂覺腹中有孕懐胎一年于丙午歲正月初九日午時誕生玉帝於光嚴妙樂國王宫中愚按人之生也有氣質形體則有倫理性命身任綱常之重生負参兩之責高大光明靈通自在身非委形生非輕易本金質玉相清凈不染也惟暗昩貪妄輕慢天寶不能會神妙孕玄靈漫喪吾家至珍委此身於無用縱少知自愛而見道弗明用功非實詐善揜惡多金質其外而敗絮其中遂使一己之身不能自保天爵良貴厥美弗彰何以踐形盡性使我之眞主不頽哉若悟生死之玄根契天人之秘要洞曉陰陽深達造化認宗祖識父母見生我之在坤明種我之在乾融金液純玉煉得妙於恍惚會玄於渺冥以虚無之神神孕妙有之眞眞結靈胎産聖子俾生我者不虚長我者非徒金筋玉骨脫化形神已枯復榮永延未艾即寶月光皇后夢太上道君與諸眞清凈之儔抱聖兒賜后爲社稷主也夫人一也悟則仙不悟則亡能識月光皇后祈子之義可以悟道矣神通品十八章當生之時身寶光燄音焰充滿玉國色相妙好觀者無厭幼而敏慧長而慈仁於其國中所有庫藏一切財寶盡將散施窮乏困苦鰥音官寡孤獨無所依怙飢饉音謹癃音龍殘一切衆生仁愛和遜歌謡有道化及遐方天下仰從歸仁太子父王加慶無上元君云當玉帝下生之時身放百寶光燄充周遍滿於光嚴王國容色形相奇妙美好觀看者永無厭棄之心幼而童稚時聰敏智慧漸長成時慈悲仁德於本國中倉庫府藏所貯一切財物寶貝盡將發散施捨盡將字意施捨不拘多少無吝惜心若將盡散了的一般如作將財盡捨是不顧君親國家了玉帝生知安行之至聖豈有此太過之事讀者詳之帝施庫藏非繼富貴者與那無財力貧窮窘乏之人幽閉無柰危困苦楚之輩無妻之鰥夫無夫之寡婦無父之孤子無子之獨民無母摩有所依頼者無父靡有所瞻怙者當谷不熟之飢年菜不熟之艱饉或疾病衰癃傷敗殘廢之等一切艱難衆生皆受玉帝賑恤惠濟且又恩德出於至誠非徒外爲仁厚慈愛温和謙遜天下被其澤感其德皆稱歌謫謡美其有道自畿甸達之要荒功化及於遐逺之方天下瞻仰景從歸服仁德之太子歸猶與也論語云一日克己復禮天下歸仁焉蓋求道即得效本速大玉帝生而神異長大慈仁天下有不歸心哉自是帝德旣著四方悅服他日聖明至治從今爲太子時已見故其父王不但生帝之時歡悅觀今日太子有道心上益加喜慶愚按人生天地間有此身則有正眞生氣有正眞生氣而後可以爲人此眞氣在天地則爲妙理在人身則爲浩然眞氣玄靈光明自在照徹古令并包法界人具此義本無困苦艱危取人厭惡也但降之在天棄之在人繼善成性之眞視爲泛常不急之務不能全正理以孕眞靈養妙機以成神化暗蔽不明嗔妬不道貪利圖名聚歛不已不慕道德不恤貧困傲慢自賢招集謗毀是害正氣餒浩然自䧟於凡愚不能入聖也若保全太和凝融秘意聖胎露寶光神嬰發妙景漸演玄神靈化無礙泥塗勢利塵視寵榮以我之有餘助人之不足濟人利物惠徧羣生任刼運之昇沉而功德無盡盛德神化永著仙名法界浩刼悉被慈恩天神人悅供服至德廼乾坤肖子出世奇人父母亦增光而嘉樂是即玉帝生成之神異長而慈惠至仁天下歸仁父王加慶也神通品十九章當爾之後王忽告崩太子治政俯念浮生告敕大臣嗣位有道遂捨其國於普明香嚴山中修道功成超度斗母云當妙樂國太子有道天下歸仁之後國王忽然告崩大行太子即位治一國之政事俯念浮生俯念下視己身而恩念也浮生人生在世如天上浮雲水上浮萍難以常在故曰浮生帝旣念此因告命勑諭本國卿相大臣將大寶傳賢嗣緒君位於有道者一云欲大臣嗣承此位有道行善意亦通託位於賢人遂棄捨其國隱於普明香嚴山中修習大道普明香嚴山按古史廼東海石頭山也他山中玉帝遺迹皆闡教之所非香嚴山故址帝旣入山修道行滿功成超出凡世度生天上愚按人在世間如過隙白駒空中雷電倏有倏無不能自保貴爲天子富有四海被龍衣衮玉食萬方一捐賓客盡爲幻夢下此而位極人臣田連阡陌又不足言況富貴希覯貧窮夥然且醉生夢死耽迷不悟所以行道者罕聞矧作仙人哉人能悟身猶寄旅生似蜉蝣頓出塵障懇覓重玄明徹實踐不求速效時至自化行成名仙先人雖没亦藉聖子之至名不亡矣非妙樂太子捨父位修道功成超度哉噫人身有崑崙山老陽消盡一陽復生離種種邊密修至眞久而仙化又希仙之意亦類帝行當味之神通品二十章過是刼已歷八百刼常捨其國爲羣生故割愛學道於此後又經八百刼行藥治病拯救衆生令其安樂此刼盡已又經八百刼廣行方便啓諸道藏演說靈章恢弘正化敷揚神功助國救人自幽及顯過此已後再歷八百刼亡身殞命行忍辱故捨已血肉如是修行三千二百刼始證金仙號曰清凈自然覺王如來教諸菩薩頓悟大乘正宗漸入虚無妙道如是修行又經億刼始證玉帝說是語已法筵清衆異口同聲歎未曾有許眞君云玉帝初捨王位修行過是刼數已後經歷八百刼常作太子每捨其國爲度化羣生故割斷六親恩愛學修道眞刼數有大有小六十載爲微塵刼五百載貞元會運爲羡數刼三千年爲閏置刼一萬八百年爲小刼十二萬九千六百年爲轉輪刼刼劫延積經至萬數廼爲大刼八百刼莫拘小大但言其永久大約八百刼數耳於此割愛學道諸刼已後又經八百刼施行藥餌療治病疾拯拔救濟苦難衆生令其安康快樂此刼數盡了又經八百刼廣多行大方便開啓諸道藏法品演說玄靈寶章恢擴弘大正教道化敷布振揚神聖經功輔助國家救拔人民自幽微以至光顯彌大彌光一云自幽及顯自幽冥及陽世盡天上地下人間悉被其澤意亦通過此等刼數已後再歷八百刼亡没其身不敢惜損殞其命不暇顧惟行含忍耻辱不嗔報大有容之因故喜捨己之血肉只是捨財物人之施財如割血肉玉帝前刼忍辱喜捨捨了家財雖至貧寒危困外侮來加人不堪其憂帝絶不知覺生退悔是即亡身殞命行忍辱捨血肉矣一云苦人所難苦而後成人所難成帝成至聖捨血肉之事亦須有之然聖人化度愚俗無所不可分身妙變體實未嘗毁也觀者神會勿泥文辭則善矣自八百刼割愛學道以及行藥治病說經普度忍辱喜捨等如是苦修妙行已歷三千二百刼方始位證金仙成不毀之果號曰清凈自然妙覺法王如來教化諸菩薩大士頓悟大乘正法眞宗漸次入於虚玄眞無神妙大道如來字意人生有性萬善備焉其來也齊肩仙佛本廣大光明暴棄者不能全天之所賦本來眞如剥蔽已極遂作凡業玉帝前修捨妙樂王位之後又歷三千二百刼數功化無邊永無退轉不拘不染大覺法王範圍天地曲成民物不過不遺視體受歸全者又逈出萬萬是云如來也如是等大修行又十萬刼方證萬天教主玉帝之位元始天尊說是言語已法筵會上清凈大衆異口同聲稱歎言自來未曾有此大聖妙行也愚按人之生也身有陰陽念有理欲陰陽互根迭爲消長理欲貞勝不容並立欲動則陰凝理純則陽盛盛而達化妙入神神惟所措而咸宜無所施而不可本純陽爲上善柰怠者之弗能玉帝憫是大闡妙義捨王位不一而足歷八百刼爲羣生捨其國割恩愛學大道此妙行最大不窮矣況身之元神御靈臺宰五官役使百執事六欲七情恩愛最重能欲盡理還攝情歸性剥盡沿華獨會玄秘又天君之棄位學道也行藥救生令其安樂玉帝又歷八百刼度世矣人之塵勞幻想鑿喪眞意甘至老死終不能悟爲世大病能以元神精氣三品上藥凝秘結靈廻陽换骨生而不罔死而不亡又内景行藥救生之義也演經助國利益幽顯帝又歷八百刼矣人之會玄逹秘妙變陰陽位上仙濟鬼物身亦有默轉眞經利冥陽之義也亡身命捨血肉帝歷是又八百刼矣人之心不動捐濁質身亦有殞命忍辱捨血肉之義也從刼至刼虔修不改清凈無染妙化自然使人人了悟功無限量亦如玉帝從三千餘刼至億刼矣則未曾有之妙可希神通品二十一章爾時衆中有一玉女名曰夜光從座而起嚴整衣冠從容雅步長跪道前白天尊言臣宿或作夙字昔何幸仰侍御前親奉供養已經億刼三清境界金闕玉京寂淡逍遥快樂自在嬉遊聖域餐音叅吞嘗味也聽法音未昔見此希有之事鬼谷子云當爾清衆稱歎玉帝之時侍列衆中有一玉女其名曰夜光從其座位中起來嚴肅端整身上衣冠座時衣冠雖然潔肅起來益見其端嚴故曰嚴整衣冠從容雅歩動履安恭長跪於道祖之前上白元始天尊言臣夜光宿命昔刼曾有何因幸得瞻仰侍列在天上帝主御前或以爲夜光云在三清界又問玉帝神光之由當作元始傍玉女非也天帝常朝三清界說經時玉帝大光不常見故玉女云然以是爲天帝侍女無疑玉女侍御前非一次也親自欽奉供養已經億刼十萬之久三清玄境妙界黄金闕白玉京寂然清淡無事逍遥快美喜樂得大自在嬉喜神遊至聖界域餐味聽聞妙法音聲以餐字言者清微天眞聖秘音皆最上一乘妙理有無窮之味非易覺明玉女雖神初作聖流豈能明了故聞法音而詳味之若吞美食而審味也是以言餐聽餐法音廼玉女指平音言非今日聽元始語也若作今日看失文意本旨夜光夙居聖界久在御前大樂然聽法音衆妙無不備見見衆妙無不契悟如玉帝之普放慈光變現攝受聚散自如生化祥異浩刼修眞功德無量教成聖流了悟最上愽觀歷刼遐鑒前代未曾見此希奇無有之事愚按人身陰氣即仙女也玉質氷骨光容雅度本自有者但塵染濁污蔽垢已久正陰梵氣䧟爲穢念惡行六丁陰神翻做無常餓鬼思慮種種終日營營食息靡定舉動張皇不能朝上帝供玄元肆意輕馳食愛華麗以名利自縛以塵勞自累不得逍遥快樂隨輪廻昇轉墮凡世無休不聞正道妙法日嗜情慾動有羣魔有妙化致使難逢若純陽秘變孚化陰精皓魄露妙光於無窮玉質顯神化於不匱周身所有悉爲至靈化機從容妙藴瑩露靜禮元始默朝上帝性道常明人心聽命丹臺紫府之界七寶五明之宫寂寂空明踈逸快樂神遊玄境耳味瓊琅爲希世之奇觀眞未有之勝事即夜光玉女從座起整衣冠雅歩跪道前白天尊問夙因請明玉帝妙化希有之事也夫陰陽理氣人所同有得道者陰機作玉女神通無道者反作業趣則修眞之事誠不可不明神通品二十二章不審向來光内所現十方諸天變現聖境皆有玉帝應化法身天眞大聖妙行眞人靈妃玉女以爲侍衛是諸玉女相貌端嚴形體姝妙出衆妙香無與等者復蒙玉帝神通移接今皆普集在清微天未審今此玉女以何因縁得證如是無上色身恩惟聖慈示以未悟南華帝君云夜光玉女自言久居上天聆玄論未曾見玉帝妙化若今日者遂言不審向來大光明内所現出十方諸天變化顯現聖眞境界變或作遍字亦通皆有玉帝妙應神化法身諸天神仙眞大聖妙行眞人靈妃玉女以爲侍列護德是諸玉女色相容貌端正威嚴形影體質姝美奇妙岀衆妙神異之香無復與之等倫者復蒙玉帝大神通妙移慈接衆侍衛隨帝光今皆普徧來集在清微天上不審今此侍衛玉女以何妙因良縁得證如是無上色身無上色身者玉女妙化色身超絶一切無與比對耳蓋世有六道地獄餓鬼畜生三惡道無美色矣人道色身本爲精血之聚氣散神離其穢難言況生也有衰有老有病有苦則美皆夢景故身曰幻不可言無上色外此魔道一切魔女雖容顔奇妙具五通能變化業滿報來終爲自患何以言無上色身惟此靈妃玉女奇顔勝儀冠絶三界天香妙化不衰不凢非世所得觀廼無上色身寔夜光玉女所不能側其故也恩惟至聖慈悲示以未悟之義使夜光得知靈妃玉女體貌端姝香妙之理愚按世界福業一切由心造心統性情性無不具陰陽妙化人人固有不脩道同陰爲幽趣腐尸朽骸輪業之根悟道脩眞則陰亦身之正氣六丁呈妙靜煥天光玉女眞香身妙用也周身玄通丹臺瓊樓六陽秘境眞王時御法體廣化攝虎御龍煆玉液於玄宫列女青於座右會丹靈之秘寶浮妃嬪之清香亦帝光現十方天境有玉帝應化法身聖眞玉女侍衛以神通移居清微天耳夫人人有性具陰陽含衆妙身與天同靈妃玉女之神通妙範宜聞見者悉知何夜光玉女成聖侍帝尚未悟耶蓋脩證有品階之崇卑而聖體由道源之變化成何品之果則有何品神通惟聖知聖惟賢知賢一毫不容假借靈妃玉女以天至眞神化救人則光範玄顔正妙眞香宜夜光之未知夜光未知以初證聖身等階不同非退托故言者噫靈妃玉女尚不易知則帝光神化又豈能測夜光尚不能知他人又豈知哉聖凢一性人與玉帝比肩至於知之尚不能何以成聖耶人宜思之勉之神通品二十三章爾時天尊謂夜光玉女言汝固初入聖流雖有智慧未能明了此諸玉女乃自徃昔無量刼中修諸妙行具解脫門同清凈信同清凈解同清凈念同清凈行同清凈身同清凈心同清凈意同清凈果同清凈報同大慈心同大悲心覆護衆生如母撫念愛於赤子奉戒專一冥心大道清齋弘誓千萬刼中尊奉玉帝沖虚帝君云爾夜光祈聖慈開未悟之時元始天尊謂夜光玉女言汝固初得入於聖流汝爾也聖流與聖人同行列作一流類也旣爲聖矣宜無不知柰初入聖流雖有睿智聰慧尚未能大明了徹此諸侍衛玉帝之玉女非一旦有此神通也乃自過去徃昔無盡量刼數中修衆妙行全具大解悟超脫之門歷刼無染永不退正信心玉帝夙修常清凈信矣諸玉女徃刼妙行亦同此清凈信也不着色象得大解脫玉帝夙修常清凈解矣諸玉女徃刼妙行亦同此清凈解也眞念無生脫盡諸趣玉帝夙修常清凈念矣諸玉女徃劫妙行亦同此清凈念也妙行莊嚴永無過動玉帝夙修常清凈行矣諸玉女徃刼妙行亦同此清凈行也道以物身不染邪穢玉帝夙修常清凈身矣諸玉女徃刼妙行亦同此清凈身也心即道道即心湛然無住玉帝夙修常清凈心矣諸玉女徃刼妙行亦同此清凈心也無内外無將迎絶意忘機玉帝夙修常清凈意矣諸玉女徃刼妙行亦同此清凈意也位乎上清永不退轉玉帝證聖得清凈果矣諸玉女徃刼妙行亦同此清凈果也浩刼推崇功德莫量玉帝至尊得清凈報矣諸玉女徃劫妙行亦同此清凈報也仁周沙界惠孚浩刼玉帝具大慈心矣諸玉女妙行亦同此大慈心也萬有羣生悉加矜憐玉帝具大悲心矣諸玉女妙行亦同此大悲心也玉女大慈悲心同玉帝其實云何覆蓋保護衆生如慈母撫育惜念恩愛赤心之幼子且奉持玄戒專篤誠一或云欽奉心嚴戒心精專純一故冥心誠皈大道意更妙諸玉女皈大道非暫然清凈齋䖍弘大誓願千萬刼中歷來欽奉尊敬玉帝愚按人有正信心自然解悟念斷行純身無所染心清意凈證果獲報必得至眞能大慈悲嚴持妙戒對越上帝歷久不回則上仙可至世人惑邪見雜念僻行身不能修心擾意亂果報牽纏皆以不慈悲弗信道也故夜光初入聖流尚不能悉諸玉女妙行則與之同行益難矣意道人人有也善反之則玉女之妙行在我神通品二十四章此諸玉女非實是女皆天至眞爲度羣生現玉女身是故身色神通智慧隱顯變化與帝同焉爾時夜光聞是說已心得開悟稽首歡喜黙然復位關尹子云此侍衛玉帝徃昔無量刼修諸妙行之玉女非眞是女身皆天仙至眞爲化度法界羣生入道遂化現玉女之身惟其爲至眞之化身身素非女是故身色神通智慧隱顯變化非淺鮮也與玉帝同焉凡人莫不有身色身幻體不能分化難以與玉帝同身至於變身之魔鬼身爲矯障又不足言上有天人或五里或數里或一二由旬或百億萬丈或在天宫或見冥界或著人間一顯於此不能他化或著聞見不能妙度拘一處限一時皆非最上妙化法身諸玉女化身遍見一切世界聚散自如卓絶倫類是身與玉帝同有身皆爲色色不妙好或美而罔終皆非色於帝同諸玉女化身妙色端奇美好隨在全彰永無變遷是色與帝同天人魔道皆有神通神化有限通非六運是神通不與帝同矣諸玉女神化無方悉且六通是神通與帝同神人皆有智慧有隔礙未明了或假體照不能妙會非智慧與帝同諸玉女徹照無遣預通無礙是智慧與帝同知神通者悉善隱隱有遺跡非與帝同也諸玉女散則還於太虚不但芥納須彌是妙隱無迹隱與帝同有隱則有顯顯非大光未與帝同也諸玉女妙現清微神見各界是顯與帝同有神通智慧隱顯是能變化變化若假作爲非與帝同諸玉女妙變無心神化自然是變化與帝同此時夜光聞元始說諸玉女現化語意已竟心中便得開明覺悟知諸玉女妙化因由稽首作禮歡悅喜慶默然忘言復歸本位愚按人身陰陽非判然二物自一而二陰以孕陽陽以生陰本至根也修眞成道六丁陰神化見玉女妙變奇機與元神玄靈同功此陰化呈靈豈獨坤質廼乾體孕育陽光梵炁之化耳況天上神眞變化無定教度衆生各有權宜應以男身即現男形應以女身即化女體刼運甚久世界紛然應以女身度者不可限量此天上至聖神眞化諸玉女以度羣生其身色神通智慧隱顯變化非神人所及與玉帝同夜光雖朝三清境界夙聞法音初入聖流此大神通至眞妙行宜其未知雖然聖凡同性則法身一般有普濟之心傚至眞之行諸玉女同帝神妙在吾身矣故夜光聞說了悟歡喜也達者詳之皇經註解卷三終
