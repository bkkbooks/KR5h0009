body:
  text: 嗣漢五十代天師大眞人張國祥枝狀元方外隱江西吉水羅洪先閱山東濟南小兆臣周玄貞集高上玉皇本行集經卷中太上大光明圓滿大神呪品第二神呪品第一章爾時天地始祖五老上帝稽首長跪白天尊言伏聞高上玉皇慈念蒼生普放神光照燭法界六凡四聖普叨道蔭竊以凡夫短景刼運將終正道宜行以濟兆民使修眞之子有期輕舉末代烝民俱獲壽考爾時當元始天尊說盡神通品之時天地開始之祖五方五靈五老上帝叩拜稽首俯伏長跪上白元始天尊言伏聞高上玉皇大慈憫念世間蒼生普徧放出大神通無量眞光照燭三千大千諸天諸地一切法界天人魔獄餓鬼畜生等六樣凡品以至最上一乘與夫上中下乘四等仙眞佛神忘士之四聖普徧叨蒙大道慈光蔭庇竊以凡夫不壽世景短促法界刼運將次告終仙眞正道宜當傳行以濟億兆之民使希仙修眞之子有了脫之期得以輕身沖舉末代烝民無有夭折俱獲壽考夫人世間命有定數三教聖人皆蛻骨塵世顔子大賢三十二嵗而卒皇經雖有利益豈能違大造之數而使人長生哉是不然人之身可死人之生理不死道理不明雖生世上其心已死偷生茍免何足言壽若明了道理悟徹行成還虚脫化則朝聞夕死無復遺恨即是長生故道德經云死而不亡者壽孔子云人之生也直又曰仁者壽釋經云若人了證涅槃即見如來是名金剛不壞三教至人不以死爲死以不明道爲死不以生爲生以了道爲生造化之數雖生死難逃可拘常人而不可拘聖人玉皇尊經演自元始最上一乘妙法三教之眞宗萬法之玄訣法界之慈航生死之要關成住壊空之秘旨傾刼之機括超證坦途度世妙品解結拔罪之津梁也至尊若爲慈演經文烝民一蒙聖恩承神光力皆得皈依正法不落邪徑生死無愧能令短命衆生而得長壽是經神功有若此者右上卷神通品至聖天宫妙化三教聖眞皆不易及故列第一見傳此眞經神化之自此卷首列神咒品以經中秘法語能度人録仙制星制魔制水鎭五方濟法界故曰神咒有神通而法語秘文若是利益斯繼神通而第二云蔭音印烝與蒸同末代將終之刼神呪品二章自昔元始洞玄靈寶赤書玉篇眞文生於元始之先空洞之中天地未根日月未光幽幽冥冥無祖無宗無氣無象無色無名無形無緒無音無聲混沌太無靈文音捻不明也藹於蓋切乍存乍亡靈圖開化玄象推遷結氣浮空乘機應會玉帝眞誥靈寶秘篆無上大不可思議神呪於是存焉天地始祖五老上帝言玉帝尊經之正道能令末代烝民獲壽考因何有此大功效自昔元始洞玄靈寶大赤天書碧玉琅篇之眞文生於未立法界元始本初之先大空洞虚之中兩儀不曾分太極無極之先天地未立根基陰陽水火不曾肇孕未有日月光明混混茫茫何所分别幽幽冥冥而已萬象未生孰爲之先不見造化之元是無祖無宗玄虚太空不見其氣無有形象無着見之色無字稱之名無形影無端緒無影響沖然漠然衆音何有衆聲何有無音無聲也無涯無際混沌太無元始洞玄靈寶赤書玉篇之眞文靈秘文光掩然雖不明見藹然又著端倪乍存乍亡非有也非無也非有有無無有而未常有無而未嘗無也元始靈運玄圖開張萬化玄元妙化之象推轉運遷結妙梵之氣遍浮虚空乘玄運之機應天人叨陰正道宜行之會玉帝寶誥靈寶秘密天篆無上功德不可稱量大不可思議神咒於是顯秘著象而妙法存焉赤書玉帝眞經妙有之文皆諸天太初梵氣結成字文廣長一丈色光赤煥爲丹天大赤金書玉篇九天之上皆碧瑶之篇元始洞玄靈寳之文寶霞玉潤故云玉篇生於元始之先廼天地本初之先非元始天尊之先天地未根非天地無生化之根天地生於虚無元始眞文在三千大界未立之前浩刼之先故未見天地肇分之根乍存乍亡存而不可定其象亡而未嘗滅其眞玉帝眞誥皇經妙典慈濟無窮歷浩刼而無量徧三千大千而莫盡諸天奉行三教遵依是傾刼法界之誥命也靈寶秘篆天書雲篆非易聞見不可思議不可以心思不可以言議言莫量也於是存焉玉經眞文在浩刼先非自今日存也未乘機應會時道涵太虚夫有何形孰從而見雖存而莫知其存也今正道宜行靈文彰秘神通光明於昭炳顯故云於是存焉眞經妙法之存乘機應會是難遇之時也在斯會者肯自負而不求法誨乎神呪品三章故天地得之而分判三景得之而發光靈文鬱秀洞映上清發乎始青之天而色無定方文勢曲折難可尋詳元始鍊之於洞陽之館冶之於流火之庭鮮音先其正文瑩發光芒洞陽氣赤故號赤書靈圖旣煥五帝朝眞飛空步虛旋行上宫燒香散花口詠靈章是時天啓十二玄瑞地發二十四應上慶九天之靈奧讃三天之寶明神風旣鼓皇道咸暢元始登命太眞按筆玉妃拂筵鑄金爲簡刻玉爲書五老掌録秘於九天靈都之館玉女典香太華執巾金童侍衛玉陛朝軒九天玉書非鬼神所聞惟玉經眞文靈寶祕篆於是存焉故太極生兩儀清浮爲乾濁凝爲坤天地得之而分判日曜輝月呈華星列張三景得之而發光眞經靈文鬱然浮其瑞光秀氣洞然光映上清境界發乎始青最上之天而色無拘定方所靈文光曜之勢充周曲折難可尋究側詳元始天尊鍊此眞文於洞陽重玄之館鎔冶此經於流火大梵之庭鮮其正文光燿無方鮮其大正妙有之文瑩然騰發光芒洞陽妙氣溢丹流光純然大赤故號赤書靈蓮玄圖旣煥光明五帝朝元至眞乘雲御瑞飛空歩虚旋繞行朝最上宫闕燒清凈自然眞香布散天花口中讃詠靈文寶章是時天不愛道元辰獻祥天啓十二玄瑞地不愛寶二十四氣粹顯隹禎地發二十四應上慶九天之靈文奥旨讃揚三天之寶章昭明妙典神通風教旣鼓度世之機皇道咸暢大法普惠一切元始登座錫命太眞上仙按筆以書玉女靈妃拂蕩法筵鑄不毁之金光以爲玄策秘簡刻碧玉之玄霞以爲丹書五方五靈五老職掌騰録秘藏於九天太靈玄都之館玉女則典司天香太華眞人則執持玄巾金童侍側周衛瑶堦玉陛朝軒九天玉字丹書非一切鬼神所能聞有天地而後有文字傳諸經今言皇經存而後天地分判人聞此語多疑惑不省蓋道之自然相循不息廼爲眞文道之不壞廼爲眞經元始在浩刼先皇經之理已在眞文無字妙化不窮故天地自此判三光自此開景也此是實理又何疑文勢曲折有以文字作支字者非是鮮其正文有以鮮字作觧字者非是瑩音盈或作巽字信字讀者非是玄經無象何云金簡玄光妙象傾刼不毁故云金簡玉書玄文光瑞潤麗尊嚴故云玉書非鬼神所聞皇經玄祕鬼神不識非常聞非易聞非凡聞能知者神呪品四章故天寶之以致清地秘之以致寧五帝掌之以得靈三光乘之以高明上聖奉之以致神高靈尊之以致眞五嶽從之以得鎭天子得之以致治國祚賴之以致平實靈寶之妙德乃天地之玄根威靈恢廓普加無窮蕩蕩大化爲神明之宗其量莫測巍巍乎太空是時元始革運玄象開圖靈文鬱秀神表五方分判天地開化萬靈此玄宗之寶可得暫披於靈韞乎九天玉書皇經非鬼神所聞妙法難聞若此故天位乎上也寶重此眞經得眞一以致常清地位乎下也秘持此眞經得眞一以致常寧五方五帝掌此秘文以得神通而成五靈日月星三光乘此眞經妙法以崇高懸象著明上聖至人奉持此眞經以至於聖不可知而神高靈神部尊崇此眞經以至眞聖之位五嶽名山聖帝從此眞經之力而不崩壊以得安鎭君天下之天子得此眞經妙法以致四海無虞之治國家祚業頼此眞經以致安平實靈寶眞宗之妙德乃天地之眞宗玄根此經天威靈通恢然莫量廓爾無際浩刼法界一切利益無盡是普加無窮坦坦平平功化無象而無方誠蕩蕩大不可量之神化爲神明之眞宗其功量莫可測識無象無宗巍巍莫及而太空是時元始天尊革太混之運玄光妙象開闢靈圖靈文鬰茂光秀辨位化形神表東西南北中之五方分判上天下地開化法界萬靈一切品類此重玄眞宗秘寶可得暫爾披瀝宸訓開闡無上眞宗之靈韞乎披一作披閱皇經道家語本以脩證仙品不言齊治均平此云天子得之以致治國祚頼之以致平何也蓋以道化成廼爲治平悟眞宗明大道則不言而信不動而變無爲而成德盛化神永利無疆故云致治致平妙德本無所得不見施與自然功化無窮故云妙德若夫玄根一切根皆有象道生天地雖有無極太極生兩儀之圖太極本無象眞者見不得言不得晝圖不過假像教人天地之根有何實象雖無實象其實循環無盡故曰玄根威靈三教聖神不敢慢妙化無邊故曰威靈神明之宗諸聖宗法又云千神萬聖從此出也太空不見其前不見其後恍惚不可爲象故曰太空革運或云革將終之運非也此經在浩刼先是革太混運耳神表五方混沌本無分辨方位别中外寔道妙化故云神表五方神呪品五章今皇道敷暢澤被十方仰觀刼運眞風宜行臣心實欲使靈蔭八遐風洒蘭林寒條仰希華陽之繁朽骸蒙受靈奥之津明眞有格今當以行仰對元慈下伸丹懇惟願哀憫俯念蒼生不審靈寶玉篇眞文可得見授下教於未聞者乎玄宗之寶冀暫披於靈韞以今時大道敷布暢達慈思徧徹於四正四隅上極下極澤被十方矣仰觀刼數氣運正道眞風宜當推行臣心實欲使靈寶法惠蔭覆一切方所世界盡八遐之逺道澤惠風蕩洒蘭林寶香玄苑世間沉滯異類傍門天魔外道有情無情不聞正道者皆蒙眞經之濟如稿然無生意之寒條仰希和煦霑潤華陽之繁滋已枯使榮朽毁骸骨蒙受靈文奥典之津澤明眞上仙有度世金格今當以行世間仰對元始太慈下伸丹誠懇祈惟願聖慈哀憫俯念蒼生不審靈寶玉篇眞文可得見授世間下教於未聞者乎十方非此个小十方盡三千大千世界之十方刼運從刼至刼終始相循刼刼此眞經濟世非止一刼一運八遐盡三千大千之逺不止言目前八方之逺蘭林香寶華林天地人物有此正理皆有此林人物昩之而不見上聖眞仙此林寶光風洒惠浮此林恩及一切澤濟無方矣寒條人物神鬼不明正法如同稿木聞眞經了悟是枯木再榮朽骸人物神鬼不知正道雖生如死聞眞經超脫枯骨再生靈奥之津廼潤澤之津明眞玉帝明封諸眞丹懇竭盡丹衷懇祈至聖蒼生以玄首黄髪老而皓白蒼然無恒故言蒼又云蒼天所生之民又云蒼生衆也靈寶玉篇眞文俱觧見前見授祈天尊傳授此經下教法界一切神人鬼物而度拔未聞此經者可得見授下教於未聞者乎廼謙疑未定不敢執言恐至尊妙法不易傳授故先懇祈又作未定之詞以見求之切而尊崇之至也神咒品六章於是元始天尊撫几高抗凝眞遐照觀時已至普爲時會一切眞聖論定陰陽推數刼會移校河源檢録天度選擇種人指拈太無嘯朗九玄念無開聽於陳辭有若閉礙音閡求眞之路是時五老帝君啓問不已良久元始天尊乃垂盼眥之容慨爾歎曰微乎深哉子今所扣豈不善乎此元始靈寶之玄根空洞自然之眞文生天立地開化神明施鎭五嶽安國康民靈寶玄妙爲萬物之尊天啓玄瑞靈應自然靈寶眞文宜下教未聞於是時元始天尊撫循玉几即寶座巍崇道體高抗不俯密凝至眞默張大智遐照今昔過去未來定觀開度之時已至普爲時會六縁共際諸法界皆當吉時隹會一切世界天眞至聖論定陰陽貞元之會推生化自然之數大小刼運元會移枝河源水帝檢察攷録天數期度選擇脩因善種之人指拈眞玄太無嘯咏朗吟九品玄章念天地始祖五老上帝所陳懇祈傳法之辭若不開慈聽許有若閉塞阻礙脩道求眞之路是時五老帝君懇啓請問不已時過良久元始天尊乃開慈顔聖目俯燭垂盼眥之容慨爾嘆曰微妙乎淵深哉子今時所扣問豈不善乎此元始靈寶之玄根空洞妙化自然之眞文生乾天立坤地開化諸世界一切聖眞神明施鎭東泰南霍又名衡西華北恒中嵩之五嶽安歷代之國康平法界之民靈寶玄微奇妙爲萬物之最尊天啓玄瑞地發禎祥諸靈效應皆出自然撫几撫凭玄化玉几非凢案也高抗非自高自抗以巍然道身玄範巍巍不動故云高抗遐照有刊作想字者非是論定陰陽推數刼會上眞至聖非拘於數大道不容輕傳時本自然聖教無有强聒移校河源檢録天度下自諸水上及諸天一切世界諸類羣生皆度也選擇種人非止說於善類教不揀擇以眞經說與善類則諸類皆蒙恩指拈太無道本大無如何拈出元始至尊說此眞經廼最上一乘三教眞宗虚無重玄令人聞之了悟是云拈出九玄或作九九重玄亦通盼分目開眸垂光目際故云盼眥又云眥目睢也盼或作盻非是元始至聖如何稱天地五老之問爲善請問眞經知其利益時會智見深逺微妙故稱善開化神明道生諸仙神佛等其餘觧見前眥音姿又音子神呪品七章今三天盭運六天道行雜法開也當有三萬六千種道以釋來者之心此法運訖三龍之後庚子之年雜氣普消諸天慶會吾眞道乃行今且可相付當録於上館未得行於下世玄科有禁不得妄傳子可詣靈都紫微上宫聽天音於金格視俯仰於神王然後當使得受天文以總御元始之天也盭魯第切眞經若傳天啓玄瑞靈應自然今何時哉三氣丹天盭更氣運六六諸天一時道行雜說小法開度教化當有三萬六千種門頭道理以解釋來求道者之心此法運化已訖三龍龍漢等三刼之後庚子之年貞元會運雜氣普消諸天慶宵時會吾眞道正法乃行今暫且可以相付當録載於上玄天館未得行於下塵凡世玄科天律例有禁戒不得妄自輕傳子可躬詣太靈玄都紫微上宫聽聆天音旨宣金格傳度期數嚴重之勑視俯仰於仙神天帝將吏天王知此法與貴重利益然後當使得受眞經天文以總御元始統化之諸天也盭音立作盩字非是或作整字亦不是三天青赤禹餘三炁之天六天欲色無色輕塵細塵輕染細染等天帝神人大中小三乘演教各品道行雜說小法開示化度三萬六千種道人身有三萬六千神氣清濁强弱不同有正信者有邪見者根器各别學焉而得其性之所近故有大乘有小乘是有三萬六千種道以釋來者之心應來求道者之心機一云應當來之心機各就相投相信者以受持故了悟者言渙然氷釋是釋字無疑或作擇字者非也三龍龍漢初中末三刼一云龍漢龍康龍徵雜氣普消時將泰妖氛息諸天慶會諸天皆當吉時盛會一云諸天喜慶法會玄科天律有自然之禁雖道不擇人語非其人褻天寶且失言所以三教聖人得其時得其地得其人廼說法傳道金格夜較玄格功過等律也視俯仰於神王仰視仙眞俯視天王神將總御元始之天總領統御元始所化諸天一云視與示同示俯仰於神王示仰承俯聽之義於神王統御元始之天統會諸天近御法駕於元始最上之天二說俱通神呪品八章於是五老帝君與諸眞聖清香執戒徘徊雲路嘯命十方上詣上清太玄玉都寒靈丹殿紫微上宫受俯仰之格乃知天眞貴重難可即聞還乃更詣元始道前諮以禁戒之儀遜謝不逮聽天音於金格然後得受天文眞經於是五方五老帝君與諸天眞聖清著眞香執守道戒周歩雲衢徃遺導度逡廵徘徊雲路嘯咏宣命十方聖神上詣上清太玄玉都天宫妙界寒靈丹陛寶殿紫微上清玄宫受領俯仰之格乃知天文眞經尊貴嚴重難可即得聽聞還乃更詣元始道前懿問以禁戒之儀遜謝智見不及清香廼性眞天香清凈自然香無爲正妙道德眞香非世焚香等也執戒玄範巍肅如對道祖守天尊法戒徘徊慈接無窮玄光法駕周命十方雲路之際先儒云天光雲影共徘徊即此意耳非世間逡巡徃來不止之比也嘯命十方嘯音笑讀作勑或作秀字讀者非也蓋肅然出令爲嘯非吟笑之義十方不言十靈寶但言十方神部爾上詣仙眞朝元受法玄光默昇恭聆玄誨非凡足踵躡踐登之義寒靈丹殿九天之上無聲氣日月不能及天光自照廣而無量清而寒肅丹殿太赤玉光故云然紫微上宫紫霄之上太微天中上清玄宫也非日月天端世所稱紫微垣之宫太微垣之宫也俯仰格觧見前難可即聞非云難以即時得聞但言難以聞而即知一云玄都掌經者不使即還廼更詣元始道前更回來九天上謁元始至尊懿以禁戒之儀懿解見前請問天律禁戒傳法受法之儀則禁禁令戒戒條也遜謝不逮非謝不能守禁持戒但謙遜言身雖神眞法寶眞經素未悟入一時聞之智見不逮此正天地五老眞知道法之尊處非自限止言不堪受此也天下諸類皆有理皆可聞道故四靈之物各拔其萃人爲萬物之靈神爲出世之品豈不能聞道乎故顔子平日聆受夫子之教不違如愚相說以解卓立之後云雖欲從之末由也已文殊諸佛傳釋迦正法眞宗一事聞者𤢜𤢜與此語義一般持此經者識得天地五老委曲推尊經旨之意則知道矣神呪品九章是時天尊慈顏愍諭靈關廓開登命五老帝君開洞陽玉館披九光八色之韞雲錦之囊岀元始靈寶赤書玉篇眞文金書玉篆微妙祕密運御乾坤大光明圓滿大神呪玉章宣付五老帝君是時五老帝君拜受已及諸天聖衆稽首禮謝天尊玉帝仰奉道旨按法以傳五老帝君與諸眞聖旣遜謝不逮矣是時元始天尊大慈天顔矜愍誥諭靈關廓然開化登命五老帝君開玄天洞陽玉館披開九霞光八景色之韞雲錦之囊出元始靈寳赤書玉篇眞文金書玉篆淵微玄妙秘密奥旨蓮化統御一切世界乾坤無量大光明圓滿大神通秘呪玉章宣布付與五老帝君是時五老帝君拜受此法已竟及諸天聖衆稽首禮謝天尊玉帝仰奉元始道旨按此經金格正法以傳諸界神人愍諭愍即大悲諭開誘也或云當作和愉色非是靈關廓開藏經之天丹靈玄關廓然洞開一說洞開聖哀開心見誠一說聖目流光靈關廓開俱通登命登進五老帝君使近前而親命之也洞陽玉館九天玄館大洞無礙永明無暗非瓦石土木玄光妙景虬文奇錯碧玉之章故云然九光觧見前八色太青太赤大黄太白太玄葱蒼碧玉紫金等色也韞經之藏處玄光無邊際盡含於此也披開啓也雲綿之囊雲霞天錦道化自然光結非天孫之織錦也有底曰囊經注於此諸神不測故云然非人間布帛皮革比也靈寶至乾坤等五句俱觧見前大光明三教眞文俱稱法寶所在有光明諸教經書光明有限惟此皇經法徧三千大千傾刼不盡故曰大光明圓滿聖心慈濟無窮力不能及是有限量有虧欠故佛下不能化北極盧州上不能化自在天人難稱圓滿皇經包萬法貫諸乘功化無量無盡雖云道不瀆不强聒道化自然諸類終始循環無有不化於道者故曰圓滿神呪玉篇諸眞法宗諸神玄訣度世要旨諸教神通皆不外此尊重莫踰故云然一攷人性悟道浩刼難忘如注物不漏悟入之初如㯱口故注經言㯱天尊有連上句讀者言禮謝元始天尊有連下句讀者言玉帝爲諸天之尊後說可從餘觧見前玉帝仰奉道旨按法以傳眞經神呪其意云何五老帝君東方爲首東方木德安寶華林青靈始老蒼帝所受神誥命右東方九炁至攝氣舉仙六句廼度世拔人校録神仙青帝祕密靈文二十四字書于九天元臺主召九天上帝校神仙圖籙皆仙梵祕言不敢細解嵗星輔肝至掃除灾羣八句廼制星祕文三十二字書於紫微宫東華殿主召木德星君正天分度東方神呪至敢有稽延八句廼制東方諸魔祕文三十二字書於東華玄靈之館主攝鬼魔正東方諸界九炁下制東河至風火無間八句廼制東方諸水祕文三十二字書於九天東北玉闕丹臺主攝東海水帝大刼洪灾召蛟龍及水神事東方九炁靈寶赤書玉篇眞文合一百二十字皆太上無上大光明圓滿大神呪空洞自然之書一名生神寶眞洞玄章一名青帝八威策文以上不可解故重書原文右玉皇誥命以錫東方安寶華林青靈始老蒼帝九炁天君令統御東方諸天地日月星宿山洞水泉仙聖一切威靈符命所臨如誥奉行如誥者東方天地水一切神祇皆欽遵此命無不奏行此玄章悉天地人物大德青靈之秘魔鬼喪膽度刼免灾諸聖不敢違故永鎭東方諸界玉帝仰奉道旨按法以傳眞經神呪其意云何五老帝君東方爲首東方木德安寶華林青靈始老蒼帝所受神誥命右東方九炁至攝氣舉仙六句廼度世拔人校録神仙青帝祕密靈文二十四字書于九天元臺主召九天上帝校神仙圖籙皆仙梵祕言不敢細觧嵗星輔肝至掃除灾羣八句廼制星祕文三十二字書於紫微宫東華殿主召木德星君正天分度東方神咒至敢有稽延八句廼制東方諸魔祕文三十二字書於東華玄靈之館主攝鬼魔正東方諸界九炁下制東河至風火無間八句廼制東方諸水祕文三十二字書於九天東北玉闕丹臺主攝東海水帝大刼洪灾召蛟龍及水神事東方九炁靈寶赤書玉篇眞文合一百二十字皆太上無上大光明圓滿大神呪空洞自然之書一名生神寶眞洞玄章一名青帝八威策文以上不可解故重書原文右玉皇誥命以錫東方安寶華林青靈始老蒼帝九炁天君令統御東方諸天地日月星宿山洞水泉仙聖一切威靈符命所臨如誥奉行如誥者東方天地水一切神祇皆欽遵此命無不奏行此玄章悉天地人物大德青靈之秘魔鬼喪膽度刼免灾諸聖不敢違故永鎭東方諸界神呪品十一章南方梵寶昌陽丹靈眞老赤帝所受神呪誥命南方丹天赤帝玉堂中有大神號曰赤皇上炎流煙三炁勃光神仙受命應會太陽右度人録仙赤帝祕文三十二字書于九天洞陽之館主召九天神仙圖籙金名熒惑輔心井鬼守房栁星張翼統御四郷軫總七宿回轉天常召運促會正道驛行右制星祕文三十二字書于三炁丹臺主召星官明度數正天分赤文命靈北攝酆山束送魔宗斬邪滅根符教所討明列罪原南山神呪威伏八方羣妖滅爽萬試推亡右制魔祕文四十字書于西南陽正玉闕主制北酆正鬼炁南河水帝太伯龍王神呪流行普掃不祥洪水飛災止蛟召龍開除水逕千道萬通敢有干試攝送火宫赤書所告莫有不從右制水祕文四十八字書於西南陽正玉闕主攝南河水帝大運交期洪水四出召蛟龍及水神事南方三炁靈寶赤書玉篇眞文合一百五十二字皆太上無上大光明圓滿神呪空洞自然之書一名南雲通天寶經一名九天無上之上呪一名赤帝八威策文右玉皇誥命以錫南方梵寶昌陽丹靈眞老赤帝三炁天君令統御南方諸天諸地日月星宿名山靈洞水府泉宫上聖高尊眞仙聖衆一切威靈符命所臨如誥奉行東方誥文永鎭東方矣南方梵寶昌陽丹靈眞老赤帝所受神呪誥命云何南方丹天至應會太陽八句廼度人録仙赤帝祕文三十二字書于九天洞陽館主召九天神仙圖籙金名熒惑輔心至正道驛行八句迺制星祕文三十二字書于三炁丹臺主召星官明南天之度數正南天之分野赤文命靈至萬試摧亡十句廼制魔祕文四十字書于西南陽正玉闕主制北酆正炁鬼南河水帝至莫有不從十二句廼制水祕文四十八字書于西南陽正玉闕主攝南河水帝大蓮交期洪水四出召蛟龍及水神事南方三炁眞文一百五十二字皆太上大光明圓滿大神咒空洞自然之書一名南雲通天寶經一名九天無上之上咒一名赤帝八威策文右玉皇誥命以錫南方眞老赤帝三炁天君今統御南方諸天地日月星宿山洞水泉高仙聖衆一切威靈符命所臨如誥奉行度人録仙盡南方一切世界制星盡南