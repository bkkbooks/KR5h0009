body:
  text: 應驗品續二十五章持是經人名慈悲身六道衆生賴其善故持是經人不但名道藏身也名慈悲身大仁大惠濟度無窮廼名慈悲人惟物我異念久暫殊心不但普濟永利有失慈悲即有所惠有所度有限難久亦非慈悲身故分人以財謂之惠教人以善謂之忠小惠私恩非普濟也眞持經人非常身也大慈身也大悲身也何以見之六道衆生賴其善故世界之類盡於六道六道至衆六道之衆難盡濟度一天道高高在上其福清長不見所生奚云其衆惟天雖高猶有三界欲色無色俱有成壞縱福有長短之期除各天主外信正道可久存其諸天人一切所有天上品類俱非常住有始有卒皆名衆生二人道人爲萬物之靈雖賛化育弘道法貴賤異位男女殊形夥然繁以庶億兆林林不可勝計是名衆生三魔道天之魔王魔民魔女精邪恠異妖孽難窮是魔類衆生四地獄道五無間獄九幽惡獄十八大獄三十六獄七十二獄冥塗苦惱獄類一切衆生五餓鬼道陰酆溟瀆大力鬼王鬼使足長首大腹廣喉微千萬刼中不聞漿水如是餓鬼衆生六畜生道胎者卵者濕者化者羽毛介甲鱗蟄形色蠢然沕然畜業一切衆生悉荷持經慈恩超濟覆護固天人之福解人中之厄除魔獄之淪滅鬼畜之報一界千萬界三千大千諸世界六道一切衆生除業增福賴其善故是云慈悲夫語六道則盡類矣言衆生則盡衆矣諸界皆然則無始前無盡後不可思議稱量者皆賴此眞持經之善矣信乎大慈悲也噫先自度而後度人欲濟六道衆生尚永持眞經以成至善而後可也應驗品續二十六章持是經人名大道身出入所在無怖畏故持是經人不但名慈悲身也名大道身道本無形人身有象人性俻道之全得天地之理得天地之氣若云道身人人有道人人不盡道則父母生身謂人之身可也四大易散云幻身可也物而不化云凡身可也醉生夢死云無知身可也朝暮忙忙甘至老死云業身可也不脩不學輪廻難脫云罪身可也秋香易度華表無多云色身可也男女殊形老少異狀云無常身可也大限到來六親難顧云獨夫身可也風雨寒暄切迫肌膚云受苦身可也此世人無有道者也眞持經人得法成眞是道身也非凢身也名大道身出入所在無怖畏故怖驚憂畏恐懼也惟持經人名大道身出則坦然入則無累或出或入清凈脫洒無不泰然何憂何懼凢其所在無怖畏故觧疑儒者云戒愼乎其所不覩恐懼乎其所不聞戒愼恐懼非畏乎况喜怒憂思悲恐驚七情在人箇箇不無此云出入所在無怖畏故若於戒愼恐懼相反也是不然戒愼恐懼遏人欲存道眞也七情之具見人性體用全俻欲人懾情歸性也若怖畏之心内見未定生於外患有所恐懼不得其正也故夫子云内省不疚夫何憂何懼出入所在無怖畏身與道一觸處泰然何畏之有儒者云見大心泰與此互相發夫持經者出入無怖畏皆自然也非强制也强制則告子之不動心終非見道自然則夫子之不惑從心孟子之不動心皆與此經義同善乎兩教之言心學曰如如自然巍巍不動神化之道具是矣若勉强把捉不需自化持之不永效之欲速雖不怖畏亦非此經義也應驗品續二十七章持是經人名良醫身善行妙法安樂人故持是經人不但名大道身也名良醫身醫者宜也藥與病宜除其疾障也世醫察形辨理愈人之疾拯人之急以藥去病利人之生有神聖工巧之名眞持經人非世醫也無凢醫也不言海上之方也金針默度名良醫身善行妙法人生氣質雜揉者衆氣失其平有生來之疾有有形之疾有無形之疾有一身之患有一家之患有一國天下之患有一世之患有累刼之患疾苦牽纏相循無盡父母所不能訓聖賢所不能化王法所不能禁醫之無藥救之無方持是經人不詭異不强瀆妙用適宜良法當可不苦口不逆耳不違汝心不累汝身不强人以難不詭隨以縱善行妙法安樂人故妙法一行聾者開聦再則盲者目明三則瘖者能言四則跛痾積逮起行五則久病痼疾一時復形六則髪白返黑齒落更生七則老者壯少者强八則婦人孕鳥獸胎已生未生皆得生成九則地藏發泄金玉露形十則枯骨更生皆起成人消一切灾度一切厄魔異寃債永不侵凌九祖六親徃刼未來人我安平幽無對繫物阜身輕不但起人之沉痾抑且消變於未形誠勿藥而有喜永保命以延生非一方一技安樂人一身之醫天醫最良衆生慈父善行妙法安樂人者矣夫此經登眞之大道淑世之奇方人人本有自迷不悟者也善持眞經有得宜濟世矣何末代自私念起稍得一二不慈人物如秦越肥瘠兩不相關始不教世終以自快暫明復蔽不能成道甚可惜也噫知經不度世非也不知强以爲知奸爲人師妄自傳度又大過也能除二病勉力了明此經斯可以普度應驗品續二十八章持是經人名光明身常爲帝光所攝受故持是經人不但爲良醫身也名光明身人性虚明無所不照氣拘物蔽昏掩其明眞持經人性天朗耀心地開通光明常顯命蒂精融如太虚之無雲如日月之代明浩然充塞盛大流行誠光明身非污暗者也常爲帝光所攝受故帝玉帝也帝光普照無所不及人自卑污難以承受今持經人履踐天光丹耀金庭宇泰定而天光發上帝昭格光映玄空持經仰受太和景明帝光攝入保護持經持經蒙化永保常清光明交映持經之人信與天合德日月合明嘗聞天道下濟而光明本無私親人受天之明命本大光明然性本無染心貴虚明人貪欲樂不能使靈臺無物如日月薄蝕雲霧蔽空若不文其過絶欲還理一時之暗旋即廊清四通八達明者益明天光有不煥帝光有不臨未之有也人乃自暴自棄念頭營營晝作夜息心無少停爲者旣妄念復不清與天相悖故昩眞經稍然有覺過成業生罪報森然輪受不輕不能速改以辭文之則天不可欺神不可瞞人之視己如見肺肝此性何在忍欺心若是也所以天命之佑帝光祥護必在眞持經修道成眞之人眞持經名光明身爲帝光所攝受也噫人一也明德同也人何不持經盡道克當上帝之心應驗品續二十九章持是經人名自在身天宫妙境神能遊故持經功德說不可盡持是經人不但名光明身也名自在身三災四殺五行六害七傷八難九星厄十惡業一切無牽永除業根證三元空五藴離四相絶百非除萬有超載刼眞觧脫大自在身天宫妙境神能遊故是持經人玄功如意身得自在凡諸天宫一切妙境碧路瑶階虬墻彩壁玉京金闕紫府黄房瓊樓玉宇閬苑瑶池玄都上境秘院丹臺寶林香徑神室絳宫法橋錦檻皓殿赭庭及瑶草琪花氷桃雪李交梨火棗丹饌瓊漿道光玄瑞彩霞雲祥神輿法駕法寶天人諸品奇英神遊定觀悉歷勝遊非常人所及持經功德說不可盡甚言功德大也夫所言持經功德種種人物幽顯存亡今昔一切並利邪魔伏帝光臨神遊諸天尚言不盡則功德無量矣說經至聖又何如哉噫經功最大當至誠永持矣應驗品續三十章闐字真形間解也又若道士志人能結壇誦經着新凈衣於夜半後関寂之時獨處清凈室叩齒九通東向端坐誦詠是經於是時也天眞御几玉妃拂筵萬神班列諸天臨軒三界侍衛五帝司迎持是經人名十二功德身慈濟無窮矣又若道士志人道士脩道入玄之通名志人有志之人也或作至人非也蓋得道成眞方名至人觀經者但以後有天眞玉妃萬神諸天三界五帝御班侍迎等句以爲當作至人看不知經是帝勑所在諸神供衛遇持誦者即愚夫凡婦衰叟蒙童神敬是人如奉是帝持經誠敬福德無量怠慢則咎殃立至諸神侍迎敬其持眞經不必至人況結壇新衣夜半靜室叩齒東坐此學者誦經之常規非所以論至人故知爲志人無疑能結道法壇場諷誦此經着新作潔凈衣服於夜半後闃苟曲二音大昧時也寂之時獨處清凈室中叩齒九通面東向端身定坐誦詠是經於是時也於是志人如法清凈誦經之時天御几諸天至眞臨御法几玄案玉妃拂筵靈妃玉女拂清法筵拂蕩也欽敬清肅之意非拂逆之拂筵法席也萬神班列世間帝王勑令所在羣臣班列皇經爲玉帝秘言元始法㫖志人持誦即讀宣帝勑一般萬神悉皆班列拱奉諸天臨軒一切諸天帝眞法駕臨軒軒玄案也三界侍衛三界天界地界水府界三界諸神將吏侍列護衛一云志人誦經三界當作天地人然夜半靜室定無人在爲天地水部三界無疑一云欲色無色三界亦不是五帝司迎五帝五方五靈五老上帝也一云五嶽尊帝也以前有萬神三界字中有五老此當作五嶽萬神三界中有五嶽此作五老是也經中有五老啓問故開經五老司迎道祖司主也承也迎迓也覲禮虚皇之義一云司迎持經之神昇玄亦是夫觀誦經之虔諸神備護則不誠諸神鑒報必有之矣見聞經者當凛然恭持不見聞者當惕然求遇嚴若諸神之臨不求應見之效無思無爲密密持眞一身之神森然永保玄眞經矣勉之勿怠應驗品續三十一章又能閉目靜思存想是經不覺身䖏三色雲氣之中俄見其身光明赫奕上昇天宫衆眞下迎心有所請一切應奉仙丹妙寶隨意自得宜當依科冥心奉行不但虔誦是經得諸神護又能閉目靜思五藴之害色爲第一色之亂心目實受之奉持眞經身心宜凈閉目以靜心自大定然道之玄微非思不入妄思又所以亂眞閉目靜坐不見可欲使心不亂默嘿思索密入深機此誦經之大要也今言靜坐者兩目半垂簾不全閉恐作鬼窟活計不知陰趣襍念是曰鬼窟若心清凈閉目何害時人心不决烈閉目疑生故半開眼不着睡魔疑心耳若善惡兩忘無無亦無眞道自入閉目何妨垂簾之論玄師防無志者魔惑耳且半垂簾義閉目不觀内有眞照心法惺惺光明不昩如垂簾聽政雖不觀看當應者無不周知也此修道之機括故論經而併及之存想是經此存想不是招攝經中景象功效對此法品如見玉帝念道思眞不敢輕易徒口誦經靜存此心密密研窮經中至理體之身心云存想是經不覺身䖏三色雲氣之中雲氣蒸成於天地思經大定與天心合念念眞善慶雲廼生不覺身處青黄白三色雲氣之中心身靜正龍虎蟠旋故有是三色雲若修眞成則五色雲擁九霞光泛又不同耳俄見其身光明赫奕上昇天宫衆眞下迎俄少傾時也俄見身光煥發盛耀炳蔚餘觧見前心有所請至天宫心有所請求一切應奉仙丹妙寶隨意皆得一切應當奉獻元始玉帝仙丹妙寶隨意請求自然皆得不可言求寶應奉自身宜當依科宜當遵依科教冥心奉行觧見前夫經本人性之眞默悟永持可也以存想言之似落第二義儒書云恍惚不見之圖儼然無形之視又云洋洋乎如在其上豈亦第二義乎噫上智者少中人最多若不操存求不聞之亦式焉能盡人合天超凢以入聖耶學者思之應驗品續三十二章此經乃至三世金仙十方大聖皆從此經依科修奉故得超證無上妙道是兹玉帝諸天之師衆聖之王此經不但持誦志人當依科奉乃至三世金仙過去世見在世未來世金仙金丹不毁太玄眞仙也十方大聖四正方四隅方上下方十方靈寶尊神至眞無極大聖皆從此經依科修奉觧見前故得超證無上妙道進脩不同成就各異證道階品未至不爲無上如神人地鬼等仙如欲色無色天神如菩薩聲聞羅漢佛乘如化大美信善人賢者等儒皆非其至如天仙文佛聖不可知神儒方名最上金仙大聖依科專奉此經與帝眞合故得成最上仙超脫高證無上至眞妙道不落諸天福德之果是兹玉帝兹此也諸天之師三十三天三十六天萬二千天三千大世界一切諸天皆從皇經而證大道玉帝廼諸天之師化成衆眞者也衆聖之王諸仙諸儒聖諸佛諸天諸神一切衆聖脩讓其德度讓其功證讓其尊浩刼欽崇衆聖之王也噫人有天君泰然則道可得若不脩心了悟與天合德虚崇上帝抑過矣戒之思之應驗品續三十三章是故凡夫值遇是經精一修奉乃至五帝輔翼召使羣仙御役神官運導陰陽千靈敬仰萬神攝伏百邪避路羣魔束形命過之後即得南宫受鍊飛步上清逍遥自在與道長存不特金仙大賢從此經證道也是故凡夫值遇是經世間凡夫因縁際會值遇是經精一脩奉精誠專一脩持崇奉乃至五帝輔翼五老上帝不指五嶽輔助其進脩翼加其不逮召使羣仙御役神官召使令而使之羣仙如命也御役制而驅之神官供役經云脩道志人中可以役鬼驅神雖凡夫精一持經伏道法力自能召仙役神運導陰陽惟精惟一允持此經自以斡運造化開導陰陽千靈敬仰千靈恭敬膽仰萬神攝伏攝驚畏心服伏斂神默伏也萬神攝伏不待作持百邪避路百邪逺避道路不敢觸犯群魔束形諸魔束斂其形不敢顯露命過之後觧見前即得南宫受煉南宫朱陵府度魂錬魄之宫也受錬受南宫鍊度也飛歩上清飛神歩上清天界此非上清境但言昇天耳逍遥自在不經地獄不受業報無拘無繫自在逍遥與道長存初受持經雖非至眞精一脩奉心契於道無滯無牽魂神清凈不復毀淪與道長存此道典之所謂死而不亡佛經之所謂一悟便了也夫一凢夫精一持經其驗如此則知至誠之功效雖下愚亦可以盡道也觀者勉焉應驗品三十四章又復世間衆生得聞是經心生渴仰能於家庭擇清浄處畫帝尊像日夜虔虔晨香濟濟香花燈果尊重供養稱讃聖號瞻禮誦經是人當得三十種上妙功德一者諸仙讃重二者先亡生天三者宿殃觧脫四者所徃通達五者無盗賊事六者所求遂心七者除水火厄八者横事潜消九者夜夢吉祥十者疾病不侵十一者智慧聦明十二者人見歡喜十三者衣食豐盛十四者子孫榮貴十五者六親見喜十六者門族和睦十七者除三惡報十八者轉女成男十九者形容端嚴二十者爲國大臣二十一者生爲帝子二十二者鬼神欽仰二十三者得宿命通二十四者諸神護念二十五者九族受蔭二十六者䖏世長年二十七者有情賴善二十八者魔玉保迎二十九者决超三界三十者白日上昇凡夫精一修奉此經存亡大益矣又復世間衆生得聞此經心生渴仰如渴得仰感極切能於家宅庭堂擇清凈䖏畫玉帝尊像日夜虔䖍誠破懇篤晝夜不怠晨昏濟齋揚祇奉早蛻鏶二香花燈果尊重供養稱讃玉帝聖號瞻拜禮誦此經是人當得三十種上妙功德一者諸仙讃重讃歎欽重二者先亡生天先亡安觀悉生三界三者宿世業殃觧脫永不牽纏四者所徃通達向徃進修悉得通達五者無盗賊事永不遭此六者所求遂心求謀盡遂七者除水火厄難八者横事潜暗也消九者夜夢吉祥十者疾病不相侵十一者智慧聦明十二者人見歡喜十三者衣食豐足隆盛十四者子孫榮貴子孫榮貴非必榮華富貴賢而清不惡賤夭便好十五者六親見喜十六者門族和睦十七者除三惡業報十八者轉女身成男十九者形容端正威嚴二十者爲國大臣二十一者生爲帝王之子二十二者鬼神欽服瞻仰二十三者得宿命通宿業盡命大通利二十四者諸神護念護持讃念持經奉玉帝之人二十五者九族受蔭九族高曾祖父己身子孫曾玄一云父三族母三族妻三族也二十六者䖏世長年二十七者世界有情賴其善功二十八者魔王保舉迓迎二十九者决超欲色無色三界三十者白日上昇諸仙昇化不同非必白日肉身昇天體同太虚神遊玉京是白日上昇尊經敬帝雖有此功先要絶盡秘欲不求效驗亦不間斷心與天合然後有效即無效亦不害爲善也若一覬效非善傳帝經矣觀者辯之應驗品續三十五章爾時天尊復告四衆曰此經功德能碎鐵圍諸山竭苦海水破大地獄拔諸罪苦降暴惡魔護諸國土能滅一切惡鬼能除一切重病能觧一切惡毒能離一切惡人能伏一切毒獸能摧一切邪道一切諸天皆自尊敬其餘功德說不可盡尊經敬帝功德有三十種爾時天尊復告四衆曰此經功德能碎陰酆鐵圍諸山凈盡宿塵竭苦海水廻頭登岸苦海波乾破大地獄屏息妄縁拔諸罪苦絶斷業根永無罪報降暴惡魔降伏剛暴猛惡邪魔禁横逆邪妄護諸國土悉使清寧富國安民能滅一切惡鬼除滅兇惡陰鬼除陰惡趣能除一切重病除盡諸染能觧一切惡毒觧除世諸惡毒觧身大嗔惡毒能離一切惡人或不相遇或惡人見我彼即遁迹能伏一切毒獸馴伏世諸毒獸又脩眞之人陰氣化諸毒龍猛獸巨虬獅子各百億萬衆護我眞經令自馴伏永護於我能摧一切邪道摧破世諸邪道摧己邪妄迷執一切諸天諸界諸天皆自尊敬自然尊敬此經其餘功德說不可盡觧見前此經功德消難消之變除難去之毒無所不化無所不利大方便最上法品也雖至聖之微言實性分之能事勉之則功自成應驗品續三十六章爾時道場大衆金仙菩薩眞聖眷屬聞是說已歡喜踊躍稽首敬禮而作頌曰大哉至道無宗上眞上度諸天下濟幽魂上無師祖惟道爲身丹臺紫府金闕玉京秘此妙法溥福含靈滅我萬罪增我遐齡萬神朝禮魔王保迎功德昌盛黄籙書名渺渺億劫使我長存于時會衆說是頌畢稽首皈依奉辭而退高上玉皇本行集經卷下爾時道場大衆道場敷道之場也金仙菩薩眞聖眷屬聞是說已說經已竟歡喜踊躍騰歡鼔舞之意稽首敬禮而作頌曰大哉至道大不可量至不可及無宗上眞無本無始最上至眞上度諸天化徧於上下濟幽魂化徹幽冥滯魄盡昇上無師祖無師無祖惟道爲身頌讃此經以道爲身丹臺紫府太玄妙境金闕玉京解見前秘此妙法秘珎藏也溥福含靈徧福一切含靈或以福作溥度滅我萬罪經能滅一切罪增我遐齡經能延年萬神朝禮欽重此經魔王保迎尊持經者功德昌盛功德盛大周遍悠長黄籙書名玄都仙籍金簡黄籙以書其名渺渺億劫渺渺寥廓遼逺億數多劫使我長存使持經有道者長存于時法會眞衆說是頌畢稽首皈依無上玉皇本行集經奉辭至聖而退高上玉皇本行集經卷下終玉皇心印妙經當附此不當書半板後先列補闕纂心印續後至心皈命金闕玄穹主主一作祖字高上玉皇尊至尊也諸佛聖師諸佛從此經悟道故玉帝爲諸佛師萬天帝主統御萬天演三卷五品之妙法上中下分三卷玉帝化三身故經三卷五品神通神咒功德護持應驗等品周十號萬德之洪名窮蒼眞老至大慈仁者爲玉帝十號經讃玉帝萬德周身洪名最大眞名放十七大光明大神通光至無能勝光爲十七大光明玉帝光無量稱不盡就諸神之能稱者十七示三十種功德示人以尊經敬帝得諸仙讃重至白日上昇三十種功德拔度生死利益存亡脫其業趣增其福果運化古今化盡徃古來今一萬二千三十六字即易經大衍之數洞玄靈寶解見前高上玉皇本行集經夫此經探之無始莫知其先推之無終莫知其後大包三千大千莫知其大細入塵沙渺冥不見其小覆盡諸天不知其高利盡諸地不見其下福度一切人物不見其繁包諸法括萬有不見其雜任刼數昇沉無分無合任化機推遷無間無緒消盡邪魔不示神通度盡迷執不見勞費化無窮不恃功德普仁慈不拘品類究之無際稱之難窮誠三教之眞宗浩劫之永寶要之爲吾性之固有天命之本然也一切人物至誠脫悟全得經功眞得之基存乎一心因附心印皇經集註終玉皇心印妙經此玉帝傳心聖聖相承以心印心明悟了證皆宗此旨三教莫違故云心印上藥三品最上妙藥有三品即三般神與氣精非金石上术靈芝玉屑及外藥凡藥乃元神元氣元精凡藥可以愈疾所及有限此藥保劫度世化濟無窮一切莫此故云上藥恍恍似有非有惚惚似無非無杳杳似逺非逺冥冥似近非近若不見聞似有見聞存無守有秘存虚無默守妙有頃刻而成上藥一得立躋聖域廻風混合廻旋巽風混合百神百日功靈三月基就功漸玄靈默朝上帝宇泰貞定秘禮元皇一紀飛昇十二年丹神飛昇一云歷脫十二相屬乃昇知者易悟眞知者易悟上藥之基昧者難行愚昧者難行存守之義履踐天光宇泰定天光發而足躡天根呼吸育清眞炁徃來滋育玄清出玄入牝知天谷元神而出玄入牝若亡若存不散亡不强存若亡若存綿綿不絶默默綿綿終始不絶固蒂深根性根命蒂妙培深固人各有精各人皆有至眞眞精精合其神眞精妙合元神神合其氣元神妙合眞氣氣合體眞元氣妙合吾體至眞不得其眞不得身之至眞皆是强名自云得藥便是强名神能入石神入金石無礙一云穿山透石無不到之謂也神能飛形煉神還虚身自飛昇入水不溺有道者水不漂溺一云諸欲不染爲不溺入火不焚有道者火不能焚一云怒妄不生爲不焚神依形生形成而神至故云神依形生精依氣盈氣滿則精全故云精依氣盈不凋不殘神氣精全系無耗散而不凋不殘松栢青青永無衰變如松栢青青三品一理三品上藥共根一理妙不可聽重玄至妙非可聞聽其聚則有善存默守妙聚則有其散則零妙意渙散倏忽凋零七竅相通耳目鼻口眞七竅内爲相通一云七竅在竅竅光明風雲發洩竅竅光明一云各有天寳明聖日聖月身之眞陰眞陽永明不毀故云聖日聖月照耀金庭光映丹臺紫府云照耀金庭一得永得眞得實益永不毀淪自然身輕身輕回陽换骨遺虚非徒體健也太和充溢太和眞氣充滿洋溢骨散寒瓊黄中通理骨竦神怡畢落瓊琳金筋玉骨得丹則靈明藥得丹易凡而靈不得則傾不得正丹梁喪身傾丹在身中非白非青非肺白非肝青誦之萬遍默轉眞經萬遍非口誦也妙理自明此經妙理召然明白無上玉皇心印妙經回向懺悔文回心向道重誠懺其前愆悔而自新不作後過龍章鳳篆已殫盡也歌詠之誠鶴駕鸞輿重冀望也鑒觀之惠臣謹炷眞香丹誠天香也重誠奏啓道經師寶元始萬神玉光會中一切聖眞恭望恩光重垂證鑒臣向來爲某人某事看誦玉皇本行集經幾部敬保某人某事云云所宣經典罔敢不虔其柰業力障魔神志錯亂所立根鈍自然想來脫略混清顚倒重叠臨文徇意字誤句差乖清濁之正音泥解會之邪見事奪其志心不在經問對起居斷絶隔越久誦懈怠因事忿嗔嚴潔或涉於垢塵肅敬或乘以瀆慢身口服用之不凈衣冠禮貌之不虔供弗如儀處非其地卷舒揉亂墜落脫傷不專不恭大慙大愧伏願慈悲憐憫赦釋罪愆庶使誦持得臻感格所祈所願如志如心尚慮經中傳授或誤刊寫多訛其師其人悉皆懺悔仗道威力願罪消除常轉法輪普度羣品爲如上衆稽首稱念太上無極大道至眞三十六部尊經眞文寶符太上三尊十方衆聖玄中大法師玉經中無鞅數衆神仙不可思議功德高上玉皇本行集經懺悔文丁培仁點校
