body:
  text: 文一百六十字皆大神咒自然之書一名保劫洞清九天靈書一名黃天大神咒一名黃帝八威策文右玉皇誥命以錫中央保劫洞清玉寶元靈元老黃帝一炁天君令統御中央皇天后土日月星山洞水泉聖尊仙眾一切威靈符命所臨如誥奉行度人錄仙制星制魔制水秘文俱不敢解此文握盡黃帝之秘一切皆不能逃故厯劫永制中央諸靈神咒品十三章西方七寶金門皓靈皇老白帝所受神咒誥命西方素天白帝七門金靈皓映太華流氛白石峩峩七氣氤氳上有始生皇老大神總領肺氣主校九天檢定圖籙制召上仙右度人錄仙白帝秘文四十八字書於九天素靈宮北軒之上主召仙炁舉仙道太白檢肺奎婁守魂胃昴畢觜主制七關參總斗魁受符北元右制星秘文二十四字書於金闕玄窗主攝白帝星官正明天數赤書玉字九天正文攝召萬炁普歸帝君右制魔秘文一十六字書於九天金闕三圖之館以攝六天魔炁西山神咒八威七傳符水上龍召山送雲在所校錄同到帝門輔衞上眞斬滅邪源若有不祥截以金關赤書符命風火驛傳右制水秘文四十八字書於九天金闕三圖之館主攝西海水帝及水中萬怪惡毒之精召雲龍以防水旱之災也西方七炁靈寶赤書玉篇眞文合一百三十六字皆太上無上大光明圓滿大神咒空洞自然之書一名金眞寶明洞微篇一名西山神咒一名白帝八威召龍文右玉皇誥命以錫西方七寶金門皓靈皇老白帝七炁天君令統御西方諸天諸地日月星宿名山靈洞水府泉宮上聖高尊眞仙聖眾一切威靈符命所臨如誥奉行西方七寶金門皓靈皇老白帝所受神咒誥命西方素天至制召上仙十二句四十八字迺度人錄仙白帝秘文書於九天素靈宮北軒之上主召仙炁舉仙道太白檢肺至受符北元六句二十四字書於金闕玄窗主攝白帝星官正明天數制星秘文赤書玉字至普吿帝君四句十六字書於九天金闕三圖之館以攝六天魔炁西山神咒至風火驛傳十二句四十八字迺制水秘文書於九天金闕三圖之館主攝西海水帝及水中萬怪惡毒之精召雲龍以防水旱之災也西方七炁眞文合一百三十六字皆太上大神咒一名金眞寶明洞微篇一名西山神咒一名白帝八威召龍文右玉皇誥命以錫西方七寶金門皓靈皇老白帝七炁天君令統御西方諸天地日月星山洞水泉聖眞仙眾一切威靈符命所臨如誥奉行度人錄仙制星制魔制水盡一切西方之秘不敢明解召山送雲召山之玄靈眞氣或作止字者非也神咒品十四章北方洞陰朔單鬱絕五靈玄老黑帝所受神咒誥命北方玄天五炁徘徊中有黑帝雙皇太微總領符命仙鍊八威靑裙羽䙱龍文鳳衣上帝所舉制到玉階右度人錄仙黑帝秘文四十字書於鬱單無量玄元紫微臺北軒之內主召諸眞人神仙圖籙北辰輔腎斗牛衞扉女虛危室豁落四開壁總七星執凶糾非卻災掃穢明道動輝右制星秘文三十二字書於天心北元玄斗中主攝北方星官正天氣北山神咒激陽起雷流鈴煥落玃天振威北酆所部萬妖滅摧右制魔秘文二十四字書於北方洞陰朔單鬱絕玄臺主攝天魔北帝制伏惡神萬鬼事九河傾訖鳥母羣飛蛟龍通道水陌洞開赤文玉書驛龍風馳右制水秘文二十四字書於洞陰朔單鬱絕玄臺主攝北海水帝制水中萬精主召蛟龍興雲致雨事北方五炁靈寶赤書玉篇眞文合一百二十字皆太上無上大光明圓滿大神咒空洞自然之書一名本命紫微元神生眞寶明文一名北山神咒一名黑帝八威制天文右玉皇誥命以錫北方洞陰朔單鬱絕五靈玄老黑帝五炁天君令統御北方諸天諸地日月星宿名山靈洞水府泉宮上聖高尊眞仙聖眾一切威靈符命所臨如誥奉行北方洞陰朔單鬱絕五靈玄老黑帝所受神咒誥命北方玄天至制到玉階十句四十字度人錄仙黑帝秘文書於玄臺北軒主召諸眞人神仙圖籙北辰輔腎明道動輝八句三十二字制星秘文書於天心北元玄斗中主攝北方星官正天氣北山神咒萬妖滅摧六句二十四字制魔秘文書於洞陰朔單鬱絕玄臺主攝天魔北帝制伏惡神萬鬼事九河傾訖驛龍風馳六句二十四字制水秘文書於洞陰朔單鬱絶元臺主攝北海水帝制水中萬精主召蛟龍興雲致雨事北方五炁眞文合一百二十字皆太上大神咒一名本命紫微元神生眞寶明文一名北山神咒一名黑帝八威制天文右玉皇誥命以錫北方五靈玄老黑帝五炁天君令統御北方諸天地日月星山洞水泉聖眞仙眾一切威靈符命所臨如誥奉行度人錄仙制星制魔制水盡握北玄之秘故一切永不能違授五方五帝眞文永鎭一切世界三教萬類一切莫逃永劫不壞虛無妙有秘不可窮玄之又玄神乎其神吾身之五炁悉備是理志士達人徹性命之宗得萬法之源理數不能違眞經常在我神咒功化屬此矣神咒品十五章道言是大神咒者元始之妙言玉皇之眞誥上清自然之靈書九天始生之玄札空洞之靈章上聖之秘語玉宸之尊典成天立地開張萬化安神鎭靈生成兆民匡御運度保天長存上制天機中檢五靈下策地祗嘯命河源運役陰陽召神使仙此至眞之妙文神應自然致天高澄令地固安保鎭五嶽萬品存焉五方神咒妙化無窮何也道言是大神咒者元始天尊至玄之妙言玉皇天尊至眞之寶誥上清玄都自然之靈書九天仙境始生之玄文仙札太虛空洞之靈章上極無上至聖之玄言秘語紫極玉宸之至尊法典上成諸天下立諸地開張萬有妙化總諸神鎭萬靈一生一成億兆之民匡輔統御劫運化度之秘保諸天長存上制天覆大生之機中焉檢制五方五靈下以策使地祗嘯命一切水府河源運化役使陰陽召諸神使仙眞此大神咒乃至眞之妙文神化妙應惟出於自然上位乎天得一以清高明悠久是致天高澄下位乎地得一以甯博厚悠久是致地貞固永安保鎭五嶽名山一切萬有品類使永存焉道言是五老上帝述道致讚述言故稱元始玉皇云云非元始自讚也妙言至靈書等俱解見前九天始生玄札稱手書曰札玉皇眞經無象無聲大光妙音徹十方徧法界傾劫不毁非手可書皆自然之文非言可傳皆心印之妙探之無始在太虛罔象之先故曰九天始生玄札玉宸尊典天子所居爲宸元始爲萬教至尊居玉淸聖境玄化難窮故曰玉宸說此眞經各教經書皆不及此諸聖諸神皆不敢違天律金格寶之甚重十方列聖衞之甚嚴故曰尊典安神令諸神不顯神通安然無爲鎭靈令萬靈不露靈響斂其威靈匡御運度終始法界掌持劫運化度無窮令其循環無端不傾不撓故曰匡御運度下策地祗簡策旨命之也非策鞭之策運役陰陽陰陽往來道實主之故云運役非言役使陰鬼陽神也召神攝召一切神使仙仙爲上帝之賓何以言使元始說此經迺三教眞宗諸神欽承故云使仙天地有窮萬類易盡何言萬品存焉從劫至劫生生不窮皆賴大道故云萬品存焉神咒品十六章玉帝昔授五老上帝是時五帝跪捧其章秘題靈都之館天眞皇人昔書其文掌之於上清眞境太玄玉都寒靈丹殿紫微上宮累經劫運而其文保固天根無有毁淪與運推遷是大神咒混之不濁穢之愈清毁之不滅滅之極明大有之文天眞所尊自光眞名帝圖刻簡昭示來生斯文隱秘不得窺聞有得之子保萬炁長存勤行修奉克至神仙朝禮帝君大神咒保天地山川萬品存焉玉帝昔以此神咒授五老上帝時五帝跪捧此寶章秘密題此玄章於靈都之館天眞皇人昔書此經本文掌之於上清眞境太玄玉都寒靈丹殿紫微上宮累經劫數元運而其經保固天然妙化之根無有毁壞淪沉與元運相推轉移是大神咒混之終不可濁穢之愈見其清毁之終不滅滅之則極精明大有玄妙之眞文諸天眞聖所尊崇自煥天光普張眞名應受帝圖刻之金簡昭示當來生生諸品斯經文隱奧深秘凡常不得窺測聞見有得斯道之子保萬炁長存不毁勤行修習奉持克至神仙朝禮至尊帝君跪捧長跪手捧寶章也經在天迺玄文非世文如何言手捧天神拱捧至敬之意秘題讚而書錄也天眞皇人書經文皆玄光天書金玉篇字一丈之妙文也上清眞境靈寶所居也經自元始天尊說傳之者靈寶故曰上清眞境而其文保固天根經之理厯劫不壞是保天然之玄根永固也或以爲保天之根使其悠久不可從蓋元會之後天不能長在故知非言天之根與運推遷劫劫長存混之不濁雜法渾亂正道常存終不能濁此經穢之愈清褻瀆此經者天有罰愈見其尊而清毁之不滅癡邪謗毁此經者此經終不磨滅滅之極明無道之世欲滅此經則經法流通大行於世愈顯其明大有之文厯劫常在處處不無非凡象迺妙有故云大有或以爲大有妙庭之文太拘昭示來生將來之萬生非一人之來生不得窺聞非至聖不知此經常人但誦其文耳邪魔不敢窺下愚不能聞有得此經中道理之子保吾之萬炁長存勤行修奉自能至於神仙而朝禮上帝也或云朝五老帝君太拘了一云保萬化之炁長存亦通此言經之明效功德品一續前十七章玉皇功德品第三爾時玉虛上帝白天尊言惟願慈悲普爲四眾帝釋等及四梵天王一切諸天一切諸仙及未來一切眾生持是經人說利益事爾時天尊告玉虛上帝言快哉斯問不亦善乎汝以慈悲愍念眾生故請問於我汝當復坐吾爲宣說當玉帝授五老上帝此經時玉虛天之上帝上白說經教主大天尊言惟願至聖慈悲普爲世間四眾及諸天帝釋等及三界之上四梵天一切諸天一切諸品仙人及未來世一切眾生持是眞經之人說利益之事爾時說經大天尊告玉虛上帝言快心哉斯問也不亦善乎汝以慈悲心愍念世間眾生故請問於我汝當復坐吾爲宣說經義天尊指元始言或指玉帝者非是四眾解見前帝釋迺諸天帝及釋教諸佛菩薩等眾或以爲諸天主皆稱帝釋亦是若以玉帝爲帝釋天主此僧家之訛言故諸經妄以天主爲玉帝不知玉帝爲萬天之宗非止一天之主釋經云梵王帝釋爲呈祥蓋言天佛之宗非敢言玉帝僧人任私謬解亦屬大過故併及之四梵天王三界上大梵天王也非欲界下天之王言梵天則盡上界不言種民諸天者種民之上皆至眞大仙自然契此經故不言及一切諸天一切諸仙自梵天之下一切諸天帝神民一切諸品仙說利益事大道不言效如何玉虛上帝請言利益大道爲天地人物之宗本來皆有實益於人有自然之利天地四眾未知此經者不知其義罔敢信從遂輕大法悞自己大道恩慈不忍世迷故言利益以度人奈何愚迷者尙云此經亦微言渺論何益於人豈知此經生天地人物不可須臾離者處處人人當誦持劫劫相循有大利益迺出自然非徒歆人以效也不亦善乎非疑詞迺稱其善問也我元始自謂也汝元始謂玉虛上帝也復坐命玉虛上帝復還聽經座位吾亦元始自稱宣說廣布爲宣吿語爲說梵扶之切或誤作梵非也此請經之誠普利之心功德品續上十八章天尊言曰若有三界十方無量國土或兵戈並起疫氣大行水旱蟲蝗凶災饑饉是其國王大臣當發慈憫爲其黎庶遍勅國內州縣鎭宰令諸道流清淨嚴潔于其觀內設大齋醮六時行道爲轉此經當得國土清平五穀豐熟黎庶安泰元始天尊旣命玉虛上帝復坐聞經迺言曰若有天地人三界上下四正四隅之十方無盡量一切國土或動軍戰而兵戈並起或天災流布値疫氣大行或年嵗荒歉而水旱蟲蝗凶災饑饉是其國國王大臣當發慈憫爲其黎民臣庶遍勅國內州縣鎭宰令諸道門之流清淨嚴潔於其觀內設大齋醮白晝六時行道爲轉此眞經當得國土清平五穀豐熟黎庶安泰或云三界不可言天恐與國土兵戈字有礙不知天魔與諸天主爭衡亦有鬬戰各有分界故知三界言天地人也兵戈並起只言各處兵起互相戰爭非言兵戈兩樣並起也刀鎗之屬皆兵器戈㦸也此固不可言並起或言兵作人人戈並起亦非正義或疫氣大行天道安常災則稱變疫氣大行時癘之作亦災異也此經救除之水旱蟲蝗水溢旱乾諸蟲害禾羣蝗傷稼皆災異也凶災饑饉嵗不熟民物不安則爲凶異常爲災穀不熟曰饑菜不熟曰饉此皆災異也黎黔黎庶庶民也遍勅遍與徧同州縣鎭宰或言州縣統鎭百姓之官或言鎭爲軍鎭之官又言鎭爲督撫官之大者皆是是其國王大臣如是等地方之國王大臣道流全眞正一清微靈寶等派道流清淨嚴潔內外肅然身心無二衣壇整飭恭敬莊嚴終始如一如是清淨嚴潔觀觀也神之所在瞻者起敬是誠大觀故曰觀設大齋醮齊內外一眾志齊其不齊爲齋祈謝神祗酬報天地合德於神依科迓福爲醮六時行道非如今時沿途行道不過依科迓神轉經念道而已或云晝夜十二時奇時動偶時靜六時當作子寅辰午申戌或云子至巳一云白晝六時俱通轉經心與道合持眞經國土無厄艱得清平稻黍稷菽麥五穀俱豐熟各國各界黎民無災艱永得安然定泰然樂功德品連上十九章若復有人入諸山林遇毒惡獸但能存想一念眞經山神衞護猛獸自退終不害己若入江海採寶求珍値遇惡風如法持念是此眞經風浪頓止安穩達岸眞經之利豈特消天災豐嵗年令黎庶安哉卒然之變山水風波之厄亦有不能害者若復有人入諸山林中遇毒猛惡獸但能存想一念眞經不忘此寶章妙法山神保衞佑護猛獸自然退去終不傷害持經入山之己身若人入諸江海採寶物求珍玩値遇惡風漂其船舫如經中誦受之法持念是此眞經大風自息波浪頓止安穩達岸持經人船終無傷害山林險阻猛獸毒蟲勢不可近一旦遇之必至傷害存想一念眞經不過暫與道合如何猛獸便退蓋人物之生本一元氣但分清濁全偏天地之初人物混處沕沕然穆穆然一切毒蟲惡獸原不害人後人心漸假去害蟲獸所以蟲獸害人人若常行好事存好心敬信眞經念念不忘是大善人入山林自不遇毒蟲惡獸若平日庸常無有善功入山適然遇著毒蟲惡獸不貪生怕死不惶懼不欺心惟信正法專一無二操存默想一念眞經心與道俱山神衞護毒蟲猛獸自然退避蟲獸道中之蠢物性雖毒惡好傷殺各有所敬有所畏有所忌是以鷙鳥尊鳳猛獸朝麟蛇蝎蜈蜒諸毒蟲等畏鸛宏鳥鶴鵬滅跡不施其毒仙眞達生化之機明尅制之源一咒語一符水尙能制蟲蛇毒解虎狼厄返風囘天况皇經爲萬法之宗天地之祖萬物生殺係於天地本於大道一念存想此經不懼蟲獸法寶光諸神衞蟲獸雖蠢性亦尊道畏天懼神自然退避江湖河海風波危險迺天之怒數似難逃此經爲萬法之王風雷雹電皆天之妙用神威也如法持念此眞經同於天同於道天亦爲之霽威風息浪止船安然達岸考證易云履虎咥人凶子曰暴虎憑河死而無悔此經云存想一念如法持念此眞經蟲獸退風浪息道德經言合於道者鷙鳥不搏毒蟲不蟄虎兕無所投其用藏牙伏爪避不敢傷人多疑與儒道相悖及考禹過江黃龍俛首而逝劉昆守江陵返風滅火守弘農虎北渡河伊川過江主敬風息則知易經孔子所言無道妄行者也皇經道德所言尊經合道也經功尙可以脫獸趣拔毒業持經者豈行陸齊出毒哉功德品續二十章若在軍陣戈㦸旣接兩刃相交存心默念是此眞經是諸惡賊悉自退散眞經之利豈但解蟲獸風波厄哉若在軍陣兵器俱舉戈㦸旣接兩軍之刃相交存心默念是此眞經是諸陣上侵我之惡賊悉自退散考證兵凶器也戰危事也衝鋒禦敵矢石之交兵刃旣接如虎之鬬勢不可解存心默念此眞經不過心與道俱如何惡賊便退兵法云三軍可奪氣將軍可奪心默念眞經攝其神褫其魄妙典神功敵人喪氣無殺心無鬬志格惡從善自然退而散去軍陣非言萬二千五百數爲軍軍勢成列爲陣止言戰而陣成相攻之際戈㦸非重文接與交無大分别不過順經文言兵刃相交耳存心默念眞經不爲苟免殺伐專心致志甯死而不畔於道耳諸眾也惡賊或言惡指惡人賊爲賊黨如此分者非也不過言惡逆之賊耳悉皆也退散退而自迴散而各歸也解疑老君化胡于闐國以兵圍之天帝居天宮天魔舉兵以爭衡佛在舍衞國歌利等六王爭叛孔子化天下伐木於陳削迹於宋此皆大聖人道身法身常轉眞經觀是若有賊害之者其後老君布道光于闐皈依帝顯天光天魔斂跡佛運法光六王歸化孔子著德光援琴三唱三和匡人解甲是自退散嘗考賊多有誓不殺害善人者善人多有臨危不死者或又疑宋徽欽之好道受辱漠北梁武帝好佛餓死臺城以爲經功不效然三主之好道釋但有虛名非眞好也情欲未絕不能以道治天下故有此難若眞體道正信經力匹夫匹婦亦可免難若疑死難節義不信經言則謬矣吁稱完節所以勸世述經功所以鼓舞人爲善也要知經旨不外吾身性道遇六根之賊作亂一心于道則六賊斂迹由是遇兵天爲解難老君曰甲兵不能害觀音云刀尋段段壞理之必然者語豈欺我哉功德品續二十一章若在牢獄枷鎖之中淨心定慮存念是經寃枉自伸卽得解脫此經利益豈止令賊兵自退哉若誤犯罪過在牢獄枷鎻之中清淨其心志安定其念慮存念是此眞經寃枉自然伸明卽得解脫考證牢獄所以繫罪人福善禍淫天道之常旣犯罪在獄便不能遽出如何云存念是經卽得解脫夫所謂寃枉自伸其人平日必定是善的或宿世寃愆今生運限或誤失過失他人罣誤或先亡連逮救人被陷一旦繫獄俱是寃枉不怨天不尤人素患難行乎患難絕無意想是淨心定慮存想眞經矣天相吉人寃抑自白不必分辯自然伸理不必曠日持久天下無久屈之理卽時便得解脫牢獄繫囚曰牢待對曰獄今之監倉舖厰輕重之獄不同大率止以罪人之居者爲言二字非有兩樣分别枷鎻拘攣罪人罹之者爲有罪迺變故也或云牢字從牛獄字從犬不食牛犬牢獄永免不過令人不殺生勿縱口而以味招禍也此經外之意附記之經大利益寃枉自伸卽平日有過犯罪時悔過自新絕無怨望經力拔濟久而不怠亦必解脫文王得道而聖者也羑里之囚修易經而被宥免公冶長希道而賢者也縲絏之拘尋亦得出徐神公張紫陽成道而仙者也昌邑之囚三配之苦以其篤修至道妙傳悟眞俱得解脫不惟聖賢愚人若能除去雜念永信眞經牢獄之厄自解脫解疑太古無罪人無刑獄軒轅捕蚩尤制桎梏畫地以禁刑獄之義起三代後刑獄之制全經在浩劫之先元始說於天上如何言牢獄蓋劫劫處處有善有惡惡自有孽獄之理已在經包萬法永利羣動理無不具預言拔罪之效耳釋經云念彼觀音力枷鎖早離身儒書曰君子懷刑大易云無妄之災何嘗不言獄則知經非近世之言矣迺無始玄章也要之一念理則福堂一念私則業獄慾妄滯而不除一身業坑牢獄在矣孟子云人之異於禽獸幾希牢從牛獄從犬制字者有深意焉今人與未來世著力永信此經劫劫處處牢獄俱免功德品續二十二章若爲邪精鬼賊眾苦所加如法持念是此眞經眾邪遠避自然安穩玉經神功豈但解牢獄厄哉若爲一切邪魔精怪鬼賊眾苦所加如法持念是此眞經眾邪精鬼賊皆遠遁避去自然安穩無事考證若爲卽云如爲也邪精鬼賊凡不正者皆爲邪通靈而逞妖異者爲精陰之靈者爲鬼傷人害物曰賊或云賊當作人之惡者前段已云軍陣惡賊悉自退散如何此賊字又作人看大抵邪魔妖精鬼怪乘閒伺隙因人之不正以入其來也不知何從其去也不知何歸暗施殘害令人不測故曰鬼賊上自天魔下至土精山魍魎水怪異木魅金精火妖草異禽獸之精氷炭之怪魑孽鬼靈邪屬甚眾眾苦抛磚擲瓦驚雞弄狗要求祭祀惱亂家宅或令人顚倒精神恍惚狂亂無端奔走哀號迷頑不省戲跳嘔惡咆哮淫孽醉痴損衰寢食不安日夜惶惶生非平安死有繫滯是爲眾苦加以殃來加人也如法持念是此眞經旣云邪精鬼賊眾苦所加焉能如法持念眞經此云如法非能易乃慮一乃心與道合眞誦此經但依諷經之法瞻拜禮誦一切邪精鬼賊皆遠避去一云如法持念眞經令道人替被苦者念經皆除眾邪遠避去自然安穩不待符水驅縛藥餌吿逐聞經遠避受苦者自然得安穩無眾苦嘗聞祖天師以法伏諸魔玄帝修眞滅諸精邪治人鬼薩眞人闡道除邪魔老君伏天魔佛梵咒降魔先儒范文正公宿戰場止聞小雞聲鬼不爲妖程子伏大頭鬼又任眾鬼移牀心如如不動鬼皆濳伏故云道高龍虎伏德重鬼神欽如法持念眞經秘密法典至聖眞言了鬼神覷不破之機邪精鬼賊有不遠避者乎解疑要之人身三尸五窮七魄七情六欲襍念妄想種種陰趣皆邪精鬼賊若了悟虛明慧劍誅妖欲盡而邪精鬼賊遠避矣功德品二十三章若人爲求嗣息如法尊重持念此經帝勅天曹明檢丹籍九品之內四果仙人運應數合降謫下生爲其作子才辯明慧人中尊貴經功豈但能伏諸邪哉若人因孤苦無子爲求嗣息如經中尊重經典之法持念此經上帝卽勅天曹明檢查丹書仙籍九品之內四果仙人運應輪轉數合臨世降謫下生爲其作子與無嗣誦經之人爲子多才善辯聰明智慧得人中尊貴之果求祈祝禱神以求也或令人或自求有無子息命係於天若不可求不孝有三無後爲大不可不求况人資血氣以生凡有血氣者皆可生育或虧損陰德獲罪於天或陽差陰錯命犯孤寡或胎中虛偏或欲怒自傷因而無子人定囘天至誠感格無不有子故嗣息可求嗣息繼續曰嗣或云嗣系也繼祖宗之統續如系相接也又云嗣司也司傳家之業繼口纘册也息子以繼先如人之喘息呼吸相繼不絕也且人之眞息生死之根息住不絕氣有子不絕祀故云息大抵息自心也有子萬事足可以少息此心故曰息三教聖人皆有子人何不知子息之重如法尊重是重經或云自己尊重者非也天曹造命掌仙籍者也九品上三乘中三下三共九品也釋經云九品蓮花爲父母佛菩薩圓覺聲聞阿羅漢四禪亦是九品四果仙人須陀洹斯陀含阿羅漢阿那含降謫下生仙佛以生人間爲下凡故曰降謫才才藝出眾辯口辯超羣明無不照慧無不悟人中尊貴非卽爲君爲相爲師有德有道爲完人肖子則尊莫尊乎道貴莫貴乎德天子不得而臣諸侯不得而友參贊位育裁成輔相萬代瞻仰三界推尊故曰人中尊貴如法尊重持誦此經或自己或令人求嗣雖有明效不可計日指望惟知尊經首罪謝過終始如一對此經如見玉帝至誠敬此法寶則靈章神功默運造化囘天易命嗣息自有世間功臣猶得廕子大善人信眞經轉法輪爲天地之功臣甯不克昌厥後乎若尊重此經而嗣息不建必其誠有未至終始不能如法耳世人勉之愼之自驗經之神效功德品續二十四章若婦人臨難之月如法持念是此眞經卽得母子平安生福德男女人所愛敬經法神功豈但可以廣嗣續哉若婦人生產臨難之月如法持念是此眞經卽得母子早分平安無事生福相有德之男女人所愛親而敬重女子已嫁夫家則稱婦人臨難之月當生產之際性命所關與死爲隣故曰臨難如法持念眞經或未生產時自己齋䖍念經或生產令人念經卽得母子平安該生產之候無有留難卽時降生母無損傷子亦順利平坦安康兩有所益福富貴康夀吉相之人德聖賢忠義孝友有德之人男女或男或女皆有福德人所愛敬可親而不可狎可敬而不可玩人樂就之稱之羨之如是曰愛然望之而畏心生卽之而怠心息不言而信不動而敬是曰敬解疑男爲人所愛敬可也女如何爲人愛敬若福相全德行好不嗁不戲端重寡言少動不嬉笑少而老成長而嚴潔老死不變人皆愛之如親戚敬之如尊長愛非有狎心羨其福德世之罕有也考證母子平安詩經生民之章贊姜嫄生后稷曰先生如達無災無害姜嫄有德故首生如羊子之易不災害母安子亦安釋經云母子早離身道經云臨盆有慶坐草無虞誦經功德其應如響今皇經盛行世間誦者亦有婦人生產或半產不及
