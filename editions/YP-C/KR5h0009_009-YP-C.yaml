body:
  text: 切諸經法利皆不及此是大威德者或除邪或輔正功德不能相兼不名威德今經法除邪滅罪扶正成眞是神功妙德恩威莫量故名威德能令一切枯稿便生枝葉花果茂盛者諸草諸木奇花異菓瑞芝靈香凡榮秀生類不能暢達茁育一切乾枯稿損此經便令復生枝葉花蕚果實暢茂繁盛能除眾生極重苦惱者此經消諸業利人之生拔諸罪利人之死除魔難保人快樂厯劫寃愆終身煩惱最重苦寃累世難消者此經便除其根能令短命眾生而得長夀者世人之生七十甚希此經保命延生能令世間夭折短命眾生益算延年而得長夀或云顔子亞聖年止三旬是道德無益何云經功延夀蓋死而不亡者夀卓爾見道顔子不死經云延短命之夀蓋令眾生見道死而不亡也歎莫能盡稱歎不盡也噫㓂公忠義枯竹成林田氏孝友稿荆復生聖人在上比屋可封死生快然會大道之全功德無類不及也觀經者勉焉自有最上功德應驗品續十九章若不宿植道本廣種福田乃至經名尙不得聞何况得見是經此經功德無盡矣宿夙也預也植立也樹也種也道本漸次進修入道根本道經云大道無名精修則成孔子云下學而上達佛經云從聞思修入三摩地三教皆重學問爲成道本然道雖頓悟須假漸修實非一蹴能盡可不宿世今生預加修習先植道本福田積功有效如種田等故曰福田外功則修宮觀寺院庵廟堂祠塔閣社宇橋梁道路行藥治病助國救人符濟祈禱廣嗣利生除邪去難拔苦拯貧內行則慈悲喜捨忍辱和光普惠無私堅固圓滿粗行則施財物衣食祕行則念道思眞絕欲養神積精累氣入聖超凡種種不一無量福田皆廣種之種世田者時嵗旱澇人事不齊或不成收種諸福田小則小成大則大效陰德種種若人不知若說不盡功德無量若不種諸福田無德無福不聞經名見此眞經卽爲道眼夫人之分量不同承受亦異有福無德富貴而愚有德無福淸貧而聖德福並懋禄位夀名若遇王法知見了脫非厯劫修習功德無量不能至是佛會百萬正法付之迦葉孔門三千一貫付之曾參道門法眾億萬萬萬繼太上心法文始而已觀者勉之應驗品續二十章蓋是經依三洞眞格八萬劫一傳此淸都至眞上聖所寶祕於玉京金闕甚爲微妙難可得遇如宿有仙骨當爲九天眞仙之人得遇斯文承斯緣故後當齎金寶從師吿盟受之方當承機應運乃可付焉不得輕泄敬之愼之三洞眞格者洞眞洞玄洞神此三洞品載天律金科眞格自然之數八萬劫一傳者經八萬徧元會運世之劫一云人生於寅盡於酉八時共八萬六千四百年計大數八萬餘年每年生長成收一次亦謂之一劫沙塵數也八萬劫一傳此經普轉大法非常遇也前說近是淸都上淸玄都玉京金闕非云玉帝之居迺太玄寶藏帝經之閣難可得遇不易遇此經也宿有仙骨宿世進修有成道分骨相合仙也九天眞仙之人九炁天眞上仙品也承斯緣者承此當作仙遇經之良緣齎金寶從師吿盟受之者非但齎持世財金寶吿天立誓受經獻至誠無私永劫不改之心盟心天日如白日靑天無有點塵是眞金寶不毁者也方當承機應運者方始也始當乘機會應時運付傳付此人泄洩也不得輕易泄漏經旨言不傳非人也敬之愼之者尊敬此經不可輕忽愼守此經不可妄傳噫知此經之重人人當修良緣以爲受經之地旣受永劫不可輕也寶之勉之應驗品續二十一章於是天尊重宣此義而說偈曰設使江河水波浪能生蓮慈烏毛能白如經故難遇設使龜生毛堪採爲衣服夜月能消冰如經故難遇設使蚊蠓足堪構爲橋梁能載一切重如經故難遇設使黃雀口能啣諸大山擲之他方界如經故難遇設使一葉舟力能載崑崙浮度於大海如經故難遇設使諸水蛭口能生巨齒其大如象牙如經故難遇設使蓬蒿葉能覆無鞅界癊庇崑崙山如經故難遇設使烏梟類同樹一巢棲啣食共反哺如經故難遇設使兔生角堪用爲梯磴上窮有頂天如經故難遇設使鼷鼠等緣於兔角梯至天能食月如經故難遇設使驢顔唇色如蘋婆果復能作歌舞如經故難遇設使蠅蟲等能飲鍾石酒迷荒而沉醉如經故難遇江河水深洶流巨浪不能生蓮烏鴉生來純黑不能白今言烏白江有蓮花以見絕無甚言經之難遇龜本無毛月本太陰今言採龜毛爲衣以夜月消冰只是以絕無者見經之難遇至於言蚊蠓足構橋梁載諸重言黃口小雀啣諸大山擲他界言小舟載崑崙神山度大海水蛭生象牙之齒蓬蒿葉覆無量界廕崑崙山烏梟同巢共食反哺兔角爲梯上天鼷鼠步兔角梯至天食月驢顔唇如蘋婆果色復能歌舞蠅蟲飲鍾石酒迷荒沉醉以上皆事之所必無理之所未有厯厯言之以見經之難遇夫大道人人有眞經個個全愚人蠢物皆有正性悉可化度何至如此類所絕無者擬經之難遇豈終不傳耶蓋法品不同此經最上傳之者未必如元始之眞受之者未必契玉皇之祕扞格偏執全經難曉或不聞不見或徒聞徒見功德實效語之茫然未獲全益信乎其難遇矣不畏難之難至誠有恒經功自遇應驗品續二十二章爾時天尊宣說偈已普吿四眾世間若有持是經人名功德身一切有情被其蔭故持是經人名神通身一切吉祥咸臻集故持是經人名淸淨身是諸惡業不能侵故普徧也四眾解見前有利於眾爲功有益於眾爲德利人利物曲成不遺名玄功妙德之身一切有情者世間動植凡有生之屬雖土木金石情性精魄在者皆有情覆冐曰蔭持經者利已利他利人利物若有知若無知普惠共濟一切被其慈蔭人雖至靈無有神通經中妙法至玄至神大通無礙持是眞經名神通身咸皆也臻至也集萃聚也持經人爲己則順而祥爲人則愛而公爲天下國家則無所處而不當自致之福千祥攸萃天不愛道地不愛寶人服其化物效其靈一切吉祥皆集也不染謂之淸無累謂之淨持經人萬緣俱息一疵不存名淸淨身侵逼害也自作之業天降之殃宿業今愆先亡連逮時嵗之咎命運之滯星居觸犯魔鬼侵淩人言物厲一切千傷是諸惡業皆化凶爲吉不能侵淩夫有道之士範圍天地曲成民物福履禎祥天保勿替吉人天相無災無害眞功德神通淸淨身也人亦有身而非功德神通淸淨亦不眞持經耳勉之自可以證其功效應驗品續二十三章持是經人名威德身天魔異道不能攝故持是經人名無等身上帝遙唱萬神敬故天魔異道諸天魔王魔民魔女陰暗魔鬼及阿修羅唃嘶羅魑魅魍魎精邪怪祟世人詭誕外道旁門妖孽艷異等不正道攝招伏親服也魔異侵入人迷服不覺云攝如佛門阿難被摩登伽女攝入淫房鞠愛撫摩幾毁戒體今持經人了明心印無私無爲默持眞經法力周完道高德重威德赫奕不可稱量鬼妖喪膽精怪亡形一切邪魔豈敢侵正故天魔異道不能攝阿難非不持戒一念動於摩登伽女是未悟心宗持經間斷故伽女攝入耳若非佛楞嚴經力焉復全體此皇經諸經之王也受持威德甯不萬倍於他經哉無等身無等倫儔類之身言眞持經者最上無與比卽釋經云一切無如佛儒書云夫子之不可及也猶天之不可階而升也上帝非玉帝也諸天上帝也遙遠也唱樂世有進道之人天音宣贊也一云謠唱是作歌謠之謠於理未妥不可從蓋世間生男萬神唱恭生女萬神唱奉上帝好生諸天稱慶有道之人誠格天地動鬼神與天合德諸天帝歡慶但諸帝甚尊與他神不同萬神非一神所指者廣一切諸神雖有崇卑皆重道典遇眞持經有道之人故無不敬也夫人性剛明中和比肩元始本有大威德無等倫也惟不禁情欲故邪入而神不敬也吁子夏賢者也出見紛華勝麗而說非夫子眞儒之教焉能成高弟哉人能一眞無僞永成道矣應驗品續二十四章持是經人名堅固身惡劫大難不能損故持是經人名道藏身口出語言鬼神仰故世人生死無常輪迴不知或小功小德福緣身世或小根小乘果位有限或明而未了易蔽易欺或行而未成易得間斷或度人濟物分量易窮身如萍燭難當風浪非堅固也眞持經者心不退轉名堅固身惡劫大難者或小劫中劫大劫元會運世三界滅轉之劫物絕人盡地傾天壞四輪相觸五行並尅水火風災侵壞世界萬象空諸法盡諸乘果四禪界三階九品官神將吏悉入輪迴䝉再造難眞持經者得大堅固超出劫數永不退轉惡劫元運宿業災魔意外大難毫不能侵貞達常變億世如一不能損也藏藏也臧也道無所不包無往不善道藏無有不載無用不臧人身雖有限性無不備但不盡道所以不成道身眞持經人淵存海含法藏中包無量世界故名道藏身答述曰語自言曰言人亦有言鬼神不仰蓋詞不誠口過生尤且不免何以感人神鬼神乎眞持經人言焉誠信出之有章不躁不隱不失人不失言或一言續千眞之脉或一言開萬代之傳或一言拯人物之溺或一語破死生之關或一言盡天地之道或一語括萬法之玄或一言悉鬼神之情狀或一語明劫數之升纒一言而滅罪福一語而露金丹三教眞宗在經一言人物共寶鬼神所不識也誰不欽仰哉鬼神仰故云爾已矣夫三教大聖人厯劫不退轉言語天人所共崇堅固道藏之旨可徵已一持經者何遽至是蓋一得永得理之實驗人惟不眞持經耳眞持如何心齋爲本神化成之
