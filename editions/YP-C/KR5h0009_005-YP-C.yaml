body:
  text: 爾時當元始天尊說盡神通品之時天地開始之祖五方五靈五老上帝叩拜稽首俯伏長跪上白元始天尊言伏聞高上玉皇大慈憫念世間蒼生普徧放出大神通無量眞光照燭三千大千諸天諸地一切法界天人魔獄餓鬼畜生等六樣凡品以至最上一乘與夫上中下乘四等仙眞佛神志士之四聖普徧叨䝉大道慈光蔭庇竊以凡夫不夀世景短促法界劫運將次告終仙眞正道宜當傳行以濟億兆之民使希仙修眞之子有了脫之期得以輕身冲舉末代烝民無有夭折俱獲夀考夫人生世間命有定數三教聖人皆蛻骨塵世顏子大賢三十二嵗而卒皇經雖有利益豈能違大造之數而使人長生哉是不然人之身可死人之生理不死道理不明雖生世上其心已死偷生苟免何足言夀若明了道理悟徹行成還虛脫化則朝聞夕死無復遺恨卽是長生故道德經云死而不亡者壽孔子云人之生也直又曰仁者夀釋經云若人了證湼槃卽見如來是名金剛不壞三教至人不以死爲死以不明道爲死不以生爲生以了道爲生造化之數雖生死難逃可拘常人而不可拘聖人玉皇尊經演自元始最上一乘妙法三敎之眞宗萬法之玄訣法界之慈航生死之要關成住壞空之秘旨傾劫之機括超證坦途度世妙品解結拔罪之津梁也至尊若爲慈演經文烝民一蒙聖恩承神光力皆得皈依正法不落邪徑生死無愧能令短命眾生而得長夀是經神功有若此者右上卷神通品至聖天宮妙化三教聖眞皆不易及故列第一見傳此眞經神化之自此卷首列神咒品以經中秘法語能度人錄仙制星制魔制水鎭五方濟法界故曰神咒有神通而法語秘文若是利益斯繼神通而第一云神咒品二章自昔元始洞玄靈寶赤書玉篇眞文生於元始之先空洞之中天地未根日月未光幽幽冥冥無祖無宗無氣無象無色無名無形無緒無音無聲混沌太無靈文䁆藹乍存乍亡靈圖開化玄象推遷結氣浮空乘機應會玉帝眞誥靈寶秘篆無上大不可思議神咒於是存焉天地始祖五老上帝言玉帝尊經之正道能令末代烝民獲夀考因何有此大功效自昔元始洞玄靈寶大赤天書碧玉琅篇之眞文生於未立法界元始本初之先大空洞虛之中兩儀不曾分太極無極之先天地未立根基陰陽水火不曾肇孕未有日月光明混混茫茫何所分別幽幽冥冥而已萬象未生孰爲之先不見造化之元是無祖無宗玄虛太空不見其氣無有形象無著見之色無字稱之名無形影無端緒無影響沖然漠然眾音何有眾聲何有無音無聲也無涯無際混沌太無元始洞玄靈寶赤書玉篇之眞文靈秘文光䁆然雖不明見藹然文著端倪乍存乍亡非有也非無也非有有無無有而未嘗有無而未嘗無也元始靈運玄圖開張萬化玄元妙化之象推轉運遷結妙梵之氣徧浮虛空乘玄運之機應天人叨蔭正道宜行之會玉帝寶誥靈寶秘密天篆無上功德不可稱量大不可思議神咒於是顯秘著象而妙法存焉赤書玉帝眞經妙有之文皆諸天太初梵氣結成字文廣長一丈色光赤煥爲丹天大赤金書玉篇九天之上皆碧瑤之篇元始洞玄靈寶之文寶霞玉潤故云玉篇生於元始之先迺天地本初之先非元始天尊之先天地未根非天地無生化之根天地生於虛無元始眞文在三千大界未立之前浩劫之先故未見天地肇分之根乍存乍亡存而不可定其象亡而未嘗滅其眞玉帝眞誥皇經妙典慈濟無窮厯浩劫而無量徧三千大千而莫盡諸天奉行三敎遵依是傾劫法界之誥命也靈寶秘篆天書雲篆非易聞見不可思議不可以心思不可以言議言莫量也於是存焉玉經眞文在浩劫先非自今日存也未乘機應會時道涵太虛夫有何形孰從而見雖存而莫知其存也今正道宜行靈文彰秘神通光明於昭炳顯故云於是存焉眞經妙法之存乘機應會是難遇之時也在斯會者肯自負而不求法誨乎神咒品三章故天地得之而分判三景得之而發光靈文鬱秀洞映上清發乎始青之天而色無定方文勢曲折難可尋詳元始鍊之於洞陽之館冶之於流火之庭鮮其正文瑩發光芒洞陽氣赤故號赤書靈圖旣煥五帝朝眞飛空步虛旋行上宮燒香散花口詠靈章是時天啟十二玄瑞地發二十四應上慶九天之靈奧讚三天之寶明神風旣鼓皇道咸暢元始登命太眞按筆玉妃拂筵鑄金爲簡刻玉爲書五老掌錄祕於九天靈都之館玉女典香太華執巾金童侍衞玉陛朝軒九天玉書非鬼神所聞惟玉經眞文靈寶秘篆於是存焉故太極生兩儀清浮爲乾濁凝爲坤天地得之而分判日曜輝月呈華星列張三景得之而發光眞經靈文鬱然浮其瑞光秀氣洞然光映上清境界發乎始青最上之天而色無拘定方所靈文光曜之勢充周曲折難可尋究測詳元始天尊鍊此眞文於洞陽重玄之館鎔冶此經於流火大梵之庭鮮其正文光燿無方鮮其大正妙有之文瑩然騰發光芒洞陽妙氣溢丹流光純然大赤故號赤書靈運玄圖旣煥光明五帝朝元至眞乘雲御瑞飛空步虛旋繞行朝最上宮闕燒清淨自然眞香布散天花口中讚詠靈文寶章是時天不愛道元辰獻祥天啟十二玄瑞地不愛寶二十四氣粹顯佳禎地發二十四應上慶九天之靈文奥旨讚揚三天之寶章昭明妙典神通風教旣鼓度世之機皇道咸暢大法普惠一切元始登座錫命太眞上仙按筆以書玉女靈妃拂蕩法筵鑄不毁之金光以爲玄策秘簡刻碧玉之玄霞以爲丹書五方五靈五老職掌謄錄秘藏於九天太靈玄都之館玉女則典司天香太華眞人則執持玄巾金童侍側周衞瑤堦玉陛朝軒九天玉字丹書非一切鬼神所能聞有天地而後有文字傳諸經今言皇經存而後天地分判人聞此語多疑惑不省蓋道之自然相循不息迺爲眞文道之不壞迺爲眞經元始在浩劫先皇經之理已在眞文無字妙化不窮故天地自此判三光自此開景也此是實理又何疑文勢曲折有以文字作支字者非是鮮其正文有以鮮字作解字者非是瑩音盈或作巽字信字讀者非是玄經無象何云金簡玄光妙象傾劫不毁故云金簡玉書玄文光瑞潤麗尊嚴故云玉書非鬼神所聞皇經玄秘鬼神不識非常聞非易聞非凡聞能知者神咒品四章故天寶之以致清地秘之以致甯五帝掌之以得靈三光乘之以高明上聖奉之以致神高靈尊之以致眞五嶽從之以得鎭天子得之以致治國祚賴之以致平實靈寶之妙德乃天地之玄根威靈恢廓普加無窮蕩蕩大化爲神明之宗其量莫測巍巍乎太空是時元始革運玄象開圖靈文鬱秀神表五方分判天地開化萬靈此玄宗之寶可得暫披於靈韞乎九天玉書皇經非鬼神所聞妙法難聞若此故天位乎上也寶重此眞經得眞一以致常清地位乎下也秘持此眞經得眞一以致常甯五方五帝掌此秘文以得神通而成五靈日月星三光乘此眞經妙法以崇高懸象著明上聖至人奉持此眞經以至於聖不可知而神高靈神部尊崇此眞經以至眞聖之位五嶽名山聖帝從此眞經之力而不崩壞以得安鎭君天下之天子得此眞經妙法以致四海無虞之治國家祚業賴此眞經以致安平實靈寶眞宗之妙德乃天地之眞宗玄根此經天威靈通恢然莫量廓爾無際浩劫法界一切利益無盡是普加無窮坦坦平平功化無象而無方誠蕩蕩大不可量之神化爲神明之眞宗其功量莫可測識無象無宗巍巍莫及而太空是時元始天尊革太混之運玄光妙象開闢靈圖靈文鬱茂光秀辨位化形神表東西南北中之五方分判上天下地開化法界萬靈一切品類此重玄眞宗秘寶可得暫爾披瀝宸訓開闡無上眞宗之靈韞乎皇經道家語本以修證仙品不言齊治均平此云天子得之以致治國祚賴之以致平何也蓋以道化成迺爲治平悟眞宗明大道則不言而信不動而變無爲而成德盛化神永利無疆故云致治致平妙德本無所得不見施與自然功化無窮故云妙德若夫玄根一切根皆有象道生天地雖有無極太極生兩儀之圖太極本無象眞者見不得言不得畫圖不過假像教人天地之根有何實象雖無實象其實循環無盡故曰玄根威靈三教聖神不敢慢妙化無邊故曰威靈神明之宗諸聖宗法又云千神萬聖從此出也太空不見其前不見其後恍惚不可爲象故曰太空革運或云革將終之運非也此經在浩劫先是革太混運耳神表五方混沌本無分辨方位別中外實道妙化故云神表五方神咒品五章今皇道敷暢澤被十方仰觀劫運眞風宜行臣心實欲使靈蔭八遐風灑蘭林寒條仰希華陽之繁朽骸䝉受靈奥之津明眞有格今當以行仰對元慈下伸丹懇惟願哀憫俯念蒼生不審靈寶玉篇眞文可得見授下教於未聞者乎玄宗之寶冀暫披於靈韞以今時大道敷布暢達慈恩徧徹於四正四隅上極下極澤被十方矣仰觀劫數氣運正道眞風宜當推行臣心實欲使靈寶法惠蔭覆一切方所世界盡八遐之遠道澤惠風蕩灑蘭林寶香玄苑世間沈滯異類傍門天魔外道有情無情不聞正道者皆䝉眞經之濟如稿然無生意之寒條仰希和煦霑潤華陽之繁滋已枯使榮朽毁骸骨䝉受靈文奥典之津澤明眞上仙有度世金格今當以行世間仰對元始大慈下伸丹誠懇祈惟願聖慈哀憫俯念蒼生不審靈寶玉篇眞文可得見授世間下教於未聞者乎十方非此個小十方盡三千大千世界之十方劫運從劫至劫終始相循劫劫此眞經濟世非止一劫一運八遐盡三千大千之遠不止言目前八方之遠蘭林香寶華林天地人物有此正理皆有此林人物昧之而不見上聖眞仙此林寶光風灑惠浮此林恩及一切澤濟無方矣寒條人物神鬼不明正法如同槁木聞眞經了悟是枯木再榮朽骸人物神鬼不知正道雖生如死聞眞經超脫枯骨再生靈奥之津迺潤澤之津明眞玉帝明封諸眞丹懇竭盡丹哀懇祈至聖蒼生以玄首黃髮老而皓白蒼然無恒故言蒼又云蒼天所生之民又云蒼生眾也靈寶玉篇眞文俱解見前見授祈天尊傳授此經下教法界一切神人鬼物而度拔未聞此經者可得見授下教於未聞者乎迺謙疑未定不敢執言恐至尊妙法不易傳授故先懇祈又作未定之詞以見求之切而尊崇之至也神咒品六章於是元始天尊撫几高抗凝眞遐照觀時已至普爲時會一切眞聖論定陰陽推數劫會移校河源檢錄天度選擇種人指拈太無嘯朗九玄念無開聽於陳辭有若閉礙求眞之路是時五老帝君啟問不已良久元始天尊乃垂盼眥之容慨爾歎曰微乎深哉子今所扣豈不善乎此元始靈寶之玄根空洞自然之眞文生天立地開化神明施鎭五嶽安國康民靈寶玄妙爲萬物之尊天啟玄瑞靈應自然靈寶眞文宜下教未聞於是時元始天尊撫循玉几卽寶座巍崇道體高抗不俯密凝至眞默張大智遐照今昔過去未來定觀開度之時已至普爲時會六緣共際諸法界皆當吉時佳會一切世界天眞至聖論定陰陽貞元之會推生化自然之數大小劫運元會移校河源水帝檢察攷錄天數期度選擇修因善種之人指拈眞玄太無嘯咏朗吟九品玄章念天地始祖五老上帝所陳懇祈傳法之辭若不開慈聽許有若閉塞阻礙修道求眞之路是時五老帝君懇啟請問不已時過良久元始天尊乃開慈顏聖目俯燭垂盼眥之容慨爾嘆曰微妙乎淵深哉子今時所扣問豈不善乎此元始靈寶之玄根空洞妙化自然之眞文生乾天立坤地開化諸世界一切聖眞神明施鎭東泰南霍又名衡西華北恒中嵩之五嶽安厯代之國康平法界之民靈寶玄微奇妙爲萬物之最尊天啟玄瑞地發禎祥諸靈效應皆出自然撫几撫凭玄化玉几非几案也高抗非自高自抗以巍然道身玄範巍巍不動故云高抗遐照有刋作想字者非是論定陰陽推數劫會上眞至聖非拘於數大道不容輕傳時本自然聖教無有强聒移校河源檢錄天度下自諸水上及諸天一切世界諸類羣生皆度也選擇種人非止說於善類教不揀擇以眞經說與善類則諸類皆䝉恩指拈太無道本大無如何拈出元始至尊說此眞經迺最上一乘三教眞宗虛無重玄令人聞之了悟是云拈出九玄或作九九重玄亦通盼分目開眸垂光目際故云盼眥又云眥目睢也盼或作盻非是元始至聖如何稱天地五老之問爲善請問眞經知其利益時會智見深遠微妙故稱善開化神明道生諸仙神佛等其餘解見前眥音姿又音子神咒品七章今三天盭運六天道行雜法開化當有三萬六千種道以釋來者之心此法運訖三龍之後庚子之年雜氣普消諸天慶會吾眞道乃行今且可相付當錄於上館未得行於下世玄科有禁不得妄傳子可詣靈都紫上宮聽天音於金格視俯仰於神王然後當使得受天文以總御元始之天也盭魯第切眞經若傳天啟玄瑞靈應自然今何時哉三氣丹天盭更氣運六六諸天一時道行雜說小法開度教化當有三萬六千種門頭道理以解釋來求道者之心此法運化已訖三龍龍漢等三劫之後庚子之年貞元會運襍氣普消諸天慶宵時會吾眞道正法乃行今暫且可以相付當錄載於上玄天館未得行於下塵凡世玄科天律例有禁戒不得妄自輕傳子可躬詣太靈玄都紫微上宮聽聆天音旨宣金格傳度期數嚴重之勅視俯仰於仙神天帝將吏天王知此法典貴重利益然後當使得受眞經天文以總御元始統化之諸天也盭音立作盭字非是或作整字亦不是三天青赤禹餘三炁之天六天欲色無色輕塵細塵輕染細染等天帝神人大中小三乘演教各品道行雜說小法開示化度三萬六千種道人身有三萬六千神氣清濁强弱不同有正信者有邪見者根器各別學焉而得其性之所近故有大乘有小乘是有三萬六千種道以釋來者之心應來求道者之心機一云應當來之心機各就相投相信者以受持故了悟者言渙然氷釋是釋字無疑或作擇字者非也三龍龍漢初中末三劫一云龍漢龍康龍徵雜氣普消時將泰妖氛息諸天慶會諸天皆當吉時盛會一云諸天喜慶法會玄科天律有自然之禁雖道不擇人語非其人褻天寶且失言所以三教聖人得其時得其地得其人迺說法傳道金格考較玄格功過等律也視俯仰於神王仰視仙眞俯視天王神將總御元始之天總領統御元始所化諸天一云視與示同示俯仰於神王示仰承俯聽之義於神王統御元始之天統會諸天近御法駕於元始最上之天二說俱通神咒品八章於是五老帝君與諸眞聖清香執戒徘徊雲路嘯命十方上詣上清太玄玉都寒靈丹殿紫微上宮受俯仰之格乃知天眞貴重難可卽聞還乃更詣元始道前諮以禁戒之儀遜謝不逮聽天音於金格然後得受天文眞經於是五方五老帝君與諸天眞聖清著眞香執守道戒周步雲衢往還導度逡巡徘徊雲路嘯咏宣命十方聖神上詣上清太玄玉都天宮妙界寒靈丹陛寶殿紫微上清玄宮受領俯仰之格乃知天文眞經尊貴嚴重難可卽得聽聞還乃更詣元始道前諮問以禁戒之儀遜謝智見不及清香迺性眞天香清淨自然香無爲正妙道德眞香非世焚香等也執戒玄範巍肅如對道祖守天尊法戒徘徊慈接無窮玄光法駕周命十方雲路之際先儒云天光雲影共徘徊卽此意耳非世間逡巡往來不止之比也嘯命十方嘯音笑讀作勅或作秀字讀者非也蓋肅然出令爲嘯非吟笑之義十方不言十靈寶但言十方神部爾上詣仙眞朝元受法玄光默昇恭聆玄誨非凡足踵躡踐登之義寒靈丹殿九天之上無聲氣日月不能及天光自照廣而無量清而寒肅丹殿太赤玉光故云然紫微上宮紫霄之上太微天中上清玄宮也非日月天端世所稱紫微垣之宮太微垣之宮也俯仰格解見前難可卽聞非云難以卽時得聞但言難以聞而卽知一云玄都掌經者不使卽聞還迺更詣元始道前更囘來九天上謁元始至尊諮以禁戒之儀諮解見前請問天律禁戒傳法受法之儀則禁禁令戒戒條也遜謝不逮非謝不能守禁持戒但謙遜言身雖神眞法寶眞經素未悟入一時聞之智見不逮此正天地五老眞知道法之尊處非自限止言不堪受此也天下諸類皆有理皆可聞道故四靈之物各拔其萃人爲萬物之靈神爲出世之品豈不能聞道乎故顔子平日聆受夫子之教不違如愚相說以解卓立之後云雖欲從之末由也已文殊諸佛傳釋迦正法眞宗一事聞者𤢜𤢜與此語義一般持此經者識得天地五老委曲推尊經旨之意則知道矣神咒品九章是時天尊慈顏愍諭靈關廓開登命五老帝君開洞陽玉館披九光八色之韞雲錦之囊出元始靈寶赤書玉篇眞文金書玉篆微妙秘密運御乾坤大光明圓滿大神咒玉章宣付五老帝君是時五老帝君拜受已及諸天聖眾稽首禮謝天尊玉帝仰奉道旨按法以傳五老帝君與諸眞聖旣遜謝不逮矣是時元始天尊大慈天顏矜愍誥諭靈關廓然開化登命五老帝君開玄天洞陽玉館披開九霞光八景色之韞雲錦之囊出元始靈寶赤書玉篇眞文金書玉篆淵微玄妙秘密奧旨運化統御一切世界乾坤無量大光明圓滿大神通秘咒玉章宣布付與五老帝君是時五老帝君拜受此法已竟及諸天聖眾稽首禮謝天尊玉帝仰奉元始道旨按此經金格正法以傳諸界神人愍諭愍卽大悲諭開誘也或云當作和愉色非是靈關廓開藏經之天丹靈玄關廓然洞開一說洞開聖衷開心見誠一說聖目流光靈關廓開俱通登命登進五老帝君使近前而親命之也洞陽玉館九天玄館大洞無礙永明無暗非瓦石土木玄光妙景虬文奇錯碧玉之章故云然九光解見前八色太青太赤太黃太白太玄葱蒼碧玉紫金等色也韞經之藏處玄光無邊際盡含於此也披開啟也雲錦之囊雲霞天錦道化自然光結非天孫之織錦也有底曰囊經注於此諸神不測故云然非人間布帛皮革比也靈寶至乾坤等五句俱解見前大光明三教眞文俱稱法寶所在有光明諸教經書光明有限惟此皇經法徧三千大千傾劫不盡故曰大光明圓滿聖心慈濟無窮力不能及是有限量有虧欠故佛下不能化北極盧州上不能化自在天人難稱圓滿皇經包萬法貫諸乘功化無量無盡雖云道不瀆不强聒道化自然諸類終始循環無有不化於道者故曰圓滿神咒玉篇諸眞法宗諸神玄訣度世要旨諸教神通皆不外此尊重莫踰故云然一考人性悟道浩劫難忘如囊注物不漏悟入之初如囊口故注經言囊天尊有連上句讀者言禮謝元始天尊有連下句讀者言玉帝爲諸天之尊後說可從餘解見前神咒品十章東方安寶華林青靈始老蒼帝所受神咒誥命東方九炁始皇青天碧霞鬱壘中有老人總較圖錄攝氣舉仙右度人錄仙青帝秘文二十四字書於九天元臺主召九天上帝校神仙圖錄嵗星輔肝角亢鎭眞氐房心尾四景囘旋箕主七辰正斗明輪承氣捕非掃除災羣右制星秘文三十二字書於紫微宮東華殿主召星官正天分度東山神咒攝召九天赤書符命制會酆山束魔送鬼所誅無蠲悉詣木宮敢有稽延右制魔秘文三十二字書於東華玄靈之館主攝鬼魔正九天炁下制東河溟水神大劫洪灾蛟龍負身水府開道通逕百千上帝赤文風火無間右制水秘文三十二字書於九天東北玉闕丹臺主攝東海水帝大劫洪灾召蛟龍及水神事東方九炁靈寶赤書玉篇眞文合一百二十字皆太上無上大光明圓滿大神咒空洞自然之書一名生神寶眞洞玄章一名東山神咒一名青帝八威策文右玉皇誥命以錫東方安寶華林青靈始老蒼帝九炁天君令統御東方諸天諸地日月星宿名山靈洞水府泉宮上聖高尊眞仙聖眾一切威靈符命所臨如誥奉行玉帝仰奉道旨按法以傳眞經神咒其意云何五老帝君東方爲首東方木德安寶華林青靈始老蒼帝所受神誥命右東方九炁至攝氣舉仙六句迺度世拔人校錄神仙青帝秘密靈文二十四字書於九天元臺主召九天上帝校神仙圖錄皆仙梵秘言不敢細解嵗星輔肝至掃除灾羣八句迺制星秘文三十二字書於紫微宮東華殿主召木德星君正天分度東方神咒至敢有稽延八句迺制東方諸魔秘文三十二字書於東華玄靈之館主攝鬼魔正東方諸界九炁下制東河至風火無間八句迺制東方諸水秘文三十二字書於九天東北玉闕丹臺主攝東海水帝大劫洪灾召蛟龍及水神事東方九炁靈寶赤書玉篇眞文合一百二十字皆太上無上大光明圓滿大神咒空洞自然之書一名生神寶眞洞玄章一名青帝八威策文以上不可解故重書原文右玉皇誥命以錫東方安寶華林青靈始老蒼帝九炁天君令統御東方諸天地日月星宿山洞水泉仙聖一切威靈符命所臨如誥奉行如誥者東方天地水一切神祗皆欽遵此命無不奉行此玄章悉天地人物大德青靈之秘魔鬼喪膽度劫免灾諸聖不敢違故永鎭東方諸界神咒品十一章南方梵寶昌陽丹靈眞老赤帝所受神咒誥命南方丹天赤帝玉堂中有大神號曰赤皇上炎流煙三炁勃光神仙受命應會太陽右度人錄仙赤帝秘文三十二字書於九天洞陽之館主召九天神仙圖籙金名熒惑輔心井鬼守房柳星張翼統御四卿軫總七宿囘轉天常召運促會正道驛行右制星秘文三十二字書於三炁丹臺主召星官明度數正天分赤文命靈北攝酆山束送魔宗斬邪滅根符教所討明列罪原南山神咒威伏八方羣妖滅爽萬試推亡右制魔秘文四十字書於西南陽正玉闕主制北酆正鬼炁南河水帝太伯龍王神咒流行普掃不祥洪水飛災止蛟召龍開除水逕千道萬通敢有千試攝送火宮赤書所告莫有不從右制水秘文四十八字書於西南陽正玉闕主攝南河水帝大運交期洪水四出召蛟龍及水神事南方三炁靈寶赤書玉篇眞文合一百五十二字皆太上無上大光明圓滿大神咒空洞自然之書一名南雲通天寶經一名九天無上之上咒一名赤帝八威策文右玉皇誥命以錫南方梵寶昌陽丹靈眞老赤帝三炁天君令統御南方諸天諸地日月星宿名山靈洞水府泉宮上聖高尊眞仙聖眾一切威靈符命所臨如誥奉行東方誥文永鎭東方矣南方梵寶昌陽丹靈眞老赤帝所受神咒誥命云何南方丹天至應會太陽八句迺度人錄仙赤帝秘文三十二字書於九天洞陽館主召九天神仙圖籙金名熒惑輔心至正道驛行八句迺制星秘文三十二字書於三炁丹臺主召星官明南天之度數正南天之分野赤文命靈至萬試推亡十句迺制魔秘文四十字書於西南陽正玉闕主制北酆正鬼炁南河水帝至莫有不從十二句迺制水秘文四十八字書於西南陽正玉闕主攝南河水帝大運交期洪水四出召蛟龍及水神事南方三炁眞文一百五十二字皆太上大光明圓滿大神咒空洞自然之書一名南雲通天寶經一名九天無上之上咒一名赤帝八威策文右玉皇誥命以錫南方眞老赤帝三炁天君令統御南方諸天地日月星宿山洞水泉高仙聖眾一切威靈符命所臨如誥奉行度人錄仙盡南方一切世界制星盡南方一切天制魔盡南方天地人物一切魔制水盡南方一切水帝神物以上制南方一切誥盡一切世界之南方厯浩劫永鎭三教大聖亦不能違玄章秘不敢解原文重記示尊崇玄秘也以此制心自得其秘以此䖍誦默持悉有至徵神咒品十二章中央玉寶元靈元老黃帝所受神咒誥命中央總靈黃上天元始生五老中黃高尊攝氣監眞總領羣仙典錄玄圖宿簡玉文催運上炁普吿萬神右度人錄仙黃帝秘文四十字書於太玄玉寶玄臺主召神仙玉簡宿命總仙炁鎭星輔脾迴度北元魁𩲃主非截邪斬根𩵄䰢魓𩳐掃穢除氛魒正玄斗明度天關九天符命金馬驛傳右制星秘文四十字書於玄都玉臺主攝星官正天分數中黃總炁統攝無窮鎭星吐輝流鍊神宮勅攝北帝遏塞鬼門翦除不祥莫有當前右制魔秘文三十二字書於玄都玉臺主攝北帝正天氣檢鬼精中山神咒召龍上雲制會黃河九水河源不得怠縱善惡悉分千妖萬奸上對帝君莫有干試太陽激燌赤書玉字宣吿普聞右制水秘文四十八字書於玄都玉臺四壁以攝中海水帝四泉之水洪災湧溢之數主召水神止蛟龍中央一炁靈寶赤書玉篇眞文合一百六十字皆太上無上大光明圓滿大神咒空洞自然之書一名保劫洞清九天靈書一名黃天大神咒一名黃帝八威策文右玉皇誥命以錫中央保劫洞清玉寶元靈元老黃帝一炁天君令統御中央皇天后土日月星宿名山靈洞水府泉宮上聖高尊眞仙聖眾一切威靈符命所臨如誥奉行中央玉寶元靈元老中主黃帝所受神咒誥命中央總靈至普吿萬神十句四十字迺度人錄仙黃帝秘文書於太玄玉寶玄臺主召神仙玉簡宿命總仙炁鎭星輔脾至金馬驛傳四十字十句迺制星秘文書於玄都玉臺主攝星官正天分數中黃總炁至莫有當前八句三十二字迺制魔秘文書於玄都玉臺主攝北帝正天氣檢鬼精中山神咒至宣告普聞十二句四十八字迺制水秘文書於玄都玉臺四壁以攝中海水帝四泉之水洪災湧溢之數主召水神止蛟龍中央眞
