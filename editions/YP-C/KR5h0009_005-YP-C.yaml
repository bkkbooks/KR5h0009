front:
  text: 重刋道藏輯要高上玉皇本行集經註解卷之中太上大光明圓滿大神咒品第二神咒品第一章爾時天地始祖五老上帝稽首長跪白天尊言伏聞高上玉皇慈念蒼生普放神光照燭法界六凡四聖普叼道蔭竊以凡夫短景劫運將終正道宜行以濟兆民使修眞之子有期輕舉末代烝民俱獲夀考
  hash: sha256:f9c96a61894324e9ee5ffb6529bfa5f1677dfc44ddcd23520738e47b54f514a5
