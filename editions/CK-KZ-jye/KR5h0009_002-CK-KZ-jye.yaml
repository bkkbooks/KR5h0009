front:
  text: 良緣祖天師云淸微天宮超絕三界塵染悉淨虛玄明妙微不可窮居三淸境是大天宮玉帝居也元始演經御此妙界至聖妙用運化無方不可測識經演此義爲最上品非神智妙慧不能明了故曰神通品第一愚按古義云妙化不測之謂神周貫無遺之謂通迺五品之冠三卷之宗丹臺契此全經可曉
  hash: sha256:f6fa622a51d13cd3cfe844b83f57bd03351a68c6aab7b9390d8328641e5559cb
  markers:
  - {type: head, offset: 2, content: '淸¶<md:KR5h0009_HFL_002-001a>¶¶¶<md:KR5h0009_HFL_002-001b>¶¶微天宮神通品第一', id: KR5h0009_CK-KZ-jye_002-h1, level: 1}
body:
  text: 爾時元始天尊爾時者無極分景之初太玄開化之始萬聖良緣妙際此經將演之時也元大也首也始初也萬聖闡化肇端於元始故曰元始天尊在淸微天中淸微天解見前玉京金闕紫淸白眞人云玉帝所居白玉爲京黃金爲闕非世金玉神通妙化碧天瓊琅莊嚴宮城故曰玉京金闕七寶玄苑白眞人云七寶者碧土瑤階琉璃宮虬文壁白玉城丹闕金色徹照光迺號七寶一云玻瓈水晶珍珠瑪瑙珊瑚琥珀硨磲玄苑重玄秘苑也玉皇宮殿陞光明座張子房云元始時臨御玉皇殿陞大光明玄聖之寶座與無鞅數眾宣說靈寶淸淨眞一不二法門子房云元始登座無量眞聖來集故曰與無鞅數眾宣明玄靈妙寶淸淨無染至眞玄一秘妙無間無雜不二之法門十方集說云人之元神性命之宗是大天尊淸微天界身固有之玉京金闕七寶莊嚴人人本具而性命陰陽神氣精又身之七寶則琅庭玄苑天人一致天君泰然則玉皇光明之座可陞百體從令凝神會道卽天尊御座與無鞅眞聖宣靈寶淸淨眞一不二之法門也然道無形迹了悟明徹秘臻妙境若大路然入之有自矣故曰法門是時是元始陞座之時玉皇尊帝尊帝其崇無比故云然與諸天眞飛天大聖無極神王靈童玉女九千萬人淸齋建節侍在側焉子房云與同也諸眾也玉帝同眾天仙眞人妙運助化昇度神通飛天之大聖三千大界無量之外諸天地無極方之神王少陽梵氣應感侍啟之靈童少陰梵氣宣化傳奏之玉女大計九千萬之神人不露神光歸眞元始淸齋持建寶節侍列於元始光明座之傍天猷副元帥云人身有眞主元神靈通不拘亦有飛天大聖神氣扶衞一身無間隙處亦有無極神王少陽之玄光少陰之靈運亦有靈童玉女心同於道則陽剛大數亦云九千萬身神朝元淸齋無貳爾心建節身無惰儀管見云人與天地一般當淸明不雜元神御極之時果如顏子之心齋如法家之持幢唱恭無二則從令天君而道得矣于是于是就此際會也玉帝知時欲至卽於會前舉六通力放大光明遍照諸天無極梵刹一切境界皆大震動十方無極一切世界俱同瑠璃玻瓈無有隔礙梓潼云玉帝知道開玄光文明將啟演法傳經之時欲至卽於盛會前彰舉六通之法力放普照最大之光明遍照無量天無窮極諸天帝神眞所居之玄梵宮刹一切神御之境界皆大震驚而竦動盡十方無極量一切仙佛之世界俱同瑠璃玻瓈之寶光明瑩徹盡照畢見無有間隔滯礙不見之處張紫陽云六通視通聽通神觸通神會通夙神通預照通卽佛家所謂天眼等六通也梵刹仙帝神居妙麗天上不依階塵未嘗毁壞巍然不拔凡目難見故曰梵刹一切境界各神所居之境其境之界一切世界不止人間諸界天境亦謂之世瑠璃雖有形光而乘物畢見玻瓈之寶無有漏脫而物無不見玉帝光明射盡諸界幽闇悉輝豈有隔礙以如字言者恐人不省故比喻而論耳管見云人性光明本無不通以元神失主故有隔礙或聞不見或見不聞或知不言或言不知或蔽人已或惑先後茲不能六通也若了徹性命元神時御則普照天人表裏洞觸紫府丹臺黃庭玄界身神故址本有天垣皆光耀晃輝無有遮滯盡被光明豈非玻瓈瑠璃之載物無隱障耶雖然道固本明明之非易未知不可强已知不可惑不先不後了悟實難人能如玉帝觀時至而顯光復日新而常泰則大光明終不晦道其永彰矣十方聖眾並乘五色瓊輪琅輿碧輦九色玄龍十絕羽蓋雷祖云十方四正四隅及上下也聖眾十方眞聖神眾也覩玉帝所放光明並皆乘駕五采文色瓊玉之輪琅秀華輿蒼碧寶輦九色華光玄龍十絕無倫之羽蓋白玉蟾云五色靑黃赤白黑也輪車之兩輪輿車也輦帝王車駕之總名九色靑色赤色黃色白色黑色紫色碧色太玄色金光明色玄龍有龍光象不見形骸十絕十極所無神奇絕倫靈鳳祥鸞之羽蓋道經云羽蓋卽高柄羽扇一云神仙帝眞輦行時有瑞羽法節以爲之蓋後說尤妙管見云人秉五行金木水火土之元靈各有法寶仙眞道成諸寶擁隨法駕人能默朝上帝效法於天身中神集正氣呈秀瓊玉輪琅玕眞碧寶輦九氣靈色玄化之神龍十絕無儔之羽蓋皆在一身中矣豈獨天地神聖有哉噫惟眞得者知之麟舞鳳唱嘯歌嗈嗈靈妃散花金童揚煙讚詠洞章浮空而來虛靜天師云聖眾駕行有麒麟導舞鳴鳳和唱嘯聲和雅其歌嗈嗈天靈妃御散布瓊花隨侍金童輝揚祥煙讚唱歌詠玄洞寶章同護神駕浮淩虛空而來帝京十方人云神帝行駕有靈童采女歌隨麟舞鳳唱侍衞童女舞唱效麟法鳳也故曰嘯歌嗈嗈此說太鑿神駕行有麟鳳卽今帝乘御看馬之類况道經有云天帝行時龍翔鳳舞蓋天上太和仙景自有此意又云龍豹長嘯於山林則嗈嗈嘯歌爲眞麟鳳無疑不然舜帝作樂於歧山何爲鳳凰儀而百獸舞耶觀經味此當從前說管見云人能修道默順帝則禮元皇身中太和天籟鳴唱玄脉安適雅如麒麟之舞鸞鳳之鳴嗈嗈可樂陽精煥彩陰華呈露恍見靈妃散花金童揚煙秘樂玄韻卽天人讚詠洞章對越元神如憑虛御風是亦聖眾浮空來帝闕也此人人之同具惟有志者騐焉是時梵天一切金仙大乘菩薩四眾八部承斯光照皆乘金碧飛雲玉輿九霞流景慶霄四會三辰吐芳飛香八凑旋繞道前雨眾妙花如雲而下遍覆會前子房云此時諸梵天一切大覺金仙了悟大乘正道之大士天神魔鬼之四眾天龍八部承此光明之照皆乘金光碧色飛雲寶玉輦輿所被九霞之服流㪚妙景以慶吉之霄四眾集會日月星三辰爲之吐芳秀㪚飛異香八埏環凑眾聖呈此秘妙旋繞周折於大道之前雨降奇妙天花如眾雲之垂下遍覆蓋盛會之前麻姑云梵天最上寶林瓊宮凡世未見隱妙莫窮故曰梵天金仙金剛不壞之仙大乘菩薩若觀音大士等四眾仙眾將眾男神女神也或亦分天神魔鬼俱通若云道俗僧尼非也蓋天上凡身難至故不言此四眾八部神部將部天人天丁部金剛部龍王部夜光女使部修羅部夜义部也九霞碧霞彩霞紫霞丹霞雲霞煙霞瑞光霞景輝霞普運寶霞九色玄光流此異景蓋衣之光亦云神之隨形妙好不專在衣被也慶霄云佳辰亦云慶覲神霄也四會天良會神吉會時際會緣凑會也不專言四眾之會也旋繞道前飛香八凑之旋繞亦云聖眾旋繞也如雲而下遍覆會前妙花如雲之下盡覆會前或專言聖眾如雲而下太鑿管見云人身之神甚多元神弗御則眾神不呈靈惟修眞之士默朝眞主萬神恭謁靈府玄光諸奇百妙一一凑顯元神會前諸禎列瑞如祥雲遍覆我與天上不二矣是時帝光遍照諸天下燭十方無極世界同玄都境凡彼人間上近九天通接交連至親至邇凡彼下方無極世界山陵坡坂溝澗溪谷緬平如掌六合至邇三境非遼天寶臺殿星羅人間瓊瑰羅列朗耀雲衢七寶欄楯以界道路玉樹仙花蒨燦珠實景秀丹田芝草綿覆天眞皇人云是時玉帝之光自此世界三十六天遍照及三千大界之諸天下照燭盡十方無極量之世界俱皆光明同於玉帝所居玄都境界凡彼各法界人世間承此光照無有隔礙上近於九陽妙化之天天地人間通明相接交互合連極其親近凡彼各下方無極世界高大山陵崎嶇坡坂汚下之溝澗溪谷緬然平正如人手掌盡上下四方之六合聯屬至近三淸境界亦非遼遠天上珍寶之臺閣殿宇如星辰明宻羅布於人間瓊瑶瑰玉張羅陳列朗然光耀於雲空衢路七寶妙成之欄楯以分界道路玉枝寶樹仙瑞奇花蒨燦珠珍之實妙景秀輝丹田瑞芝靈草綿結覆蔭石杏林考義云人王之居曰京都玉帝之居妙冠諸天世所難見故曰玄都平時天淸地濁神靈人愚若不連接非親邇也帝光照徹神機妙聯故上下連神人親近也九天九上界三十六天非止九也山舉高大者而言陵邱大阜也坡地之失平者坂山嶺之崎嶇者也深長曰溝山夾水曰澗水之流注處曰溪山之大虛曰谷緬坦平也地有山水谷澗本不平也帝光覆照妙意融溢故盡各世界之地皆平瓊美石瑰玉類也紛然並陳曰羅列雲衢天端之路橫曰欄竪曰楯卽世之排攔也蒨華光之顯輝者珠實珠實之實丹田玄都丹陛之田耳管見云人身有天地陰陽之元秘不交則上下間隔遼異若元神御光天輝煥發則地天泰上下融高下曲轉並親邇妙合矣身中本有之寶妙顯神映與天上何殊丹田御神之地奇景秀見靈孕神芝綿覆呈瑞已欄楯仙花何待遠求時彼下方皆見諸天鈞天妙樂隨光旋轉自然振響又復皆見鸞嘯鳳唱飛鳴應節龍戯麟盤翔舞天端諸天寶花零亂散落徧滿道路是時凡聖駭異幽暗開光天人悅慶踴躍懽忻凡夫學士盡得飛昇仰觀刧仞寶臺俯眄紫雲彌羅是諸世界一切人民咸臻道炁白首面皺皆得化度紺髮朱顏少壯幼稚轉增形容光澤美好苦惱痊平普䝉解脫安樂快然天下歌謡欣國太平長生大帝云當彼帝光遍照之時各世界下方人民皆見各天鈞天上秘之妙樂隨帝光旋轉繞動自然聲振而音響又復盡見瑞鸞歌嘯靈鳳和唱飛動聲鳴悉應節奏玄龍舞戯祥麟旋盤翺翔舞動於天端諸天上珍寶之花紛零飄亂布散降落周徧充滿於諸界道路此時凡夫聖人皆震駭驚異幽隱黑暗盡開光明天神民人並皆豫悅喜慶踴躍鼓舞懽暢忻樂無知凡夫學道士人皆得神遊玉京飛昇天上仰觀刧仞高隆諸寶之臺俯眄紫雲覆映彌羅之界是諸世界一切諸人兆民咸皆臻於道炁妙化之域白頭皺面之老盡得化度爲紺黑之髮紅朱之顏少年壯夫幼小童稚轉增加華麗形容光輝潤澤粹美奇好眾苦諸惱痊泰安平普三千大界老幼盡䝉悟解超脫安逸喜樂心意快然各天下皆謳歌誦謡欣樂國運之太平雷門使者云鈞天妙樂金爲八音之首上梵玄韻不毁之金元諸韻諧和無亂無毁聲律之宗一云不調自勻世所希聞故曰鈞天又云大造爲洪鈞道化妙運自然太和天樂之妙是大造之化故曰鈞天踴躍懽忻手舞足蹈而喜也八尺曰仞天之寶臺厯眾劫難毁非可磨消者故曰劫仞仰觀舉目觀俯眄低首顧視也紫雲彌羅黃老寶境非俯視者對寶臺言若有俯仰之義紺深靑揚赤色紺髮卽今言綠鬢管見云人有陰陽身分上下上炁常淸下氣常濁惟氣間而不和則上妙不見不聞而衰損弱虛遂乘以患人旣符大道會元秘輝妙景則眞聞秘音眞見玄化鈞天雅奏麟鳳龍鸞悉顯奇矣瓊花飄瑞周徹美觀陰陽氣承佳欝神若驚駭一切幽闇光明上下和卽天人之踴躍懽忻矣陰消陽復妙意昇玄是凡夫學士盡昇也上瞻碧寶之臺俯顧通玄之境國富民安氣和神泰衰者壯平者泰不足者有餘易筋換髓終保太和周身順熈快此妙化非老者返少少壯增好天下歌謡欣國太平之義哉吁此實理也達者味焉當爾之時神風遐著萬炁揚津天震地裂枯骨更生沉尸飛魄皆得復形酆都鐵圍長夜九幽卽時破壞地獄苦魂化生諸天三惡道苦一時解脫時諸罪眾以斯光力得生十方諸大天宮魏伯陽云當天下歌欣太平時帝德神風遐遠鼓著妙有萬炁揚太和津乾發生機陽剛行健天震玄輿坤開成運陰柔效順地裂靈函已枯之骨更復迴生沉滯之尸渙飛之魄皆得復形無拘無散冥府酆都大鐵圍山大鐵圍城冥冥長覆九幽黑獄卽時破壞無復暗蔽獄禁諸地獄中受苦幽魂俱化生諸天地獄餓鬼畜生三惡道苦一時解脫業寃永除時諸亡獄受苦罪眾以斯玉帝玄瑞道光燭照之力得生十方世界玄霄之上冲漠之表諸大天宮愚按鼓萬物者莫疾乎風帝化玄通神神無盡徧徹法界䝉受者不識不知故曰神風一炁有景色無實形奚云揚津炁之所通帝德默運太和洋溢浹洽津濡故曰揚津一天震非言雷陽德亨也出乎震以施生一地裂非崩裂地道卑而上行陰定陽復露成育之妙不閉塞而地藏發泄故云裂一枯骨更生非朽骨再起心死形稿者悟道知眞囘陽換骨人中之仙枯骨再生也一魄在人身樂人死享祭祀生不明道塵識染累神離形死魂消魄散或自執或墮罪獄渙飛魄精幻變漂淪惡孽飛魄復形魂靈魄聚不致漂沉驚禁罪苦一切冥業一酆都鐵圍嚴固難開悉由罪魂自障蔽帝光玄照一燭罪滅不見天日長夜九幽之獄悉開光明酆都鐵圍卽時摧壞破盡獄苦罪眾得生天上三惡道苦亦卽解脫彼時承光罪眾仗此道力生十方大天宮夫人之生神具形全肖形天地陰陽五行性無不備本太和貫徹淸淨無染至知誘物化認假爲眞塵勞染着攀援妄想一有執恃牢不可破欺蔽日久無復開明喜怒憂思悲恐驚情倐臨驟懼心無定見忙忙不止私欲苦心累身語之不省卽沉尸飛魄酆都鐵圍黑獄幽閉也若絕欲忘私使天君泰然冲和澄徹鼓巽風周太和全浩然洽道脉卽神風遐著萬炁揚津陽施陰受交泰囘陽消無量之苦除不盡之塵破厯劫之迷執脫暗昧之業趣卽天震地裂枯骨更生沉尸飛魄復形酆都鐵圍九幽卽時破壞也陰消陽長欲盡理還易濁爲淸精氣化神脫五苦而融五氣默朝元宮淨三業而證三元上登紫府卽地獄苦魂化生諸天三惡道苦一時解脫罪眾時承光力得生諸天宮也生世間者思之寶之爾時玉帝卽分其身徧於諸大天宮令諸天宮自然化現白玉爲京黃金爲闕七寶玄苑大光明殿具光明座幢節旛蓋異寶奇花徧布是處爾時玉帝卽以所分之身徧於是處白玉京中黃金闕內七寶玄苑大光明殿光明座上普爲十方演說淸淨解脫之道鐘離帝君云彼放大光明時玉帝卽分化法身徧及於眾大天宮令各天宮自然化現白玉京城黃金闕庭七寶莊嚴玄苑皆如玉帝所居大光明玄殿備具大光明寶座玄揮法幢節旛華蓋珍異妙寶奇麗天花徧布滿各大天宮之處爾時玉帝卽以妙分之身徧在各大天宮神化玉京金闕玄苑之中御大光明殿陞光明座上諸神座俱有光元始玉帝演法寶座其光尤妙至大莫量最神難言妙勝佛家法王座故帝化身陞此座上徧爲十方世界演說其眞淸眞淨悟解超脫之道演演明陳其義也管見云人之元神靈通不拘無所不到本同玉帝之妙化紫府丹臺本同天上之神宮瑞芝靈蘂本同天上之寶花人惟縴於世利元神失主遂不能周流徹貫觸處呈靈喪我淸靜之眞不得解脫之道若保眞合道默禮神王則靈運普通周身徧滿卽玉帝分身徧諸天宮凡身達妙至寶呈奇珠樓寶殿瓊宮瑶臺卽天上金玉京闕七寶玄苑也神宮丹臺卽光明殿光明座也氣和脈暢光動霞揚卽幢節旛蓋神芝之秀又同天上奇花也元神御宰丹臺敷靈顯秘卽玉帝以分身徧各天宮同時登座說法也吾之眞性厯劫不壞無二無雜無拘無間本淸靜不染脫落自然大明不昧也能神御敷靈則徧一身皆玄化周三千無拘我明了因緣不昧實際表裏瑩徹窮神達化卽玉帝演解講明淸靜解脫之道教化各世界也達者味之自識此義時化玉帝各以無量天眞大聖妙行眞人靈妃玉女侍列左右是諸玉女顏容姝妙端麗奇特天珍異寶莊嚴身相言音淸徹眾所樂聞是諸玉女其身復出微妙解脫自然之香是香芬馥周徧諸天極妙樂土及諸大地一切福處王母云爾時徧諸天宮化身玉帝各以無盡量天上諸眞神通大聖靈運變化妙行莊嚴之眞人靈通仙妃護聖玉女侍立分列於左右此眾玉女顏面形容姝美奇妙端正華麗神奇特邁天珍神異之寶莊嚴身之形相言語音聲淸明通徹大眾所樂聽聞是眾玉女其身邊復發出玄微神妙大解脫自然之馨香此香芬芳欝馥周徧充滿於眾天宮極神妙快樂之淨土並徧及眾大地世界一切福會之處考義云妙行者人有諸善不假强爲功德不窮本於自然而成眞人則神通莫量故曰妙行靈妃玉女陰梵妙氣變化之神拱衞帝眞凡天上神女皆如是稱無欲無累與魔女不同德功俱備貴美尊靈純潔永無間雜故曰靈妃玉女非專言帝后是諸玉女是此也顏容姝妙姝美也端莊正也麗華澤也奇神妙罕見特超絕眾美世無比倫也天寶莊嚴身相天上妃女玄光神化妙寶莊嚴其體其容世所未見言音淸徹言言語音音聲淸聲語分明徹通徧周聞也微妙解脫自然之香妃女了悟得大解脫玄機難窮神妙莫量不待造作自然馨香且不知其香從何而生故曰微妙是香芬馥芬香美氣布揚也馥欝然馨香盛著也周徧諸天極妙樂土周悉及也徧廣被也極某也各大天宮侍衞玉帝化身之玉女香不止及一處皆徧及各世界諸天甚妙無苦樂土大地盡山河世界而言福處有世界則有生成故曰福處或云恭敬精信然後得聞異香各世界承玉帝光皆生信心得遇靈妃玉女妙香故曰福處此亦通六道一切眾生聞是香者普䝉開度所謂天道人道魔道地獄道餓鬼道畜生道若諸天道一切天人或有能聞是此香者五衰四相永得消除轉增天福若諸人道王臣兆庶或有能聞是此香者卽得人天長夀之樂身或滅度乃得脫殼屍解之道若諸魔道一切諸魔或有能聞是此香者安處天宮鬪戰之苦各得休息若諸地獄道一切罪魂或有能聞是此香者離地獄苦得淨土樂若諸餓鬼道一切餓鬼或有能聞是此香者卽得飽滿無飢渴惱若諸畜生道一切畜生或有能聞是此香者脫畜生苦得智慧樂救苦天尊云六道中一切眾生聞是靈妃玉女自然之香者普皆䝉受開化㧞度之惠六道眾生所謂各天上人道世界人天道諸魔道冥府地獄道窮魂餓鬼道業報畜生道四種民天下一切諸天界之天人或有能聞是靈妃玉女自然之香者五衰四相之苦永得消滅除去轉增益天福之樂若大地一切世界諸人道中帝王臣宰兆民眾庶或有能聞是此自然之香者卽得留形住世享人天長夀之樂身或入滅超度卽得脫殻無拘尸解仙化之道若諸世界各天諸魔道中一切魔王魔民魔女諸魔精類或有得聞是此自然香者安然附處天界别宮爭鬪戰伐之苦各得止休甯息若諸世界冥途地獄道中一切有罪之魂或有能聞是此自然香者卽能脫離地獄之苦得生淨土樂地若諸窮魂餓鬼道中一切餓鬼或有能聞是此自然香者卽得飽味滿腹無有飢渴惱恨若諸畜生道中一切業報畜生或有能聞是此自然香者卽能脫離畜生之苦得生智慧聰明之樂薩眞人云六道道猶路也在六般途路中受輪轉故曰六道首言天道者天有三十六稱最上四天號曰種民七寶九宸諸天仙所居佛家云不退轉之地種民之下有四崇秘天佛家云四梵天也崇秘天下有四忘象天佛家云四禪天卽無色界也忘象天下有色界十八天色界十八天下有欲界六天一世界有三十六天各世界俱同四種民天虛無妙有妙化玄神永無毁淪止有上聖眞仙御居並無天人不在天人道數四崇秘天塵染方淨畧化未神未臻大乘雖冠天人道大劫亦不能免無色界色界欲界諸天天人身高大形如白銀不依日月之照自有光明日月天天人身高五里其上漸加至於百數由旬之高由旬四十里道經云踰舍也衣六銖二錢五分重之天衣頭有自然珠冠目不瞬頭不俯立不倚眼無淚身無困憊若不悟大乘天福受盡之日珠冠碎目瞬雨淚身屈形憊五般衰弱四不美相見矣若承自然之香精信恭敬悟其妙香之由頓契大道不徒外聞此香遂得了悟是曰能聞五衰四相永得消除永終也終免衰相之苦轉增天福轉轉進益天福無窮不退盡也人道不同有陰陽老少有貴賤貧富有聖賢智愚不得大道夀算不長死之甚難屍不能化若各世界帝王宰臣大小臣僚及兆庶諸民千萬曰兆庶眾也兆庶盡人民而言極語其多也若能承自然香了悟大道亦能善聞馨妙卽得人天道無拘礙長夀之樂縱或滅度亦必妙脫軀殻屍解仙化矣脫殻或坐脫立亡或投胎奪舍屍解或此已死又顯身於世間屍魂並去或假死而上昇若諸魔道魔類不同若唃嘶囉與天帝爭衡鬪亂天宮修羅宄逆等一切魔途或好戰爭或作幻厲居處不安常無休息此魔等若聞自然妙香能悟道眞則改邪從正居處安然守其素位在天别宮不樂紛爭鬪亂戰伐之苦各得罷休止息鬪戰苦者鬬亂必傷戰伐必殺互勝互敗交爲冦讐所以云苦各得休息神雖不侵魔爲魔所亂亦必應變伏魔今魔聞香悟妙安處不爭神亦無事神魔悉安故言各得休息諸世界地獄不止一名曰酆都曰血湖曰血硤曰寒氷曰火車曰刀山曰劒樹曰愛河曰刳心曰鐵床曰風刀曰鐵狗曰銅蛇曰鑊湯曰鋸解曰碓磨曰剥剔曰泥犂曰拔舌以及三十六獄一切受罪之魂本難離地獄囚刑之苦若聞此自然之香卽能了悟遂得超脫出離地獄諸苦得生淸淨樂土諸餓鬼厯劫窮魂久繫鬼籍或細頸大腹或首大腹隘或咽喉蔽塞或食炭吞煙或餐鎔銅或啖鐵丸累世不聞漿水不遇飲食餓餒渴痛雖常憂惱若諸世界如是餓鬼道中一切餓鬼聞此自然之香卽能悟道則道味充腹卽得飽滿消除飢渴開明喉咽永無餓惱諸畜生道卵化混蠕蠢動皆是不專言禽獸也畜生者雖畜養於天地之間無有智慧業報多苦雖若難脫各世界一切畜生若聞自然妙香卽能悟道則得此解脫業報卽盡脫離畜生之苦得聰明智慧之樂畜生非無知不能言道不能體道形異神殊或豢養乘御或漁獵殺食投䧟阱充庖廚茹毛飲血皮骨悉盡最苦難言聞香卽得智慧皆帝光法力也管見云上兩節俱一意人身元神總御陰陽眞聖妙行靈妃玉女皆所有也神氣精血太和之中本有妙香解脫自然微妙難窮也氣之偏正是非狂愚自分亦有六道惟天君不泰則爲五行所拘念頭不斷紛紛擾擾爲陰陽所制是亦受六道輪轉者也覩已身六丁玉女之美聞太和解脫自然之香明徹大道使元神常煥卽覩帝光而仙化者也永脫塵凡不爲身拘是亦永脫六道之苦矣達者味焉自識兩節之意爾時諸生天罪眾旣得生是勝天宮已緣承慈光攝受之故便得覺悟各各明了罪福因緣與諸眷屬作天伎音計其倚切藝也一本作伎字之跂切渠紀切與也伎字當從樂來詣帝前是諸眾等各各含悲俱發聲言臣等前後經千劫萬劫不見三光常處黑暗三惡道中多受苦惱伏䝉上帝方便放光愍救我等皆生天上是諸惡業悉皆滅盡無諸繫滯皆得往生仰朝上帝各到道前是諸生天一切罪眾說是語已稽首復位葛仙翁云爾聞香脫化時候諸地獄餓鬼等途一切生天罪眾旣䝉自然妙香得生是最勝天已因承玉帝大慈光明攝受之故攝接引保持也受接引魂神召之皈眞也帝放慈光妙化眞香攝受諸罪眾卽便得覺悟大道覺知其所以然也悟徹通也罪眾覺悟脫其三惡道趣各各明通了徹深知罪福因緣夙根曰因有因則有果由來曰緣有緣則有業罪眾旣明罪業福德因果緣故與諸親眷屬類與同也罪眾或魔或鬼或業畜各有親黨統屬旣生天明道與眷屬舉作天上伎藝妙樂天伎以藝字解者言其妙無不通耳來詣帝前詣至也是諸生天罪眾等各各包含著悲的意思俱發聲音言說臣等前前後後經厯大劫小劫千千萬萬不見日月星之三光常處陰黑幽暗之地墮於地獄餓鬼畜生三惡道之中多受罪苦悲惱伏䝉上帝伏鞠身俯伏地下也䝉承受仰被之意言伏䝉以卑承尊當作是言耳後凡言伏䝉倣此䝉上帝普行方便放大光明方便者普著道妙令人得便益故曰方便慈光旣放憐愍救拔我等皆得生於天上是諸惡苦業報悉皆除滅了盡無諸縴繫滯絆皆得往生諸天仰朝玉皇上帝各得到元始至尊大道之前是諸生天一切罪眾說是言語已畢稽首復歸原侍立的地位愚按人秉陰陽與天地本來相同溺於利欲汚䧟眞心長惡不悛以報應轉輪之事爲無是不知罪福因緣故妙和眞意無有蔽於塵俗之網貪嗔癡妬狂亂悲喜嗜慾求名不見了期是常處黑暗如地獄餓鬼畜生之在三惡道中也晝夜熬煎亦與諸罪眾多受苦惱一般是卽惡業不盡有繫滯不得生天之罪眾也元神御天光發則一身陰氣雜意惡趣皆復正氣而昇九陽境界知善惡凡聖之關㨗於影響報應昭然卽洩太和之韻呈靈秘禮元皇是卽生天罪眾承帝慈光攝受各明罪福因緣與諸眷屬作天伎樂來詣帝前也陰氣消雜念忘惡趣淨易惡爲善皈神皈命悔悟懲創自知作惡不祥不悟大道如同面墻坐井寔無所見蔽於參三貳二之途遂多憂懼惟元神御
