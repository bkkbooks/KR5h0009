body:
  text: 持是經人名慈悲身六道眾生賴其善故大仁大惠濟度無窮迺名慈悲人惟物我異念久暫殊心不能普濟永利有失慈悲卽有所惠有所度有限難久亦非慈悲身故分人以財謂之惠教人以善謂之忠小惠私恩非普濟眞持經人非常身也大慈身也大悲身也六道一天道高高在上其福淸長不見所生奚云其眾惟天雖高猶有三界欲色無色俱有成壞縱福有長短之期除各天主外信正道可久存其諸天人一切所有天上品類俱非常住有始有卒皆名眾生二人道人爲萬物之靈雖贊化育弘道法貴賤異位男女殊形夥然繁以庶億兆林林不可勝計是名眾生三魔道天之魔王魔民魔女精邪怪異妖孼難窮是魔類眾生四地獄道五無間獄九幽惡獄十八大獄三十大獄七十二獄冥塗苦惱獄類一切眾生五餓鬼道陰酆溟瀆大力鬼王鬼使足長首大腹廣喉微千萬刧中不聞漿水如是餓鬼眾生六畜生道胎者卵者濕者化者羽毛介甲鱗蟄形色蠢然沕然畜業一切眾生悉荷持經慈恩超濟覆護固天人之福解人中之厄除魔獄之淪滅鬼畜之報一界千萬界三千大千諸世界六道一切眾生除業增福頼其善故是云慈悲夫語六道則盡類矣言眾生則盡眾矣諸界皆然則無始前無盡後不可思議稱量者皆賴此眞持經之善矣信乎大慈悲也噫先自度而後度人欲濟六道眾生尙永持眞經以成至善而後可也持是經人名大道身出入所在無怖畏故道本無形人身有象人性備道之全得天地之理得天地之氣若云道身人人有道人人不盡道則父母生身謂人之身可也四大易散云幻身可也物而不化云凡身可也醉生夢死云無知身可也朝暮忙忙甘至老死云業身可也不修不學輪迴難脫云罪身可也秋香易度華表無多云色身可也男女殊形老少異狀云無常身可也大限到來六親難顧云獨夫身可也風雨寒暄切迫肌膚云受苦身可也此世人無有道者也眞持經人得法成眞是道身也非凡身也名大道身怖驚憂畏恐懼也惟持經人出則坦然入則無累或出或入淸淨脫灑無不泰然何憂何懼凡其所在無怖畏故解疑儒者云戒愼乎其所不覩恐懼乎其所不聞戒愼恐懼非畏乎况喜怒憂思悲恐驚七情在人箇箇不無此示出入所見無怖畏故若於戒愼恐懼相反也是不然戒愼恐懼遏人欲存道眞也七情之具見人性體用全備欲人懾情歸性也若怖畏之心內見未定生於外患有所恐懼不得其正也故夫子云內省不疚夫何憂何懼出入所在無怖畏身與道一觸處泰然何畏之有儒者云見大心泰與此互相發夫持經者出入無怖畏皆自然也非强制也强制則告子之不動心終非見道自然則夫子之不惑從心孟子之不動心皆與此經義同善乎兩教之言心學曰如如自然巍巍不動神化之道具是矣若勉强把捉不需自化持之不永效之欲速雖不怖畏亦非此經義也持是經人名良醫身善行妙法安樂人故醫者宜也藥與病宜除其疾障也世醫察形辨理愈人之疾拯人之急以藥去病利人之生有神聖工巧之名眞持經人非世醫也無凡醫也不言海上之方也金針默度名良醫身人生氣質雜揉者眾氣失其平有生來之疾有有形之疾有無形之疾有一身之患有一家之患有一國天下之患有一世之患有累刧之患疾苦牽纒相循無盡父母所不能訓聖賢所不能化王法所不能禁醫之無藥救之無方持是經人不詭異不强凟妙用適宜良法當可不苦口不逆耳不違汝心不累汝身不强人以難不詭隨以縱善行妙法妙法一行聾者開聰再則盲者目明三則瘖者能言四者跛痾積逮起行五則久病痼疾一時復形六則髪白返黑齒落更生七則老者壯少者强八則婦人孕鳥獸胎已生未生皆得生成九則地藏發泄金玉露形十則枯骨更生皆起成人消一切災度一切厄魔異寃債永不侵凌九祖六親往刧未來人我安平幽無對繫物阜身輕不但起人之沉痾抑且消變於未形誠未藥而有喜永保命以延生非一方一技安樂人一身之醫天醫最良眾生慈父善行妙法安樂人者矣夫此經登眞之大道淑世之奇方人人本有自迷不悟者也善持眞經有得宜濟世矣何末代自私念起稍得一二不慈人物如秦越肥瘠兩不相關始不教世終以自誤暫明復蔽不能成道甚可惜也噫知經不度世非也不知强以爲知好爲人師妄自傳度又大過也能除二病勉力了明此經斯可以普度持是經人名光明身常爲帝光所攝受故人性虛明無所不照氣拘物蔽昏掩其明眞持經人性天朗耀心地開通光明常顯命蒂精融如太虛之無雲如日月之代明浩然充塞盛大流行誠光明身非汚暗者也帝玉帝也帝光普照無所不及人自卑汚難以承受今持經人履踐天光丹耀金庭宇泰定而天光發上帝昭格光暎玄空持經仰受太和景明帝光攝入保護持經持經䝉化永保常淸光明交映與天合德日月合明嘗聞天道下濟而光明本無私親人受天之明命本大光明然性本無染心貴虛明人貪欲樂不能使靈臺無物如日月薄蝕雲霧蔽空若不文其過絕欲還理一時之暗旋卽廓淸四通八達明者益明天光有不煥帝光有不臨未之有也人乃自暴自棄念頭營營晝作夜息心無少停爲者旣妄念復不淸與天相悖故昧眞經稍然有覺過成業生罪報森然輪受不輕不能速改以辭文之則天不可欺神不可瞞人之視己如見肺肝此性何在忍欺心若是也所以天命之佑帝光祥護必在眞持經修道成眞之人眞持經名光明身爲帝光所攝受也噫人一也明德同也人何不持經盡道克當上帝之心持是經人名自在身天宮妙境神能遊故持經功德說不可盡自在身者三災四殺五行六害七傷八難九星厄十惡業一切無牽永除業根證三元空五藴離四相絕百非除萬有超載劫眞解脫大自在身天宮妙境神能遊者是持經人玄功如意身得自在凡諸天宮一切妙境碧路瑤堦虬墻彩壁玉京金闕紫府黃房瓊樓玉宇閬苑瑤池玄都上境祕院丹臺寶林香徑神室絳宮法橋錦檻皓殿赭庭及瑤草琪花冰桃雪李交梨火棗丹饌瓊漿道光玄瑞彩霞雲祥神輿法駕法寶天人諸品奇英神遊定觀悉厯勝遊非常人所及持經功德說不可盡甚言功德大也夫所言持經功德種種人物幽顯存亡今昔一切並利邪魔伏帝光臨神遊諸天尙言不盡則功德無量矣說經至聖又何如哉噫經功最大當至誠永持矣又若道士志人能結壇誦經著新淨衣於夜半後闃寂之時獨處淸淨室叩齒九通東向端坐誦詠是經於是時也天眞御几玉妃拂筵萬神班列諸天臨軒三界侍衞五帝司迎道士修道入玄之通名志人有志之人也或作至人非也蓋得道成眞方名至人觀經者但以後有天眞玉妃萬神諸天三界五帝御班侍迎等句以爲當作至人看不知經是帝勅所在諸神拱衞遇持誦者卽愚夫凡婦衰叟蒙童神敬是人如奉是帝持經誠敬福德無量怠慢則咎殃立至諸神侍迎敬其持眞經不必至人况結壇新衣夜半靜室叩齒東坐此學者誦經之常規非所以論至人故知爲志人無疑天眞御几者諸天至眞臨御法几玄案玉妃拂筵者靈妃玉女拂淸法筵拂蕩也欽敬淸肅之意非拂逆之拂筵法席也世間帝王勅令所在羣臣班列皇經爲玉帝祕言元始法旨志人持誦卽讀宣帝勅一般萬神悉皆班列拱奉軒玄案也三界天界地界水府界三界諸神將吏侍列護衞一云志人誦經三界當作天地人然夜半淨室定無人在爲天地水部三界無疑一云欲色無色三界亦不是五帝五方五靈五老上帝也一云五嶽尊帝也以前有萬神三界字中有五老此當作五嶽萬神三界中有五嶽此作五老是也經中有五老啟問故開經五老司迎道祖司主也承也迎迓也覲禮虛皇之義一云司迎持經之神昇玄亦是夫觀誦經之䖍諸神備護則不誠諸神鑑報必有之矣見聞經者當凜然恭持不見聞者當惕然求遇嚴若諸神之臨不求應見之效無思無爲密密持眞一身之神森然永保我眞經矣勉之忽怠又能閉目靜思存想是經不覺身處三色雲氣之中俄見其身光明赫奕上昇天宮眾眞下迎心有所請一切應奉仙丹妙寶隨意自得宜當依科冥心奉行五藴之害色爲第一色之亂心目實受之奉持眞經身心宜淨閉目以靜心自大定然道之玄微非思不入妄思又所以亂眞閉目靜坐不見可欲使心不亂默嘿思索密入深機此誦經之大要也今言靜坐者兩目半垂簾不全閉恐作鬼窟活計不知陰趣雜念是曰鬼窟若心淸淨閉目何害時人心不決烈閉目疑生故半開眼不着睡魔疑心耳若善惡兩忘無無亦無眞道自入閉目何妨垂簾之論玄師防無志者魔惑耳且半垂簾義閉目不觀內有眞照心法惺惺光明不昧如垂簾聽政雖不觀看當應者無不周知也此修道之機括故論經而併及之存想是經不是招攝經中景象功效對此法品如見玉帝念道思眞不敢輕易徒口誦經靜存此心密密研窮經中至理體之身心也雲氣蒸成於天地思經大定與天心合念念眞善慶雲迺生不覺身處靑黃白三色雲氣之中心身靜正龍虎蟠旋故有是三色雲若修眞成則五色雲擁九霞光泛又不同耳俄少頃時也俄見身光煥發盛耀炳蔚心有所請者至天宮心有所請求一切應奉仙丹妙寶隨意皆得者一切應當奉獻元始玉帝仙丹妙寶隨意請求自然皆得不可言求寶應奉自身依科遵依科教也夫經本人性之眞默悟永持可也以存想言之似落第二義儒書云恍惚不見之圖儼然無形之視又云洋洋乎如在其上豈亦第二義乎噫上智者少中人最多若不操存求不聞之亦式焉能盡人合天超凡以入聖耶學者思之此經乃至三世金仙十方大聖皆從此經依科修奉故得超證無上妙道是兹玉帝諸天之師眾聖之王三世金仙過去世見在世未來世金仙金丹不毁太玄眞仙也十方大聖四正方四隅方上下方十方靈寶尊神至眞無極大聖超證無上妙道者進修不同成就各異證道階品未至不爲無上如神人地鬼等仙如欲色無色天神如菩薩聲聞羅漢佛乘如化大美信善人賢者等儒皆非其至如天仙文佛聖不可知神儒方名最上金仙大聖依科專奉此經與帝眞合故得成最上仙超脫高證無上至眞妙道不落諸天福德之果兹此也三十三天三十六天萬二千天三千大千世界一切諸天皆從皇經而證大道玉帝迺諸天之師化成眾眞者也諸仙諸儒聖諸佛諸天諸神一切眾聖修讓其德度讓其功證讓其尊浩劫欽崇眾聖之王也噫人有天君泰然則道可得若不修心了悟與天合德虛崇上帝抑過矣戒之思之是故凡夫値遇是經精一修奉乃至五帝輔翼召使羣仙御役神官運導陰陽千靈敬仰萬神攝伏百邪避路羣魔束形命過之後卽得南宮受鍊飛步上淸逍遙自在與道長存五老上帝不指五嶽輔助其進修翼加其不逮召使令而使之羣仙如命也御役制而驅之神官供役經云修道志人中可以役鬼驅神雖凡夫精一持經仗道法力自能召仙役神運導陰陽惟精惟一允持此經自以幹運造化開導陰陽千靈敬仰千靈恭敬瞻仰萬神攝伏攝驚畏心服伏歛神默伏也萬神攝伏不待作持百邪避路百邪遠避道路不敢觸犯羣魔束形諸魔束斂其形不敢顯露南宮朱陵府度魂鍊魄之宮也受鍊受南宮鍊度也飛步上淸飛神歩上淸天界此非上淸境但言昇天耳逍遙自在者不經地獄不受業報無拘無繫與道長存者初受持經雖非至眞精一修奉心契於道無滯無牽魂神淸淨不復毁淪此道典之所謂死而不亡佛經之所謂一悟便了也夫一凡夫精一持經其驗如此則知至誠之功效雖下愚亦可以盡道也觀者勉焉又復世間眾生得聞是經心生渴仰能於家庭擇淸淨處畫帝尊像日夜䖍䖍晨昏濟濟香花燈果尊重供養稱讚聖號瞻禮誦經是人當得三十種上妙功德一者諸仙讚重二者先亡生天三者宿殃解脫四者所往通達五者無盜賊事六者所求遂心七者除水火厄八者橫事潛消九者夜夢吉祥十者疾病不侵十一者智慧聰明十二者人見歡喜十三者衣食豐盛十四者子孫榮貴十五者六親見喜十六者門族和睦十七者除三惡報十八者轉女成男十九者形容端嚴二十者爲國大臣二十一者生爲帝子二十二者鬼神欽仰二十三者得宿命通二十四者諸神護念二十五者九族受蔭二十六者處世長年二十七者有情賴善二十八者魔王保迎二十九者決超三界三十者白日上昇諸仙讚重讚歎欽重也先亡生天先亡宗親悉生三界也宿殃解脫者宿世業殃解脫永不牽纒所往通達者向往進修悉得通達所求遂心者求謀盡遂潛暗也子孫榮貴非必榮華富貴賢而淸不惡賤夭便好宿命通宿業盡命長通利諸神護念護持讚念持經奉玉帝之人九族受蔭九族高曾祖父已身子孫曾玄一云父三族母三族妻三族也有情賴善者世界有情賴其善功白日上昇諸仙昇化不同非必白日肉身昇天體同太虛神遊玉京是白日上昇尊經敬帝雖有此功先要絕盡私欲不求效驗亦不間斷心與天合然後有效卽無效亦不害爲善也若一覬效非善傳帝經矣觀者辨之爾時天尊復吿四眾曰此經功德能碎鐵圍諸山竭苦海水破大地獄拔諸罪苦降暴惡魔護諸國土能滅一切惡鬼能除一切重病能解一切惡毒能離一切惡人能伏一切毒獸能摧一切邪道一切諸天皆自尊敬其餘功德說不可盡竭苦海水者迴頭登岸苦海波乾破大地獄者屏息妄緣拔諸罪苦者絕斷業根永無罪報降暴惡魔者降伏剛暴猛惡邪魔護諸國土者悉使淸甯富國安民能滅一切惡鬼者除滅兇惡陰鬼除陰惡趣能除一切重病者除盡諸染能解一切惡毒者解除世諸惡毒解身大嗔惡毒能離一切惡人者或不相遇或惡人見我彼卽遁迹能伏一切毒獸者馴伏世諸毒獸又修眞之人陰氣化諸毒龍猛獸巨虬獅子各百億萬眾護我眞經令自馴伏永護於我能摧一切邪道者摧破世諸邪道摧已邪妄迷執此經功德消難消之變除難去之毒無所不化無所不利大方便最上法品也雖至聖之微言實性分之能事勉之則功自成爾時道場大眾金仙菩薩眞聖眷屬聞是說已歡喜踊躍稽首敬禮而作頌曰大哉至道無宗上眞上度諸天下濟幽魂上無師祖惟道爲身丹臺紫府金闕玉京祕此妙法溥福含靈滅我萬罪增我遐齡萬神朝禮魔王保迎功德昌盛黃籙書名渺渺億劫使我長存于時會眾說是頌畢稽首皈依奉辭而退大哉至道大不可量至不可及也無宗上眞無本無始最上至眞也上度諸天化徧於上也下濟幽魂化徹幽冥滯魄盡昇也上無師祖無師無祖也惟道爲身頌讚此經以道爲身也丹臺紫府太玄妙境也金闕玉京解見前祕此妙法祕珍藏也溥福含靈徧福一切含靈或以福作溥度也滅我萬罪經能滅一切罪也增我遐齡經能延年也萬神朝禮欽重此經也魔王保迎尊持經者也功德昌盛功德盛大周徧悠長也黃籙書名玄都仙籍金簡黃籙以書其名也渺渺億劫渺渺寥廓遼遠億數多劫也使我長存使持經有道者長存也高上玉皇本行集經卷下終至心皈命金闕玄穹主高上玉皇尊諸佛聖師萬天帝主演三卷五品之妙法周十號萬德之洪名放十七大光明示三十種功德拔度生死運化古今一萬二千三十六字洞玄靈寶高上玉皇本行集經夫此經探之無始莫知其先推之無終莫知其後大包三千大千莫知其大細入塵沙渺冥不見其小覆盡諸天不知其高利盡諸地不見其下福度一切人物不見其繁包諸法括萬有不見其雜任劫數昇沉無分無合任化機推遷無間無緒消盡邪魔不示神通度盡迷執不見勞費化無窮不恃功德普仁慈不拘品類究之無際稱之難窮誠三教之眞宗浩劫之永寶要之爲吾性之固有天命之本然也一切人物至誠脫悟全得經功眞得之基存乎一心因附心印玉皇心印妙經此玉帝傳心聖聖相承以心印心明悟了證皆宗此旨三教莫違故云心印上藥三品最上妙藥有三品卽三般神與氣精非金石土木靈芝玉屑及外藥凡藥乃元神元氣元精凡藥可以愈疾所及有限此藥保劫度世化濟無窮一切莫比故云上藥恍恍似有非有惚惚似無非無杳杳似遠非遠㝠㝠似近非近若不見聞似有見聞存無守有祕存虛無默守妙有頃刻而成上藥一得立躋聖域迴風混合迴旋巽風混合百神百日功靈三月基就功漸玄靈默朝上帝宇㤗貞定祕禮元皇一紀飛昇十二年丹神飛昇一云厯脫十二相屬乃昇知者易悟眞知者易悟上藥之基昧者難行愚昧者難行存守之義履踐天光宇㤗定天光發而足攝天根呼吸育淸眞炁往來滋育玄清出玄入牝知天谷元神而出玄入牝若亡若存不㪚亡不强存若亡若存綿綿不絶默默綿綿終始不絶固蒂深根性根命蒂妙培深固人各有精各人皆有至眞眞精精合其神眞精妙合元神神合其氣元神妙合眞氣氣合體眞元氣妙合吾體至眞不得其眞不得身之至眞皆是强名自云得藥便是强名神能入石神入金石無礙一云穿山透石無不到之謂也神能飛形煉神還虛身自飛昇入水不溺有道者水不漂溺一云諸欲不染爲不溺入火不焚有道者火不能焚一云怒妄不生爲不焚神依形生形成而神至故云神依形生精依氣盈氣滿則精全故云精依氣盈不凋不殘神氣精全絲無耗散而不凋不殘松柏靑靑永無衰變如松柏靑靑三品一理三品上藥共根一理妙不可聽重玄至妙非可聞聽其聚則有善存默守妙聚則有其散則零妙意渙散倐忽凋零七竅相通耳目口鼻七竅內焉相通一云七竅在內竅竅光明風雲發洩竅竅光明一云各有天光寶明聖日聖月身之眞陰眞陽永明不毁故云聖日聖月照耀金庭光映丹臺紫府云照耀金庭一得永得眞得實益永不毁淪自然身輕身輕囘陽換骨還虛非徒體健也太和充溢太和眞氣充滿洋溢骨散寒瓊黃中通理骨竦神怡翠落瓊珠金筋玉骨得丹則靈是藥得丹易凡而靈不得則傾不得正丹藥喪身傾丹在身中非白非靑非肺白非肝靑誦之萬遍默轉眞經萬遍非口誦也妙理自明此經妙理自然明白無上玉皇心印妙經囘向懴悔文囘心向道龍章鳳篆已殫歌詠之誠鶴駕鸞輿重冀鑒觀之惠臣謹炷眞香重誠奏啟道經師寶元始萬神玉光會中一切聖眞恭望恩光重垂證鑒臣向來爲某人某事看誦玉皇本行集經幾部敬保某人某事云云所宣經典罔敢不䖍其奈業力障魔神志錯亂所立根鈍自然想來脫畧混淆顚倒重疊臨文狥意字誤句差乖淸濁之正音泥解會之邪見事奪其志心不在經問對起居斷絶隔越久誦懈怠因事忿嗔嚴潔或涉於垢塵肅敬或乘以瀆慢身口服用之不淨衣冠禮貌之不䖍供弗如儀處非其地卷舒揉亂墜落脫傷不專不恭大慙大愧伏願慈悲憐憫赦釋罪愆庶使誦持得臻感格所祈所願如志如心尙慮經中傳授或誤刊寫多訛其師其人悉皆懴悔仗道威力願罪消除常轉法輪普度羣品爲如上緣稽首稱念太上無極大道至眞三十六部尊經眞文寶符太上三尊十方眾聖玄中大法師玉經中無鞅數眾神仙不可思議功德
