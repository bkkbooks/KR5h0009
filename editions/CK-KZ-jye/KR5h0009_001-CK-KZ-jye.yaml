front:
  text: 最盛之眞文寸勞旣效良緣若存涓吉朝而䖍刻資善信以協成預奏疏詞上干玄鑒增君民淸淨之福赦小兆僭妄之罪使諸界多方盡爲十七光明之照徹絶今傾古悉被三十大願之陶鎔人物俱登重玄冥陽永霑法利庶臣玄貞之誠少伸萬一矣謹奏重刋道藏輯要高上玉皇本行集經註解卷之上此義迺洞玄靈寶對註者後人勿疑
