body:
  text: 文昌開化帝君張校純陽警化帝君吕閱長春輔化眞君邱編雷霆大元帥鄧訂証長跪奉禮此經係元始闡玉帝妙行之義故誦經者長跪䖍誠禮奉仰啟三淸境無上三境尊知大道之高三淸之尊投誠企慕皈身皈神皈命上達眞心仰瞻啟告於玉淸上淸太淸三淸境界至尊無上玉淸聖境元始上淸眞境靈寶太淸仙境道德三境道祖大天尊仰啟大羅天無上玄穹主吕純陽曰玉帝所居爲三千大千世界天宗永無退轉至高無比故云大羅玄穹主穹窿蒼穆諸天都教主仰啓三淸界侍宸諸眞眾張紫陽曰侍旁列也宸高玄不可窺見聽聞之界諸眾也諸眾眞先天九宸後天仙聖一切神佛菩薩阿羅漢金剛皆在焉妙道難思議至妙大道最上一乘不可以心思不可以言議難以思議而得造入資玄門張子房云造入由眞知力行進入也資玄門道義之門眾妙玄玄難入漸進悟入資玄卽孟子所謂居之安則資之深釋經所謂從聞思修流入亡所也妙經抉音訣玄藴抉决也挑出之意玄藴玄奥難測此妙經自眞無中挑出神機是抉玄藴導引塵迷趣元始說妙經抉玄藴導引塵俗迷人使出苦海脫其業趣臣今淨三業臣看誦經者自稱也三業身業口業心業也淨䖍誠永絕此業也口誦及心持誦經者自言誦此經眞誠口中言奉誦眞心持受也惟願大慈悲開受臣所請悲一本作尊字悲字爲是誦持此經惟願元始玉帝諸眞垂大慈悲開慈顔受臣所祈請若作尊字不能承前三啟意慈光燭卑賤聰聽聆音聲諸聖大慈光燭照臣卑賤誠心神聰聽聆祝誦音聲願臣諷誦時響徹十方界願臣諷誦經時法音響徹十方界十方聽信大法卽響徹也成就一切願如經所稱述願臣悟經修眞成就一切善願如此經中所稱述玉帝厯劫妙行從此漸進修成道事諸聖從此漸次進修成大道事諸仙聖人至心皈命禮誠有未至不爲至心少有追悔不爲皈命諷此經永誠不改而恭持故云至心皈命禮玉淸聖境元始尊大無比天中法王位冠仙佛其居永不毁壞云玉淸聖境淸微天宮解見後欝羅蕭臺之中最上之極天中之天神光芳欝蕭然眞淸故言欝羅蕭臺之中森羅淨泓音弘玄深不可窮也之上天有萬象羅列深奥難窮玉淸在諸天上故言森羅淨泓之上現有爲之梵相元始天尊爲三教宗顯化教人其妙難窮是現有爲億梵妙相具無極之神通具無極量大神通一云元始迺無極大道故云然前說爲是敷演眞玄破無有色空之礙敷宣廣布演說發明至眞玄宗破世間無有色空等障礙無者以無爲宗有者狥生色者執有空者不脫無趣元始說此經明示眞玄不屬三觀不落兩際明言直指如如見成故破無有色空之滯礙使皈道妙拯提趣類絕智愚高下之分拯救提拔一切情識業趣諸類出塵不拘古今聖愚皆可修道是絕無智愚高下一切分別眞不二妙法妙用難窺靈機罔測至聖妙用無方難以窺視玄靈道機不可測度大悲大願大聖大慈無量度人元始天尊大悲憐世心切大願願化無窮大聖聖中至聖大慈濟度無盡無量度人無限量也元始句解見後至心皈命禮此是言誦看經者眞心頂禮至尊今人口念此句者非也上淸眞境最上玄淸至眞妙境禹餘天宮自始靑而太白玄光神化妙界永不毁高大無比神運無疆經言元白禹餘天宮紫微瓊臺之中妙境難測永不動毁故言紫微非北辰紫微垣瓊臺上淸宮光萬寶莊嚴云瓊臺中玄都玉京之上上淸在太玄都白玉京之上一言在高天玉京山之上亦通接元始虛皇之統系系下記切繫也繼也靈寶體元行化故上接元始虛皇道統世系超西那玉國之根苖經攷西那玉國在陜西西方白帝生處靈寶在諸聖生化之先故言超出西那玉國根苖不可以元白作白帝也一云超當作紹言天尊爲西那玉國根苖非也入黍米珠盡挹眞玄之精粹天尊入黍米玄珠中卽儒家所謂丸弄太極佛悟正法眼藏也挹獨徹此道如世人握奇珍飽至味也故云盡挹眞玄精切華粹在香林苑屢談秘要之筌蹄天尊在上淸妙香寶林玄苑中屢次談說玄秘眞要之筌蹄道本無說經爲修行徑路卽取魚之筌捕兔之蹄不可終執故說經爲筌蹄妙德難思神通莫擬天尊妙德難以思致神通莫可比擬大悲大願大聖大慈無量度人解見前靈寶天尊始靑至太白元始再彰妙化居上淸靈運無方大道法寶傳之不窮爲靈寶天尊至心皈命禮太淸仙境大赤天宮三淸境天宮本一以玄光大著妙無窮盡故言太淸仙境元白散霞赤祥徧覆永無毁淪故曰大赤天宮非專言色之赤紅也巍巍金闕之高渺渺重霄之上太上所居巍巍不動最上至大無比倫金光不毁玄闕之高渺渺難窮永居九宸九重九霄上一云冠三十六天重霄上降生於無量數劫太上厯劫行化無有量數不可窮探大道玄宗是降生於無量數劫說法於萬二千天太上厯來化徧三千大千此言說法萬二千天太上說法宮有萬二千天界也五千秘言融三才之妙道道有五千餘秘秘言融貫天地人三才妙道八十餘度接六趣之眾生八十一化接引天人魔鬼獄畜六等趣眾生或云接六欲中滯眼耳鼻舌身意六趣眾生又云接有無色空能所六趣或從拯字拯拔悟道成眞意亦是六趣難脫太上垂慈教化拔濟神人鬼物出塵故亦作拯聖德崇高玄功廣愽太上聖德尊崇隆高玄功普廣愽大深厚莫窮故言玄功大悲大願大聖大慈無量度人解見前降生天尊太上顯化無量慈恩莫窮生生不已故云降生天尊至心皈命禮妙有眞境彌羅上宮上宮玉帝聖父宮名曩音向示現國王之身曩昔時往劫也昔顯示化現光嚴妙樂國王身卽根本帝尊之質卽根本萬天聖帝慈尊之體質始相湛寂聖父道化宗始妙相湛然常淸寂然不動實至玄至妙以難言湛寂始相實至玄遠至神妙而難以言議嗣位繼傳妙無等無倫而相踵嗣光嚴國君位繼國王宗傳其德無與同等而相倫類者踵繼先業德福彌昌故云妙無等無倫而相踵聖父之慈悲父至尊之最上尊玉帝號眾生慈父位至尊聖父至尊指玉帝言光嚴國王生玉帝故言聖父之慈悲父至尊之最上尊稱讚難窮皈依莫盡王生玉帝功德永著故稱讚難窮皈依無盡耳大悲大願大聖大慈光嚴妙樂國王聖父天尊此聖父指光嚴國王以其生至聖也至心皈命禮妙有眞境彌羅內宮內宮玉帝宮深邃處聖母居之故曰內宮慈顏烜春日之和聖母慈善容顏烜著光明如春天日色之太和懿範凛秋霜之肅懿淑恭美身範凛烈似秋日嚴霜之威肅純全梵炁先天地以素存全備虛無梵氣妙體預存於天地先化現妙身厯后妃而示應化現聖母妙身厯光嚴國君后妃應生帝具一炁胚胎之始具眞一梵氣顯化胚胎之始胚形氣初立胎形氣稍著也寓帝身生化之殊寓寄玉帝道身生化祥瑞殊異萬化祖根眾生慈母聖母誕玉帝分萬化統眾生誠萬化祖根眾生慈母大悲大願大聖大慈寶月光皇后聖母元君至心皈命禮紫金金闕白玉玉京紫金闕與黃金非二說玉帝京闕神光妙寶無二常御者淨土色尊爲黃金宴息之所紫金闕也金玉重文者讚文自當若此說住妙有之境中處玄眞之天上常住妙有無迹眞境中永處大玄至眞上天之上功成道備故妙相卓冠於諸天普度功成至眞道備故妙好光相卓然冠出於三千大界一切諸天加冠於首曰冠玉皇萬天教主故冠諸天心廣體胖故慈光徧燭於三界性天廣大妙體如如心本廣體本胖也人不能故無光明玉帝成道心如太虛之廣道身自然斯慈光照諸三界位尊而上極無上位尊無比故云上極無上道妙而玄之又玄玉帝之道高妙難窮是玄之又玄眞聖宗師天人依仗大悲大願大聖大慈解見别章穹蒼聖主玉皇大天尊穹蒼聖主諸天宗主也此號讚玉帝之尊至心皈命禮光嚴國內妙樂土中解見後註聖母凝神夢於虛無聖母夢道君抱嬰兒付已遂生玉帝是凝會神異之夢於虛無中夢本幻中之幻故云虛無然祥異特著故云神夢道君授玉質於恍惚道君降授玉帝寶玉質付聖母於恍惚渺冥中慈愛和遜仁慈惠愛温和謙遜弗貪萬乘之尊榮萬乘大國出車萬乘者也玉帝捨王位是不貪萬乘君位之尊重榮華忍辱仁柔不憚億劫之修累大忍耻辱仁愛柔弱不憚億劫之修德累行憚畏難也十萬曰億劫解見後功高無比德重難踰功行超倫故高無比恩德邁種故重大難踰過大悲大願大聖大慈現無量功德之身玉皇大天尊此號讚玉帝功德之大至心皈命禮尊居帝位高處天宮尊居玉帝位高處淸微大天宮徧遊於一切白玉京中徧遊周厯一切世界大天宮白玉京也普現於十方黃金闕內普徧廣現於十方一切大天宮黃金闕也定而能應去來自在以無拘大定而能順應或去或來妙用自然得大自在未嘗拘拘去來伸屈翕散始終皆然合而可分變化圓通而莫測翕合而可殊分神變妙化圓活大通活潑潑地莫可測度變化圓通卽佛云信手拈來無不是道儒家云左右逢源也演淸淨解脫之道演說眞淸眞淨大解悟超脫之道濟沉迷憂苦之徒濟度沉淪迷惑憂悲業苦之徒自然而然非識可識帝妙化自然非人間識性可測識者或以可識識字作誌字看非是或作解識看亦不是大悲大願大聖大慈現淸淨自然之身玉皇大天尊此號讚玉帝聖德之純至心皈命禮昔爲王嗣苦見音現玄功昔劫初爲光嚴王嗣苦見無量玄深功化三千餘劫之修行有如一日三千二百劫修眞行道如一日億萬生靈之拯度廣及十方拯拔濟度億萬生靈廣及十方一切世界雖法身由胎臟之胚腪諒聖體由道原之變化玉帝顯化生自聖母法身聖體雖由胎胞臟神之胚基腪生腪音運形化之意諒此聖體實由大道宗原之變化生成也不壞不滅杳亡杳存終不壞永不滅杳若亡實妙有杳若存𨚫虛無大悲大願大聖大慈現神明堅固不壞眞空無上法身玉皇大天尊此號讚玉帝聖果至眞常住也長跪懴悔長跪俯伏地上投誠盡恭或云屈膝時久爲長跪非也懴自陳已過願永滅此惡悔懊恨前非願自改圖卽罪人自首也臣等自從無始劫臣等看誦經者率同善人而言自從無始劫數以來無始劫世數無窮不可知其本始也無明煩惱覆眞心人性本明因事物動心自己遮蔽不能反觀內照起了妄念故曰無明煩惱因無明心起煩亂恨惱傾喪善心故曰覆眞心眞心常在雖無喪失因無明煩惱遂昏暗蔽錮如物被覆幪不見也去了自露本眞常行殺盗與邪淫常行不但專行殺生偷盗邪淫的事凡有殺心盗念淫亂之思不能斷盡意識皆是常行惡事了此身三惡業也兩舌妄言並綺音倚語或常搬說是非兩頭弄舌或無根造端而妄說言辭或萋菲售奸文飾說詞巧言亂聽而爲綺語不據實論誹謗大乘眞正教或不聞大道謬言毁論誹謗儒道釋大乘正教鬪亂親朋離間人鬪不是相毆或妄言鼓人爭心亂親朋情分離間阻隔人家和氣此上三句皆口四惡業也貪嗔癡暗縱三心或欲得無厭貪求不已忿怨懊惱嗔恨不休或迷惑泥執癡滯不改貪嗔癡暗縱三心有以暗字作一病過去見在未來言三心皆非是喜怒愛惡增七慢劉朗然云遂意生歡喜感觸生忿怒投中生溺愛違意而增惡連上三心共增爲七慢一慕浮華不求大道爲狂慢二恣肆惡念不信罪福爲悖慢三沉迷幻妄不皈正法爲褻慢四樂縱凡情不親正人爲傲慢五匿怨妬橫不畏法典爲怠慢六縱情恣慾不保身體爲惰慢七厭惡不輟不登善地不敬神明爲侮慢或以喜怒哀懼愛惡慾七情爲七慢皆由喜怒愛惡而增貪嗔癡三心不可入七慢中此說不可從依劉朗然說爲是觀者詳之也厯劫罪根難記憶厯來劫數所造惡業罪根難以考記憶想多生業垢莫能量多生世世愆業塵垢汚染莫能稱量不知多少皈依上聖大慈悲皈至誠永久歸向也依因依仰賴仗上聖大慈悲心力默佑永滅罪過悲或作尊字太拘了發露眞心伸懴悔發露眞實善心仰伸懴罪悔過誠意萬劫千生諸罪垢萬劫千生畧舉數而言厯來諸罪業垢汚之孽願從懴悔悉消除願從懴悔之後永不造業夙愆盡消散除去淨將此身心奉上眞將此見具身心永皈奉祇承上聖至眞惟願罪根悉原宥惟願厯來罪根悉䝉聖眞原無知情由盡爲赦宥至心發願以至誠心發大誓願願眼常覩玉毫相願眼中常覩見聖眞白玉毫光妙相儼然如在願耳常聞說法聲願耳中常聞聖眞說法妙聲一誠之動有眞聞願鼻常嗅眾妙香願鼻中常嗅聞聖眞法身眾妙眞香得洽梵氣願舌常讚無上道願舌常讚無上妙道非聖眞之法言不敢言願身不染邪淫穢願生生身淸不染邪淫穢惡非聖眞之法行不敢行願意常存正信心願我心意常存至正誠信之念永無邪妄欺覬之私發願上報四重恩天地蓋載日月照臨皇王水土父母生身爲四重恩發願下濟三塗苦願濟色累天塗愛累地塗貪累水塗心神形三重苦廣運慈悲憐一切願廣運我本等慈悲憐恤一切一云願帝運慈悲廣行方便度眾生願作如是功德廣行大方便化度世間一切眾生仰惟玉帝大慈悲解見前加護願心悉成就玉帝加護使我願心一切皆得如意悉能成就發願已竟完也皈依三寶道經師玄藴咒重玄秘藴大梵仙咒大哉元始大哉大不可量元始解見後無量度人解見前演淸淨教解見後登引天眞登進接引天眞一云昇座接引太拘玄座說法道身常住光徹十方座非凡座凌虛御極空浮轉法是玄座說法寂然無聲玄玄漠漠寂然無聲玉帝放光解見後喜慶難言喜慶難以言語形容是爲心傳是此眞經迺教主至聖傳心要典亦曰天根此經爲天道之玄根非言地雷復也大圓滿咒解見後瑤章洞文碧瑤天章大洞靈文集以成書集元始之秘言諸眞之請明以成玉帝之經書敷落神眞敷布落著神眞以流聖教語落典章卽此意臣今東向誦東向坐誦此經願與天齊并願齊天永遠眞誦此經存亡俱證果存亡悉證道果永度愛河津永出愛河眾生恩愛最難割眞苦惱之津誦經令一切永度愛河注想尊容想玉帝尊容稱揚寶號稱玉帝寶號至心皈命禮註見前太上彌羅無上天太虛最上玄冲彌羅無極至上之天妙有玄眞境玉帝天宮有玄象瑞光非凡象幻假永不壞微難窮云妙有玄眞境渺渺紫金闕渺渺紫金瑞光玄相之金闕太微玉淸宮太微非日月天太微垣迺太上玄微玉淸宮玉帝所居之宮玄瑞紫炁金光四十億萬里巍巍如如永不毁淪絕無塵染諸天不能及故云太微玉淸宮無極無上聖道高無極位尊無上至德大聖廓落發光明恢廓無際碧落重玄發最大無量光明寂寂浩無宗雖著大光明冲漠難窮默默無聲寂寂不可識浩浩然無有根宗玄範總十方道體法身巍巍蕩蕩爲神明之宗萬天之主浩劫聖祖是玄範總統十方湛寂眞常道湛然寂然常淸常定眞常不易之大道恢漠大神通恢恢無量漠漠無朕最大神通玉皇大天尊玄穹高上帝玉皇非一天之尊萬天之主三教之宗最上無極大天尊玄虛蒼穹高上帝念此十句聖誥當一句一拜如不能逐句拜先一拜將誥全念後九拜只念玉皇大天尊玄穹高上帝亦可禮完端坐誦經大元帥馬靈官云此經法中王神人鬼物無往不利世間或男或女不拘貧賤富貴不識字者但能敬此經聞此經女轉成男人得福夀或印造施捨或勸人持誦功德無量但要至誠不可希望疑怠此經所在諸神護之人聽吾言神亦永佑勉之勿負
