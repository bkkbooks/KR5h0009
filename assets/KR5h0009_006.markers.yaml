  - {type: variant, offset: 8053, length: 211, content: 月或灾害或危亡或鬼胎或妖異或刑剋母子平安者固多不能兩全或兩不利者亦有或以爲謫經未必有益不知正法難遇世人或不知此經尊重此經利益不聞其名者有之聞名不知重者有之或虚敬而不持謫或持誦而始動終怠或脫落混清或怠污顛倒字誤句差解會失當雖有懺謝之文難得全經之利皆人自誤不遇經功遂以爲謫經無益是爲謗法嗚呼正法宜行親恩難報救難利生學道者之急務也若教化世人敬誦此經則母子安産難免生善男善女世間皆福德相正道永流傳矣功德最大觀經者勉之皇經集註卷之六, CK-KZ: ''}
