  - {type: variant, offset: 0, length: 139, content: 高上玉皇本行集謹按抱朴子云高上者種民之上盡天之極其高無對即佛家所謂不退轉之地也玉皇者聖中最尊神中最貴諸佛聖師萬天帝主故尊稱曰玉皇吕純陽云道高無皇經註觧卷之上文昌開化帝君張校純陽警化帝君吕閱長春輔化眞君丘編雷霆大元帥鄧天君訂証皇經集註目録本經三卷一萬二千三十六字上卷中卷下卷五品清, CK-KZ: 良緣淸}
