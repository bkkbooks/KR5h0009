  - {type: variant, offset: 0, length: 418, content: 高上玉皇本行集謹按抱朴子云高上者種民之上盡天之極其高無對即佛家所謂不退轉之地也玉皇者聖中最尊神中最貴諸佛聖師萬天帝主故尊稱曰玉皇吕純陽云道高無皇經註觧卷之上文昌開化帝君張校純陽警化帝君吕閱長春輔化眞君丘編雷霆大元帥鄧天君訂証皇經集註目録本經三卷一萬二千三十六字上卷中卷下卷五品清微天宫神通品第一係上卷太上大光明圓滿大神咒品第二玉皇功德品第三俱中卷天眞護持品第四報應神驗品第五俱下卷本經集註十卷十萬餘言首卷諸眞序前序附攷義管見序二卷三卷四卷俱上卷註五卷六卷七卷俱中卷註八卷九卷十卷俱下卷註經名同異辨倫曰皇上帝仁孚浩刼功超列聖盡善盡美稱讃難窮位乎玉清宣元始之化廼號玉皇韓湘云本行者迷玉帝成聖根本歷修妙行集經集元始五品之妙言合爲一經示後人修行之正路耳管見云惟天蓋高玉帝所居之天位接玉清又超諸天故曰高上人見玉帝之尊以爲絶德人終不能及不知聖道無二我與至聖齊肩帝之尊帝之妙行成之也故天樞張上相傳集是經欲人希聖成眞故明旨云玉皇本行集經欲人觀經了悟歷考, CK-KZ-jye: ''}
