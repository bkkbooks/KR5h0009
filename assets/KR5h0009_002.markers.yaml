  - {type: variant, offset: 134, length: 388, content: 宫神通品第一係上卷太上大光明圓滿大神咒品第二玉皇功德品第三俱中卷天眞護持品第四報應神驗品第五俱下卷本經集註十卷十萬餘言首卷諸眞序前序附攷義管見序二卷三卷四卷俱上卷註五卷六卷七卷俱中卷註八卷九卷十卷俱下卷註經名同異辨倫曰皇上帝仁孚浩刼功超列聖盡善盡美稱讃難窮位乎玉清宣元始之化廼號玉皇韓湘云本行者迷玉帝成聖根本歷修妙行集經集元始五品之妙言合爲一經示後人修行之正路耳管見云惟天蓋高玉帝所居之天位接玉清又超諸天故曰高上人見玉帝之尊以爲絶德人終不能及不知聖道無二我與至聖齊肩帝之尊帝之妙行成之也故天樞張上相傳集是經欲人希聖成眞故明旨云玉皇本行集經欲人觀經了悟歷考良因追蹤至聖以成上眞也其後又稱曰太上洞玄靈寶經蓋言大不可量高不可極故曰太上闡先天道德之秘爲萬世文字之宗洞明三景顯露玄機故曰洞玄玄靈之藴爲天人億代法寶故曰靈寶要之經以明道道屬我身人能盡性至命了悟此道探本躬行可以入聖矣清微天宫, CK-KZ: 宮}
