  - {type: variant, offset: 8205, length: 0, content: '', CK-KZ: 天常有色象無色界四天以空定爲樂大梵四天知空知無雖無冀樂靜福有數諸天之外最上種民四天無輪迴成壞以前諸天等義不同在種民下有成有壞四相非人我眾生夀者福相盛衰德相盛衰分四相也一云生壯老盡爲四相一云不威儀不神通不快樂不精健爲四相輪迴侵逼者欲色梵無色三十二天久暫不同其天人福盡轉生人間皆有定數故云輪迴侵逼能捨除妄想者逐緣妄生或想福或想慧或想夀或想空或想定或想上昇或想轉降言所不盡心所不窮皆名妄想捨除雜念一緣不生空空無無是捨幻念除妄想坐招自然天福益固者不待思求自然坐致欲界色界無色梵界皆自所居而得超脫永不輪轉無毁淪得大堅固不入輪迴身度三界者能出欲界於色界及無色梵界天地人出三有象高度上霄玄境與道長存者與道合眞浩劫長存觀天人寶經之效則世人可知矣勉之應驗品續十八章是此經典無與等無能勝是大威德大神咒能令一切枯槁便生枝葉花果茂盛能除眾生極重苦惱能令短命眾生而得長夀此經功德不可思議歎莫能盡無與等者一切諸經諸法皆出其下無與等倫無能勝者一}
