  - {type: variant, offset: 8204, length: 0, content: '', CK-KZ: 口也床榻不淨棹几牀榻座器不淨便將此經安置供放九祖始祖四昭四穆爲九祖受考酆都考考察過失也吏作拷掠之拷此卽小兒犯事罪坐家長之義累及子孫害纒後代積不善之家必有餘殃受大苦惱罹大罪苦煩惱無限遇聖教累救罪惡小減卽蒙經功法力咸遇上聖殊恩上帝恩赦也得脫離地獄苦報餓鬼腹大咽喉微小飲食難下黒獄羅酆不見漿水亦不聞名生類莫蠢於物鬼報盡生畜生中其業尙在人世雖一中國難投男身難得生邊夷外域而復女身人中之不美也貧寒困苦貧賤凍餓困苦艱難癃殘百病衰損殘廢百病縈纒受無量苦言不盡之苦人所憎惡厭棄求生不得安生求死不能卽死皆以輕慢此經之故獲罪業如是之重亦可哀哉夫人生參天地爲三才此身貴重親賴以繼光前裕後道賴以傳所係匪輕一慢經法殃及已身緣祖先禍後代受業報何其愚之甚也又觀三教書言男女法性無有分别在在處處皆爲樂土中庸云富貴貧賤夷狄患難素位而行無入而不自得今言外域女身病難之體爲人憎棄何也蓋無分別皆自得者道也分等類言罪福者報也報應明人斯爲善矣嗚呼人一也皆可爲善人也尙勉力進道勿造業而爲人所憎應驗品續十五章又復有人初雖信受後復慢易善惡童子上奏三官黑薄書名靑編減算身歿之後拘閉幽牢往復三塗無由解脫或於見世受種種病疥癩癰疽以爲果報憂悲苦惱日夜相煎或身被橫惡所加或牢獄繫鎻或非命自害毒藥所殘或被虎狼毒蛇之所噉食或爲寃債之所牽引或行山林値遇惡人被他屠割推落崕岸或被邪精魍魎之所殘害或値水火之所焚漂或被刀兵之所橫誅輕斯經故橫喪天年獲如是果獲如是報可不悲歟可不痛歟善惡童子紀錄世人善惡之童子黑簿錄過之簿也書慢易經典之罪青編減算減慢易經者之算輕斯經故獲如是業果報應可不悲歟可不痛歟旣悲哀其苦又痛惜其愚此見天尊之大慈也証疑夫後一慢易此經罪報無窮則尊道信經貴有恒也久道化成經功全驗盡被其德領其效矣人惟無恒始勤終怠無怪乎罪業之及也抑自古及今不才者間出不持經不聞經者甚眾獲罪厄患者每有豈皆盡慢經者耶蓋經以言道不信道而無德卽慢經者也無德有罪卽慢經之罪也欲尊經消罪當進道修德應驗品續十六章汝宜殷勤依此奉行勿生邪念若諸念不生萬緣頓息塵沙惡業隨心消散一切灾魔自然殄滅此經功德不可思議是誠無比最上妙法諸經之王有大利益非人勿示諸念不生者無善念無惡念無無念無無無念萬緣頓息者空五累除九識離四象絕百非空萬有忘一無外緣內緣業緣福緣空定妙緣宿世今生攀援未來一切斷絕悉盡根塵塵沙惡業隨心消散者世上塵恒河沙不可稱數如是眾業隨信經心悉皆消散三教萬法一切無可比此誠爲最上妙法兩門之經儒之書皆不及此爲三教諸經之王道雖人人可學不信不敬者不可傳非人勿示非重道之人不傳示也解疑儒者不教自暴自棄之夫佛不度無緣之輩道法最尊豈强不信之人哉噫信心進道之基眞志成聖之要不信不可以授經人當至誠勵志以爲受經入聖之本應驗品續十七章若諸天人五衰四相輪迴侵逼能捨除妄想受持是經坐招自然天福益固身度三界與道長存此經至尊不宜妄示人矣天人者欲界六天尙有欲樂色界十}
