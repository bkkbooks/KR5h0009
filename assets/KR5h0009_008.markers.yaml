  - {type: variant, offset: 1033, length: 298, content: 衆悉令下降覆護受持是此經者玉帝告曰持經非徒口誦也若有世間一切衆生孝順事養父母恭敬道經師三寶竭力盡心上忠於君不殺生不偷盜不淫慾不嫉妬不嗔怒不怨恨不驕傲不奸詐奉受道典清凈玄戒持守眞正齋素不怠忽不躁急坦然澹然默任自然棲神養靜法天凝眞冥心合於大道欽若昊天祗奉道法生尊崇珍重之心一云自己嚴敬不苟且奉持誦詠是經我玉帝自言也當作朕字讀即勑下周流諸世間一切法界遍傳十方無極世界勑命東方東華帝君青騎南方朱陵大帝赤騎西方皓靈皇老白騎北方紫微帝君黑騎等神仙兵馬東南扶桑大帝西南太華元老西北皇天上帝乾方也東北沖虚天君上方天皇大帝此非勾陳天皇廼司天之神佛云帝釋天主也崑崙蒼老黄騎下方來和天君名山大洞與其部衆神仙兵馬無鞅數衆, CK-KZ: 眾}
