  - {type: variant, offset: 8200, length: 2, content: 集註, CK-KZ: 生諸惡逆偏眼邪視乃至起一惡心發一惡言妄生謗讟持經之人其罪深重命終之後墮大地獄永無出期不惟慢神謗經罪重目見曰覩生諸惡逆有不信心故不知經爲道語法言持之利益阿慢輕忽厭惡謗毁生諸過惡悖逆偏眼邪視不喜見經並持經人無有正眼定觀輕藐憎厭讟詈毁也持經作善本不可毁邪執惡人不知緣業罪福不知持經之善妄自生謗毁讟詈之言加持經之人命終之後終盡也墮大地獄無間獄也永無出期永終也長也妄謗正法業根深重故墮地獄難出夫識見一也見之不正則爲邪人一也執迷不悟則爲愚爲惡心一也生惡念則爲逆眼目一也偏眼邪視則爲過一念至微也起一惡心爲業根一語無幾也發一惡言爲罪本君子成人之美嘉人之善持經者當稱讃也妄生謗讟是自作孽人生本無業自惹其罪深重是大可哀命終是還造化舊物也固無拘迺一謗法墮大地獄死亦不安其過如何永無出期天心仁愛上帝好生惟神正直不掩沒人今罪者無出期豈天拘之哉孽自己作定業難逃欲除已業還須自信至善不囘業根脫矣噫刑獄天討法本無親慈父不能庇其子孝子不得私其父至公者神豈消自致之業哉信經向法自懴前業如世人出首信誠免其罪犯也人生世間聖愚無二卽不能出言有章聲爲律幸勿出訛言而爲惡口不能行無過動身爲度幸勿行惡事而造身業不能心無妄想守至眞幸勿起惡意造心業不知大道勿謗道不能解經勿非經不能持誦勿謗人不明鬼神生死因果勿起毁言一心正信久自明道漸成聖眞又何罪業之有應驗品續十四章至若在世男女得遇是經不生敬仰穢手污觸葷口讀誦床榻不淨便將安置或誦是經講習俗語共同戲笑以爲常典如是之人命過之後墮無間獄永無出期殃緣九祖受考酆都累及子孫害纒後代是人於地獄中厯無量劫受大苦惱縱遇聖教累承救拔罪惡小減又遇上聖殊恩得離地獄生餓鬼中厯干萬劫不聞漿水之名鬼報得盡生畜生中畜生報已若生人中復生邊夷外域而復女身貧寒困苦癃殘百病受無量苦人所憎棄求生不生求死不死輕斯經故獲罪如是此甚言慢經之報不生敬仰不敬重仰慕也穢手污觸不淨之手或請捧經}
