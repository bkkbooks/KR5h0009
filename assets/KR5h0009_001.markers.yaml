仙明解適羅太史付愚不彙入藏是秘天寶叅入又於見未安懼劣質管見不能聯仙旨融註意嚼飯旁付令人嘔噦使道味至趣爲某調亂則罪益甚矣嗚呼述者之明世亦希覯臣愚陋而僣述者之事宜無功而取罪也然志在行道罪我之議孔子不辭愚何人斯敢避罪而不述己成之論耶若重道英流觀某管見而憐之繼爲發明以宣此經之義是編爲不徒矣謹序明萬曆十五年講修道經臣山東周玄貞百拜皇經集註謄録序行道揚名以光先人世所謂忠以成孝古今相襲之道也臣靜粹幼業儒雖知天帝之尊行道不在功名寔知所未逮矣後從玄師周雲清修道藏供書務觀皇經註廼知三教一理性道無二此經直指玄要悟此則道盡遂僭序卷首以自勉明萬曆十六年夏京都奉道臣王靜粹叩書諸義攷目道源攷道本無象無名孰究其源奚從而攷自元始分化太虛孕妙有道之秘彰名因以立眞一含三三教峙焉有無終始不外五行刼刼相生聖聖相承皆道也縱有跳出三界不在五行亦不免爲成道之人耳固道之所由顯道家之名所自來矣故尋經源先攷此經源攷經以載道度世慈航諸經皆聖眞法言無非至理但此經演自元始化本玉帝元始爲三教之首玉帝爲萬法之宗此經至玄極妙獨冠三教又爲諸經之玉浩刼常存演從無始秘之玄天韞在玉笈字非凢品廣長一丈光徹無量天眞皇人應時按筆書傳世間此經之所由宣布故續道源以繼攷玉帝萬法教主聖祖玄師岀處世系攷師以度世破迷拔苦傳道授經開來継徃大道玄師統三教包萬法居天中之天爲聖中之聖無始無終本莫窮其自在萬象之先但道妙分眞現生光嚴妙樂國中廼徃昔刼中化顯也世人觀天道陽明陽主施其機常張尊帝曰張大帝迷徒不達此埋妄以今北直隸眞定府行唐張氏族爲玉帝之後豈知行唐張族廼張果之支裔張仙之後也奚可混作一論哉此姓氏世族之攷耳若論世系玉帝爲大道之首分浩刼之古祖焉有死生姓名耶若玉帝聖后聖子眷屬皆化光嚴太子時宫眷帝復登昇宫眷悉證道耳要之帝后宫眷非實女身皆天至眞爲度群生顯化女身經已言之即佛成道妻子證聖也目玉帝爲道祖累刼衆生萬類皆天地之生意道脉之支分孰非玉帝之眷屬統系若大羅宫眷證道後皆天眞聖身如文殊掌無垢世界龍女成道而化男身義同今之僧道世人不觀此埋妄以爲玉帝有宫眷有輪迴爲二乘果豈知諸天可盡三清境大羅天無盡諸天帝輪迴玉帝不輪迴蓋玉帝廼道身道無窮玉帝豈有窮乎信乎玉帝最上一乘諸佛之師萬天之王宫眷皆道化之妙意矣玄系之畧若此學者勿妄論請詳是攷刊經功德攷太古經無紙筆方策記之蒙恬蔡倫造紙筆載經書後高士刊板印記功德又加倍世之迷徒旁門不知恬倫受福於兜率天以兹二人有地獄之報二人之遊冥府從太乙救苦天尊冥主地藏菩薩執經入地府化度邪說罪人耳二人豈有地獄之苦哉功德甚大刊經演教之品也持誦施經講註寳益攷持誦講觧心要至誠一無染着貪妄功德如經中語印經施捨功德又大以其廣布法品若輕經謗經污損經典罪亦深重勉之戒之勿負聖賢之教玉帝聖號同異攷玉帝聖號崇自浩刼前中古復尊上重稱讃耳世主好道感玄恩各就所見聞所皈重事與時會功以世顯隨其彰著人人共覩聽者敬上諸神之號以定稱謂玉帝有四一太微玉帝漢武帝上太薇垣星主號也二梵天玉帝漢宣帝上天市垣帝主號也三焰華少微玉帝漢哀帝上先天定位號也四紫極玉帝漢光武上後天乾號也皆非此玉帝此玉帝號昊天金闕無上至尊自然妙有彌羅至眞玉皇上帝又曰玄穹高上玉皇大帝是帝宰諸天永不毁淪世不詳考謬謂帝即帝釋不知玉帝名號各有不同其四玉帝俱屬高上玉帝統御今言四帝天皇同列者亦非是玉帝達天者詳之玉帝御蒞推極攷葛仙翁曰世界之天所見皆同儒家言一天地一上帝道教言三十億萬大法界界有三十六天天各有帝俱屬高上玉帝統攝釋教言三千大千世界界有三十二天界各一玉帝三教之論若殊然言一天者天外言太虛稱其不可窮言三十億萬自是之外亦言不可思議言三千大千者自此之外亦言無盡量故儒言順帝之則又曰聖希天天體無窮至元會運世此理亦在是以上帝爲不變遷也道言高上虚無眞帝不毁佛言眞如自在永不退轉是俱言玉帝無毁淪也故言一天者非遺大也舉總名而言之與玄釋不二矣言三十億萬三千大千非謬說也析分數而言與儒者相同矣至於釋言各一玉帝一界各一極也道言共此玉帝衆界同一無極也曰太虚曰不思議曰無盡量皆知道不變玉帝常在耳苟以世界分而謂玉帝殊豈以無極之理有二乎或以元會遷而上帝毁豈無極之理有壞乎知道不壞則玉帝常在信矣毋持魔說以謗聖玉帝清微天界攷王重陽曰清微天之最上玄微處即道家所謂種民天儒家所謂沖漠之表蒼蒼不毁釋教所謂不退轉之地今禪之雜文内誤言玉帝在須彌山頂廼日月天四王天或有毁壞惟彌勒内院爲不退處又言彌羅垣又言彌來園此三箇異名是道經無上元君分出即彌羅玄眞境玉帝所居清微天也其日月四王天蓋太微玉帝之居非此大天尊高上玉帝也故道經言玄谷山頂有帝君上禮玉皇大天尊玄谷山即禪家須彌山日月天主管理此天之神即今帝都京兆尹也是以釋經言如來說法帝釋張蓋即此時狀元及第金殿傳臚禮部舉觴京兆尹張蓋以示朝廷旌賢之意邪流遂以張蓋之帝釋爲高上玉皇是以張蓋京兆尹爲皇帝也其謬甚矣惟訛謬若此斯雜文中言崑崙山有八處不知方向雖有八極八極總有一西北西北乾首崑崙儒家所謂天柱地維即道之玄谷山釋之須彌山豈有八箇之理世人訛言已久故因攷清微天界併言而戒誤論者玉帝尊次攷劉海蟾云玉帝在道教即三清之化道家先三清者先虚無而後妙有所謂無極太極非有尊卑之殊在釋教即燃燈古佛顯化釋迦佛身禪家先佛而後玉帝即外國尊其主而後中國皇帝之義也若攷道之尊處金輪經云玉斗玄尊命駕神遊上極前行五星爲使者後以釋梵作威儀釋梵仙佛菩薩也帝信三清與佛者顯身度衆生使皈道也世流妄分乘位不攷源流以玉帝爲次尊是世人有大於帝王者矣甚至以三清佛尊比太上皇又悖玉帝先後顯化之意而以異姓異號擬父子其罪尤甚噫世不能無玉帝猶生必有宗祖父母也謗上帝而别立門户是舍宗祖父母而自尊也奚可哉玉帝號稱利益攷藍采和云人知尊上帝不稱玉帝寶號儒者或言誦之非是不知大孝終身慕父母非孟子之言乎慕父母而心誠則爲孝子稱帝號而心誠永無過行豈不爲乾坤肖子哉踐形惟肖則天地皆歸利益豈不大乎皇經利益攷張紫陽云有帝王之興必有帝玉之制守玉制而過者未之有也況皇經心印廼道要心宗體之則爲至聖豈止免過哉今人不信利益惟體會誦持未誠耳智者思之帝經校録功過攷鍾離子曰人物之生本於道皆自天帝而分眞故善則德動天福自至即貧賤而安樂勝於他人是眞福堂惡則自作孽天降殃即富貴而凶咎是活地獄禍福有定隨人善惡天人交應捷於影響迷徒不信故功格言眞誦皇經一部爲千種功德即升天堂眞誦者内外總一言行合道不在口上念經惟在心心實善善乎王靈官曰何勞妙手圖吾像但願君心合我心能心合上帝則德福並懋廼眞誦善功其餘持誦經文戒口制心尊信論嵗月雖有福德因其善之大小而應是又次矣過格言不信此經墮入邪道以心不合道遂作邪人也又言毁謗眞文身墮地獄不信者惟聞經中功德信之不及尚爲小過毁謗則廢天章心作大業凶咎無邊淪於陰惡罪不可活故墮地獄途又言詆帝毁聖廢神居裂眞經頑惡無忌永受業禁禍及七祖毁謗則口訕靈章言冐天威故罪在自己詆帝裂經縱惡不悛身爲不善遺臭無窮虧體辱親雖孝子慈孫百世不能改己身罪業豈有出期祖親之咎又何能赦不然國家設法禁罪人可矣有夷三族滅九族者何也以罪犯過重故延及親族惟若此則爲法網雖延其餘或邪視經典或誦置不虔或持念訛慢或妄意裁度或是此非彼或優彼劣此隨其過之大小又有一定之報在矣鳴呼帝之經當今之法也不信王法律有明章不遵盛典豈無天條惜人身難得至道難聞父母生我其勞苦同有德者福祖親即今世登甲科封贈顯親也有過者禍祖親即今世子弟犯事罪坐家長也人身同而善惡異親恩同而福業殊人何不爲善而甘作惡徒遺累親宗哉經功過格言此見眞經在人心上純善則經功自有上智行自合經不在口誦中智者因經見道下愚則語之弗信上智不常有下愚亦不多中人旣廣則教化之功信不可缺觀是經者豈可不體玉帝慈悲度世之意而視爲泛常耶皇經集註義畧攷石杏林云皇經言道之眞吾性分固有之宜不須解世人多慮資有高下偏見者廣諸仙解是非能盡說玄旨姑備後人之折哀耳皇經同異攷張子房云此經本無二名高上靈寶之分後人穿鑒隨意增減字句牽合文意殊失本旨今攷高上靈寶出自各仙眞稱揚語後人誤執爲二兹據玄都定論録傳世間後學鑒此定志黙體或遇刊寫傳講差處從公考校其外添文句字畫皆訛誤也達者勿泥執焉皇經集註刊傳䟽文大明講道經修玄箴嗣全眞弟子山東小兆臣周玄貞誠惶誠恐稽首頓首齋沐百拜奏伏以道妙無爲毎因時而著見人心有覺宜隨地以積功臣玄貞一介微質三才末品慕妙法以皈玄本儒行而會道一覩帝經勝獲珎異即逐字以精研冀因文而了悟但聖典無註體認惟難臣貞用發哀虔博方解義緒纂仙聖格言彙入道藏函部縁三卷之眞文用集序次敷五品之祕論以列篇名卷編爲十幅計六百總列一百八章大畧十餘萬言千聖心法覩册昭然浩刼玄宗舉目如在雖未能獨窺上聖之藴奧亦庶使衆觀, CK-KZ-jye: ''}
  - {type: variant, offset: 0, length: 5356, content: 皇經集註啟讃序天猷副元帥和應善天尊製原夫大道無刑妙萬物而資始至眞罔象攝群心而自歸機若洪鍾扣之立應邈哉上聖至誠遂通恭惟本行經者玄皇之秘言穹昊之樞要浮黎眞境紀談授道之初紫微上宫顯露緘藏之跡實諸天之隱韻乃大梵之仙章八角垂亡本由於宸翰千眞列衛普度於人靈年刼孰究世數莫知蓋大地衆生迷謬喪失眞源自壞刑體耽惑情慾不能洗滌聖文遂隱今日崑山玉顯巨海珠分獲覩瓊文伏增驚歎所謂幽囚重繫慕妙義以薦原痼疾沉痾仰德音而頓愈昏衢惠炬溟渤舟航保國寧家濟生度死金編玉軸浩渺難量非慕眞風曷契斯理聊叙大要以化未萌云耳高上玉皇本行集經前序道本無言諸經皆眞聖唾迹但因言顯道文亦聖賢之所不廢自三才分名教立理本一致謬妄者或歧之歧之非是也元始坐照於諸劫之先當時至運會諸眞問玉帝行因遂說是經廼法品最尊靈文第一自來經書無有及此者眞文隱奧不事奇麗梵對而旨自難窮諸聖所不能言思議所不能到此經括盡明若掌臣張仲事文中古供職於周祇承上帝即聞此經願終寶持帝偶較人間功過録臣仲在忠孝之途命掌化九天編輯此經經中玄藴益得飽味惜世觀經者不能體聖意契玄旨謬刊訛傳言韻或誤遂分洞玄高上二名各執私見以傳習大悖說經之意甚至膠柱狂誕之徒或不信此經或以爲因襲他典或無知强觧皆不知是經之尊而罪福報應不可逃也其過何可言臣仲不忍盛典之失傳惜塵俗之愚謬誤犯無知不聞大道奏承帝命使仙眞解經說義流傳凡世作窮經之關鑰爲人道之梯階庶聖經法航可濟久溺之流玄宗妙藥易醫積沉之病聞經悟道永無妄議應機識眞終免輪沉三千大千界界悉太和之域從刼至刼代代爲樂利之場求道必得無願不成是經功德斯無負矣謹序九天開化文昌梓橦帝君臣張仲頓首百拜原道南極遐齡老人臞仙撰臞仙曰稽夫道教之源昔在混茫始判人道未備天命我道祖軒轅黄帝承九皇之運秉六龍以御天代天立極以定三才當是時也天地尚未昭晰無有文字結繩以代政無有房屋巢居以穴處無有衣裳結草以蔽体無有器用汗尊而杯飮我道祖軒轅黄帝始創製文字製衣服作宫室制器用而人事始備今九流之中三教之内所用之文字所服之衣裳所居之房屋所用之器皿皆黄帝之始制是皆出於吾道家黄帝之教焉且夫老子謂生天生地生人生萬物必有所生者曰吾不知其名强名曰道强字之曰大故曰大道其教曰道教世方有道字之名以是論之凢言修道學道者是皆竊老子之言以道爲名也豈非老氏之徒乎又若老子所謂玄之又玄爲衆妙門玄妙二字又皆竊之爲名用之於經者是皆用老子之言也又若莊子書曰有大覺而後知聖人此大覺二字乃莊子所立之名徵宗取之而封金仙其經皆用之是皆出於吾道家之書黄帝老莊之教也皇經註緒前序道之一字三教同尊稱之廼妄誕狂流目道爲二乘是不知道也玉帝三教同尊事之盲徒或稱爲天主議其不尊是不攷玉帝本行根由也帝修德無量功成不毁位至尊名最勝統萬天包三教御三千大千歷劫自如儒家稱爲上帝佛家號曰燃燈道號玄主尊貴無倫睹是經則知帝妙行可破千古之疑萬種之惑惜不知者未契經文猶有妄議不能了悟增罪愈深豈識人生本於道宰於上帝明心於聖訓若輕帝慢天毁謗經文皆不明大道是背本忘親不達生成之自也臣嵓慨此已久故序於經註之首以示戒純陽警化孚佑帝君臣吕嵓頓首百拜序皇經集註再緒前序道之有經如天之有日月國之有典章覩日月面墻之弊可免遵先玉之法而過者未之有也則崇信眞經豈非入道之準的乎況此經元始親傳玉帝諸神承宣三教最上品大聖秘密言在在宜尊刼刼當重但無言之道此經已作文具又何用註解哉然經以文言自得道者觀之耳未得入門正深借於此矣不然渡河無筏焉得到岸嗟嗟舍經求道非也執經爲道亦非也以心觀經以經驗心心融神會此天寶靈章固在我性分中眞明不至泥文矣奚有二病哉長春輔化明應眞君臣丘處機頓首百拜皇經集註前四序道之大玉帝之尊皇經聖玄奥臣震知之已久世多昧而興妄議將以道可離天可褻聖經可輕耶豈知道有經即性有此身天有帝即身有天君耳無幻身則性無所附而妙不彰非天君則身無主而形爲虚身心不可無則帝恩可不報經功可不信哉但信經非徒以文惟神會以心耳眞得不忘則妙果成矣雷霆大元帥臣鄧天君頓首百拜恪序三讃臣鄧天君稽首言讃大哉至道無宗上眞道卓爾三教惟此獨尊讃皇矣玉帝三教無倫帝沙界浩刼永皈至尊讃皇經盛典微妙甚深經三教括盡法品最尊皇經集註初纂前序宣聖不言神而祇事上帝儒者諱談玄而敦尚心學上帝固儒家之不敢慢矣卒無觀道經會玄旨融三爲一者豈意專立門耶抑行道而不暇耶吁亦隘矣事不在於徇名道惟貴於實益玄經非矣何以言道是矣又何殊於儒而可拘拘哉臣洪先幼習孔訓嘗及玄典恍若有得未敢輙是迨長捷龍頭居金鸞坡得備覽三教書益知莫尊於道莫深於玄三教語莫勝於皇經如菽粟布帛之不可少奥意難規諸仙註不可不傳因寄迹方外虔輯成卷惜弱軀日驘未及刊布後遇山東濟南隱客周雲清氏講玄經修道藏遂托友人天拙子記愚言以付之明萬曆十三年冬前狀元方隱臣江西羅洪先叩序皇經集註纂序道之難言久矣臣玄貞蒙爾蠧質草莽下士何足知道而修玄藏集皇經編註耶以蚊負山徒見其不勝任已但大道不遺於卑陋下學亦可以知言玉經雖玄諸仙明解適羅太史付愚不彙入藏是秘天寶叅入又於見未安懼劣質管見不能聯仙旨融註意嚼飯旁付令人嘔噦使道味至趣爲某調亂則罪益甚矣嗚呼述者之明世亦希覯臣愚陋而僣述者之事宜無功而取罪也然志在行道罪我之議孔子不辭愚何人斯敢避罪而不述己成之論耶若重道英流觀某管見而憐之繼爲發明以宣此經之義是編爲不徒矣謹序明萬曆十五年講修道經臣山東周玄貞百拜皇經集註謄録序行道揚名以光先人世所謂忠以成孝古今相襲之道也臣靜粹幼業儒雖知天帝之尊行道不在功名寔知所未逮矣後從玄師周雲清修道藏供書務觀皇經註廼知三教一理性道無二此經直指玄要悟此則道盡遂僭序卷首以自勉明萬曆十六年夏京都奉道臣王靜粹叩書諸義攷目道源攷道本無象無名孰究其源奚從而攷自元始分化太虛孕妙有道之秘彰名因以立眞一含三三教峙焉有無終始不外五行刼刼相生聖聖相承皆道也縱有跳出三界不在五行亦不免爲成道之人耳固道之所由顯道家之名所自來矣故尋經源先攷此經源攷經以載道度世慈航諸經皆聖眞法言無非至理但此經演自元始化本玉帝元始爲三教之首玉帝爲萬法之宗此經至玄極妙獨冠三教又爲諸經之玉浩刼常存演從無始秘之玄天韞在玉笈字非凢品廣長一丈光徹無量天眞皇人應時按筆書傳世間此經之所由宣布故續道源以繼攷玉帝萬法教主聖祖玄師岀處世系攷師以度世破迷拔苦傳道授經開來継徃大道玄師統三教包萬法居天中之天爲聖中之聖無始無終本莫窮其自在萬象之先但道妙分眞現生光嚴妙樂國中廼徃昔刼中化顯也世人觀天道陽明陽主施其機常張尊帝曰張大帝迷徒不達此埋妄以今北直隸眞定府行唐張氏族爲玉帝之後豈知行唐張族廼張果之支裔張仙之後也奚可混作一論哉此姓氏世族之攷耳若論世系玉帝爲大道之首分浩刼之古祖焉有死生姓名耶若玉帝聖后聖子眷屬皆化光嚴太子時宫眷帝復登昇宫眷悉證道耳要之帝后宫眷非實女身皆天至眞爲度群生顯化女身經已言之即佛成道妻子證聖也目玉帝爲道祖累刼衆生萬類皆天地之生意道脉之支分孰非玉帝之眷屬統系若大羅宫眷證道後皆天眞聖身如文殊掌無垢世界龍女成道而化男身義同今之僧道世人不觀此埋妄以爲玉帝有宫眷有輪迴爲二乘果豈知諸天可盡三清境大羅天無盡諸天帝輪迴玉帝不輪迴蓋玉帝廼道身道無窮玉帝豈有窮乎信乎玉帝最上一乘諸佛之師萬天之王宫眷皆道化之妙意矣玄系之畧若此學者勿妄論請詳是攷刊經功德攷太古經無紙筆方策記之蒙恬蔡倫造紙筆載經書後高士刊板印記功德又加倍世之迷徒旁門不知恬倫受福於兜率天以兹二人有地獄之報二人之遊冥府從太乙救苦天尊冥主地藏菩薩執經入地府化度邪說罪人耳二人豈有地獄之苦哉功德甚大刊經演教之品也持誦施經講註寳益攷持誦講觧心要至誠一無染着貪妄功德如經中語印經施捨功德又大以其廣布法品若輕經謗經污損經典罪亦深重勉之戒之勿負聖賢之教玉帝聖號同異攷玉帝聖號崇自浩刼前中古復尊上重稱讃耳世主好道感玄恩各就所見聞所皈重事與時會功以世顯隨其彰著人人共覩聽者敬上諸神之號以定稱謂玉帝有四一太微玉帝漢武帝上太薇垣星主號也二梵天玉帝漢宣帝上天市垣帝主號也三焰華少微玉帝漢哀帝上先天定位號也四紫極玉帝漢光武上後天乾號也皆非此玉帝此玉帝號昊天金闕無上至尊自然妙有彌羅至眞玉皇上帝又曰玄穹高上玉皇大帝是帝宰諸天永不毁淪世不詳考謬謂帝即帝釋不知玉帝名號各有不同其四玉帝俱屬高上玉帝統御今言四帝天皇同列者亦非是玉帝達天者詳之玉帝御蒞推極攷葛仙翁曰世界之天所見皆同儒家言一天地一上帝道教言三十億萬大法界界有三十六天天各有帝俱屬高上玉帝統攝釋教言三千大千世界界有三十二天界各一玉帝三教之論若殊然言一天者天外言太虛稱其不可窮言三十億萬自是之外亦言不可思議言三千大千者自此之外亦言無盡量故儒言順帝之則又曰聖希天天體無窮至元會運世此理亦在是以上帝爲不變遷也道言高上虚無眞帝不毁佛言眞如自在永不退轉是俱言玉帝無毁淪也故言一天者非遺大也舉總名而言之與玄釋不二矣言三十億萬三千大千非謬說也析分數而言與儒者相同矣至於釋言各一玉帝一界各一極也道言共此玉帝衆界同一無極也曰太虚曰不思議曰無盡量皆知道不變玉帝常在耳苟以世界分而謂玉帝殊豈以無極之理有二乎或以元會遷而上帝毁豈無極之理有壞乎知道不壞則玉帝常在信矣毋持魔說以謗聖玉帝清微天界攷王重陽曰清微天之最上玄微處即道家所謂種民天儒家所謂沖漠之表蒼蒼不毁釋教所謂不退轉之地今禪之雜文内誤言玉帝在須彌山頂廼日月天四王天或有毁壞惟彌勒内院爲不退處又言彌羅垣又言彌來園此三箇異名是道經無上元君分出即彌羅玄眞境玉帝所居清微天也其日月四王天蓋太微玉帝之居非此大天尊高上玉帝也故道經言玄谷山頂有帝君上禮玉皇大天尊玄谷山即禪家須彌山日月天主管理此天之神即今帝都京兆尹也是以釋經言如來說法帝釋張蓋即此時狀元及第金殿傳臚禮部舉觴京兆尹張蓋以示朝廷旌賢之意邪流遂以張蓋之帝釋爲高上玉皇是以張蓋京兆尹爲皇帝也其謬甚矣惟訛謬若此斯雜文中言崑崙山有八處不知方向雖有八極八極總有一西北西北乾首崑崙儒家所謂天柱地維即道之玄谷山釋之須彌山豈有八箇之理世人訛言已久故因攷清微天界併言而戒誤論者玉帝尊次攷劉海蟾云玉帝在道教即三清之化道家先三清者先虚無而後妙有所謂無極太極非有尊卑之殊在釋教即燃燈古佛顯化釋迦佛身禪家先佛而後玉帝即外國尊其主而後中國皇帝之義也若攷道之尊處金輪經云玉斗玄尊命駕神遊上極前行五星爲使者後以釋梵作威儀釋梵仙佛菩薩也帝信三清與佛者顯身度衆生使皈道也世流妄分乘位不攷源流以玉帝爲次尊是世人有大於帝王者矣甚至以三清佛尊比太上皇又悖玉帝先後顯化之意而以異姓異號擬父子其罪尤甚噫世不能無玉帝猶生必有宗祖父母也謗上帝而别立門户是舍宗祖父母而自尊也奚可哉玉帝號稱利益攷藍采和云人知尊上帝不稱玉帝寶號儒者或言誦之非是不知大孝終身慕父母非孟子之言乎慕父母而心誠則爲孝子稱帝號而心誠永無過行豈不爲乾坤肖子哉踐形惟肖則天地皆歸利益豈不大乎皇經利益攷張紫陽云有帝王之興必有帝玉之制守玉制而過者未之有也況皇經心印廼道要心宗體之則爲至聖豈止免過哉今人不信利益惟體會誦持未誠耳智者思之帝經校録功過攷鍾離子曰人物之生本於道皆自天帝而分眞故善則德動天福自至即貧賤而安樂勝於他人是眞福堂惡則自作孽天降殃即富貴而凶咎是活地獄禍福有定隨人善惡天人交應捷於影響迷徒不信故功格言眞誦皇經一部爲千種功德即升天堂眞誦者内外總一言行合道不在口上念經惟在心心實善善乎王靈官曰何勞妙手圖吾像但願君心合我心能心合上帝則德福並懋廼眞誦善功其餘持誦經文戒口制心尊信論嵗月雖有福德因其善之大小而應是又次矣過格言不信此經墮入邪道以心不合道遂作邪人也又言毁謗眞文身墮地獄不信者惟聞經中功德信之不及尚爲小過毁謗則廢天章心作大業凶咎無邊淪於陰惡罪不可活故墮地獄途又言詆帝毁聖廢神居裂眞經頑惡無忌永受業禁禍及七祖毁謗則口訕靈章言冐天威故罪在自己詆帝裂經縱惡不悛身爲不善遺臭無窮虧體辱親雖孝子慈孫百世不能改己身罪業豈有出期祖親之咎又何能赦不然國家設法禁罪人可矣有夷三族滅九族者何也以罪犯過重故延及親族惟若此則爲法網雖延其餘或邪視經典或誦置不虔或持念訛慢或妄意裁度或是此非彼或優彼劣此隨其過之大小又有一定之報在矣鳴呼帝之經當今之法也不信王法律有明章不遵盛典豈無天條惜人身難得至道難聞父母生我其勞苦同有德者福祖親即今世登甲科封贈顯親也有過者禍祖親即今世子弟犯事罪坐家長也人身同而善惡異親恩同而福業殊人何不爲善而甘作惡徒遺累親宗哉經功過格言此見眞經在人心上純善則經功自有上智行自合經不在口誦中智者因經見道下愚則語之弗信上智不常有下愚亦不多中人旣廣則教化之功信不可缺觀是經者豈可不體玉帝慈悲度世之意而視爲泛常耶皇經集註義畧攷石杏林云皇經言道之眞吾性分固有之宜不須解世人多慮資有高下偏見者廣諸仙解是非能盡說玄旨姑備後人之折哀耳皇經同異攷張子房云此經本無二名高上靈寶之分後人穿鑒隨意增減字句牽合文意殊失本旨今攷高上靈寶出自各仙眞稱揚語後人誤執爲二兹據玄都定論録傳世間後學鑒此定志黙體或遇刊寫傳講差處從公考校其外添文句字畫皆訛誤也達者勿泥執焉皇經集註刊傳䟽文大明講道經修玄箴嗣全眞弟子山東小兆臣周玄貞誠惶誠恐稽首頓首齋沐百拜奏伏以道妙無爲毎因時而著見人心有覺宜隨地以積功臣玄貞一介微質三才末品慕妙法以皈玄本儒行而會道一覩帝經勝獲珎異即逐字以精研冀因文而了悟但聖典無註體認惟難臣貞用發哀虔博方解義緒纂仙聖格言彙入道藏函部縁三卷之眞文用集序次敷五品之祕論以列篇名卷編爲十幅計六百總列一百八章大畧十餘萬言千聖心法覩册昭然浩刼玄宗舉目如在雖未能獨窺上聖之藴奧亦庶使衆觀, YP-C: ''}
