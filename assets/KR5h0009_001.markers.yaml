  - {type: variant, offset: 4835, length: 134, content: 數成於十也分五品以象五行合五行四象八卦則得十七皆太極之分故帝於十七光明天以生地以成玉帝此經即地之曲成萬物地數三十故帝示三十種功德帝德超出十極故具十號修億萬刼故周萬德今註六百幅象火記六百篇一百八章從帝千八百戒十萬餘言象帝十萬妙行玄光也至於所謂皇經纂恐下愚不能全契聖文舉大, CK-KZ: 藏輯}
