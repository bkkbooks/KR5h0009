  - {type: variant, offset: 4970, length: 317, content: 以詔入耳知此義又何有不同之旨觀誦講授經典戒義凡觀誦諸經或講明授受先齋明整衣肅容請經置凈几上端坐定志善惡兩忘一乘不立沖妙虚明然後從容展卷或默觀或持誦或發明或教習與帝終對越至誠無息方爲守戒抄寫經戒凡抄寫諸經規儀與觀誦同心正筆正非欲字好即此是道信經論昇沉德業辨人自太極生化天堂地獄經詳言之世固未信豈虛語耶死雖歸空趣不盡者魂有執業伯有爲厲子產信之夫子不以爲非地獄豈無清凈還造化舊物天堂亦有但福不可徼得業不可倖免天堂地獄惟人心造若信二說之名而不修德是自求禍也雖日言果報亦何益之有凡誦經者有凈心等諸咒今不録因前已教人心同於道是誦眞咒矣故不載其文皇經原本首載三十六聖號從天上三十六之義今經止載十誥何也十號十極從帝稱用之耳寔不以繁簡而爲去取也觀者詳之, CK-KZ: ''}
