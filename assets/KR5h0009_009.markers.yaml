  - {type: variant, offset: 0, length: 2805, content: 皇經集註卷之九九應驗品續十三章又若有邪見愚執惡人睹持是經生諸惡逆偏眼邪視乃至起一惡心發一惡言妄生謗讟持經之人其罪深重命終之後墮大地獄永無出期不惟慢神謗經罪重又若有邪見愚濁執迷惡人覩持謫是經者目見曰覩生諸惡逆有不信心故不知經爲道語法言持之利益阿慢輕忽厭惡謗毁生諸過惡悖逆偏眼邪視不喜見經並持經人無有正眼定觀偏眼邪視輕藐憎厭乃至起一念惡心發一句惡言妄生謗讟持經之人讟譽毁也持經作善本不可毀邪執惡人不知縁業罪福不知持經之善妄自生謗毁讟詈之言加持經之人其罪深重命終之後終盡也墮大地獄無間獄也永無出期永終也長也妄謗正法業根深重故墮地獄難出夫識見一也見之不正則爲邪人一也執迷不悟則爲愚爲惡心一也生惡念則爲逆眼目一也偏眼邪視則爲過一念至微也起一惡心爲業根一語無幾也發一惡言爲罪本君子成人之美嘉人之善持經者當稱讃也妄生謗讟是自作孽人生本無業自惹其罪深重是大可哀命終是還造化舊物也固無拘廼一謗法墮大地獄死亦不安其過如何永無出期天心仁愛上帝好生惟神正直不淹没人今罪者無出期豈天拘之哉孽自已作定業難逃欲除己業還須自信至善不回業根脫矣噫刑獄天討法本無親慈父不能庇其子孝子不得私其父至公者神豈消自致之業哉信經向法自懺前業如世人出首信誠免其罪犯也人生世間聖愚無二即不能出言有章聲爲律幸勿出訛言而爲惡口不能行無過動身爲度幸勿行惡事而造身業不能心無妄想守至眞幸勿起惡意造心業不知大道勿謗道不能解經勿非經不能持謫勿謗人不明鬼神生死因果勿起毀言一心正信久自明道漸成聖眞又何罪業之有應驗品續十四章至若在世男女得遇是經不生敬仰穢手污觸葷口讀誦床榻不凈便將安置或誦是經講習俗語共同戲笑以爲常典如是之人命過之後墮無間獄永無出期殃縁九祖受考酆都累及子孫害纒後代是人於地獄中歷無量刼受大苦惱縱遇聖教累承救拔罪惡小減又遇上聖殊恩得離地獄生餓鬼中歷千萬刼不聞漿水之名鬼報得盡生畜生中畜生報已若生人中復生邊夷外域而復女身貧寒困苦癃殘百病受無量苦人所憎棄求生不生求死不死輕斯經故獲罪如是此甚言慢經之報不生敬仰不敬重仰慕也穢手污觸不凈之手或請捧經卷或披閱指點污觸輕犯此經葷口讀念謫持食五葷五辛三厭之口也床榻不凈卓几牀榻座器不凈便將此經安置供放或謫是經與人講習俗語共同戲笑以爲閑常書籍典章是人不惟自惹罪報禍殃縁及九祖始祖四昭四穆爲九祖受考酆都考孝察過失也或作拷掠之拷此即小鬼犯事罪坐家長之義累及子孫害纏後代積不善之家必有餘殃受大苦惱罹大罪苦煩惱無限遇聖教累救罪惡小减即蒙經功法功减遇上聖殊恩上帝恩赦也得脫離地獄苦報餓鬼千萬刼不聞漿水之名餓鬼腹大咽喉微小飲食難下黑獄羅酆不見漿水亦不聞名生類莫蠢於物鬼報盡生畜生中其業尚在人世雖一中國難投男身難得生邊夷外域而復女身人中之不美也貧寒困苦貧賤凍餓困苦艱難癃殘百病衰損殘廢百病縈纏受無量苦言不盡之苦人所憎惡厭棄求生不得安生求死不能即死皆以輕慢此經之故獲罪業如是之重亦可哀哉夫人生參天地爲三才此身貴重親賴以繼光前裕後道頼以傳所係匪輕一慢經法殃及己身縁祖先禍後代受業報何其愚之甚也又觀三教書言男女法性無有分别在在處處皆爲樂土中庸云富貴貧賤夷狄患難素位而行無入而不自得今言外域女身病難之體爲人憎棄何也蓋無分别皆自得者道也分等類言罪福者報也報應明人斯爲善矣嗚呼人一也皆可爲善人也尚勉力進道勿造業而爲人所憎應驗品續十五章又復有人初雖信受後復慢易善惡童子上奏三官黑簿書名青編減算身殁之後拘閉幽牢徃復三塗無由觧脫或於見世受種種病疥癩癰疽以爲果報憂悲苦惱日夜相煎或身被橫惡所加或牢獄繫鎻或非命自害毒藥所殘或被虎狼毒蛇之所噉食或爲寃債之所牽引或行山林值遇惡人被他屠割推落崖岸或被邪精魍魎之所殘害或值水火之所焚漂或被刀兵之所橫誅輕斯經故橫喪天年獲如是果獲如是報可不悲歟可不痛歟此經法利不特全不信者有罪也又復有人初雖信受無疑後復怠慢輕易善惡童子紀録世人善惡之童子上奏三官黑簿書名黑簿録過之簿也書慢易經典之罪青編减筭紀功青篇减慢易經者之筭身殁後拘閉幽牢刑獄囚繫徃復三塗苦累無由觧脫或於見生今世受種種疾病疥癩癰疽惡疾以爲果報償其惡業憂悲苦惱日夜相煎愁困日夜熬煎或身被横逆禍惡所加或牢獄繫鎻或非命自己殘害或毒藥傷殘或被虎狼毒蛇之所噉傷啖食或爲寃家債主之所牽引受害或行山林值遇惡人被他謀殺屠割推落崖岸以傷身命或被邪精魍魎之所陰殘損害或值火焚而水漂或被刀兵之所横誅輕斯經故橫喪天年夭横折喪不得善終獲如是業果獲如是報應可不悲歟可不痛歟旣悲哀其苦又痛惜其愚此見天尊之大慈也證疑夫後一慢易此經罪報無窮則尊道信經貴有恒也久道化成經功全驗盡被其德領其效矣人惟無恒始勤終怠無怪乎罪業之及也抑自古及今不才者間出不持經不聞經者甚衆獲罪厄患者每有豈皆盡慢經者耶蓋經以言道不信道而無德即慢經者也無德有罪即慢經之罪也欲尊經消罪當進道修德應驗品續十六章汝宜殷勤依此奉行