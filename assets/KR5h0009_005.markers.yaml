  - {type: variant, offset: 6840, length: 405, content: 刼免灾諸聖不敢違故永鎭東方諸界玉帝仰奉道旨按法以傳眞經神呪其意云何五老帝君東方爲首東方木德安寶華林青靈始老蒼帝所受神誥命右東方九炁至攝氣舉仙六句廼度世拔人校録神仙青帝祕密靈文二十四字書于九天元臺主召九天上帝校神仙圖籙皆仙梵祕言不敢細觧嵗星輔肝至掃除灾羣八句廼制星祕文三十二字書於紫微宫東華殿主召木德星君正天分度東方神咒至敢有稽延八句廼制東方諸魔祕文三十二字書於東華玄靈之館主攝鬼魔正東方諸界九炁下制東河至風火無間八句廼制東方諸水祕文三十二字書於九天東北玉闕丹臺主攝東海水帝大刼洪灾召蛟龍及水神事東方九炁靈寶赤書玉篇眞文合一百二十字皆太上無上大光明圓滿大神呪空洞自然之書一名生神寶眞洞玄章一名青帝八威策文以上不可解故重書原文右玉皇誥命以錫東方安寶華林青靈始老蒼帝九炁天君令統御東方諸天地日月星宿山洞水泉仙聖一切威靈符命所臨如誥奉行如誥者東方天地水一切神祇皆欽遵此命無不奏行此玄章悉天地人物大德青靈之秘魔鬼喪膽度刼, CK-KZ: 劫}
