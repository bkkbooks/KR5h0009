  - {type: variant, offset: 6451, length: 0, content: '', CK-KZ: 神咒品十章東方安寶華林青靈始老蒼帝所受神咒誥命東方九炁始皇青天碧霞鬱壘中有老人總較圖錄攝氣舉仙右度人錄仙青帝秘文二十四字書於九天元臺主召九天上帝校神仙圖錄嵗星輔肝角亢鎭眞氐房心尾四景囘旋箕主七辰正斗明輪承氣捕非掃除災羣右制星秘文三十二字書於紫微宮東華殿主召星官正天分度東山神咒攝召九天赤書符命制會酆山束魔送鬼所誅無蠲悉詣木宮敢有稽延右制魔秘文三十二字書於東華玄靈之館主攝鬼魔正九天炁下制東河溟水神大劫洪灾蛟龍負身水府開道通逕百千上帝赤文風火無間右制水秘文三十二字書於九天東北玉闕丹臺主攝東海水帝大劫洪灾召蛟龍及水神事東方九炁靈寶赤書玉篇眞文合一百二十字皆太上無上大光明圓滿大神咒空洞自然之書一名生神寶眞洞玄章一名東山神咒一名青帝八威策文右玉皇誥命以錫東方安寶華林青靈始老蒼帝九炁天君令統御東方諸天諸地日月星宿名山靈洞水府泉宮上聖高尊眞仙聖眾一切威靈符命所臨如誥奉行}
