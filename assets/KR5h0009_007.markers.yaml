  - {type: variant, offset: 8609, length: 281, content: 師天地人三界之宗師混元祖無始之先天地未分世界未有帝眞長在歷刼眞宗故曰混元之祖無能勝主三教萬法一切聖人無能比肩皆以爲主故云無能勝四生慈父四生胎卵濕化皆賴帝德以生以成善始善終並以道濟故曰四生慈父高天上聖諸天無如大羅天高諸仙諸佛無如玉帝尊故曰高天上聖大慈仁者大慈大仁無盡量者十號圓滿自穹蒼至仁者十號玉帝行德神功皆周完圓滿如此萬德周身帝德無邊此云萬德周身約言也無盡量度人拔一切生死苦爾時玉虚上帝說是頌及十號已諸天一切聖衆異口同音歎未曾有聞此妙法聖號至德歷刼難逢故聖衆同稱歡未曾見此希有也一云歎世間未曾有此夫帝之功德若此以億億刼脩證始之觀經者大悟眞脩斯不愧矣皇經集註卷之七, CK-KZ: ''}
