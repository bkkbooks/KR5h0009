  text: 皇經註解卷四鍾四
  hash: sha256:057a52f676d51e4b8acbdd89ea2f584df39ba7915f5dbb185bff969388f5353f
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5h0009_HFL_004-001a, image: hfl/1060/1060-184.png}
body:
  text: 嗣漢五十代天師大眞人張國祥校狀元方外隱江西吉水羅洪先閱山東濟南小兆臣周玄貞集神通品爾時高虛清明天主與諸天眷屬馭八景鸞輿九光寶蓋奏玄歌妙樂詠無量洞章散天寶花噴天眞香飛步遊空來詣道前承天尊玉帝威神之力是諸寶花即於空中化一寶蓋蔭覆大衆無不周徧赤松子云爾夜光玉女復位之時高虚清明天帝主與本天諸親眷屬類或作别天主眷屬非也清明天主與眷屬來時各駕八景輝明鸞輿九霞光耀寶蓋八景一作八寶妙景一作八卦神景一作八色光景大抵天上神輿周八方之景備八節之和故云八景奏太玄歌神妙之樂詠無量功三洞寶章遍散天寶奇花噴著天眞妙香飛歩凌虚遊空而來敬詣道前承元始天尊玉帝威德神通之力此衆寶花即於虚空中化一寶蓋蔭庇覆蓋法會大衆無有不周徧處愚按人之修眞朝上帝禮元皇默轉眞經清虚神光後朝玄境時呈秘妙瓊花結彩周覆衆妙皆虚皇秘引元神慈接即高虚清明天主後至法筵呈妙樂御靈輿所散天花仗元始玉帝威力成寶蓋覆衆無遺也有志者觀此典而神會之則天上景化一身具之矣神通品二十六章是時高虛清明天主見此希有稽首長跪白天尊玉帝言賤臣懈怠後會法筵今日吉慶值遇法橋幽顯聖凡普霑聖澤放大光明現希有相上照諸天四梵六慾一切樂土諸眞聖衆睹此光明悉皆雲集下照下方無極世界同玄都境近接九天靈風奏樂宫商相和激朗雲庭皆成洞章一切衆生咸臻道化酆都鐵圍長夜九幽一切地獄受苦衆生盡承光力皆生諸天得受快樂今日所散天寶奇花旋結成蓋徧覆法筵大會諸衆盡承斯光威神之力臣等千刼良因九天運會皇道蕩蕩正法興隆今日大吉成仰玄功火帝眞君云是寳花成蓋遍覆大衆之時高虚清明天主見此希有之事稽首長跪上白元始天尊玉皇大帝自己謙言卑賤下臣懈惰怠慢後期遲會於法筵今日吉辰慶霄值遇尊聖慈濟法橋橋者世人建之以濟水津免徒涉但凡世橋梁須木石構成且所濟有限易於損壞如長江大河湖海皆不能濟至聖經功法力濟浩刼周沙界不假作爲形迹潛移默轉秘化神通使人出愛河離慾海免血湖祛洪灾永久不毁故曰法橋幽而冥途顯而陽界聖智凡愚普同霑濡至聖恩澤玉帝放普照大光明現希有神妙相上照各界諸天四梵六欲等天一切快樂凈土諸仙眞神聖衆等覩見此大光明悉皆雲合集會雲之合也倏忽滿空不知何來聖衆速集如雲故曰雲集其光下照下方無極量世界俱同清微天玄都境界近邇神接聯九宸上天光中靈風奏天妙樂如宫調商音相和凡樂宫啇等五音雖分清濁别五行天然之妙或未易有帝天靈風妙和自然不啻凡樂是宫啇相和激揚朗震於雲庭皆成三洞寶章下方諸世界一切衆生咸臻集大道玄化酆都獄鐵圍城長夜九幽一切地獄受苦衆生盡仰承玉帝大光明法力皆生諸天宫得受快樂今日臣所散天寶奇花旋繞結成華蓋徧覆冒法筵大會諸衆盡仰承天尊玉帝大光威德神力臣清明天主等非止一世之幸遇此希有千萬刼中多修良因又值九天嘉蓮聚會皇天至道蕩蕩坦平重玄正法興行隆盛一云元始開化演最上法皇風沕穆大道平平時無旁門外道適正法興隆之際意亦可今日慶霄是大吉辰諸界神人一切羣生咸得仰賴最玄功化一云咸欲仰希玄功俯陳道要亦可愚按人身雖小包羅天地萬有悉具衆妙渾涵清虚靈氣分司六陽亦有高虚清明天主若元神失御玄化未呈則趣溺恩波機沉苦海洪津巨浪滔滔靡岸何以免淪没拯昏墊也惟一人浸淫遂淪胥䧟溺誤己誤他固不足論其滯於小乘惑於旁徑行潦無源難免枯涸又不足道間或濬靈源接道脉浸浸幾化矣而自屯其膏恩澤不降又非大成耳故有證四梵六慾之果不達九宸七寶之境或受人中福報或作獄主魔王甚至沉三惡道淪九幽界可哀莫大焉是以靈化不彰妙韻不露眞經失轉瓊花無彩由不作良因不信正法玆不能聞蕩蕩平平之道而仰被玄功也能凝玄神泰天君清虚明妙之靈後機隨發則通達曹溪吸盡西江融會金液誕登道岸苦海業坑永得消滅超絶六慾高出四梵普會萬神照徹幽界靈風鼔眞妙韻絶品眞經默轉以無停萬有蒙恩於不匱酆都破圍九幽開光地獄化天堂罪衆生凈土一身陰濁悉變陽明瓊花霞彩蓋蔭衆妙實虚皇之靈元神之力也非積修素養正法篤信何以聆皇道休風得仰玄功哉噫此身之妙眞也視清明天主後至法筵慶遇法橋稱聖化揚玄功謂道濟天地幽顯者同矣而修良因廣妙行不求速化妙本自然又證聖眞訣也學道者味之自得神通品二十七章是時註是法會聖衆咸仰玄功之時高虚清明天主註解見前以偈讃玉帝曰註清明天主以偈語讃玉帝曰金闕玄穹祖註祖一本作主字攷經意玉帝爲天主諸佛師御黄金闕爲玄都穹蒼宗老故云祖或作主字是但以天帝言矣高上玉皇尊註解見前妙相冠諸天註諸天神人皆有美相或衰毁有窮或神通有限隨各居之天變化不能相兼色相容顔未甚超絶玉帝隨形妙好無量無邊色相奇妙獨冠諸天慈光燭三界註大慈光明照徹上天下地人間故云普燭三界眞聖妙道師註眞一至聖神妙大道玄師一云玉帝之行眞聖玄妙道宗尊師也天人依仗師註玉帝爲天人教主萬神之君上天神聖世間人民皆宗依仰仗功化是天人師大乘垂法語註道法三乘分上中下又有最上一乘不依階級高超三品並包無遺是爲大乘諸神法語各隨智見大乘希聞玉帝垂教明示眞宗徹上徹下該括諸品羣生蒙誨悉得超脫是大乘垂法語眞一指迷途註玉帝以眞宗玄一妙理指明開悟迷途此直指單傳使人不落旁門小法即指人以大路使之不䧟邪徑也功德若虛空註天下之物皆有窮盡惟虚空歷刼若是再無改移玉帝大功至德無量無邊如同虚空不可窮極諸神聖非無功德或逺或近或小或大可以隨分比擬玉帝功德無有比倫故若虚空讃揚無窮盡註玉帝功德如虚空稱讃難窮皈依莫盡讃揚無窮盡盛德不可名稱矣黄石公云高虚清明天主雖後會法筵眞見玉帝妙化神景竒觀仰慕不已遂以妙演偈語讃揚玉帝昔宰我子貢有若善稱述推尊孔子爲智足以知聖人今清明天主稱玉帝功德如虚空讃揚無窮盡其他讃再無如是之切盡者即宰我子貢有若之知孔子矣此偈可以謂之知言愚按人身元神浩刼不改四體眞主萬有之宗妙冠六陽慈護三元一己眞師神氣攸頼靈照光通法音最上直破迷途示我周行妙體玄功德之所被與虚空等讃揚何盡人不能反觀内照會此眞宗一身之至德不識玉帝功德又豈能知經功利益無怪其不秘悟實體也清明天主仰玉帝功德以妙偈讃固對揚天休亦詔人迴光耳果能契本眞知道力法天不私與帝同功自不惑他岐弗喪天寶至聖可希矣志士勗之神通品二十八章是穹蒼主浩刼之尊妙見妙知無等無倫湛寂眞凈杳亡杳存上聖上靈大神通光明藏大丈夫開化人天教導無窮大慈大悲流煥法輪爲度羣生是號玉皇穹蒼眞老妙圓清凈智慧辯才至道至尊開度衆生故放是光爾時高虛清明天主說偈讃已靜默而坐魏伯陽云高虚清明天主皈揚玉帝功德不但有十句之讃言此玉帝是穹窿蒼穆聖主浩刼之至尊凡刼之有數或億或兆皆不可言浩玉帝歷來作萬天教主經歷刼蓮不可數計廣大深逺難以尋窮故云浩刼之尊其遐照無遣神通妙見徹明無礙大覺妙知再無與之同等與之比倫相類者瑩徹虚明而堪然巍巍不動而寂然不二不息其道至眞無染無淪其德至凈杳若亡非眞亡廼虚無自然杳若存非執存廼妙有無心杳若存亡不可明見難以測論矣仙佛諸神咸尊玉帝是聖中最上萬神靈通無如玉帝是最上玄靈神化六通超絶一切誠大神通普燭久照光潔不淪愈出愈有無滅無晦眞光明藏藏畜大光明無窮也至尊莫如道玉帝法道自然最大難量莫有止極允矣大丈夫世賢以成身成性正已物正範圍天地爲大丈夫玉帝化天地生民物不見其始莫有其終聖中最尊神中最大丈夫孰甚焉開明孚化諸人諸天教成啓道無有窮盡覆愛萬有憫念衆生永無限量信大慈大悲轉流煥明法輪俾不滯不隱煥或作轉太拘了爲化度羣生是以稱號曰玉皇穹蒼之眞元老大尊神妙圓通眞清眞凈大智大慧妙辯難窮才施不匱至道莫量至尊無比今開化拔度衆生故放是大慈普照光明彼時高虚清明天主說此偈讃已寂靜默然復坐愚按人身元神即上天玉帝號曰元皇又曰眞主又曰玄宗又曰祖眞又曰天君又曰性宗又曰眞宗祖又曰法性又曰妙明眞心又曰正性又曰玄靈又曰眞師又曰玄光又曰大柱杖又曰法王又曰妙寶又曰眞根又曰佛性又曰眞種又曰丹元一身眞主靈妙絶倫明藴無窮開化陰陽神智莫盡慈恤衆妙周應明通最尊最貴化機不窮默融精氣以孕眞靈故眞光時露妙機生生善體此者自産神嬰與帝同功德道化無盡矣契清明天主讃帝之偈方云眞知實悟耳不然眞妙弗得帝化奚識清明偈語誦之若夢何以得經功獲實益噫性道在我眞妙自足能會妙明眞機是實對揚玉帝休光者神通品二十九章於是天尊復告四衆云是帝身即道身也非常體也是無量功德之身是清凈自然之身是神明堅固不瓌眞空無上法身威靈恢廓名聲周遍無幽不燭神妙巍巍難可稱焉赤脚大仙云清明天主偈讃玉帝已復坐默然於此時元始天尊復告法會上四衆云是玉帝妙化之身即大道身也非尋常形體也道本無形何以言身蓋道雖虚無無量無盡化萬有成始終鼓陰陽無間息眞虚而有實體非徒空也玉帝功德若虚空與道同神故云帝身即道身非常體耳是無盡量大功德之身是眞清眞凈自然不拘之身功有限德有窮難言無盡玉帝化一切世界亘古不改何有限量着色象有拘滯非清凈自然玉帝永無染着得大逍遥寧非自然是神通光明堅確永固不損壞之眞空最上無比之妙化法身天下之有象者悉壊惟虚空常存壊者非堅固非神明太虚旣存則空廼至眞玉帝之靈通歷世無損玉帝之玄光浩刼不滅不但至神至明而堅不可磨固不可破永無毁淪終久不壊是常住之眞空不消散之妙體是無上絶倫妙法身也其威德靈光豈易窮探恢恢至弘廓然極大不可恩議名號聲稱洋溢貫徹周徧十方光悉塵微無幽不燭神通玄妙巍巍莫量蕩蕩難名不可得而稱焉愚按人性靈明神妙自在三身足四智完浩然之氣眞一之精萬善衆妙何者不具藐焉一身叅位責成無間可息本非常體廼道身無量功德身清凈自然身神明堅固不壊眞空無上法身何世人恣縱虚負此身心累神馳精耗氣散性道不明誰復至命道要茫然幻身空盡枉過此生存亡若夢一無所知何由達化間有明德盡性或不終保其成所以人不能窮神達化還虚成仙與道合眞至名不毁惟玉帝以道爲身功德無量清凈自然神明堅固眞空不壊無上法身凡初入聖流一間未達覷之不破語之未悟心恩未通乎性命不知其神之所以神學術未貫乎天人不知其化之所以化委於天道之難知希覯通玄之上士元始憐衆生之久迷言帝德之廣運盡啓世刼之聾瞶以證神化之玄功眞大慈深仁欲衆生入妙亦恢廓其威靈周徧其名聲光徹幽微神妙巍巍德難名稱天尊之大願也柰世域漂沉人心䧟溺不能順帝之則奚承元始之訓噫天人一理聖凡同心不能希聖希天道法自然誠有愧於眞經大道父母生身已有志者也之神通品三十章是帝非有爲功德之所熏修而帝昔雖下生人間多刼行化示大神通而身清凈未嘗不在金闕分身變化應現隨方利濟羣生超昇道岸普垂教法開悟後人依教奉行登眞成道以斯功德之所莊嚴是故光明常充諸天神智妙達莫可度量妙行眞人云是神妙巍巍難可盡稱之玉帝非有作爲勉然功德之所熏積修證是帝徃昔劫前雖下降受生於人間多劫廣行教化顯示大神通行化如捨王位修行割愛學道行藥治病演道弘化忍辱喜捨位證金仙教度菩薩等刼故釋藏記生佛之因言自兠率天乘香象下降於摩耶夫人腹中遂生文佛是亦玉帝隨方設教之一化也他如赴浮黎會臨寶珠會化士庶身化道者身隨遇著靈普度不已爲諸天尊王神通莫量是多刼行化顯示大神通而法身清凈巍巍不動未嘗不在黄金闕内方元始將說玉經帝放大光即分身徧十方諸大天宫一切世界上天下地人間悉覩光明各獲利益咸得快樂共聞大乘是分身變化應現隨方利濟羣生超昇道岸所著功德非止一時一地普徧垂示教法開度覺悟後世之人若能遵依教典欽奉帝命自可以位登上眞成全大道帝惟以此最大上妙功德之所莊嚴是故所放光明常充滿諸天至神大智靈妙通達莫可測度思量神智妙達則大光明非徒爾德盛而光妙也莫可度量則神智妙達非浮爾道妙而神彰也至是益見帝非有爲功德之所熏修矣愚按人之元神浩劫如故大神光妙未易名言豈有心作爲之所成哉聞見覺知行住坐卧食息語默應感酬酢雖隨機呈妙清凈本體未嘗不御丹闕即凝玄妙産神嬰而眞眞如如未始他離千百億化隨方利濟誕登道岸廣宣靈藴開化後天守秘持眞超凡證聖萬化悉成無果不就以此妙行莊嚴則一露玄光充周莫禦性道奇驗寧可測度量計耶視玉帝聖德神功不假修爲難以量度者不一致乎惟成性雖均而暴棄甚衆使清凈正性爲淫惑障蔽如明鏡塵埋光明不露故妍不見而妙意弗彰果刮垢磨光日新月盛應感無心眞如自在金闕紫府永住元神常應常靜一無所擾妙察則一以貫萬顯行則順應無情慈悲大願永不退轉萬妙莊嚴難以數計積修無邊眞光自普功德不思議矣吁此道人所固有也非有爲熏修亦非頑空可能不有不無善學者體之神通品三十一章是身光明皆具妙號所謂大神通光大慈悲光大喜捨光大忍辱光大平等光大柔和光大自在光大利益光大如意光大智慧光大吉祥光大解脫光大歸依光大功德光大圓滿光大無礙光無能勝光大慧眞人云是玉帝身所放大光明皆具上妙稱號光號云何所謂大神通等十七大光玉帝普垂照攝妙行積證有大威神具六通力神通光嚴遍燭一切此光號第一也次則帝具大慈帝具大悲慈悲無量光妙弘明大慈悲光其二也再次則帝眞喜捨喜捨無量妙光普明大喜捨光其三也帝之累劫又大忍辱忍辱無邊光明莫遏大忍辱光其四也帝之前修行大平等平等不已光明莫禦大平等光其五也帝之徃刼又大柔和柔弱安和浩劫不改普著光明不可窮盡大柔和光其六也帝德安安超然自在恢霽光明終無窮極大自在光是其七也帝仁浩浩兼濟永利利益不窮法輝普煥大利益光是其八也帝之普身超證妙覺清凈自然法王如來又億刼始證帝位則最上功德妙出無心神化如意如意光明永無極已大如意光是其九也帝有大智帝有大慧智慧邁種光明絶倫大智慧光爲十種矣帝本至善永大吉祥以是光明徹燭無息大吉祥光廼十一矣帝夙了悟得大解脫脫落自然金光永煥大解脫光廼十二矣帝同大道妙法自然永刼正信不生退轉十方後世悉永欽承皈神依道永明不晦大皈依光光之十三也帝普度無量曲成不遣功德最大光昭不匱大功德光光之十四也功圓道備帝德圓滿普光久麗以其成功大圓滿光光之十五也塵染夙凈妙通圓明神化無礙帝光永昭大無礙光又十六號矣神中最貴聖中最尊萬天主諸佛師浩刼法界一切無如玉帝是故光明常充諸界神化莫可度量無能勝光非大光明之十七乎如是十七大光明神妙義惟玉帝今見之神通夫豈可量哉愚按人生世間以正性爲宗故仙傳實際以此爲大光明種但眞種悉具而保眞無人故迷惑場中須作修洗功縁是以有一種最上良因則有一等神妙光明玉帝積修無數妙行難窮不止十七良因何爲十七大光明哉蓋機多難悟化繁道晦帝十七光明即佛現丈六身而頂放大祥光也況帝光上妙一種超倫敦能追蹤妙行識十七大義乎噫是難能也亦可希也道本在己怠則晦精則明勤修無爲不求速化道自得之矣神通品三十二章是故汝等欲見是帝而不可得者縁以汝等尚於身口不捨結習煩惱行業由是障故不能得覩是帝慈顏吾今爲汝法會衆等宣示斷障之法汝等大衆宜各奉行時諸大衆不勝喜躍各於至尊几前稽首作禮俱欲願聞雷師皓翁云玉帝放十七大光明神通莫量是故爾高虚清明天主等欲眞見是玉帝而不可得所以然者縁以爾等雖無塵染證位天帝上妙大乘未眞了徹尚於身口不捨多劫結習無明煩惱凡行愆業由是遮障之故不能得覩見玉帝慈顔結習情慾塵凡一切迷累本不可貪因智慧不足執想太重識念一起漸致染着物交牽引愈積愈深作爲結毒致成習氣如人以繩鎖挽結一時難解熏習舊染一旦難除惡種業根本源未凈習染物欲或畜煩惱或積愆行或植縁業煩雜靡定惱亂未消累行諸業夙爲障蔽今雖統御梵天尚未徹明弗悉重玄奚瞻最勝不能即見玉帝以是故耳吾今爲爾法會衆等宣明顯示斷除障滯之法汝等大衆宜各奉持躬行時諸大衆不勝歡喜踴躍各於元始玉几前稽首俯顖恭敬作禮俱欲願聞斷障秘論吾元始自謂也几案也愚按人之生來各有夙因雖元會初開太和之氣而徃刼修習亦難頓忘故經以夙含業縁比之積毒誠有見也是以有喜縁者則異域同心爲惡縁者則對面千里莫言道藏功案釋教録記或指爲異端之論即儒書中晏嬰之沮孔子先正歸之命程蘇大儒分爲蜀洛之黨此亦縁之不偶也而相須之殷不免於相遇之踈今古同以爲恨則因縁之說豈可盡廢哉用是十識難盡五藴難窮十有三徒二十五魔種七假三合一切機括誰復易逃清明天主證帝位爲尊神雖脫塵染浩劫夙積未盡超融境落高虚號著清明徃昔善因未脫虚無套矣虚明妙有如玉帝者豈能遽見釋經攷菩薩行尚有覩面不見釋迦如來文佛演最上義菩薩默默以聽亦此義也至聖豈易見身口結習之障豈易消耶然此理最難看見帝非面見了知帝行徹契帝德如在孔子之門眞得宣聖傳授心法者一機心若孚則時異世殊其揆一也神交心會其見廼眞兹聰明顔子尚未達一間清明天主不能覩玉帝又何疑元始斷障之法瑩明夙行了驗心宗捍格旣融外有何障自然親見玉帝矣所以衆欲樂聞吁起障破障一切由心大通無碍自己元神對越不怠口耳粗迹弗爲滯障大道不在我乎勉之神通品三十三章天尊言曰斷障之法當生大慧無起疑惑無起貪嗔無起媱慾無起嫉妬無起殺害無起凡情無起凡思無起昏垢無起聲色無起是非無起憎愛無起分别無起高慢無起執着廣成子云元始天尊因清衆請問無障妙旨遂言曰斷除障礙得覩見玉帝妙化光顔其道無他當生神智大慧篤信正道無起疑貳惑亂之心大道至正眞一不二本無可疑惑明不足以察具幾遂至持兩端無定見魔知通從旣知大道在我知明守固勿貳以二勿叅以三更何疑焉不疑則無惑道可從入故斷障融凈結習之大慧必先無起疑惑求道者不可計功亦不可以他求嗔怒忿怨不平之心俱不可有斷障之次無起貪嗔心專於道其哀自然滋私長欲妄念易生纖毫淫逸嗜慾之意皆大亂眞斷障之三無起媱慾道無所不容賢不肖皆吾之師友若絲毫忌刻賢能或厭惡庸愚皆爲大非斷障之四無起嫉妬大道至仁一不忍傷若因逆惡觸萌剪滅之心背道亦甚斷障之五無起殺害陰符雖言殺機只是說能照伏邪魔則至眞自在若秋天肅殺而草木歸根生機歛人見天地之仁䖏非世所謂殺也又云恩生於害亦復其見天地之心意耳非世所謂害也大道無爲情識不用一動凡意其謬無窮斷障之六無起凡情大道忘機諸想須凈一有塵恩其弊無邊斷障之七無起凡思道本貞明清凈無染少涉昏昩塵垢喪我至眞矣斷障之八無起昏垢道無聲臭以聲色求之去道逺矣體道者不惟外面聲色不礙與世無干道之影響畔岸一切不求不執故斷障之九無起聲色道本大同一是一非失太玄之本眞矣斷障之十無起是非孟子雖云是非之心人皆有之大智若愚又何肯辨是非也道無取舍有愛惡則障眞矣十一斷障之目一視渾忘無起憎愛理本無二用智分别則非道矣斷障十二法無起分别見道分明高出塵外不屑世故一生慢心違道甚矣十三斷障之法無起自高輕慢之念大道活潑了不可得斷前十三障而道得矣雖名得道實無所得一執任有着則理障未除爲法縛矣十四斷障法之終無起執着愚按道之在人本無障礙惟世爲事理二端所蔽遂至失道故元始慈示清衆斷障門品歷示諸端欲人奮志邁徃不阻於難打脫事障更出法檻則玉帝光顔以我之妙明日與對越有何不見雖然脫二障人道之門也了悟神化重玄又在後論之神通品三十四章凝神澄慮萬神調伏心若太虛内外貞白無所不容無所不納無令外邪亂其至道牽失眞宗敗其靈根盗其至寶致爾萬刼永墮凡流透入俗網萬魔來攻百千萬刼不聞妙法鬼神執誅從生入死是故汝等應當志心善護眞宗無令喪失如前所說如是諸障汝等各各當除斷之身得清凈超度諸難是名道寶持法棟梁劉海蟾云元始示斷障之法生大慧絶十四業趣矣其究維何障斷蔽除則神明慮凈當默住元靈玄始凝元神澄徹諸慮萬神和調而潜伏心如長空太虚内外貞固潔白凡法界羣生萬有無所不含容無所不包納且定見定守終焉不渝無令外面回邪亂其至正大道牽引喪失眞正玄宗敗其至妙靈根盗其固有無价不壊至寶致使尔等延積萬劫永逺墮在凡流徹透入於塵俗之網萬種陰魔相接來攻伐爾百千萬劫惑於魔業不聞最上至眞妙法鬼神乘機得以執持誅戮從生途而入死地是故汝法會衆等應當專志誠心善自護持本來眞宗無令捐喪亡失如前面所說疑惑等諸多障礙汝衆等各各當除滅斷絶之諸障十四障外邪生死等一叚事意俱在内旣除斷諸障身得眞清眞凈超出昇度三界輪轉業罪灾厄諸多艱苦厄難是斷障之法名道之至寶扶持正法之大棟梁樓閣塔廟殿宇門舍非棟梁則難構建修道成眞入聖超凡非斷障則難了脫斷諸障則終免毀淪正法大行故天尊以斷障爲持法棟梁愚按人之正性元神清凈無染萬刼不毀好靜怡怡未始不靈明與聖眞不二若明明不已玉帝神化妙光豈不親睹惟諸慮嬰心相襲不改少知道者又冀速效所以結習難盡煩惱不捨帝光難見也若眞明玄通至健果决知性命之爲眞識萬有之悉假始見道而忘物繼行道而忘人繼得道而忘我繼成道而忘心繼樂道而忘趣再忘忘以忘眞事理雙融眞假悉遣不落聖凡相際何須五位主賓得之無得守之不守空而不空不神而神則夙習瑩凈積業絶塵細染盡滅超入最上不必默朝上帝與帝同神不必法道自然而與道合眞何有於三乘何有於諸品聖中至尊功德無倫人皆可爲但根塵之凈功玄而行妙無作而無間矯假者固不能脫融之未至化之未神猶爲入聖不優若玄中地仙釋教菩薩儒家大賢以上者今人求道尚法至聖毋以大乘爲已足神通品三十五章更當修奉是此經典如近是帝生尊重心注想尊容稱揚尊號然後汝等得覩慈顏咸蒙護度普聞妙法親奉供養永無輪轉東華木公云元始示大衆斷障之法旣云是名道寳持法棟梁矣又以持久服膺之義示衆曰爾等清衆聞今正法更當修持崇奉是此玉皇本行經又典章親誦此經如近玉皇尊帝生尊敬保重之心知尊經則不褻天道知重經則不輕天寶永久尊重則終無悖慢大道自得即論語所謂畏天命畏聖人之言也如近是帝固非眞覩玉帝一時不能對越則一時不能尊重矣注意恪想玉帝尊容妙相此道非徒專在於想像也儼然如在昭事上帝斯與天地合德而爲至聖耳稱頌宣揚帝之至尊徽號然後汝大衆等得覩見玉帝大慈光顔咸皆蒙受帝之護持拔度普遍聞夫無上至眞妙法得以身親祇奉供養是帝是經永無輪滅轉移之失一云見此經典聞此妙法覩是帝顔能親懇崇奉供養則永出塵凡不受輪迴轉生之苦一說心永無退轉兼採之更通考疑云儒書云神不可以思致道經云神化無心任自然佛經云若以色求我以音聲求我是人行邪道不能見如來今言注想尊容稱揚尊號然後汝等得覩慈顔元始玄祖斯言豈欺我哉此言不是意想思存滯迹口耳合德於天孚神於帝渾化相忘故古人云天威不違顏咫尺敬恭而化不覺讃揚之至即儒書所謂言堯之言行堯之行是堯而已矣佛家所謂法身入我性我性同共如來合道經所謂神與道合則道與身一也惟如此然後聞妙法奉供養無輪轉若徒心存想口稱揚不能皈身皈神命冥心會道則不可言眞供養焉得無輪轉至無毁淪不遷轉則注想稱揚供養非世俗之謂可知愚按人生性命於天理無不具惟䧟於俗流故沉於輪轉若經綸天下之大經能盡其性是眞修奉玉帝經典能對越在天即如近是帝小心翼翼祇事不違是生尊重心身代天工口代天言法天不私帝眞時御是想玉帝容稱帝號得覩帝顏也德惟一動罔不吉盡己盡人盡物叅賛化育皈命投誠踐形惟肖至誠無息悠久無疆是咸蒙護度普聞妙法親奉供養永無輪轉也噫人之有道須臾不離道之有經如行之有路踐彼周行行道者弗全不由此道何哉此孔子有何莫由道之歎元始言凡流不能見帝也果味是經有得焉自與玉帝齊肩矣神通品三十六章是時四衆聞是說已歡喜踴躍歎未曾有天官大帝云是說玉經時法會四衆人等聞元始道祖說玉皇本行集經清微天宫神通品卷分已竟聞帝生長之奇異多世之修因變化之無量功德之難窮神應之自然法力之最大侍衛玉女化自天眞沙界浩劫悉頼經法明罪福之縁由聆斷障之妙旨十七大光明洞之有基億萬刼修眞述之有要取法自在入聖無難慶塵業之已脫幸七所之易入悉皆歡悅喜樂忻騰踴躍同聲稱歎今遇法會良縁最勝奇逢非偶此會此聞是帝是經兹時兹訓歷刼以來未曾有也或云聞是說已專指斷障之法言太拘了元始道祖說經時神通品說已竟非是說了後又說雖分三卷五品因慈訓隨示品類故天眞演經列三卷耳若將終卷稱歎意同他歎言看似爲未詳所以聞是說已當兼承上說看經者詳之愚按人身精神氣血聽命天君妙心洞然天籟發聲怡然理順油然太和手舞足蹈快樂無方得道忘機舉世莫尚身亦有四衆聞說歡喜踴躍歎未曾有之義也但世溺利欲了悟無人入聖成眞不數見耳若聞經默會身具太和心融神化帝功不在我乎上卷分章攷義元始天尊說玉皇本行集經諸天眞請問帝化根由語雖不同皆在一時如何首卷分三十六章說經固在一時因問以答各有不同後不能明經旨趣洞至聖玄訓故諸天帝神眞五老帝君校録於前天猷繼輯於後文昌帝君天樞上相各乘時有攷議評正以首分繫曰清微天宫神通品第一不分他品以帝神通無倫其居無上元始此訓諸仙佛不能言也漢魏伯陽唐吕純陽元丘長春明羅念菴議之甚詳分爲章註首卷神通品得三十六章非輕析眞語故使支分從三十六天之義以立章且截䖏有旨意相統承不至渙散觀誦者能澄心滌慮以體至聖說經之意上眞分章之趣務使神與聖眞相孚會經血脉貫串則三十六章又何分說經之旨又豈不可得哉但泥文者多默識不厭者寡或以經爲無益或得一句以爲奇或執一字以爲病别靈寶高上之名無心聆神會之妙則因經不能悟道反爲文字障執又惑之甚者也噫諸經至語皆爲心印因文見道得道忘言玄穹祕論悉我固有經綸又何疑其難入至於輕謗一得輙幸哉贅此首末學者戒之皇經註解卷之四上卷三十六章終
