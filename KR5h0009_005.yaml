body:
  text: 嗣漢五十代天師大真人張國祥枝狀元方外隱江西吉水羅洪先閲山東濟南小兆臣周玄貞集高上玉皇本行集經卷中太上大光明圓滿大神呪品第二神呪品第一章爾時天地始祖五老上帝稽首長跪白天尊言伏聞高上玉皇慈念蒼生普放神光照燭法界六凡四聖普叨道蔭竊以凡夫短景劫運將終正道宜行以濟兆民使修真之子有期輕舉末代蒸民俱獲壽考爾時當元始天尊説盡神通品之時天地開始之祖五方五靈五老上帝叩拜稽首俯伏長跪上白元始天尊言伏聞高上玉皇大慈憫念世間蒼生普遍放出大神通無量真光照燭三千大千諸天諸地一切法界天人魔獄餓鬼畜生等六樣凡品以至最上一乘與夫上中下乘四等仙真佛神忘士之四聖普遍叨蒙大道慈光蔭庇竊以凡夫不壽世景短促法界劫運將次告終仙真正道宜當傳行以濟億兆之民使希仙修真之子有了脫之期得以輕身沖舉末代蒸民無有夭折俱獲壽考夫人世間命有定數三教聖人皆蛻骨塵世顔子大賢三十二嵗而卒皇經雖有利益豈能違大造之數而使人長生哉是不然人之身可死人之生理不死道理不明雖生世上其心已死偷生茍免何足言壽若明了道理悟徹行成還虛脫化則朝聞夕死無復遺恨即是長生故道德經云死而不亡者壽孔子云人之生也直又曰仁者壽釋經云若人了證涅槃即見如來是名金剛不壞三教至人不以死為死以不明道為死不以生為生以了道為生造化之數雖生死難逃可拘常人而不可拘聖人玉皇尊經演自元始最上一乘妙法三教之真宗萬法之玄訣法界之慈航生死之要關成住壞空之祕旨傾劫之機括超證坦途度世妙品解結拔罪之津梁也至尊若為慈演經文蒸民一蒙聖恩承神光力皆得皈依正法不落邪徑生死無愧能令短命衆生而得長壽是經神功有若此者右上卷神通品至聖天宫妙化三教聖真皆不易及故列第一見傳此真經神化之自此卷首列神咒品以經中祕法語能度人録仙制星制魔制水鎮五方濟法界故曰神咒有神通而法語祕文若是利益斯繼神通而第二云蔭音印蒸與蒸同末代將終之劫神呪品二章自昔元始洞玄靈寶赤書玉篇真文生於元始之先空洞之中天地未根日月未光幽幽冥冥無祖無宗無氣無象無色無名無形無緒無音無聲混沌太無靈文音捻不明也藹於蓋切乍存乍亡靈圖開化玄象推遷結氣浮空乘機應會玉帝真誥靈寶祕篆無上大不可思議神呪於是存焉天地始祖五老上帝言玉帝尊經之正道能令末代蒸民獲壽考因何有此大功效自昔元始洞玄靈寶大赤天書碧玉琅篇之真文生於未立法界元始本初之先大空洞虛之中兩儀不曾分太極無極之先天地未立根基陰陽水火不曾肇孕未有日月光明混混茫茫何所分别幽幽冥冥而已萬象未生孰為之先不見造化之元是無祖無宗玄虛太空不見其氣無有形象無著見之色無字稱之名無形影無端緒無影響沖然漠然衆音何有衆聲何有無音無聲也無涯無際混沌太無元始洞玄靈寶赤書玉篇之真文靈祕文光掩然雖不明見藹然又著端倪乍存乍亡非有也非無也非有有無無有而未常有無而未嘗無也元始靈運玄圖開張萬化玄元妙化之象推轉運遷結妙梵之氣遍浮虛空乘玄運之機應天人叨陰正道宜行之會玉帝寶誥靈寶祕密天篆無上功德不可稱量大不可思議神咒於是顯祕著象而妙法存焉赤書玉帝真經妙有之文皆諸天太初梵氣結成字文廣長一丈色光赤煥為丹天大赤金書玉篇九天之上皆碧瑶之篇元始洞玄靈寶之文寶霞玉潤故云玉篇生於元始之先乃天地本初之先非元始天尊之先天地未根非天地無生化之根天地生於虛無元始真文在三千大界未立之前浩劫之先故未見天地肇分之根乍存乍亡存而不可定其象亡而未嘗滅其真玉帝真誥皇經妙典慈濟無窮歷浩劫而無量遍三千大千而莫盡諸天奉行三教遵依是傾劫法界之誥命也靈寶祕篆天書雲篆非易聞見不可思議不可以心思不可以言議言莫量也於是存焉玉經真文在浩劫先非自今日存也未乘機應會時道涵太虛夫有何形孰從而見雖存而莫知其存也今正道宜行靈文彰祕神通光明於昭炳顯故云於是存焉真經妙法之存乘機應會是難遇之時也在斯會者肯自負而不求法誨乎神呪品三章故天地得之而分判三景得之而發光靈文鬱秀洞映上清發乎始青之天而色無定方文勢曲折難可尋詳元始鍊之於洞陽之館冶之於流火之庭鮮音先其正文瑩發光芒洞陽氣赤故號赤書靈圖既煥五帝朝真飛空步虛旋行上宫燒香散花口詠靈章是時天啓十二玄瑞地發二十四應上慶九天之靈奧讃三天之寶明神風既鼓皇道咸暢元始登命太真按筆玉妃拂筵鑄金為簡刻玉為書五老掌録祕於九天靈都之館玉女典香太華執巾金童侍衛玉陛朝軒九天玉書非鬼神所聞惟玉經真文靈寶祕篆於是存焉故太極生兩儀清浮為乾濁凝為坤天地得之而分判日曜輝月呈華星列張三景得之而發光真經靈文鬱然浮其瑞光秀氣洞然光映上清境界發乎始青最上之天而色無拘定方所靈文光曜之勢充周曲折難可尋究側詳元始天尊鍊此真文於洞陽重玄之館鎔冶此經於流火大梵之庭鮮其正文光耀無方鮮其大正妙有之文瑩然騰發光芒洞陽妙氣溢丹流光純然大赤故號赤書靈蓮玄圖既煥光明五帝朝元至真乘雲御瑞飛空步虛旋繞行朝最上宫闕燒清淨自然真香布散天花口中讃詠靈文寶章是時天不愛道元辰獻祥天啓十二玄瑞地不愛寶二十四氣粹顯隹禎地發二十四應上慶九天之靈文奧旨讃揚三天之寶章昭明妙典神通風教既鼓度世之機皇道咸暢大法普惠一切元始登座錫命太真上仙按筆以書玉女靈妃拂蕩法筵鑄不毁之金光以為玄策祕簡刻碧玉之玄霞以為丹書五方五靈五老職掌騰録祕藏於九天太靈玄都之館玉女則典司天香太華真人則執持玄巾金童侍側周衛瑶階玉陛朝軒九天玉字丹書非一切鬼神所能聞有天地而後有文字傳諸經今言皇經存而後天地分判人聞此語多疑惑不省蓋道之自然相循不息乃為真文道之不壞乃為真經元始在浩劫先皇經之理已在真文無字妙化不窮故天地自此判三光自此開景也此是實理又何疑文勢曲折有以文字作支字者非是鮮其正文有以鮮字作解字者非是瑩音盈或作巽字信字讀者非是玄經無象何云金簡玄光妙象傾劫不毁故云金簡玉書玄文光瑞潤麗尊嚴故云玉書非鬼神所聞皇經玄祕鬼神不識非常聞非易聞非凡聞能知者神呪品四章故天寶之以致清地祕之以致寧五帝掌之以得靈三光乘之以高明上聖奉之以致神高靈尊之以致真五嶽從之以得鎮天子得之以致治國祚賴之以致平實靈寶之妙德乃天地之玄根威靈恢廓普加無窮蕩蕩大化為神明之宗其量莫測巍巍乎太空是時元始革運玄象開圖靈文鬱秀神表五方分判天地開化萬靈此玄宗之寶可得暫披於靈韞乎九天玉書皇經非鬼神所聞妙法難聞若此故天位乎上也寶重此真經得真一以致常清地位乎下也祕持此真經得真一以致常寧五方五帝掌此祕文以得神通而成五靈日月星三光乘此真經妙法以崇高懸象著明上聖至人奉持此真經以至於聖不可知而神高靈神部尊崇此真經以至真聖之位五嶽名山聖帝從此真經之力而不崩壞以得安鎮君天下之天子得此真經妙法以致四海無虞之治國家祚業賴此真經以致安平實靈寶真宗之妙德乃天地之真宗玄根此經天威靈通恢然莫量廓爾無際浩劫法界一切利益無盡是普加無窮坦坦平平功化無象而無方誠蕩蕩大不可量之神化為神明之真宗其功量莫可測識無象無宗巍巍莫及而太空是時元始天尊革太混之運玄光妙象開闢靈圖靈文鬱茂光秀辨位化形神表東西南北中之五方分判上天下地開化法界萬靈一切品類此重玄真宗祕寶可得暫爾披瀝宸訓開闡無上真宗之靈韞乎披一作披閲皇經道家語本以修證仙品不言齊治均平此云天子得之以致治國祚賴之以致平何也蓋以道化成乃為治平悟真宗明大道則不言而信不動而變無為而成德盛化神永利無疆故云致治致平妙德本無所得不見施與自然功化無窮故云妙德若夫玄根一切根皆有象道生天地雖有無極太極生兩儀之圖太極本無象真者見不得言不得晝圖不過假像教人天地之根有何實象雖無實象其實循環無盡故曰玄根威靈三教聖神不敢慢妙化無邊故曰威靈神明之宗諸聖宗法又云千神萬聖從此出也太空不見其前不見其後恍惚不可為象故曰太空革運或云革將終之運非也此經在浩劫先是革太混運耳神表五方混沌本無分辨方位别中外實道妙化故云神表五方神呪品五章今皇道敷暢澤被十方仰觀劫運真風宜行臣心實欲使靈蔭八遐風灑蘭林寒條仰希華陽之繁朽骸蒙受靈奧之津明真有格今當以行仰對元慈下伸丹懇惟願哀憫俯念蒼生不審靈寶玉篇真文可得見授下教於未聞者乎玄宗之寶冀暫披於靈韞以今時大道敷布暢達慈思遍徹於四正四隅上極下極澤被十方矣仰觀劫數氣運正道真風宜當推行臣心實欲使靈寶法惠蔭覆一切方所世界盡八遐之逺道澤惠風蕩灑蘭林寶香玄苑世間沉滯異類傍門天魔外道有情無情不聞正道者皆蒙真經之濟如稿然無生意之寒條仰希和煦霑潤華陽之繁滋已枯使榮朽毁骸骨蒙受靈文奧典之津澤明真上仙有度世金格今當以行世間仰對元始太慈下伸丹誠懇祈惟願聖慈哀憫俯念蒼生不審靈寶玉篇真文可得見授世間下教於未聞者乎十方非此個小十方盡三千大千世界之十方劫運從劫至劫終始相循劫劫此真經濟世非止一劫一運八遐盡三千大千之逺不止言目前八方之逺蘭林香寶華林天地人物有此正理皆有此林人物昧之而不見上聖真仙此林寶光風灑惠浮此林恩及一切澤濟無方矣寒條人物神鬼不明正法如同稿木聞真經了悟是枯木再榮朽骸人物神鬼不知正道雖生如死聞真經超脫枯骨再生靈奧之津乃潤澤之津明真玉帝明封諸真丹懇竭盡丹衷懇祈至聖蒼生以玄首黃髮老而皓白蒼然無恆故言蒼又云蒼天所生之民又云蒼生衆也靈寶玉篇真文俱解見前見授祈天尊傳授此經下教法界一切神人鬼物而度拔未聞此經者可得見授下教於未聞者乎乃謙疑未定不敢執言恐至尊妙法不易傳授故先懇祈又作未定之詞以見求之切而尊崇之至也神咒品六章於是元始天尊撫几高抗凝真遐照觀時已至普為時會一切真聖論定陰陽推數劫會移校河源檢録天度選擇種人指拈太無嘯朗九玄念無開聽於陳辭有若閉礙音閡求真之路是時五老帝君啓問不已良久元始天尊乃垂盼眥之容慨爾歎曰微乎深哉子今所扣豈不善乎此元始靈寶之玄根空洞自然之真文生天立地開化神明施鎮五嶽安國康民靈寶玄妙為萬物之尊天啓玄瑞靈應自然靈寶真文宜下教未聞於是時元始天尊撫循玉几即寶座巍崇道體高抗不俯密凝至真默張大智遐照今昔過去未來定觀開度之時已至普為時會六緣共際諸法界皆當吉時隹會一切世界天真至聖論定陰陽貞元之會推生化自然之數大小劫運元會移枝河源水帝檢察考録天數期度選擇修因善種之人指拈真玄太無嘯咏朗吟九品玄章念天地始祖五老上帝所陳懇祈傳法之辭若不開慈聽許有若閉塞阻礙修道求真之路是時五老帝君懇啓請問不已時過良久元始天尊乃開慈顔聖目俯燭垂盼眥之容慨爾嘆曰微妙乎淵深哉子今時所扣問豈不善乎此元始靈寶之玄根空洞妙化自然之真文生乾天立坤地開化諸世界一切聖真神明施鎮東泰南霍又名衡西華北恆中嵩之五嶽安歷代之國康平法界之民靈寶玄微奇妙為萬物之最尊天啓玄瑞地發禎祥諸靈效應皆出自然撫几撫憑玄化玉几非凡案也高抗非自高自抗以巍然道身玄範巍巍不動故云高抗遐照有刊作想字者非是論定陰陽推數劫會上真至聖非拘於數大道不容輕傳時本自然聖教無有強聒移校河源檢録天度下自諸水上及諸天一切世界諸類羣生皆度也選擇種人非止説於善類教不揀擇以真經説與善類則諸類皆蒙恩指拈太無道本大無如何拈出元始至尊説此真經乃最上一乘三教真宗虛無重玄令人聞之了悟是云拈出九玄或作九九重玄亦通盼分目開眸垂光目際故云盼眥又云眥目睢也盼或作盻非是元始至聖如何稱天地五老之問為善請問真經知其利益時會智見深逺微妙故稱善開化神明道生諸仙神佛等其餘解見前眥音姿又音子神呪品七章今三天盩運六天道行雜法開也當有三萬六千種道以釋來者之心此法運訖三龍之後庚子之年雜氣普消諸天慶會吾真道乃行今且可相付當録於上館未得行於下世玄科有禁不得妄傳子可詣靈都紫微上宫聽天音於金格視俯仰於神王然後當使得受天文以總御元始之天也盩魯第切真經若傳天啓玄瑞靈應自然今何時哉三氣丹天盩更氣運六六諸天一時道行雜説小法開度教化當有三萬六千種門頭道理以解釋來求道者之心此法運化已訖三龍龍漢等三劫之後庚子之年貞元會運雜氣普消諸天慶宵時會吾真道正法乃行今暫且可以相付當録載於上玄天館未得行於下塵凡世玄科天律例有禁戒不得妄自輕傳子可躬詣太靈玄都紫微上宫聽聆天音旨宣金格傳度期數嚴重之勑視俯仰於仙神天帝將吏天王知此法與貴重利益然後當使得受真經天文以總御元始統化之諸天也盩音立作盩字非是或作整字亦不是三天青赤禹餘三氣之天六天欲色無色輕塵細塵輕染細染等天帝神人大中小三乘演教各品道行雜説小法開示化度三萬六千種道人身有三萬六千神氣清濁強弱不同有正信者有邪見者根器各别學焉而得其性之所近故有大乘有小乘是有三萬六千種道以釋來者之心應來求道者之心機一云應當來之心機各就相投相信者以受持故了悟者言渙然氷釋是釋字無疑或作擇字者非也三龍龍漢初中末三劫一云龍漢龍康龍徵雜氣普消時將泰妖氛息諸天慶會諸天皆當吉時盛會一云諸天喜慶法會玄科天律有自然之禁雖道不擇人語非其人褻天寶且失言所以三教聖人得其時得其地得其人乃説法傳道金格夜較玄格功過等律也視俯仰於神王仰視仙真俯視天王神將總御元始之天總領統御元始所化諸天一云視與示同示俯仰於神王示仰承俯聽之義於神王統御元始之天統會諸天近御法駕於元始最上之天二説俱通神呪品八章於是五老帝君與諸真聖清香執戒徘徊雲路嘯命十方上詣上清太玄玉都寒靈丹殿紫微上宫受俯仰之格乃知天真貴重難可即聞還乃更詣元始道前咨以禁戒之儀遜謝不逮聽天音於金格然後得受天文真經於是五方五老帝君與諸天真聖清著真香執守道戒周步雲衢往遺導度逡巡徘徊雲路嘯咏宣命十方聖神上詣上清太玄玉都天宫妙界寒靈丹陛寶殿紫微上清玄宫受領俯仰之格乃知天文真經尊貴嚴重難可即得聽聞還乃更詣元始道前懿問以禁戒之儀遜謝智見不及清香乃性真天香清淨自然香無為正妙道德真香非世焚香等也執戒玄範巍肅如對道祖守天尊法戒徘徊慈接無窮玄光法駕周命十方雲路之際先儒云天光雲影共徘徊即此意耳非世間逡巡往來不止之比也嘯命十方嘯音笑讀作勑或作秀字讀者非也蓋肅然出令為嘯非吟笑之義十方不言十靈寶但言十方神部爾上詣仙真朝元受法玄光默升恭聆玄誨非凡足踵躡踐登之義寒靈丹殿九天之上無聲氣日月不能及天光自照廣而無量清而寒肅丹殿太赤玉光故云然紫微上宫紫霄之上太微天中上清玄宫也非日月天端世所稱紫微垣之宫太微垣之宫也俯仰格解見前難可即聞非云難以即時得聞但言難以聞而即知一云玄都掌經者不使即還乃更詣元始道前更回來九天上謁元始至尊懿以禁戒之儀懿解見前請問天律禁戒傳法受法之儀則禁禁令戒戒條也遜謝不逮非謝不能守禁持戒但謙遜言身雖神真法寶真經素未悟入一時聞之智見不逮此正天地五老真知道法之尊處非自限止言不堪受此也天下諸類皆有理皆可聞道故四靈之物各拔其萃人為萬物之靈神為出世之品豈不能聞道乎故顔子平日聆受夫子之教不違如愚相説以解卓立之後云雖欲從之末由也已文殊諸佛傳釋迦正法真宗一事聞者獨獨與此語義一般持此經者識得天地五老委曲推尊經旨之意則知道矣神呪品九章是時天尊慈顏愍諭靈關廓開登命五老帝君開洞陽玉館披九光八色之韞雲錦之囊出元始靈寶赤書玉篇真文金書玉篆微妙祕密運御乾坤大光明圓滿大神呪玉章宣付五老帝君是時五老帝君拜受已及諸天聖衆稽首禮謝天尊玉帝仰奉道旨按法以傳五老帝君與諸真聖既遜謝不逮矣是時元始天尊大慈天顔矜愍誥諭靈關廓然開化登命五老帝君開玄天洞陽玉館披開九霞光八景色之韞雲錦之囊出元始靈寶赤書玉篇真文金書玉篆淵微玄妙祕密奧旨蓮化統御一切世界乾坤無量大光明圓滿大神通祕呪玉章宣布付與五老帝君是時五老帝君拜受此法已竟及諸天聖衆稽首禮謝天尊玉帝仰奉元始道旨按此經金格正法以傳諸界神人愍諭愍即大悲諭開誘也或云當作和愈色非是靈關廓開藏經之天丹靈玄關廓然洞開一説洞開聖哀開心見誠一説聖目流光靈關廓開俱通登命登進五老帝君使近前而親命之也洞陽玉館九天玄館大洞無礙永明無暗非瓦石土木玄光妙景虬文奇錯碧玉之章故云然九光解見前八色太青太赤大黃太白太玄蔥蒼碧玉紫金等色也韞經之藏處玄光無邊際盡含於此也披開啓也雲綿之囊雲霞天錦道化自然光結非天孫之織錦也有底曰囊經注於此諸神不測故云然非人間布帛皮革比也靈寶至乾坤等五句俱解見前大光明三教真文俱稱法寶所在有光明諸教經書光明有限惟此皇經法遍三千大千傾劫不盡故曰大光明圓滿聖心慈濟無窮力不能及是有限量有虧欠故佛下不能化北極盧州上不能化自在天人難稱圓滿皇經包萬法貫諸乘功化無量無盡雖云道不瀆不強聒道化自然諸類終始循環無有不化於道者故曰圓滿神呪玉篇諸真法宗諸神玄訣度世要旨諸教神通皆不外此尊重莫踰故云然一考人性悟道浩劫難忘如注物不漏悟入之初如㯱口故注經言㯱天尊有連上句讀者言禮謝元始天尊有連下句讀者言玉帝為諸天之尊後説可從餘解見前玉帝仰奉道旨按法以傳真經神呪其意云何五老帝君東方為首東方木德安寶華林青靈始老蒼帝所受神誥命右東方九氣至攝氣舉仙六句乃度世拔人校録神仙青帝祕密靈文二十四字書于九天元臺主召九天上帝校神仙圖籙皆仙梵祕言不敢細解嵗星輔肝至掃除災羣八句乃制星祕文三十二字書於紫微宫東華殿主召木德星君正天分度東方神呪至敢有稽延八句乃制東方諸魔祕文三十二字書於東華玄靈之館主攝鬼魔正東方諸界九氣下制東河至風火無間八句乃制東方諸水祕文三十二字書於九天東北玉闕丹臺主攝東海水帝大劫洪災召蛟龍及水神事東方九氣靈寶赤書玉篇真文合一百二十字皆太上無上大光明圓滿大神呪空洞自然之書一名生神寶真洞玄章一名青帝八威策文以上不可解故重書原文右玉皇誥命以錫東方安寶華林青靈始老蒼帝九氣天君令統御東方諸天地日月星宿山洞水泉仙聖一切威靈符命所臨如誥奉行如誥者東方天地水一切神祇皆欽遵此命無不奏行此玄章悉天地人物大德青靈之祕魔鬼喪膽度劫免災諸聖不敢違故永鎮東方諸界玉帝仰奉道旨按法以傳真經神呪其意云何五老帝君東方為首東方木德安寶華林青靈始老蒼帝所受神誥命右東方九氣至攝氣舉仙六句乃度世拔人校録神仙青帝祕密靈文二十四字書于九天元臺主召九天上帝校神仙圖籙皆仙梵祕言不敢細解嵗星輔肝至掃除災羣八句乃制星祕文三十二字書於紫微宫東華殿主召木德星君正天分度東方神咒至敢有稽延八句乃制東方諸魔祕文三十二字書於東華玄靈之館主攝鬼魔正東方諸界九氣下制東河至風火無間八句乃制東方諸水祕文三十二字書於九天東北玉闕丹臺主攝東海水帝大劫洪災召蛟龍及水神事東方九氣靈寶赤書玉篇真文合一百二十字皆太上無上大光明圓滿大神呪空洞自然之書一名生神寶真洞玄章一名青帝八威策文以上不可解故重書原文右玉皇誥命以錫東方安寶華林青靈始老蒼帝九氣天君令統御東方諸天地日月星宿山洞水泉仙聖一切威靈符命所臨如誥奉行如誥者東方天地水一切神祇皆欽遵此命無不奏行此玄章悉天地人物大德青靈之祕魔鬼喪膽度劫免災諸聖不敢違故永鎮東方諸界神呪品十一章南方梵寶昌陽丹靈真老赤帝所受神呪誥命南方丹天赤帝玉堂中有大神號曰赤皇上炎流煙三氣勃光神仙受命應會太陽右度人録仙赤帝祕文三十二字書于九天洞陽之館主召九天神仙圖籙金名熒惑輔心井鬼守房栁星張翼統御四鄉軫總七宿回轉天常召運促會正道驛行右制星祕文三十二字書于三氣丹臺主召星官明度數正天分赤文命靈北攝酆山束送魔宗斬邪滅根符教所討明列罪原南山神呪威伏八方羣妖滅爽萬試推亡右制魔祕文四十字書于西南陽正玉闕主制北酆正鬼氣南河水帝太伯龍王神呪流行普掃不祥洪水飛災止蛟召龍開除水徑千道萬通敢有干試攝送火宫赤書所告莫有不從右制水祕文四十八字書於西南陽正玉闕主攝南河水帝大運交期洪水四出召蛟龍及水神事南方三氣靈寶赤書玉篇真文合一百五十二字皆太上無上大光明圓滿神呪空洞自然之書一名南雲通天寶經一名九天無上之上呪一名赤帝八威策文右玉皇誥命以錫南方梵寶昌陽丹靈真老赤帝三氣天君令統御南方諸天諸地日月星宿名山靈洞水府泉宫上聖高尊真仙聖衆一切威靈符命所臨如誥奉行東方誥文永鎮東方矣南方梵寶昌陽丹靈真老赤帝所受神呪誥命云何南方丹天至應會太陽八句乃度人録仙赤帝祕文三十二字書于九天洞陽館主召九天神仙圖籙金名熒惑輔心至正道驛行八句乃制星祕文三十二字書于三氣丹臺主召星官明南天之度數正南天之分野赤文命靈至萬試摧亡十句乃制魔祕文四十字書于西南陽正玉闕主制北酆正氣鬼南河水帝至莫有不從十二句乃制水祕文四十八字書于西南陽正玉闕主攝南河水帝大蓮交期洪水四出召蛟龍及水神事南方三氣真文一百五十二字皆太上大光明圓滿大神咒空洞自然之書一名南雲通天寶經一名九天無上之上咒一名赤帝八威策文右玉皇誥命以錫南方真老赤帝三氣天君今統御南方諸天地日月星宿山洞水泉高仙聖衆一切威靈符命所臨如誥奉行度人録仙盡南方一切世界制星盡南