front:
  text: 皇經集注卷之九九
  hash: sha256:1b269c9e5d692b735b63d271a45c539afd53bcfbf8a1847a6ea6050991e6c540
  markers:
  - {type: page-break, offset: 0, content: '', id: KR5h0009_HFL_009-001a, image: hfl/1062/1062-064.png}
body:
  text: 應驗品續十三章又若有邪見愚執惡人睹持是經生諸惡逆偏眼邪視乃至起一惡心發一惡言妄生謗讟持經之人其罪深重命終之後墮大地獄永無出期不惟慢神謗經罪重又若有邪見愚濁執迷惡人覩持謫是經者目見曰覩生諸惡逆有不信心故不知經為道語法言持之利益阿慢輕忽厭惡謗毁生諸過惡悖逆偏眼邪視不喜見經並持經人無有正眼定觀偏眼邪視輕藐憎厭乃至起一念惡心發一句惡言妄生謗讟持經之人讟譽毁也持經作善本不可毀邪執惡人不知緣業罪福不知持經之善妄自生謗毁讟詈之言加持經之人其罪深重命終之後終盡也墮大地獄無間獄也永無出期永終也長也妄謗正法業根深重故墮地獄難出夫識見一也見之不正則為邪人一也執迷不悟則為愚為惡心一也生惡念則為逆眼目一也偏眼邪視則為過一念至微也起一惡心為業根一語無幾也發一惡言為罪本君子成人之美嘉人之善持經者當稱讃也妄生謗讟是自作孽人生本無業自惹其罪深重是大可哀命終是還造化舊物也固無拘乃一謗法墮大地獄死亦不安其過如何永無出期天心仁愛上帝好生惟神正直不淹沒人今罪者無出期豈天拘之哉孽自已作定業難逃欲除己業還須自信至善不回業根脫矣噫刑獄天討法本無親慈父不能庇其子孝子不得私其父至公者神豈消自致之業哉信經向法自懺前業如世人出首信誠免其罪犯也人生世間聖愚無二即不能出言有章聲為律幸勿出訛言而為惡口不能行無過動身為度幸勿行惡事而造身業不能心無妄想守至真幸勿起惡意造心業不知大道勿謗道不能解經勿非經不能持謫勿謗人不明鬼神生死因果勿起毀言一心正信久自明道漸成聖真又何罪業之有應驗品續十四章至若在世男女得遇是經不生敬仰穢手污觸葷口讀誦床榻不淨便將安置或誦是經講習俗語共同戲笑以為常典如是之人命過之後墮無間獄永無出期殃緣九祖受考酆都纍及子孫害纒後代是人於地獄中歷無量劫受大苦惱縱遇聖教纍承救拔罪惡小減又遇上聖殊恩得離地獄生餓鬼中歷千萬劫不聞漿水之名鬼報得盡生畜生中畜生報已若生人中復生邊夷外域而復女身貧寒困苦癃殘百病受無量苦人所憎棄求生不生求死不死輕斯經故獲罪如是此甚言慢經之報不生敬仰不敬重仰慕也穢手污觸不淨之手或請捧經卷或披閲指點污觸輕犯此經葷口讀念謫持食五葷五辛三厭之口也床榻不淨卓几牀榻座器不淨便將此經安置供放或謫是經與人講習俗語共同戲笑以為間常書籍典章是人不惟自惹罪報禍殃緣及九祖始祖四昭四穆為九祖受考酆都考孝察過失也或作拷掠之拷此即小鬼犯事罪坐家長之義纍及子孫害纏後代積不善之家必有餘殃受大苦惱罹大罪苦煩惱無限遇聖教纍救罪惡小減即蒙經功法功減遇上聖殊恩上帝恩赦也得脫離地獄苦報餓鬼千萬劫不聞漿水之名餓鬼腹大咽喉微小飲食難下黑獄羅酆不見漿水亦不聞名生類莫蠢於物鬼報盡生畜生中其業尚在人世雖一中國難投男身難得生邊夷外域而復女身人中之不美也貧寒困苦貧賤凍餓困苦艱難癃殘百病衰損殘廢百病縈纏受無量苦言不盡之苦人所憎惡厭棄求生不得安生求死不能即死皆以輕慢此經之故獲罪業如是之重亦可哀哉夫人生參天地為三才此身貴重親賴以繼光前裕後道賴以傳所係匪輕一慢經法殃及己身緣祖先禍後代受業報何其愚之甚也又觀三教書言男女法性無有分别在在處處皆為樂土中庸云富貴貧賤夷狄患難素位而行無入而不自得今言外域女身病難之體為人憎棄何也蓋無分别皆自得者道也分等類言罪福者報也報應明人斯為善矣嗚呼人一也皆可為善人也尚勉力進道勿造業而為人所憎應驗品續十五章又復有人初雖信受後復慢易善惡童子上奏三官黑簿書名青編減算身殁之後拘閉幽牢往復三塗無由解脫或於見世受種種病疥癩癰疽以為果報憂悲苦惱日夜相煎或身被橫惡所加或牢獄繫鎖或非命自害毒藥所殘或被虎狼毒蛇之所噉食或為寃債之所牽引或行山林值遇惡人被他屠割推落崖岸或被邪精魍魎之所殘害或值水火之所焚漂或被刀兵之所橫誅輕斯經故橫喪天年獲如是果獲如是報可不悲歟可不痛歟此經法利不特全不信者有罪也又復有人初雖信受無疑後復怠慢輕易善惡童子紀録世人善惡之童子上奏三官黑簿書名黑簿録過之簿也書慢易經典之罪青編減算紀功青篇減慢易經者之算身殁後拘閉幽牢刑獄囚繫往復三塗苦纍無由解脫或於見生今世受種種疾病疥癩癰疽惡疾以為果報償其惡業憂悲苦惱日夜相煎愁困日夜熬煎或身被橫逆禍惡所加或牢獄繫鎖或非命自己殘害或毒藥傷殘或被虎狼毒蛇之所噉傷啖食或為寃家債主之所牽引受害或行山林值遇惡人被他謀殺屠割推落崖岸以傷身命或被邪精魍魎之所陰殘損害或值火焚而水漂或被刀兵之所橫誅輕斯經故橫喪天年夭橫折喪不得善終獲如是業果獲如是報應可不悲歟可不痛歟既悲哀其苦又痛惜其愚此見天尊之大慈也證疑夫後一慢易此經罪報無窮則尊道信經貴有恆也久道化成經功全驗盡被其德領其效矣人惟無恆始勤終怠無怪乎罪業之及也抑自古及今不才者間出不持經不聞經者甚衆獲罪厄患者每有豈皆盡慢經者耶蓋經以言道不信道而無德即慢經者也無德有罪即慢經之罪也欲尊經消罪當進道修德應驗品續十六章汝宜殷勤依此奉行勿生邪念若諸念不生萬緣頓息塵沙惡業隨心消散一切災魔自然殄滅此經功德不可思議是誠無比最上妙法諸經之王有大利益非人勿示天尊謂真人云慢經之罪報應如是汝等宜殷勤懇切依此經法奉行無失勿生一切邪念若諸雜念不生無善念無惡念無無念無無無念萬緣頓息空五纍除九識離四象絶百非空萬有忘一無外緣內緣業緣福緣空定妙緣宿世今生攀援未來一切斷絶悉盡根塵塵沙惡業隨心消散世上塵恆河沙不可稱數如是衆業隨信經心悉皆消散一切災魔自然殄滅諸災諸魔自然殄絶除滅此經功德不可思議是誠無比最上妙法三教萬法一切無可比此誠為最上妙法諸經之王兩門之經儒之書皆不及此為三教諸經之王有大利益非人勿示道雖人人可學不信不敬者不可傳非人勿示非重道之人不傳示也解疑儒者不教自暴自棄之夫佛不度無緣之輩道法最尊豈強不信之人哉噫信心進道之基真志成聖之要不信不可以授經人當至誠勵志以為受經入聖之本應驗品續十七章若諸天人五衰四相輪回侵逼能捨除妄想受持是經坐招自然天福益固身度三界與道長存此經至尊不宜妄示人矣若諸天人欲界六天尚有欲樂色界十八天常有色象無色界四天以空定為樂大梵四天知空知無雖無冀樂靜福有數諸天之外最上種民四天無輪回成壞以前諸天等義不同在種民下有成有壞五衰四相五衰解見前四相非人我衆生壽者福相盛衰德相盛衰分四相也一云生壯老盡為四相一云不威儀不神通不快樂不精健為四相輪回侵逼欲色梵無色三十二天久暫不同其天人福盡轉生人間皆有定數故云輪回侵逼能捨除妄想逐緣妄生或想福或想慧或想壽或想空或想定或想上升或想轉降言所不盡心所不窮皆名妄想捨除雜念一緣不生空空無無是捨幻念除妄想坐招自然天福益固不待思求自然坐致欲界色界無色梵界皆自所居而得超脫永不輪轉無毁淪得大堅固不入輪回身度三界能出欲界於色界及無色梵界天地人出三有象高度上霄玄境與道長存與道合真浩劫長存觀天人寶經之效則世人可知矣勉之應驗品續十八章是此經典無與等無能勝是大威德大神呪能令一切枯稿便生枝葉花果茂盛能除衆生極重苦惱能令短命衆生而得長壽此經功德不可思議歎莫能盡不信經者業如是天人信經效如是是此經典無與等一切諸經諸法皆出其下無與等倫無能勝一切諸經法利皆不及此無能勝者是大威德或除邪或輔正功德不能相兼不名威德今經法除邪滅罪扶正成真是神功妙德恩威莫量故云威德大神呪解見前能令一切枯稿便生枝葉花果茂盛諸草諸木奇花異莫瑞芝靈香凡榮秀生類不能暢達茁育一切乾枯稿損此經便令復生枝葉花尊果實暢茂繁盛能除衆生極重苦惱此經消諸業利人之生拔諸罪利人之死除魔難保人快樂歷劫冤欲終身煩惱最重苦寃纍世難消者此經便除其根能令短命衆生而得長壽世人之生七十甚希此經保命延生能令世間夭折短命衆生益算延年而得長壽或云顔子亞聖年止三旬是道德無益何云經功延壽蓋死而不亡者壽卓爾見道顔子不死經云延短命之壽蓋令衆生見道死而不亡也此經功德不可思議歎莫能盡稱歎不盡也噫寇公忠義枯竹成林田氏孝友稿荆復生聖人在上比屋可封死生快然會大道之全功德無類不及也觀經者勉焉自有最上功德應驗品續十九章若不宿植道本廣種福田乃至經名尚不得聞何况得見是經此經功德無盡矣若不宿植道本本猶根也君子務本本立而道生故云道本一作道種非也宿夙也預也植立也樹也種也道本漸次進修入道根本道經云大道無名精修則成孔子云下學而上達佛經云從聞思修入三摩地三教皆重學問為成道本然道雖頓悟須假漸修實非一蹴能盡若不宿世今生預加修習先植道本廣種福田福田積功有效如種田等故曰福田外功則修宫觀寺院庵廟堂祠塔閣社宇橋梁道路行藥治病助國救人符濟祈禱廣嗣利生除邪去難拔苦拯貧內行則慈悲喜捨忍辱和光普惠無私堅固圓滿粗行則施財物衣食祕行則念道思真絶欲養神積精纍氣入聖超凡種種不一無量福田皆廣種之種世田者時歲旱潦人事不齊或不成收種諸福田小則小成大則大效陰德種種若人不知若説不盡功德無量若不種諸福田乃至此經名號尚不得聞無德無福不聞經名經云正法難遇此之謂也何况得見是經見此真經即為道眼無德無福經名不聞焉能得見夫人之分量不同承受亦異有福無德富貴而愚有德無福清貧而聖德福並懋祿位壽名若遇正法知見了脫非歷劫修習功德無量不能至是佛會百萬正法付之迦葉孔門三千一貫付之曾參道門法衆億萬萬萬繼太上心法文始而已觀者勉之應驗品續二十章蓋是經依三洞真格八萬劫一傳此清都至真上聖所寶祕於玉京金闕甚為微妙難可得遇如宿有仙骨當為九天真仙之人得遇斯文承斯緣故後當齎金寶從師告盟受之方當承機應運乃可付焉不得輕泄敬之愼之此經非輕傳也依三洞真格洞真洞玄洞神此三洞品載天律金科真格自然之數八萬劫一傳經八萬遍元會運世之劫一云人生於寅盡於酉八時共八萬六千四百年計大數八萬餘年每年生長成收一次亦謂之一劫沙塵數也八萬劫一傳此經普轉大法非常遇也前説近是此清都至真上聖所寶上清玄都祕於玉京金闕非云玉帝之居乃太玄寶藏帝經之閣甚為微妙讃經難可得遇不易遇此經如宿有仙骨宿世進修有成道分骨相合仙當為九天真仙之人九氣天真上仙品得遇斯文得遇此經文承斯緣故承此當作仙遇經之良緣後當齎金寶從師告盟受之非但齎持世財金寶告天立誓受經獻至誠無私永劫不改之心盟心天日如白日青天無有點塵是真金寶不毀者也方當承機應運方始也始當乘機會應時運乃可付焉乃可傳付此人不得輕泄泄泄也不得輕易泄漏經旨言不傳非人也敬之愼之尊敬此經不可輕忽愼守此經不可妄傳噫知此經之重人人當修良緣以為受經之地既受永劫不可輕也寶之勉之應驗品續二十一章於是天尊重宣此義而説偈曰設使江河水波浪能生蓮慈烏毛能白如經故難遇設使龜生毛堪採為衣服夜月能消氷如經故難遇設使蚊蠓足堪構為橋梁能載一切重如經故難遇設使黃口雀能銜諸大山擲之他方界如經故難遇設使一葉舟力能載崑崙浮度於大海如經故難遇設使諸水蛭口能生巨齒其大如象牙如經故難遇設使蓬篙葉能覆無鞅界廕庇崑崙山如經故難遇設使烏梟類同樹一巢棲銜食共反哺如經故難遇設使兔生角堪用為梯磴上窮有頂天如經故難遇設使鼷鼠等緣於兔角梯至天能食月如經故難遇設使驢顏唇色如蘋婆果復能作歌舞如經故難遇設使蠅蟲等能飲鍾石酒迷荒而沉醉如經故難遇於是元始天尊重宣經功之義而説偈曰設使江河水波浪能生蓬江河水深洶流巨浪不能生蓮慈烏毛能白如經故難遇鳥鴉生來純黑不能白今言烏白江有蓮花以見絶無甚言經之難遇龜本無毛月本太陰今言採龜毛為衣以夜月消氷只是以絶無者見經之難遇至於言蚊蠓足構橋梁載諸重言黃口小雀銜諸大山擲他界言小舟載崑崙神山度大海水蛭生象牙之齒蛭水蝗小蟲也蓬蒿葉覆無量界廕崑崙山鳥梟同巢共食反哺烏梟皆惡鳥兔角為梯上天鼷鼠步兔角梯至天食月驢顔唇如蘋婆果色復能歌舞蠅蟲飲鍾石酒迷荒沉醉以上皆事之所必無理之所未有歷歷言之以見經之難遇夫大道人人有真經個個全愚人蠢物皆有正性悉可化度何至如此類所絶無者擬經之難遇豈終不傳耶蓋法品不同此經最上傳之者未必如元始之真受之者未必契玉皇之祕扞格偏執全經難曉或不聞不見或徒聞徒見功德實效語之茫然未獲全益信乎其難遇矣不畏難之難至誠有恆經功自遇應驗品續二十二章爾時天尊宣説偈已普告四衆世間若有持是經人名功德身一切有情被其蔭故持是經人名神通身一切吉祥咸臻集故持是經人名清淨身是諸惡業不能侵故爾時元始天尊宣説偈已普告四衆普遍也四衆解見前世間若有持是經人名功德身有利於衆為功有益於衆為德利人利物曲成不遺名玄功妙德之身一切有情世間動植凡有生之屬雖土木金石情性精魄在者皆有情故一切有情被其蔭故三教聖人普度永利覆冒曰蔭持經者利己利他利人利物若有知若無知普惠共濟一切被其慈蔭持是經人名神通身人雖至靈無有神通經中妙法至玄至神大通無礙持是真經名神通身一切吉祥咸臻集故三教聖人永成不壞咸皆也臻至也集萃聚也持經人為己則順而祥為人則愛而公為天下國家則無所處而不當自致之福千祥攸萃天不愛道地不愛寶人服其化物效其靈一切吉祥皆集也持是經人名清淨身不染謂之清無纍謂之淨持經人萬緣俱息一疵不存名清淨身是諸惡業不能侵故三教聖人有難無害侵逼害也自作之業天降之殃宿業今愆先亡連逮時歲之咎命運之滯星居觸犯魔鬼侵凌人言物厲一切干傷是諸惡業皆化凶為吉不能侵凌夫有道之士範圍天地曲成民物福履禎祥天保勿替吉人天相無災無害真功德神通清淨身也人亦有身而非功德神通清淨亦不真持經耳勉之自可以證其功效應驗品續二十三章持是經人名威德身天魔異道不能攝故持是經人名無等身上帝遙唱萬神敬故持是經人不但名清淨身也名威德身解見前天魔異道諸天魔王魔民魔女陰暗魔鬼及阿修羅唃嘶羅魑魅魍魎精邪怪祟世人詭誕外道旁門妖孽艷異等不正道不能攝故攝招伏親服也魔異侵入人迷服不覺云攝如佛門阿難被摩登伽女攝入淫房鞠愛撫摩幾毁戒體今持經人了明心印無私無為默持真經法力周完道高德重威德赫奕不可稱量鬼妖喪膽精怪亡形一切邪魔豈敢侵正故天魔異道不能攝阿難非不持戒一念動於摩登伽女是未悟心宗持經間斷故伽女攝入耳若非佛楞嚴經力焉復全體此皇經諸經之王也受持威德寧不萬倍於他經哉持是經人不但名威德身也名無等身無等倫儔類之身吉真持經者最上無與比即釋經云一切無如佛儒書云夫子之不可及也猶天之不可階而升也上帝遙唱上帝非玉帝也諸天上帝也遙逺也唱樂世有進道之人天音宣贊也一云謡唱是作歌謡之謡於理未妥不可從蓋世間生男萬神唱恭生女萬神唱奉上帝好生諸天稱慶有道之人誠格天地動鬼神與天合德諸天帝歡慶但諸帝甚尊與他神不同但依所居天宫常御處遙聞天音以慶決非歌謡之字不然何此曰上帝遙唱繼曰萬神敬故萬神非一神所指者廣一切諸神雖有崇卑皆重道典遇真持經有道之人故無不敬也夫人性剛明中和比肩元始本有大威德無等倫也惟不禁情欲故邪入而神不敬也吁子夏賢者也出見紛華勝麗而悅非夫子真儒之教焉能成高弟哉人能一真無偽永成道矣應驗品續二十四章持是經人名堅固身惡劫大難不能損故持是經人名道藏身口出語言鬼神仰故持是經人不但名無等身也名堅固身世人生死無常轉回不知或小功小德福緣身世或小根小乘果位有限或明而未了易蔽易欺或行而未成易得間斷或度人濟物分量易窮身如萍燭難當風浪非堅固也真持經者心不退轉名堅固身惡劫大難不能損故或小劫中劫大劫元會運世三界滅轉之劫物絶人盡地傾天壞四輪相觸五行並尅水火風災侵壞世界萬象空諸法盡諸乘果四禪界三階九品官神將吏悉入轉回蒙再造難真持經者得大堅固超出劫數永不退轉惡劫元運宿業災魔意外大難毫不能侵貞達常變億世如一不能損也持是經人非但名堅固身也名道藏身藏藏也臧也道無所不包無往不善道藏無有不載無用不臧人身雖有限性無不備但不盡道所以不成道身真持經人淵存海含法藏中包無量世界故名道藏身口出語言鬼神仰故答述曰語自言曰言人亦有言鬼神不仰蓋詞不誠口過生尤且不免何以感人神鬼神乎真持經人言焉成信出之有章不躁不隱不失人不失言或一言續千真之脈或一言開萬代之傳或一言拯人物之溺或一語破死生之關或一言盡天地之道或一語括萬法之玄或一言悉鬼神之情狀或一語明劫數之升纏一言而滅罪福一語而露金丹三教真宗在經一言人物共寶鬼神所不識也誰不欽仰哉鬼神仰故云爾已矣夫三教大聖人歷劫不退轉言語天人所共崇堅固道藏之旨可徵已一持經者何遽至是蓋一得永得理之實驗人惟不真持經耳真持如何心齋為本神化成之皇經集注卷之九
